<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>HOLD THE LINE</title>
<style>
  :root {
    --bg: #101318;
    --panel: #171b21;
    --panel2: #1f242b;
    --line: #2b313a;
    --ink: #e4e7ea;
    --dim: #79828d;
    --accent: #ff6a1f;
    --cyan: #4fd6e0;
    --danger: #d43350;
    --gold: #ffc93d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #top {
    position: fixed; z-index: 5; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 7px) 8px 6px;
    background: linear-gradient(to bottom, var(--bg) 76%, transparent);
    pointer-events: none;
  }
  #res { display: flex; gap: 5px; }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 5px 7px 6px;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  .stat .k {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 7.5px; letter-spacing: .13em; color: var(--dim);
  }
  .stat .v {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px; font-weight: 700; line-height: 1.15; margin-top: 1px;
  }
  .stat .v small { font-size: 9px; color: var(--dim); font-weight: 400; }
  #line2 {
    display: flex; align-items: center; gap: 8px; margin-top: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px; letter-spacing: .09em; color: var(--dim);
  }
  #line2 b { color: var(--accent); }
  #line2 .r { margin-left: auto; }
  #threatBar { height: 3px; background: #23272e; margin-top: 5px; }
  #threatFill { height: 100%; width: 0; background: var(--danger); }

  #sheet {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
    padding: 7px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  #tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tab {
    flex: 1; cursor: pointer; background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); padding: 7px 2px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px; letter-spacing: .1em;
  }
  .tab[data-on="1"] { background: var(--accent); color: #101318; border-color: var(--accent); }
  #body { display: flex; gap: 5px; flex-wrap: wrap; min-height: 56px; }
  .act {
    flex: 1 1 0; min-width: 78px; cursor: pointer; text-align: left;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 7px 8px 7px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .act:active { background: var(--panel2); }
  .act[disabled] { opacity: .35; }
  .act[data-sel="1"] { border-color: var(--accent); background: var(--panel2); }
  .act .t { font-size: 12px; font-weight: 700; }
  .act .c {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 8.5px; color: var(--dim); margin-top: 2px;
  }
  .act .c em { font-style: normal; color: var(--cyan); }
  .act.warn { border-color: var(--accent); }
  #hint {
    font-size: 9.5px; color: var(--dim); margin-top: 6px; text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    justify-content: center; padding: 26px 22px calc(env(safe-area-inset-bottom,0px) + 26px);
    background: rgba(16,19,24,.97); overflow-y: auto;
  }
  .title {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 30px; font-weight: 700; letter-spacing: .16em; color: var(--accent);
    text-align: center; margin: 0; line-height: 1.3;
  }
  .sub { text-align: center; color: var(--dim); font-size: 12.5px; line-height: 1.75; margin: 12px 0 0; }
  .lbl {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9px; letter-spacing: .18em; color: var(--dim); margin: 20px 0 8px;
  }
  .help { font-size: 12.5px; line-height: 1.9; }
  .help b { color: var(--accent); }
  .help .d { color: var(--dim); }
  .btn {
    display: block; width: 100%; cursor: pointer; margin-top: 18px;
    background: var(--accent); color: #101318; border: 1px solid var(--accent); padding: 15px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="res">
    <div class="stat"><div class="k">자원</div><div class="v" id="sMat">0</div></div>
    <div class="stat"><div class="k">인력</div><div class="v" id="sMan">0</div></div>
    <div class="stat"><div class="k">병력</div><div class="v" id="sSol">0</div></div>
    <div class="stat"><div class="k">사령부</div><div class="v" id="sHq">100<small>%</small></div></div>
  </div>
  <div id="line2">
    <span>공세 <b id="wNum">0</b>/10</span>
    <span id="wState">대기</span>
    <span class="r">전사 <span id="sKia">0</span> · 격파 <span id="sKill">0</span></span>
  </div>
  <div id="threatBar"><div id="threatFill"></div></div>
</div>

<div id="sheet">
  <div id="tabs">
    <button class="tab" data-zone="0" data-on="1">전방 · 참호</button>
    <button class="tab" data-zone="1">중앙 · 화력</button>
    <button class="tab" data-zone="2">후방 · 중장비</button>
    <button class="tab" data-zone="3">병력</button>
  </div>
  <div id="body"></div>
  <div id="hint">건물을 고른 뒤 지도를 누르세요</div>
</div>

<div class="overlay" id="titleScreen">
  <h1 class="title">HOLD<br>THE LINE</h1>
  <p class="sub">전선을 겹겹이 쌓아 10차 공세를 버텨내세요.</p>
  <div class="lbl">방어선은 세 겹입니다</div>
  <div class="help">
    <b>전방</b> <span class="d">— 철조망, 참호, 벙커. 병사가 들어갑니다</span><br>
    <b>중앙</b> <span class="d">— 기관총 진지, 박격포</span><br>
    <b>후방</b> <span class="d">— 시즈탱크, 거대로봇, 보급소, 병영</span>
  </div>
  <div class="lbl">핵심</div>
  <div class="help">
    병사는 <b>참호 안에서만 강합니다.</b><br>
    <span class="d">참호가 부서지면 그 구간이 뚫립니다. 병력을 다시 밀어 넣으세요.</span>
  </div>
  <button class="btn" id="startBtn">전투 시작</button>
</div>

<div class="overlay" id="endScreen" hidden>
  <div class="title" id="endTitle"></div>
  <p class="sub" id="endSub"></p>
  <div class="lbl">전투 기록</div>
  <div class="help mono" id="endStats" style="font-size:12px;line-height:2"></div>
  <button class="btn" id="againBtn">다시 하기</button>
</div>

<script>
"use strict";

// ===========================================================================
// Canvas + layout
// ===========================================================================
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const $ = id => document.getElementById(id);

const COLS = 9, ROWS = 16;
// rows 0-1 no man's land · 2-7 front · 8-11 mid · 12-15 rear
const ZONE_ROWS = [[2, 7], [8, 11], [12, 15]];
const zoneOf = r => r <= 1 ? -1 : r <= 7 ? 0 : r <= 11 ? 1 : 2;

let W = 0, H = 0, DPR = 1, CELL = 40, GX = 0, GY = 0;
let safeTop = 0;
let scar = null, sctx = null;         // persistent battlefield damage

function measureSafe() {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px)";
  document.body.appendChild(d);
  safeTop = d.getBoundingClientRect().height || 0;
  d.remove();
}
measureSafe();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const topH = safeTop + 78;
  const botH = ($("sheet") ? $("sheet").offsetHeight : 110) + 4;
  const playH = Math.max(140, H - topH - botH);
  CELL = Math.min((W - 8) / COLS, playH / ROWS);
  GX = (W - CELL * COLS) / 2;
  GY = topH + Math.min(8, Math.max(0, playH - CELL * ROWS));
  const sw = Math.round(CELL * COLS), sh = Math.round(CELL * ROWS);
  const old = scar;
  scar = document.createElement("canvas");
  scar.width = sw; scar.height = sh;
  sctx = scar.getContext("2d");
  if (old && old.width) sctx.drawImage(old, 0, 0, sw, sh);
}
window.addEventListener("resize", resize);

const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const K = {
  bg: "#101318", mud: "#181c22", mud2: "#1c2027", nml: "#141820",
  line: "#2b313a", ink: "#e4e7ea", dim: "#79828d",
  accent: "#ff6a1f", cyan: "#4fd6e0", danger: "#d43350", gold: "#ffc93d",
  steel: "#5b636d", steel2: "#454c55", outline: "#0a0c0f", shade: "#0b0d10",
  blood: "rgba(120,26,40,.5)", burn: "rgba(0,0,0,.45)"
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const px = c => GX + (c + 0.5) * CELL;
const py = r => GY + (r + 0.5) * CELL;

// ===========================================================================
// Content
// ===========================================================================
// zone: which band it may be built in. garrison: how many soldiers it holds.
const B = {
  wire:   { z: 0, name: "철조망", mat: 15,  hp: 320,  desc: "지나가는 적을 크게 늦춘다", slow: 0.34 },
  trench: { z: 0, name: "참호",   mat: 40,  hp: 620,  desc: "병사 3명, 피해 65% 감소", garrison: 3, cover: 0.35 },
  bunker: { z: 0, name: "벙커",   mat: 110, hp: 1500, desc: "병사 2명, 피해 88% 감소, 사격 속도 +40%",
            garrison: 2, cover: 0.12, rof: 0.7 },
  mg:     { z: 1, name: "기관총 진지", mat: 70, hp: 460, desc: "빠른 연사, 사거리 4칸",
            dmg: 5, cd: 0.11, range: 4.0, upkeep: 2 },
  mortar: { z: 1, name: "박격포",  mat: 120, hp: 380, desc: "포물선 탄. 3칸 밖만 때린다",
            dmg: 52, cd: 2.6, range: 9.5, minRange: 2.6, splash: 1.20, arc: true, upkeep: 3 },
  siege:  { z: 2, name: "시즈탱크", mat: 210, hp: 1100, desc: "화면 끝까지. 착탄이 크다",
            dmg: 150, cd: 3.4, range: 15, minRange: 4.5, splash: 1.65, arc: true, upkeep: 6 },
  mech:   { z: 2, name: "거대로봇", mat: 300, hp: 2600, desc: "관통 광선. 일직선을 쓸어버린다",
            dmg: 55, cd: 1.2, range: 11, beam: true, upkeep: 8 },
  depot:  { z: 2, name: "보급소",  mat: 80,  hp: 420,  desc: "자원 생산 +5/초", income: 5 },
  camp:   { z: 2, name: "병영",    mat: 95, hp: 500,  desc: "인력 회복 +0.5/초", manpower: 0.5 }
};
const ZONE_BUILDS = [["trench", "wire", "bunker"], ["mg", "mortar"], ["siege", "mech", "depot", "camp"]];

const E = {
  swarm:   { name: "소형",  hp: 14,  spd: 1.55, dmg: 4,  cd: 0.55, r: 0.15, kill: 1 },
  charger: { name: "돌격",  hp: 26,  spd: 2.45, dmg: 9,  cd: 0.7,  r: 0.16, kill: 2 },
  brute:   { name: "중형",  hp: 105, spd: 0.85, dmg: 20, cd: 1.0,  r: 0.24, kill: 5 },
  titan:   { name: "대형",  hp: 900, spd: 0.5,  dmg: 70, cd: 1.4,  r: 0.42, kill: 40 }
};

// Ten assaults. Pressure never stops; it swells and eases.
const ASSAULTS = [
  { dur: 34, rate: 2.0,  mix: { swarm: 1 } },
  { dur: 36, rate: 3.0,  mix: { swarm: 1 } },
  { dur: 38, rate: 4.0,  mix: { swarm: 0.82, charger: 0.18 } },
  { dur: 40, rate: 5.2,  mix: { swarm: 0.72, charger: 0.2, brute: 0.08 } },
  { dur: 42, rate: 6.5,  mix: { swarm: 0.68, charger: 0.22, brute: 0.10 } },
  { dur: 44, rate: 8.0,  mix: { swarm: 0.62, charger: 0.24, brute: 0.14 } },
  { dur: 46, rate: 9.5, mix: { swarm: 0.60, charger: 0.24, brute: 0.16 }, titans: 1 },
  { dur: 48, rate: 10.5, mix: { swarm: 0.58, charger: 0.24, brute: 0.18 }, titans: 1 },
  { dur: 50, rate: 12.0, mix: { swarm: 0.55, charger: 0.25, brute: 0.20 }, titans: 2 },
  { dur: 58, rate: 14.5, mix: { swarm: 0.52, charger: 0.26, brute: 0.22 }, titans: 4 }
];
const LULL = 17, LULL_RATE = 0.7;

const SOLDIER = { mat: 15, man: 4, hp: 46, dmg: 6, cd: 0.62, range: 3.4, spd: 1.9 };
const HQ_HP = 7000;
const MAX_ENEMIES = 460;

// ===========================================================================
// State
// ===========================================================================
let G = null, mode = "title";
let pick = null, tab = 0;

function newGame() {
  const tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    tiles.push({ c, r, b: null, hq: false });
  // headquarters: three wide, two deep, dead centre of the rear
  for (let r = 14; r <= 15; r++) for (let c = 3; c <= 5; c++) tiles[r * COLS + c].hq = true;

  G = {
    tiles, buildings: [], soldiers: [], enemies: [], shells: [], tracers: [],
    parts: [], floats: [], beams: [],
    mat: 700, man: 44, manCap: 120,
    hq: { hp: HQ_HP, max: HQ_HP },
    assault: 0, phase: "lull", timer: 26, spawnAcc: 0, titansLeft: 0,
    flow: new Int16Array(COLS * ROWS), flowDirty: true,
    dens: new Int16Array(COLS * ROWS),
    kia: 0, kills: 0, t: 0, shake: 0, breach: 0,
    sel: null
  };
  if (sctx) sctx.clearRect(0, 0, scar.width, scar.height);
}

const at = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? null : G.tiles[r * COLS + c];

function income() {
  let m = 5;
  for (const b of G.buildings) if (b.done && B[b.key].income) m += B[b.key].income;
  return m;
}
function manRate() {
  let m = 0.28;
  for (const b of G.buildings) if (b.done && B[b.key].manpower) m += B[b.key].manpower;
  return m;
}
function upkeep() {
  let u = 0;
  for (const b of G.buildings) if (b.done && B[b.key].upkeep) u += B[b.key].upkeep;
  return u;
}
// Heavy weapons eat materials. Over-arm and your economy starves, which is the
// pressure that keeps depots and barracks in the build.
function upkeepDrain() { return upkeep() * 0.42; }

// ===========================================================================
// Flow field — one BFS for every enemy on the board
// ===========================================================================
// Cells re-enter the queue whenever a cheaper route is found, so this has to
// grow past the cell count. A fixed-size buffer silently overflowed here.
const flowQ = [];
function rebuildFlow() {
  const f = G.flow;
  f.fill(30000);
  flowQ.length = 0;
  let head = 0;
  for (let r = 14; r <= 15; r++) for (let c = 3; c <= 5; c++) {
    const i = r * COLS + c; f[i] = 0; flowQ.push(i);
  }
  while (head < flowQ.length) {
    const i = flowQ[head++];
    const c = i % COLS, r = (i / COLS) | 0, d = f[i];
    const nb = [[c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]];
    for (const [nc, nr] of nb) {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const ni = nr * COLS + nc;
      const t = G.tiles[ni];
      // walls are passable but expensive, so the swarm funnels into gaps
      // and only chews through when there is no way round
      const step = (t.b && t.b.done) ? (B[t.b.key].garrison ? 9 : 6) : 1;
      if (d + step < f[ni]) { f[ni] = d + step; flowQ.push(ni); }
    }
  }
  G.flowDirty = false;
}

// ===========================================================================
// Building / soldiers
// ===========================================================================
function place(key, c, r) {
  const spec = B[key], t = at(c, r);
  if (!t) return "지도 밖입니다";
  if (zoneOf(r) !== spec.z) return "이 구역에는 지을 수 없습니다";
  if (t.hq) return "사령부 자리입니다";
  if (t.b) return "이미 건물이 있습니다";
  if (G.mat < spec.mat) return "자원이 부족합니다";
  G.mat -= spec.mat;
  const b = {
    key, c, r, hp: spec.hp, maxHp: spec.hp, done: false, prog: 0,
    cd: rnd(0, .4), aim: Math.PI / 2, flash: 0, crew: [], dead: false
  };
  t.b = b; G.buildings.push(b);
  G.flowDirty = true;
  return null;
}

function killBuilding(b) {
  const t = at(b.c, b.r);
  if (t) t.b = null;
  b.dead = true;
  G.buildings = G.buildings.filter(x => x !== b);
  for (const s of b.crew) { s.post = null; s.state = "seek"; }
  boom(px(b.c), py(b.r), CELL * .7, 16);
  scorch(px(b.c), py(b.r), CELL * .55, K.burn);
  G.shake = Math.max(G.shake, 7);
  G.flowDirty = true;
  if (B[b.key].garrison) { G.breach = 1.6; floatText(px(b.c), py(b.r), "방어선 붕괴", K.danger); }
}

function hurtBuilding(b, dmg) {
  b.hp -= dmg;
  if (b.hp <= 0) killBuilding(b);
}

function spawnSoldier() {
  if (G.mat < SOLDIER.mat || G.man < SOLDIER.man) return false;
  G.mat -= SOLDIER.mat; G.man -= SOLDIER.man;
  G.soldiers.push({
    x: px(4) + rnd(-CELL, CELL), y: py(15), hp: SOLDIER.hp, maxHp: SOLDIER.hp,
    post: null, state: "seek", cd: rnd(0, .5), dead: false, aim: -Math.PI / 2
  });
  return true;
}

// Soldiers walk themselves to the most forward position with a free slot.
function findPost() {
  let best = null, bestR = 99;
  for (const b of G.buildings) {
    if (!b.done || !B[b.key].garrison) continue;
    if (b.crew.length >= B[b.key].garrison) continue;
    if (b.r < bestR) { bestR = b.r; best = b; }
  }
  return best;
}

function updateSoldiers(dt) {
  for (let i = G.soldiers.length - 1; i >= 0; i--) {
    const s = G.soldiers[i];
    if (s.dead) {
      G.soldiers.splice(i, 1); G.kia++;
      scorch(s.x, s.y, CELL * .22, K.blood);
      continue;
    }
    if (s.post && (s.post.dead || !s.post.done)) { s.post = null; s.state = "seek"; }

    if (s.state === "seek") {
      const p = findPost();
      if (p) { p.crew.push(s); s.post = p; s.state = "move"; }
      else {
        // no trench to hold: fall back and stand in front of the HQ
        const tx = px(4) + ((i % 5) - 2) * CELL * .5, ty = py(13);
        stepTo(s, tx, ty, SOLDIER.spd, dt);
      }
    } else if (s.state === "move") {
      if (!s.post) { s.state = "seek"; }
      else {
        const idx = s.post.crew.indexOf(s);
        const off = (idx - (B[s.post.key].garrison - 1) / 2) * CELL * .26;
        if (stepTo(s, px(s.post.c) + off, py(s.post.r), SOLDIER.spd, dt)) s.state = "hold";
      }
    }

    // fire
    s.cd -= dt;
    if (s.cd <= 0) {
      const spec = s.post ? B[s.post.key] : null;
      const rof = spec && spec.rof ? spec.rof : 1;
      // reservoir pick among everything in range: thirty rifles all choosing
      // the nearest target wastes most of their fire on one already-dead body
      const R = SOLDIER.range * CELL, R2 = R * R;
      let tgt = null, seen = 0;
      for (const e of G.enemies) {
        const dx = e.x - s.x, dy = e.y - s.y;
        if (dx * dx + dy * dy > R2) continue;
        seen++;
        if (Math.random() * seen < 1) tgt = e;
      }
      if (tgt) {
        s.cd = SOLDIER.cd * rof;
        s.aim = Math.atan2(tgt.y - s.y, tgt.x - s.x);
        hurtEnemy(tgt, SOLDIER.dmg);
        G.tracers.push({ x1: s.x, y1: s.y, x2: tgt.x, y2: tgt.y, life: .07, w: 1, col: K.gold });
      } else s.cd = .2;
    }
  }
}

function stepTo(o, tx, ty, spd, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  const st = spd * CELL * dt;
  if (d <= st) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * st; o.y += dy / d * st;
  return false;
}

// ===========================================================================
// Emplacements
// ===========================================================================
function updateBuildings(dt) {
  for (const b of G.buildings) {
    const spec = B[b.key];
    if (!b.done) {
      b.prog += dt / 2.2;
      if (b.prog >= 1) { b.prog = 1; b.done = true; G.flowDirty = true; }
      continue;
    }
    b.flash = Math.max(0, b.flash - dt * 9);
    if (!spec.dmg) continue;
    b.cd -= dt;
    if (b.cd > 0) continue;

    const bx = px(b.c), by = py(b.r);
    const maxR = spec.range * CELL, minR = (spec.minRange || 0) * CELL;
    let tgt = null, score = -1, seen = 0;
    for (const e of G.enemies) {
      const d = Math.hypot(e.x - bx, e.y - by);
      if (d > maxR || d < minR) continue;
      if (spec.arc) {
        // artillery wants the deepest target it can legally reach
        if (-e.y > score) { score = -e.y; tgt = e; }
      } else {
        // direct fire spreads across the crowd rather than stacking one body
        seen++;
        if (Math.random() * seen < 1) tgt = e;
      }
    }
    if (!tgt) { b.cd = .12; continue; }
    b.aim = Math.atan2(tgt.y - by, tgt.x - bx);
    b.cd = spec.cd;
    b.flash = 1;

    if (spec.arc) {
      const dist = Math.hypot(tgt.x - bx, tgt.y - by);
      G.shells.push({
        x0: bx, y0: by, x1: tgt.x + rnd(-CELL * .3, CELL * .3), y1: tgt.y + rnd(-CELL * .3, CELL * .3),
        t: 0, dur: clamp(dist / (CELL * 9), .5, 1.5),
        dmg: spec.dmg, splash: spec.splash * CELL, big: b.key === "siege"
      });
      G.shake = Math.max(G.shake, b.key === "siege" ? 3.5 : 1.6);
    } else if (spec.beam) {
      const a = b.aim;
      const ex = bx + Math.cos(a) * maxR, ey = by + Math.sin(a) * maxR;
      G.beams.push({ x1: bx, y1: by, x2: ex, y2: ey, life: .18 });
      for (const e of G.enemies) {
        // distance from the enemy to the beam segment
        const vx = ex - bx, vy = ey - by;
        const t = clamp(((e.x - bx) * vx + (e.y - by) * vy) / (vx * vx + vy * vy), 0, 1);
        const d = Math.hypot(e.x - (bx + vx * t), e.y - (by + vy * t));
        if (d < CELL * .42) hurtEnemy(e, spec.dmg);
      }
      G.shake = Math.max(G.shake, 2.5);
    } else {
      hurtEnemy(tgt, spec.dmg);
      G.tracers.push({ x1: bx, y1: by, x2: tgt.x, y2: tgt.y, life: .055, w: 1.6, col: K.gold });
    }
  }
}

function updateShells(dt) {
  for (let i = G.shells.length - 1; i >= 0; i--) {
    const s = G.shells[i];
    s.t += dt;
    if (s.t < s.dur) continue;
    const r = s.splash;
    for (const e of G.enemies) {
      const d = Math.hypot(e.x - s.x1, e.y - s.y1);
      if (d < r) hurtEnemy(e, s.dmg * (1 - d / r * .45));
    }
    boom(s.x1, s.y1, r, s.big ? 26 : 16);
    scorch(s.x1, s.y1, r * .55, K.burn);
    G.shake = Math.max(G.shake, s.big ? 9 : 5);
    G.shells.splice(i, 1);
  }
}

// ===========================================================================
// Enemies
// ===========================================================================
function spawnEnemy(type) {
  if (G.enemies.length >= MAX_ENEMIES) return;
  const spec = E[type];
  const scale = 1 + G.assault * 0.13;
  G.enemies.push({
    type, x: GX + rnd(CELL * .2, CELL * COLS - CELL * .2), y: GY - rnd(4, CELL * 1.6),
    hp: spec.hp * scale, maxHp: spec.hp * scale,
    r: spec.r * CELL, cd: rnd(0, 1), flash: 0, dead: false,
    off: rnd(-.34, .34), wob: rnd(0, 6.28)
  });
}

function hurtEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 1;
  if (e.hp <= 0) {
    e.dead = true;
    G.kills++;
    if (Math.random() < .5) scorch(e.x, e.y, e.r * 1.5, K.blood);
    spray(e.x, e.y, E[e.type].kill > 4 ? 8 : 3);
  }
}

function updateEnemies(dt) {
  if (G.flowDirty) rebuildFlow();
  const f = G.flow, dens = G.dens;
  // occupancy per cell: enemies avoid packed cells, so a breach widens into a
  // broad push instead of a single-file queue
  dens.fill(0);
  for (const e of G.enemies) {
    const c = Math.floor((e.x - GX) / CELL), r = Math.floor((e.y - GY) / CELL);
    if (c >= 0 && r >= 0 && c < COLS && r < ROWS) dens[r * COLS + c]++;
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) { G.enemies.splice(i, 1); continue; }
    const spec = E[e.type];
    e.flash = Math.max(0, e.flash - dt * 7);
    e.cd -= dt;

    const c = clamp(Math.floor((e.x - GX) / CELL), 0, COLS - 1);
    const rRaw = Math.floor((e.y - GY) / CELL);

    // above the board: just march in
    if (rRaw < 0) { e.y += spec.spd * CELL * dt; continue; }
    const r = Math.min(rRaw, ROWS - 1);

    const here = at(c, r);

    // soldiers in the open are the first thing they reach for
    let prey = null, pd = CELL * .62;
    for (const s of G.soldiers) {
      const d = Math.hypot(s.x - e.x, s.y - e.y);
      if (d < pd) { pd = d; prey = s; }
    }
    if (prey) {
      if (e.cd <= 0) {
        e.cd = spec.cd;
        const cover = prey.post ? B[prey.post.key].cover : 1;
        prey.hp -= spec.dmg * cover;
        if (prey.hp <= 0) prey.dead = true;
      }
      continue;
    }

    // the HQ itself
    if (here && here.hq) {
      if (e.cd <= 0) {
        e.cd = spec.cd;
        G.hq.hp -= spec.dmg;
        G.shake = Math.max(G.shake, 3);
        if (G.hq.hp <= 0) { G.hq.hp = 0; finish(false, "사령부가 함락되었습니다"); return; }
      }
      continue;
    }

    // pick the neighbouring cell with the lowest distance-to-HQ
    const i0 = r * COLS + c;
    let bestI = i0, bestV = f[i0] * 10 + dens[i0] * 5;
    const nb = [[c, r + 1], [c + 1, r], [c - 1, r], [c, r - 1]];
    for (const [nc, nr] of nb) {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const ni = nr * COLS + nc;
      const v = f[ni] * 10 + dens[ni] * 5;
      if (v < bestV) { bestV = v; bestI = ni; }
    }
    const tc = bestI % COLS, tr = (bestI / COLS) | 0;
    const nt = G.tiles[bestI];

    // blocked by a structure: tear it down
    if (nt.b && nt.b.done) {
      if (e.cd <= 0) { e.cd = spec.cd; hurtBuilding(nt.b, spec.dmg); }
      continue;
    }

    let spd = spec.spd;
    if (here && here.b && here.b.done && B[here.b.key].slow) spd *= B[here.b.key].slow;

    e.wob += dt * 3;
    const tx = px(tc) + e.off * CELL + Math.sin(e.wob) * CELL * .07;
    const ty = py(tr);
    stepTo(e, tx, ty, spd, dt);
  }
}

// ===========================================================================
// Effects
// ===========================================================================
function scorch(x, y, r, col) {
  if (!sctx) return;
  sctx.fillStyle = col;
  sctx.beginPath();
  sctx.arc(x - GX, y - GY, r, 0, 6.2832);
  sctx.fill();
}
function spray(x, y, n) {
  if (G.parts.length > 520) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(20, 120);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col: "#8d2233", size: rnd(1.2, 2.4) });
  }
}
function boom(x, y, r, n) {
  if (G.parts.length > 520) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(40, 300);
    G.parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
      col: i % 3 ? (i % 2 ? "#ff9d4a" : "#ffd98a") : "#6a7079", size: rnd(1.8, 4.2)
    });
  }
  G.floats.push({ ring: true, x, y, r0: r * .3, r1: r, life: 1 });
}
function floatText(x, y, text, col) { G.floats.push({ x, y, text, col, life: 1.4 }); }

function updateFx(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= .90; p.vy *= .90;
    p.life -= dt * 1.7;
    if (p.life <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    if (!f.ring) f.y -= 22 * dt;
    f.life -= dt * (f.ring ? 3.2 : .8);
    if (f.life <= 0) G.floats.splice(i, 1);
  }
  for (let i = G.tracers.length - 1; i >= 0; i--) {
    G.tracers[i].life -= dt;
    if (G.tracers[i].life <= 0) G.tracers.splice(i, 1);
  }
  for (let i = G.beams.length - 1; i >= 0; i--) {
    G.beams[i].life -= dt;
    if (G.beams[i].life <= 0) G.beams.splice(i, 1);
  }
  G.shake = Math.max(0, G.shake - dt * 22);
  G.breach = Math.max(0, G.breach - dt);
}

// ===========================================================================
// Assault schedule
// ===========================================================================
function pickType(mix) {
  let x = Math.random();
  for (const k in mix) { x -= mix[k]; if (x <= 0) return k; }
  return "swarm";
}

function updateWar(dt) {
  G.t += dt;
  G.mat += (income() - upkeepDrain()) * dt;
  if (G.mat < 0) G.mat = 0;
  G.man = Math.min(G.manCap, G.man + manRate() * dt);

  G.timer -= dt;
  if (G.phase === "lull") {
    G.spawnAcc += LULL_RATE * dt;
    if (G.timer <= 0) {
      if (G.assault >= ASSAULTS.length) { finish(true, "10차 공세를 모두 버텨냈습니다"); return; }
      G.assault++;
      G.phase = "assault";
      const a = ASSAULTS[G.assault - 1];
      G.timer = a.dur;
      G.titansLeft = a.titans || 0;
      floatText(px(4), py(2), G.assault + "차 공세", K.danger);
      G.shake = 10;
    }
  } else {
    const a = ASSAULTS[G.assault - 1];
    G.spawnAcc += a.rate * dt;
    if (G.titansLeft > 0 && G.timer < a.dur * .55) {
      G.titansLeft--; spawnEnemy("titan");
    }
    if (G.timer <= 0) {
      G.phase = "lull";
      G.timer = LULL;
      G.mat += 90;
      floatText(px(4), py(2), "공세 격퇴  자원 +90", K.accent);
    }
  }
  const mix = G.phase === "assault" ? ASSAULTS[G.assault - 1].mix : { swarm: 1 };
  while (G.spawnAcc >= 1) { G.spawnAcc -= 1; spawnEnemy(pickType(mix)); }
}

// ===========================================================================
// Render
// ===========================================================================
function drawGround() {
  ctx.fillStyle = K.bg;
  ctx.fillRect(0, 0, W, H);

  const bw = CELL * COLS, bh = CELL * ROWS;
  // three bands, each a slightly different mud
  const bands = [[0, 2, K.nml], [2, 8, K.mud], [8, 12, K.mud2], [12, 16, K.mud]];
  for (const [r0, r1, col] of bands) {
    ctx.fillStyle = col;
    ctx.fillRect(GX, GY + r0 * CELL, bw, (r1 - r0) * CELL);
  }
  // zone seams
  ctx.strokeStyle = "#333a44"; ctx.lineWidth = 1;
  ctx.setLineDash([7, 6]);
  for (const r of [2, 8, 12]) {
    ctx.beginPath();
    ctx.moveTo(GX, GY + r * CELL + .5); ctx.lineTo(GX + bw, GY + r * CELL + .5);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  if (scar) ctx.drawImage(scar, GX, GY);

  ctx.strokeStyle = "#20252c"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < COLS; c++) { ctx.moveTo(GX + c * CELL + .5, GY); ctx.lineTo(GX + c * CELL + .5, GY + bh); }
  for (let r = 1; r < ROWS; r++) { ctx.moveTo(GX, GY + r * CELL + .5); ctx.lineTo(GX + bw, GY + r * CELL + .5); }
  ctx.stroke();

  ctx.strokeStyle = K.line; ctx.lineWidth = 1;
  ctx.strokeRect(GX - .5, GY - .5, bw + 1, bh + 1);

  ctx.font = `7px ${MONO}`; ctx.textAlign = "left";
  ctx.fillStyle = "#3d454f";
  ctx.fillText("무인지대", GX + 4, GY + 11);
  ctx.fillText("전방 · 참호", GX + 4, GY + 2 * CELL + 11);
  ctx.fillText("중앙 · 화력", GX + 4, GY + 8 * CELL + 11);
  ctx.fillText("후방 · 중장비", GX + 4, GY + 12 * CELL + 11);
}

function drawHQ() {
  const x = GX + 3 * CELL, y = GY + 14 * CELL, w = CELL * 3, h = CELL * 2;
  ctx.fillStyle = K.shade; ctx.fillRect(x + 3, y + 4, w, h);
  ctx.fillStyle = "#2a3038"; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = K.outline; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = "#343b45";
  ctx.fillRect(x + CELL * .35, y + CELL * .3, w - CELL * .7, h - CELL * .6);
  ctx.fillStyle = K.accent;
  ctx.fillRect(x + w / 2 - CELL * .26, y + h / 2 - CELL * .26, CELL * .52, CELL * .52);
  ctx.fillStyle = "#101318";
  ctx.fillRect(x + w / 2 - CELL * .09, y + h / 2 - CELL * .09, CELL * .18, CELL * .18);
  ctx.fillStyle = "#14181d"; ctx.fillRect(x + 5, y + h - 9, w - 10, 5);
  const fr = G.hq.hp / G.hq.max;
  ctx.fillStyle = fr < .35 ? K.danger : K.cyan;
  ctx.fillRect(x + 5, y + h - 9, (w - 10) * fr, 5);
  ctx.font = `7px ${MONO}`; ctx.fillStyle = "#8d959e"; ctx.textAlign = "center";
  ctx.fillText("사령부", x + w / 2, y + 12);
}

function drawBuildings() {
  for (const b of G.buildings) {
    const spec = B[b.key], x = px(b.c), y = py(b.r), s = CELL;
    if (!b.done) {
      ctx.globalAlpha = .45;
      ctx.fillStyle = "#262c34";
      ctx.fillRect(x - s * .36, y - s * .3, s * .72, s * .6);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#14181d"; ctx.fillRect(x - s * .34, y + s * .22, s * .68, 4);
      ctx.fillStyle = K.accent; ctx.fillRect(x - s * .34, y + s * .22, s * .68 * b.prog, 4);
      continue;
    }
    ctx.save();
    ctx.translate(x, y);
    switch (b.key) {
      case "wire": {
        ctx.strokeStyle = "#6a727c"; ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let k = -2; k <= 2; k++) {
          ctx.moveTo(k * s * .17, -s * .22); ctx.lineTo(k * s * .17, s * .22);
        }
        ctx.moveTo(-s * .4, -s * .1); ctx.lineTo(s * .4, -s * .1);
        ctx.moveTo(-s * .4, s * .1); ctx.lineTo(s * .4, s * .1);
        ctx.stroke();
        break;
      }
      case "trench": {
        ctx.fillStyle = K.shade;
        ctx.fillRect(-s * .46, -s * .18, s * .92, s * .36);
        ctx.fillStyle = "#3a4149";
        ctx.fillRect(-s * .46, -s * .26, s * .92, s * .09);
        ctx.fillRect(-s * .46, s * .17, s * .92, s * .09);
        ctx.fillStyle = "#262c33";
        for (let k = -2; k <= 2; k++) ctx.fillRect(k * s * .19 - 1.5, -s * .18, 3, s * .36);
        break;
      }
      case "bunker": {
        ctx.fillStyle = K.shade; ctx.fillRect(-s * .40 + 3, -s * .34 + 3, s * .8, s * .68);
        ctx.fillStyle = "#4b535c"; ctx.fillRect(-s * .40, -s * .34, s * .8, s * .68);
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.4;
        ctx.strokeRect(-s * .40, -s * .34, s * .8, s * .68);
        ctx.fillStyle = "#12161a"; ctx.fillRect(-s * .30, -s * .12, s * .6, s * .13);
        break;
      }
      case "mg": {
        ctx.fillStyle = K.shade; ctx.fillRect(-s * .3 + 3, -s * .26 + 3, s * .6, s * .52);
        ctx.fillStyle = K.steel; ctx.fillRect(-s * .3, -s * .26, s * .6, s * .52);
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.3;
        ctx.strokeRect(-s * .3, -s * .26, s * .6, s * .52);
        ctx.rotate(b.aim);
        ctx.fillStyle = b.flash > .3 ? K.gold : "#2f353c";
        ctx.fillRect(s * .12, -s * .06, s * .38, s * .12);
        break;
      }
      case "mortar": {
        ctx.fillStyle = K.shade;
        ctx.beginPath(); ctx.arc(3, 4, s * .3, 0, 6.2832); ctx.fill();
        ctx.fillStyle = "#4d5761";
        ctx.beginPath(); ctx.arc(0, 0, s * .3, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.3; ctx.stroke();
        ctx.rotate(b.aim);
        ctx.fillStyle = b.flash > .3 ? K.gold : "#2f353c";
        ctx.fillRect(0, -s * .07, s * .34, s * .14);
        break;
      }
      case "siege": {
        ctx.fillStyle = K.shade; ctx.fillRect(-s * .42 + 3, -s * .3 + 4, s * .84, s * .6);
        ctx.fillStyle = "#565f69"; ctx.fillRect(-s * .42, -s * .3, s * .84, s * .6);
        ctx.fillStyle = "#333a42"; ctx.fillRect(-s * .42, -s * .3, s * .84, s * .12);
        ctx.fillRect(-s * .42, s * .18, s * .84, s * .12);
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.4;
        ctx.strokeRect(-s * .42, -s * .3, s * .84, s * .6);
        ctx.rotate(b.aim);
        ctx.fillStyle = b.flash > .3 ? K.gold : "#39414a";
        ctx.fillRect(0, -s * .08, s * .62, s * .16);
        break;
      }
      case "mech": {
        ctx.fillStyle = K.shade; ctx.fillRect(-s * .34 + 3, -s * .42 + 4, s * .68, s * .84);
        ctx.fillStyle = "#5f6874"; ctx.fillRect(-s * .34, -s * .42, s * .68, s * .84);
        ctx.fillStyle = "#3a424c"; ctx.fillRect(-s * .34, -s * .42, s * .68, s * .18);
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.5;
        ctx.strokeRect(-s * .34, -s * .42, s * .68, s * .84);
        ctx.fillStyle = b.flash > .3 ? K.cyan : "#2b323a";
        ctx.fillRect(-s * .16, -s * .3, s * .32, s * .1);
        break;
      }
      case "depot": case "camp": {
        const col = b.key === "depot" ? "#3f5560" : "#4a4f3f";
        ctx.fillStyle = K.shade; ctx.fillRect(-s * .34 + 3, -s * .28 + 3, s * .68, s * .56);
        ctx.fillStyle = col; ctx.fillRect(-s * .34, -s * .28, s * .68, s * .56);
        ctx.strokeStyle = K.outline; ctx.lineWidth = 1.3;
        ctx.strokeRect(-s * .34, -s * .28, s * .68, s * .56);
        ctx.fillStyle = b.key === "depot" ? K.cyan : K.gold;
        ctx.fillRect(-s * .09, -s * .09, s * .18, s * .18);
        break;
      }
    }
    ctx.restore();

    if (b.hp < b.maxHp) {
      const w = CELL * .74;
      ctx.fillStyle = "#0d1013";
      ctx.fillRect(x - w / 2, y + CELL * .34, w, 3);
      ctx.fillStyle = b.hp / b.maxHp < .35 ? K.danger : "#9aa3ac";
      ctx.fillRect(x - w / 2, y + CELL * .34, w * (b.hp / b.maxHp), 3);
    }
    if (spec.garrison) {
      ctx.font = `7px ${MONO}`; ctx.textAlign = "center";
      ctx.fillStyle = b.crew.length >= spec.garrison ? "#5d6670" : K.accent;
      ctx.fillText(b.crew.length + "/" + spec.garrison, x, y - CELL * .3);
    }
  }
}

// Batched: one path for the bodies, one for the highlights. Keeps four
// hundred enemies cheap enough to hold sixty frames on a phone.
function drawEnemies() {
  const list = G.enemies;
  ctx.fillStyle = K.shade;
  ctx.beginPath();
  for (const e of list) {
    if (e.type === "titan") continue;
    ctx.moveTo(e.x + 2, e.y - e.r + 2.5);
    ctx.lineTo(e.x + e.r + 2, e.y + e.r + 2.5);
    ctx.lineTo(e.x - e.r + 2, e.y + e.r + 2.5);
  }
  ctx.fill();

  ctx.fillStyle = "#a8434f";
  ctx.beginPath();
  for (const e of list) {
    if (e.type === "titan" || e.flash > 0) continue;
    ctx.moveTo(e.x, e.y - e.r);
    ctx.lineTo(e.x + e.r, e.y + e.r);
    ctx.lineTo(e.x - e.r, e.y + e.r);
  }
  ctx.fill();

  ctx.fillStyle = "#f0f2f4";
  ctx.beginPath();
  for (const e of list) {
    if (e.type === "titan" || e.flash <= 0) continue;
    ctx.moveTo(e.x, e.y - e.r);
    ctx.lineTo(e.x + e.r, e.y + e.r);
    ctx.lineTo(e.x - e.r, e.y + e.r);
  }
  ctx.fill();

  // brutes get an outline so the tough ones read out of the mass
  ctx.strokeStyle = "#e0555f"; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const e of list) {
    if (e.type !== "brute") continue;
    ctx.moveTo(e.x, e.y - e.r);
    ctx.lineTo(e.x + e.r, e.y + e.r);
    ctx.lineTo(e.x - e.r, e.y + e.r);
    ctx.closePath();
  }
  ctx.stroke();

  for (const e of list) {
    if (e.type !== "titan") continue;
    ctx.fillStyle = K.shade;
    ctx.beginPath(); ctx.arc(e.x + 3, e.y + 4, e.r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = e.flash > 0 ? "#f0f2f4" : "#7d2b3a";
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = K.danger; ctx.lineWidth = 2; ctx.stroke();
    const w = e.r * 2.4;
    ctx.fillStyle = "#0d1013"; ctx.fillRect(e.x - w / 2, e.y + e.r + 3, w, 4);
    ctx.fillStyle = K.danger; ctx.fillRect(e.x - w / 2, e.y + e.r + 3, w * (e.hp / e.maxHp), 4);
  }
}

function drawSoldiers() {
  ctx.fillStyle = K.shade;
  ctx.beginPath();
  for (const s of G.soldiers) ctx.rect(s.x - CELL * .09 + 2, s.y - CELL * .13 + 2, CELL * .18, CELL * .26);
  ctx.fill();
  ctx.fillStyle = "#dbe1e6";
  ctx.beginPath();
  for (const s of G.soldiers) ctx.rect(s.x - CELL * .09, s.y - CELL * .13, CELL * .18, CELL * .26);
  ctx.fill();
  ctx.fillStyle = K.cyan;
  ctx.beginPath();
  for (const s of G.soldiers) ctx.rect(s.x - CELL * .06, s.y - CELL * .15, CELL * .12, CELL * .07);
  ctx.fill();
  // wounded marker
  ctx.fillStyle = K.danger;
  ctx.beginPath();
  for (const s of G.soldiers) {
    if (s.hp / s.maxHp > .5) continue;
    ctx.rect(s.x - CELL * .09, s.y + CELL * .15, CELL * .18 * (s.hp / s.maxHp), 2);
  }
  ctx.fill();
}

function drawOrdnance() {
  for (const t of G.tracers) {
    ctx.strokeStyle = t.col;
    ctx.globalAlpha = clamp(t.life / .07, 0, 1) * .85;
    ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const b of G.beams) {
    const a = clamp(b.life / .18, 0, 1);
    ctx.strokeStyle = K.cyan;
    ctx.globalAlpha = a * .25; ctx.lineWidth = CELL * .5;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = a; ctx.lineWidth = CELL * .12;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // shells arc: interpolate the ground track, lift the sprite off it
  for (const s of G.shells) {
    const k = s.t / s.dur;
    const gx = s.x0 + (s.x1 - s.x0) * k;
    const gy = s.y0 + (s.y1 - s.y0) * k;
    const lift = Math.sin(k * Math.PI) * CELL * (s.big ? 2.6 : 1.7);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.arc(gx, gy, CELL * .07, 0, 6.2832); ctx.fill();
    ctx.fillStyle = s.big ? K.gold : "#d8dde2";
    ctx.beginPath(); ctx.arc(gx, gy - lift, CELL * (s.big ? .12 : .09), 0, 6.2832); ctx.fill();
    // impact marker so the player can read where it will land
    ctx.strokeStyle = "rgba(255,106,31,.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x1, s.y1, s.splash * (0.35 + k * 0.65), 0, 6.2832); ctx.stroke();
  }
}

function drawFx() {
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  for (const f of G.floats) {
    const a = clamp(f.life, 0, 1);
    if (f.ring) {
      ctx.globalAlpha = a * .7;
      ctx.strokeStyle = "#ffb069"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - a), 0, 6.2832); ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = f.col; ctx.font = `700 12px ${MONO}`;
      ctx.fillText(f.text, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
}

function drawPlacement() {
  if (!pick) return;
  const spec = B[pick];
  const [r0, r1] = ZONE_ROWS[spec.z];
  ctx.fillStyle = "rgba(255,106,31,.07)";
  ctx.fillRect(GX, GY + r0 * CELL, CELL * COLS, (r1 - r0 + 1) * CELL);
  ctx.strokeStyle = "rgba(255,106,31,.5)"; ctx.lineWidth = 1;
  ctx.setLineDash([6, 5]);
  ctx.strokeRect(GX + .5, GY + r0 * CELL + .5, CELL * COLS - 1, (r1 - r0 + 1) * CELL - 1);
  ctx.setLineDash([]);
}

function render() {
  ctx.save();
  if (G.shake > .2) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  drawGround();
  drawPlacement();
  drawHQ();
  drawBuildings();
  drawSoldiers();
  drawEnemies();
  drawOrdnance();
  drawFx();
  ctx.restore();

  if (G.breach > 0) {
    ctx.fillStyle = `rgba(212,51,80,${G.breach * .12})`;
    ctx.fillRect(0, 0, W, H);
  }
  const fr = G.hq.hp / G.hq.max;
  if (fr < .4) {
    const a = .10 + Math.sin(performance.now() / 150) * .05;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .65);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(212,51,80,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

// ===========================================================================
// UI
// ===========================================================================
function syncTop() {
  $("sMat").textContent = Math.floor(G.mat);
  $("sMan").innerHTML = `${Math.floor(G.man)}<small>/${G.manCap}</small>`;
  $("sSol").textContent = G.soldiers.length;
  const fr = G.hq.hp / G.hq.max;
  $("sHq").innerHTML = `${Math.ceil(fr * 100)}<small>%</small>`;
  $("sHq").style.color = fr < .35 ? K.danger : K.ink;
  $("wNum").textContent = G.assault;
  $("wState").textContent = G.phase === "assault" ? "교전 중" : (G.assault ? "소강" : "대기");
  $("wState").style.color = G.phase === "assault" ? K.danger : K.dim;
  $("sKia").textContent = G.kia;
  $("sKill").textContent = G.kills;
  const a = G.phase === "assault" ? ASSAULTS[G.assault - 1] : null;
  $("threatFill").style.width = (a ? (1 - G.timer / a.dur) * 100 : (1 - G.timer / LULL) * 100) + "%";
  $("threatFill").style.background = G.phase === "assault" ? K.danger : "#3d4650";
}

function mkAct(title, cost, on, opts) {
  const b = document.createElement("button");
  b.className = "act" + (opts && opts.warn ? " warn" : "");
  b.innerHTML = `<div class="t">${title}</div><div class="c">${cost}</div>`;
  if (opts && opts.sel) b.dataset.sel = "1";
  if (opts && opts.off) b.disabled = true; else b.addEventListener("click", on);
  return b;
}

function syncSheet() {
  const body = $("body");
  body.innerHTML = "";
  document.querySelectorAll(".tab").forEach(t => t.dataset.on = (+t.dataset.zone === tab) ? "1" : "0");

  if (tab === 3) {
    $("hint").textContent = "병사는 가장 앞쪽 빈 참호로 알아서 들어갑니다";
    let free = 0;
    for (const b of G.buildings) if (b.done && B[b.key].garrison) free += B[b.key].garrison - b.crew.length;
    body.appendChild(mkAct("병사 1명", `자원 ${SOLDIER.mat} · 인력 ${SOLDIER.man}`, () => {
      spawnSoldier(); syncSheet();
    }, { off: G.mat < SOLDIER.mat || G.man < SOLDIER.man }));
    body.appendChild(mkAct("병사 5명", `자원 ${SOLDIER.mat * 5} · 인력 ${SOLDIER.man * 5}`, () => {
      for (let i = 0; i < 5; i++) if (!spawnSoldier()) break;
      syncSheet();
    }, { off: G.mat < SOLDIER.mat * 5 || G.man < SOLDIER.man * 5 }));
    const info = document.createElement("div");
    info.className = "act";
    info.style.cssText = "pointer-events:none;flex-basis:100%";
    info.innerHTML = `<div class="t" style="font-size:11px">배치 가능한 자리 ${free}칸</div>
      <div class="c">자원 +${income().toFixed(0)}/초 · 유지비 -${upkeepDrain().toFixed(1)}/초 · 인력 +${manRate().toFixed(2)}/초</div>`;
    body.appendChild(info);
    return;
  }

  $("hint").textContent = pick ? `${B[pick].name} — 강조된 구역을 누르세요` : "건물을 고른 뒤 지도를 누르세요";
  for (const key of ZONE_BUILDS[tab]) {
    const spec = B[key];
    const extra = spec.garrison ? ` · <em>병사 ${spec.garrison}</em>` : (spec.upkeep ? ` · <em>유지 ${spec.upkeep}</em>` : "");
    body.appendChild(mkAct(spec.name, `자원 ${spec.mat}${extra}<br>${spec.desc}`, () => {
      pick = (pick === key) ? null : key;
      syncSheet();
    }, { off: G.mat < spec.mat && pick !== key, sel: pick === key }));
  }
}

// ===========================================================================
// Loop
// ===========================================================================
let last = performance.now(), acc = 0, uiT = 0;
const STEP = 1 / 60;

function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .2) dt = .2;
  try {
    if (mode === "play") {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 4) { step(STEP); acc -= STEP; }
      if (acc > .4) acc = 0;
      uiT += dt;
      if (uiT > .12) { uiT = 0; syncTop(); }
    }
    if (G) render();
  } catch (err) {
    // never let a single bad frame leave the player staring at a frozen board
    console.error(err);
  }
  requestAnimationFrame(frame);
}

function step(dt) {
  updateWar(dt);
  if (mode !== "play") return;
  updateSoldiers(dt);
  updateBuildings(dt);
  updateShells(dt);
  updateEnemies(dt);
  updateFx(dt);
}

// ===========================================================================
// Flow
// ===========================================================================
function finish(won, why) {
  if (mode === "end") return;
  mode = "end";
  $("endTitle").textContent = won ? "전선 사수" : "전선 붕괴";
  $("endTitle").style.color = won ? K.cyan : K.danger;
  $("endSub").textContent = why;
  const m = Math.floor(G.t / 60), s2 = Math.floor(G.t % 60);
  $("endStats").innerHTML =
    `버틴 시간 &nbsp;<b>${m}분 ${String(s2).padStart(2, "0")}초</b><br>` +
    `도달 공세 &nbsp;<b>${G.assault} / ${ASSAULTS.length}</b><br>` +
    `적 격파 &nbsp;<b>${G.kills}</b><br>` +
    `아군 전사 &nbsp;<b>${G.kia}</b><br>` +
    `남은 사령부 &nbsp;<b>${Math.ceil(G.hq.hp / G.hq.max * 100)}%</b>`;
  $("endScreen").hidden = false;
}

function start() {
  newGame(); resize();
  mode = "play"; pick = null; tab = 0;
  last = performance.now(); acc = 0;
  $("titleScreen").hidden = true; $("endScreen").hidden = true;
  syncTop(); syncSheet();
}

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => { tab = +t.dataset.zone; syncSheet(); });
});

// ===========================================================================
// Input
// ===========================================================================
function tap(cx, cy) {
  if (mode !== "play" || !pick) return;
  const c = Math.floor((cx - GX) / CELL), r = Math.floor((cy - GY) / CELL);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  const err = place(pick, c, r);
  if (err) floatText(clamp(px(c), 60, W - 60), py(r) - CELL * .5, err, K.danger);
  else if (G.mat < B[pick].mat) pick = null;
  syncSheet();
}
cv.addEventListener("click", e => tap(e.clientX, e.clientY));
cv.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  if (t) tap(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });
cv.addEventListener("touchstart", e => e.preventDefault(), { passive: false });

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
