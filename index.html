<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>HOLD THE LINE</title>
<style>
  :root {
    --bg: #101318;
    --panel: #171b21;
    --panel2: #1f242b;
    --line: #2b313a;
    --ink: #e4e7ea;
    --dim: #79828d;
    --accent: #ff6a1f;
    --cyan: #4fd6e0;
    --danger: #d43350;
    --gold: #ffc93d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #top {
    position: fixed; z-index: 5; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 7px) 8px 6px;
    background: linear-gradient(to bottom, var(--bg) 76%, transparent);
    pointer-events: none;
  }
  #res { display: flex; gap: 5px; }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 5px 7px 6px;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  .stat .k {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 7.5px; letter-spacing: .13em; color: var(--dim);
  }
  .stat .v {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px; font-weight: 700; line-height: 1.15; margin-top: 1px;
  }
  .stat .v small { font-size: 9px; color: var(--dim); font-weight: 400; }
  #line2 {
    display: flex; align-items: center; gap: 8px; margin-top: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px; letter-spacing: .09em; color: var(--dim);
  }
  #line2 b { color: var(--accent); }
  #line2 .r { margin-left: auto; }
  #threatBar { height: 3px; background: #23272e; margin-top: 5px; }
  #threatFill { height: 100%; width: 0; background: var(--danger); }

  #sheet {
    position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
    padding: 7px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
    background: var(--bg); border-top: 1px solid var(--line);
  }
  #tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tab {
    flex: 1; cursor: pointer; background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); padding: 7px 2px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px; letter-spacing: .1em;
  }
  .tab[data-on="1"] { background: var(--accent); color: #101318; border-color: var(--accent); }
  #body { display: flex; gap: 5px; flex-wrap: wrap; min-height: 56px; }
  .act {
    flex: 1 1 0; min-width: 78px; cursor: pointer; text-align: left;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 7px 8px 7px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .act:active { background: var(--panel2); }
  .act[disabled] { opacity: .35; }
  .act[data-sel="1"] { border-color: var(--accent); background: var(--panel2); }
  .act .t { font-size: 12px; font-weight: 700; }
  .act .c {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 8.5px; color: var(--dim); margin-top: 2px;
  }
  .act .c em { font-style: normal; color: var(--cyan); }
  .act.warn { border-color: var(--accent); }
  #hint {
    font-size: 9.5px; color: var(--dim); margin-top: 6px; text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    justify-content: center; padding: 26px 22px calc(env(safe-area-inset-bottom,0px) + 26px);
    background: rgba(16,19,24,.97); overflow-y: auto;
  }
  .title {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 30px; font-weight: 700; letter-spacing: .16em; color: var(--accent);
    text-align: center; margin: 0; line-height: 1.3;
  }
  .sub { text-align: center; color: var(--dim); font-size: 12.5px; line-height: 1.75; margin: 12px 0 0; }
  .lbl {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9px; letter-spacing: .18em; color: var(--dim); margin: 20px 0 8px;
  }
  .help { font-size: 12.5px; line-height: 1.9; }
  .help b { color: var(--accent); }
  .help .d { color: var(--dim); }
  .btn {
    display: block; width: 100%; cursor: pointer; margin-top: 18px;
    background: var(--accent); color: #101318; border: 1px solid var(--accent); padding: 15px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="res">
    <div class="stat"><div class="k">자원</div><div class="v" id="sMat">0</div></div>
    <div class="stat"><div class="k">인력</div><div class="v" id="sMan">0</div></div>
    <div class="stat"><div class="k">병력</div><div class="v" id="sSol">0</div></div>
    <div class="stat"><div class="k">사령부</div><div class="v" id="sHq">100<small>%</small></div></div>
  </div>
  <div id="line2">
    <span>공세 <b id="wNum">0</b>/10</span>
    <span id="wState">대기</span>
    <span class="r">전사 <span id="sKia">0</span> · 격파 <span id="sKill">0</span></span>
  </div>
  <div id="threatBar"><div id="threatFill"></div></div>
</div>

<div id="sheet">
  <div id="tabs">
    <button class="tab" data-zone="0" data-on="1">전방 · 참호</button>
    <button class="tab" data-zone="1">중앙 · 화력</button>
    <button class="tab" data-zone="2">후방 · 중장비</button>
    <button class="tab" data-zone="3">병력</button>
  </div>
  <div id="body"></div>
  <div id="hint">건물을 고른 뒤 지도를 누르세요</div>
</div>

<div class="overlay" id="titleScreen">
  <h1 class="title">HOLD<br>THE LINE</h1>
  <p class="sub">전선을 겹겹이 쌓아 10차 공세를 버텨내세요.</p>
  <div class="lbl">방어선은 세 겹입니다</div>
  <div class="help">
    <b>전방</b> <span class="d">— 철조망, 참호, 벙커. 병사가 들어갑니다</span><br>
    <b>중앙</b> <span class="d">— 기관총 진지, 박격포</span><br>
    <b>후방</b> <span class="d">— 시즈탱크, 거대로봇, 보급소, 병영</span>
  </div>
  <div class="lbl">핵심</div>
  <div class="help">
    병사는 <b>참호 안에서만 강합니다.</b><br>
    <span class="d">참호가 부서지면 그 구간이 뚫립니다. 병력을 다시 밀어 넣으세요.</span>
  </div>
  <button class="btn" id="startBtn">전투 시작</button>
</div>

<div class="overlay" id="endScreen" hidden>
  <div class="title" id="endTitle"></div>
  <p class="sub" id="endSub"></p>
  <div class="lbl">전투 기록</div>
  <div class="help mono" id="endStats" style="font-size:12px;line-height:2"></div>
  <button class="btn" id="againBtn">다시 하기</button>
</div>

<script>
"use strict";

// ===========================================================================
// Canvas + layout
// ===========================================================================
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const $ = id => document.getElementById(id);

const COLS = 9, ROWS = 16;
// rows 0-1 no man's land · 2-7 front · 8-11 mid · 12-15 rear
const ZONE_ROWS = [[2, 7], [8, 11], [12, 15]];
const zoneOf = r => r <= 1 ? -1 : r <= 7 ? 0 : r <= 11 ? 1 : 2;

let W = 0, H = 0, DPR = 1, CELL = 40, GX = 0, GY = 0;
let safeTop = 0;
let scar = null, sctx = null;         // persistent battlefield damage

function measureSafe() {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px)";
  document.body.appendChild(d);
  safeTop = d.getBoundingClientRect().height || 0;
  d.remove();
}
measureSafe();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const topH = safeTop + 78;
  const botH = ($("sheet") ? $("sheet").offsetHeight : 110) + 4;
  const playH = Math.max(140, H - topH - botH);
  // the flat space the simulation lives in; only the projection is on screen
  CELL = Math.min((W - 14) / COLS, playH / (ROWS * PERSP.rowH * 0.95));
  GX = (W - CELL * COLS) / 2;
  GY = topH;
  buildProjection(topH, playH);
  const sw = Math.round(CELL * COLS), sh = Math.round(CELL * ROWS);
  const old = scar;
  scar = document.createElement("canvas");
  scar.width = sw; scar.height = sh;
  sctx = scar.getContext("2d");
  if (old && old.width) sctx.drawImage(old, 0, 0, sw, sh);
  buildSprites();
  buildGround();
}
window.addEventListener("resize", resize);

// ===========================================================================
// Projection
// The board is a three-quarter diorama, not a flat grid: far rows are narrower
// and shorter, and each band sits at its own height. The simulation stays in
// flat board coordinates; only drawing goes through here, so ranges and
// distances are never distorted.
// ===========================================================================
const PERSP = { far: 0.87, rowH: 0.96, bandLift: [0, 0, 0.19, 0.40] };
let ROWY = [], ROWH = [], ROWSC = [], ROWLIFT = [], BCX = 0, BTOP = 0, BOARDH = 0, CLIPTOP = 0;

function bandOf(r) { return r <= 1 ? 0 : r <= 7 ? 1 : r <= 11 ? 2 : 3; }

function buildProjection(topH, playH) {
  ROWY = []; ROWH = []; ROWSC = []; ROWLIFT = [];
  let y = 0;
  for (let r = 0; r < ROWS; r++) {
    const t = (r + .5) / ROWS;
    const sc = PERSP.far + (1 - PERSP.far) * t;
    const h = CELL * PERSP.rowH * sc;
    ROWSC[r] = sc; ROWH[r] = h; ROWY[r] = y;
    ROWLIFT[r] = CELL * PERSP.bandLift[bandOf(r)];
    y += h;
  }
  BOARDH = y;
  BCX = W / 2;
  const lift = CELL * PERSP.bandLift[3];
  BTOP = topH + Math.max(6, (playH - (BOARDH + CELL * .34)) * .5) + lift;
  CLIPTOP = topH;
}

// flat board pixels -> screen
function proj(x, y) {
  const fx = (x - GX) / CELL, fy = (y - GY) / CELL;
  const r = clamp(Math.floor(fy), 0, ROWS - 1);
  const frac = clamp(fy - r, -1.5, 1.5);
  const sc = ROWSC[r];
  return {
    x: BCX + (fx - COLS / 2) * CELL * sc,
    y: BTOP + ROWY[r] + frac * ROWH[r] - ROWLIFT[r],
    s: sc
  };
}
// tile centre -> screen
function tilePt(c, r) {
  const sc = ROWSC[r];
  return {
    x: BCX + (c + .5 - COLS / 2) * CELL * sc,
    y: BTOP + ROWY[r] + ROWH[r] * .5 - ROWLIFT[r],
    s: sc
  };
}
// screen -> tile
function unproj(sx, sy) {
  for (let r = ROWS - 1; r >= 0; r--) {
    const top = BTOP + ROWY[r] - ROWLIFT[r];
    if (sy >= top && sy < top + ROWH[r]) {
      const fx = (sx - BCX) / (CELL * ROWSC[r]) + COLS / 2;
      const c = Math.floor(fx);
      if (c < 0 || c >= COLS) return null;
      return { c, r };
    }
  }
  return null;
}

const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const K = {
  bg: "#0b0d10",
  line: "#2b313a", ink: "#e4e7ea", dim: "#79828d",
  accent: "#ff7a2a", cyan: "#6fd8e0", danger: "#d8425c", gold: "#ffcf5c",
  outline: "#0a0c0f", shade: "#07090b",
  blood: "rgba(88,16,26,.40)", burn: "rgba(0,0,0,.42)"
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const px = c => GX + (c + 0.5) * CELL;
const py = r => GY + (r + 0.5) * CELL;

// ===========================================================================
// Content
// ===========================================================================
// zone: which band it may be built in. garrison: how many soldiers it holds.
const B = {
  wire:   { z: 0, name: "철조망", mat: 15,  hp: 320,  desc: "지나가는 적을 크게 늦춘다", slow: 0.34 },
  trench: { z: 0, name: "참호",   mat: 40,  hp: 620,  desc: "병사 3명, 피해 65% 감소", garrison: 3, cover: 0.35 },
  bunker: { z: 0, name: "벙커",   mat: 110, hp: 1500, desc: "병사 2명, 피해 88% 감소, 사격 속도 +40%",
            garrison: 2, cover: 0.12, rof: 0.7 },
  mg:     { z: 1, name: "기관총 진지", mat: 70, hp: 460, desc: "빠른 연사, 사거리 4칸",
            dmg: 5, cd: 0.11, range: 4.0, upkeep: 2 },
  mortar: { z: 1, name: "박격포",  mat: 120, hp: 380, desc: "포물선 탄. 3칸 밖만 때린다",
            dmg: 52, cd: 2.6, range: 9.5, minRange: 2.6, splash: 1.20, arc: true, upkeep: 3 },
  siege:  { z: 2, name: "시즈탱크", mat: 210, hp: 1100, desc: "화면 끝까지. 착탄이 크다",
            dmg: 150, cd: 3.4, range: 15, minRange: 4.5, splash: 1.65, arc: true, upkeep: 6 },
  mech:   { z: 2, name: "거대로봇", mat: 300, hp: 2600, desc: "관통 광선. 일직선을 쓸어버린다",
            dmg: 55, cd: 1.2, range: 11, beam: true, upkeep: 8 },
  depot:  { z: 2, name: "보급소",  mat: 80,  hp: 420,  desc: "자원 생산 +5/초", income: 5 },
  camp:   { z: 2, name: "병영",    mat: 95, hp: 500,  desc: "인력 회복 +0.5/초", manpower: 0.5 }
};
const ZONE_BUILDS = [["trench", "wire", "bunker"], ["mg", "mortar"], ["siege", "mech", "depot", "camp"]];

const E = {
  swarm:   { name: "소형",  hp: 14,  spd: 1.55, dmg: 4,  cd: 0.55, r: 0.15, kill: 1 },
  charger: { name: "돌격",  hp: 26,  spd: 2.45, dmg: 9,  cd: 0.7,  r: 0.16, kill: 2 },
  brute:   { name: "중형",  hp: 105, spd: 0.85, dmg: 20, cd: 1.0,  r: 0.24, kill: 5 },
  titan:   { name: "대형",  hp: 900, spd: 0.5,  dmg: 70, cd: 1.4,  r: 0.42, kill: 40 }
};

// Ten assaults. Pressure never stops; it swells and eases.
const ASSAULTS = [
  { dur: 34, rate: 2.0,  mix: { swarm: 1 } },
  { dur: 36, rate: 3.0,  mix: { swarm: 1 } },
  { dur: 38, rate: 4.0,  mix: { swarm: 0.82, charger: 0.18 } },
  { dur: 40, rate: 5.2,  mix: { swarm: 0.72, charger: 0.2, brute: 0.08 } },
  { dur: 42, rate: 6.5,  mix: { swarm: 0.68, charger: 0.22, brute: 0.10 } },
  { dur: 44, rate: 8.0,  mix: { swarm: 0.62, charger: 0.24, brute: 0.14 } },
  { dur: 46, rate: 9.5, mix: { swarm: 0.60, charger: 0.24, brute: 0.16 }, titans: 1 },
  { dur: 48, rate: 10.5, mix: { swarm: 0.58, charger: 0.24, brute: 0.18 }, titans: 1 },
  { dur: 50, rate: 12.0, mix: { swarm: 0.55, charger: 0.25, brute: 0.20 }, titans: 2 },
  { dur: 58, rate: 14.5, mix: { swarm: 0.52, charger: 0.26, brute: 0.22 }, titans: 4 }
];
const LULL = 17, LULL_RATE = 0.7;

const SOLDIER = { mat: 15, man: 4, hp: 46, dmg: 6, cd: 0.62, range: 3.4, spd: 1.9 };
const HQ_HP = 7000;
const MAX_ENEMIES = 460;

// ===========================================================================
// State
// ===========================================================================
let G = null, mode = "title";
let pick = null, tab = 0;

function newGame() {
  const tiles = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    tiles.push({ c, r, b: null, hq: false });
  // headquarters: three wide, two deep, dead centre of the rear
  for (let r = 14; r <= 15; r++) for (let c = 3; c <= 5; c++) tiles[r * COLS + c].hq = true;

  G = {
    tiles, buildings: [], soldiers: [], enemies: [], shells: [], tracers: [],
    parts: [], floats: [], beams: [],
    mat: 700, man: 44, manCap: 120,
    hq: { hp: HQ_HP, max: HQ_HP },
    assault: 0, phase: "lull", timer: 26, spawnAcc: 0, titansLeft: 0,
    flow: new Int16Array(COLS * ROWS), flowDirty: true,
    dens: new Int16Array(COLS * ROWS),
    kia: 0, kills: 0, t: 0, shake: 0, breach: 0,
    sel: null
  };
  if (sctx) sctx.clearRect(0, 0, scar.width, scar.height);
}

const at = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? null : G.tiles[r * COLS + c];

function income() {
  let m = 5;
  for (const b of G.buildings) if (b.done && B[b.key].income) m += B[b.key].income;
  return m;
}
function manRate() {
  let m = 0.28;
  for (const b of G.buildings) if (b.done && B[b.key].manpower) m += B[b.key].manpower;
  return m;
}
function upkeep() {
  let u = 0;
  for (const b of G.buildings) if (b.done && B[b.key].upkeep) u += B[b.key].upkeep;
  return u;
}
// Heavy weapons eat materials. Over-arm and your economy starves, which is the
// pressure that keeps depots and barracks in the build.
function upkeepDrain() { return upkeep() * 0.42; }

// ===========================================================================
// Flow field — one BFS for every enemy on the board
// ===========================================================================
// Cells re-enter the queue whenever a cheaper route is found, so this has to
// grow past the cell count. A fixed-size buffer silently overflowed here.
const flowQ = [];
function rebuildFlow() {
  const f = G.flow;
  f.fill(30000);
  flowQ.length = 0;
  let head = 0;
  for (let r = 14; r <= 15; r++) for (let c = 3; c <= 5; c++) {
    const i = r * COLS + c; f[i] = 0; flowQ.push(i);
  }
  while (head < flowQ.length) {
    const i = flowQ[head++];
    const c = i % COLS, r = (i / COLS) | 0, d = f[i];
    const nb = [[c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]];
    for (const [nc, nr] of nb) {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const ni = nr * COLS + nc;
      const t = G.tiles[ni];
      // walls are passable but expensive, so the swarm funnels into gaps
      // and only chews through when there is no way round
      const step = (t.b && t.b.done) ? (B[t.b.key].garrison ? 9 : 6) : 1;
      if (d + step < f[ni]) { f[ni] = d + step; flowQ.push(ni); }
    }
  }
  G.flowDirty = false;
}

// ===========================================================================
// Building / soldiers
// ===========================================================================
function place(key, c, r) {
  const spec = B[key], t = at(c, r);
  if (!t) return "지도 밖입니다";
  if (zoneOf(r) !== spec.z) return "이 구역에는 지을 수 없습니다";
  if (t.hq) return "사령부 자리입니다";
  if (t.b) return "이미 건물이 있습니다";
  if (G.mat < spec.mat) return "자원이 부족합니다";
  G.mat -= spec.mat;
  const b = {
    key, c, r, hp: spec.hp, maxHp: spec.hp, done: false, prog: 0,
    cd: rnd(0, .4), aim: Math.PI / 2, flash: 0, crew: [], dead: false
  };
  t.b = b; G.buildings.push(b);
  G.flowDirty = true;
  return null;
}

function killBuilding(b) {
  const t = at(b.c, b.r);
  if (t) t.b = null;
  b.dead = true;
  G.buildings = G.buildings.filter(x => x !== b);
  for (const s of b.crew) { s.post = null; s.state = "seek"; }
  boom(px(b.c), py(b.r), CELL * .7, 16);
  scorch(px(b.c), py(b.r), CELL * .55, K.burn);
  G.shake = Math.max(G.shake, 7);
  G.flowDirty = true;
  if (B[b.key].garrison) { G.breach = 1.6; floatText(px(b.c), py(b.r), "방어선 붕괴", K.danger); }
}

function hurtBuilding(b, dmg) {
  b.hp -= dmg;
  if (b.hp <= 0) killBuilding(b);
}

function spawnSoldier() {
  if (G.mat < SOLDIER.mat || G.man < SOLDIER.man) return false;
  G.mat -= SOLDIER.mat; G.man -= SOLDIER.man;
  G.soldiers.push({
    x: px(4) + rnd(-CELL, CELL), y: py(15), hp: SOLDIER.hp, maxHp: SOLDIER.hp,
    post: null, state: "seek", cd: rnd(0, .5), dead: false, aim: Math.PI / 2, fire: 0
  });
  return true;
}

// Soldiers walk themselves to the most forward position with a free slot.
function findPost() {
  let best = null, bestR = 99;
  for (const b of G.buildings) {
    if (!b.done || !B[b.key].garrison) continue;
    if (b.crew.length >= B[b.key].garrison) continue;
    if (b.r < bestR) { bestR = b.r; best = b; }
  }
  return best;
}

function updateSoldiers(dt) {
  for (let i = G.soldiers.length - 1; i >= 0; i--) {
    const s = G.soldiers[i];
    if (s.dead) {
      G.soldiers.splice(i, 1); G.kia++;
      scorch(s.x, s.y, CELL * .22, K.blood);
      continue;
    }
    s.fire = Math.max(0, s.fire - dt);
    if (s.post && (s.post.dead || !s.post.done)) { s.post = null; s.state = "seek"; }

    if (s.state === "seek") {
      const p = findPost();
      if (p) { p.crew.push(s); s.post = p; s.state = "move"; }
      else {
        // no trench to hold: fall back and stand in front of the HQ
        const tx = px(4) + ((i % 5) - 2) * CELL * .5, ty = py(13);
        stepTo(s, tx, ty, SOLDIER.spd, dt);
      }
    } else if (s.state === "move") {
      if (!s.post) { s.state = "seek"; }
      else {
        const idx = s.post.crew.indexOf(s);
        const off = (idx - (B[s.post.key].garrison - 1) / 2) * CELL * .26;
        if (stepTo(s, px(s.post.c) + off, py(s.post.r), SOLDIER.spd, dt)) s.state = "hold";
      }
    }

    // fire
    s.cd -= dt;
    if (s.cd <= 0) {
      const spec = s.post ? B[s.post.key] : null;
      const rof = spec && spec.rof ? spec.rof : 1;
      // reservoir pick among everything in range: thirty rifles all choosing
      // the nearest target wastes most of their fire on one already-dead body
      const R = SOLDIER.range * CELL, R2 = R * R;
      let tgt = null, seen = 0;
      for (const e of G.enemies) {
        const dx = e.x - s.x, dy = e.y - s.y;
        if (dx * dx + dy * dy > R2) continue;
        seen++;
        if (Math.random() * seen < 1) tgt = e;
      }
      if (tgt) {
        s.cd = SOLDIER.cd * rof;
        s.fire = .12;
        s.aim = Math.atan2(tgt.y - s.y, tgt.x - s.x);
        hurtEnemy(tgt, SOLDIER.dmg);
        G.tracers.push({ x1: s.x, y1: s.y, x2: tgt.x, y2: tgt.y, life: .07, w: 1, col: K.gold });
      } else s.cd = .2;
    }
  }
}

function stepTo(o, tx, ty, spd, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  const st = spd * CELL * dt;
  if (d <= st) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * st; o.y += dy / d * st;
  return false;
}

// ===========================================================================
// Emplacements
// ===========================================================================
function updateBuildings(dt) {
  for (const b of G.buildings) {
    const spec = B[b.key];
    if (!b.done) {
      b.prog += dt / 2.2;
      if (b.prog >= 1) { b.prog = 1; b.done = true; G.flowDirty = true; }
      continue;
    }
    b.flash = Math.max(0, b.flash - dt * 9);
    if (!spec.dmg) continue;
    b.cd -= dt;
    if (b.cd > 0) continue;

    const bx = px(b.c), by = py(b.r);
    const maxR = spec.range * CELL, minR = (spec.minRange || 0) * CELL;
    let tgt = null, score = -1, seen = 0;
    for (const e of G.enemies) {
      const d = Math.hypot(e.x - bx, e.y - by);
      if (d > maxR || d < minR) continue;
      if (spec.arc) {
        // artillery wants the deepest target it can legally reach
        if (-e.y > score) { score = -e.y; tgt = e; }
      } else {
        // direct fire spreads across the crowd rather than stacking one body
        seen++;
        if (Math.random() * seen < 1) tgt = e;
      }
    }
    if (!tgt) { b.cd = .12; continue; }
    b.aim = Math.atan2(tgt.y - by, tgt.x - bx);
    b.cd = spec.cd;
    b.flash = 1;

    if (spec.arc) {
      const dist = Math.hypot(tgt.x - bx, tgt.y - by);
      G.shells.push({
        x0: bx, y0: by, x1: tgt.x + rnd(-CELL * .3, CELL * .3), y1: tgt.y + rnd(-CELL * .3, CELL * .3),
        t: 0, dur: clamp(dist / (CELL * 9), .5, 1.5),
        dmg: spec.dmg, splash: spec.splash * CELL, big: b.key === "siege"
      });
      G.shake = Math.max(G.shake, b.key === "siege" ? 3.5 : 1.6);
    } else if (spec.beam) {
      const a = b.aim;
      const ex = bx + Math.cos(a) * maxR, ey = by + Math.sin(a) * maxR;
      G.beams.push({ x1: bx, y1: by, x2: ex, y2: ey, life: .18 });
      for (const e of G.enemies) {
        // distance from the enemy to the beam segment
        const vx = ex - bx, vy = ey - by;
        const t = clamp(((e.x - bx) * vx + (e.y - by) * vy) / (vx * vx + vy * vy), 0, 1);
        const d = Math.hypot(e.x - (bx + vx * t), e.y - (by + vy * t));
        if (d < CELL * .42) hurtEnemy(e, spec.dmg);
      }
      G.shake = Math.max(G.shake, 2.5);
    } else {
      hurtEnemy(tgt, spec.dmg);
      G.tracers.push({ x1: bx, y1: by, x2: tgt.x, y2: tgt.y, life: .055, w: 1.6, col: K.gold });
    }
  }
}

function updateShells(dt) {
  for (let i = G.shells.length - 1; i >= 0; i--) {
    const s = G.shells[i];
    s.t += dt;
    if (s.t < s.dur) continue;
    const r = s.splash;
    for (const e of G.enemies) {
      const d = Math.hypot(e.x - s.x1, e.y - s.y1);
      if (d < r) hurtEnemy(e, s.dmg * (1 - d / r * .45));
    }
    boom(s.x1, s.y1, r, s.big ? 26 : 16);
    scorch(s.x1, s.y1, r * .55, K.burn);
    G.shake = Math.max(G.shake, s.big ? 9 : 5);
    G.shells.splice(i, 1);
  }
}

// ===========================================================================
// Enemies
// ===========================================================================
function spawnEnemy(type) {
  if (G.enemies.length >= MAX_ENEMIES) return;
  const spec = E[type];
  const scale = 1 + G.assault * 0.13;
  G.enemies.push({
    type, x: GX + rnd(CELL * .2, CELL * COLS - CELL * .2), y: GY - rnd(4, CELL * 1.6),
    hp: spec.hp * scale, maxHp: spec.hp * scale,
    r: spec.r * CELL, cd: rnd(0, 1), flash: 0, dead: false, dir: Math.PI / 2,
    off: rnd(-.34, .34), wob: rnd(0, 6.28)
  });
}

function hurtEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 1;
  if (e.hp <= 0) {
    e.dead = true;
    G.kills++;
    if (Math.random() < .5) scorch(e.x, e.y, e.r * 1.5, K.blood);
    spray(e.x, e.y, E[e.type].kill > 4 ? 8 : 3);
    if (E[e.type].kill > 1) dust(e.x, e.y, 2, e.r * 2.4);
  }
}

function updateEnemies(dt) {
  if (G.flowDirty) rebuildFlow();
  const f = G.flow, dens = G.dens;
  // occupancy per cell: enemies avoid packed cells, so a breach widens into a
  // broad push instead of a single-file queue
  dens.fill(0);
  for (const e of G.enemies) {
    const c = Math.floor((e.x - GX) / CELL), r = Math.floor((e.y - GY) / CELL);
    if (c >= 0 && r >= 0 && c < COLS && r < ROWS) dens[r * COLS + c]++;
  }
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) { G.enemies.splice(i, 1); continue; }
    const spec = E[e.type];
    e.flash = Math.max(0, e.flash - dt * 7);
    e.cd -= dt;

    const c = clamp(Math.floor((e.x - GX) / CELL), 0, COLS - 1);
    const rRaw = Math.floor((e.y - GY) / CELL);

    // above the board: just march in
    if (rRaw < 0) { e.y += spec.spd * CELL * dt; continue; }
    const r = Math.min(rRaw, ROWS - 1);

    const here = at(c, r);

    // soldiers in the open are the first thing they reach for
    let prey = null, pd = CELL * .62;
    for (const s of G.soldiers) {
      const d = Math.hypot(s.x - e.x, s.y - e.y);
      if (d < pd) { pd = d; prey = s; }
    }
    if (prey) {
      if (e.cd <= 0) {
        e.cd = spec.cd;
        const cover = prey.post ? B[prey.post.key].cover : 1;
        prey.hp -= spec.dmg * cover;
        if (prey.hp <= 0) prey.dead = true;
      }
      continue;
    }

    // the HQ itself
    if (here && here.hq) {
      if (e.cd <= 0) {
        e.cd = spec.cd;
        G.hq.hp -= spec.dmg;
        G.shake = Math.max(G.shake, 3);
        if (G.hq.hp <= 0) { G.hq.hp = 0; finish(false, "사령부가 함락되었습니다"); return; }
      }
      continue;
    }

    // pick the neighbouring cell with the lowest distance-to-HQ
    const i0 = r * COLS + c;
    let bestI = i0, bestV = f[i0] * 10 + dens[i0] * 5;
    const nb = [[c, r + 1], [c + 1, r], [c - 1, r], [c, r - 1]];
    for (const [nc, nr] of nb) {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const ni = nr * COLS + nc;
      const v = f[ni] * 10 + dens[ni] * 5;
      if (v < bestV) { bestV = v; bestI = ni; }
    }
    const tc = bestI % COLS, tr = (bestI / COLS) | 0;
    const nt = G.tiles[bestI];

    // blocked by a structure: tear it down
    if (nt.b && nt.b.done) {
      if (e.cd <= 0) { e.cd = spec.cd; hurtBuilding(nt.b, spec.dmg); }
      continue;
    }

    let spd = spec.spd;
    if (here && here.b && here.b.done && B[here.b.key].slow) spd *= B[here.b.key].slow;

    e.wob += dt * spd * 3.2;
    const tx = px(tc) + e.off * CELL + Math.sin(e.wob) * CELL * .07;
    const ty = py(tr);
    const ddx = tx - e.x, ddy = ty - e.y;
    if (ddx * ddx + ddy * ddy > 1) e.dir = Math.atan2(ddy, ddx);
    stepTo(e, tx, ty, spd, dt);
  }
}

// ===========================================================================
// Effects
// ===========================================================================
function scorch(x, y, r, col) {
  if (!sctx) return;
  sctx.fillStyle = col;
  sctx.beginPath();
  sctx.arc(x - GX, y - GY, r, 0, 6.2832);
  sctx.fill();
}
function spray(x, y, n) {
  if (G.parts.length > 560) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(20, 120);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col: "#7d1f2c", size: rnd(1.2, 2.4) });
  }
}
function boom(x, y, r, n) {
  if (G.parts.length > 560) return;
  // sparks and debris
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(40, 320);
    G.parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hot: i % 3 !== 0,
      col: i % 3 ? (i % 2 ? "#ffb35c" : "#fff0c0") : "#5c6169", size: rnd(1.8, 4.4)
    });
  }
  // the smoke is what sells the hit
  for (let i = 0; i < Math.max(4, n / 3); i++) {
    const a = rnd(0, 6.2832), s = rnd(6, 46);
    G.parts.push({
      x: x + rnd(-r * .3, r * .3), y: y + rnd(-r * .3, r * .3),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 12, life: rnd(.7, 1.3),
      soft: true, alpha: rnd(.18, .38), size: r * rnd(.6, 1.1), col: "#000"
    });
  }
  G.floats.push({ ring: true, x, y, r0: r * .3, r1: r, life: 1 });
}
function dust(x, y, n, size) {
  if (G.parts.length > 560) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.2832), s = rnd(4, 26);
    G.parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, life: rnd(.5, .9),
      soft: true, alpha: rnd(.10, .22), size: size, col: "#000"
    });
  }
}
function floatText(x, y, text, col) { G.floats.push({ x, y, text, col, life: 1.4 }); }

function updateFx(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.soft) { p.vx *= .965; p.vy = p.vy * .965 - 5 * dt; p.life -= dt * .85; }
    else { p.vx *= .90; p.vy *= .90; p.life -= dt * 1.7; }
    if (p.life <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    if (!f.ring) f.y -= 22 * dt;
    f.life -= dt * (f.ring ? 3.2 : .8);
    if (f.life <= 0) G.floats.splice(i, 1);
  }
  for (let i = G.tracers.length - 1; i >= 0; i--) {
    G.tracers[i].life -= dt;
    if (G.tracers[i].life <= 0) G.tracers.splice(i, 1);
  }
  for (let i = G.beams.length - 1; i >= 0; i--) {
    G.beams[i].life -= dt;
    if (G.beams[i].life <= 0) G.beams.splice(i, 1);
  }
  G.shake = Math.max(0, G.shake - dt * 22);
  G.breach = Math.max(0, G.breach - dt);
}

// ===========================================================================
// Assault schedule
// ===========================================================================
function pickType(mix) {
  let x = Math.random();
  for (const k in mix) { x -= mix[k]; if (x <= 0) return k; }
  return "swarm";
}

function updateWar(dt) {
  G.t += dt;
  G.mat += (income() - upkeepDrain()) * dt;
  if (G.mat < 0) G.mat = 0;
  G.man = Math.min(G.manCap, G.man + manRate() * dt);

  G.timer -= dt;
  if (G.phase === "lull") {
    G.spawnAcc += LULL_RATE * dt;
    if (G.timer <= 0) {
      if (G.assault >= ASSAULTS.length) { finish(true, "10차 공세를 모두 버텨냈습니다"); return; }
      G.assault++;
      G.phase = "assault";
      const a = ASSAULTS[G.assault - 1];
      G.timer = a.dur;
      G.titansLeft = a.titans || 0;
      floatText(px(4), py(2), G.assault + "차 공세", K.danger);
      G.shake = 10;
    }
  } else {
    const a = ASSAULTS[G.assault - 1];
    G.spawnAcc += a.rate * dt;
    if (G.titansLeft > 0 && G.timer < a.dur * .55) {
      G.titansLeft--; spawnEnemy("titan");
    }
    if (G.timer <= 0) {
      G.phase = "lull";
      G.timer = LULL;
      G.mat += 90;
      floatText(px(4), py(2), "공세 격퇴  자원 +90", K.accent);
    }
  }
  const mix = G.phase === "assault" ? ASSAULTS[G.assault - 1].mix : { swarm: 1 };
  while (G.spawnAcc >= 1) { G.spawnAcc -= 1; spawnEnemy(pickType(mix)); }
}

// ===========================================================================
// Sprite factory
// Baked once into offscreen canvases at device resolution. Light comes from
// the top. Friendlies are near-white, the swarm is near-black with red edges,
// and the tiles under both are light — silhouette carries the reading.
// ===========================================================================
const SPR = { b: {}, turret: {}, enemy: {}, soldier: [], flash: null, puff: null, hq: null, shadow: null, glow: null };

function h2r(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixc(a, b, t) {
  const A = h2r(a), B = h2r(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}
const lt = (c, t) => mixc(c, "#ffffff", t);
const dk = (c, t) => mixc(c, "#000000", t);
function mk(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(2, Math.round(w)); c.height = Math.max(2, Math.round(h));
  return c;
}
function slab(g, x, y, w, h, col, bev) {
  bev = bev === undefined ? Math.max(1.2, h * .18) : bev;
  g.fillStyle = dk(col, .55); g.fillRect(x, y + h - bev, w, bev);
  g.fillStyle = col; g.fillRect(x, y + bev * .5, w, h - bev * 1.5);
  g.fillStyle = lt(col, .34); g.fillRect(x, y, w, bev * .5);
}
function edge(g, x, y, w, h, lw) {
  g.strokeStyle = "rgba(14,18,24,.9)"; g.lineWidth = lw || 1.2;
  g.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

const MAT = {
  steel: "#3f4954", steelHi: "#79858f", dark: "#262d36",
  conc: "#b9c1c9", olive: "#4f5742", tan: "#c9b78d",
  orange: "#ff8a3d", cyan: "#3fd2e2"
};

function buildSprites() {
  const S = Math.round(CELL * DPR);
  const u = S / 40;

  { // contact shadow, baked once
    const n = Math.round(64 * u), c = mk(n, n), g = c.getContext("2d");
    const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    gr.addColorStop(0, "rgba(8,11,16,.62)");
    gr.addColorStop(.55, "rgba(8,11,16,.30)");
    gr.addColorStop(1, "rgba(8,11,16,0)");
    g.fillStyle = gr; g.fillRect(0, 0, n, n);
    SPR.shadow = c;
  }
  { // white glow, tinted at draw time
    const n = Math.round(64 * u), c = mk(n, n), g = c.getContext("2d");
    const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(.35, "rgba(255,255,255,.35)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, n, n);
    SPR.glow = c;
  }
  { // soft puff for smoke and dust
    const n = Math.round(48 * u), c = mk(n, n), g = c.getContext("2d");
    const gr = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    gr.addColorStop(0, "rgba(255,255,255,.95)");
    gr.addColorStop(.45, "rgba(255,255,255,.35)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, n, n);
    SPR.puff = c;
  }
  { // muzzle flash
    const n = Math.round(26 * u), c = mk(n, n), g = c.getContext("2d");
    g.translate(n / 2, n / 2);
    g.fillStyle = "rgba(255,232,160,.95)";
    g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * 6.2832, r = i % 2 ? n * .12 : n * .48;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.92)";
    g.beginPath(); g.arc(0, 0, n * .13, 0, 6.2832); g.fill();
    SPR.flash = c;
  }

  const B_ = {};

  { // 철조망
    const c = mk(S, S * .8), g = c.getContext("2d");
    g.translate(0, S * .58);
    for (let i = 0; i < 4; i++) {
      const x = S * (.12 + i * .25);
      g.fillStyle = MAT.dark; g.fillRect(x - u * 1.5, -S * .30, u * 3, S * .32);
      g.fillStyle = lt(MAT.dark, .30); g.fillRect(x - u * 1.5, -S * .30, u * 1.2, S * .32);
    }
    g.strokeStyle = "#8e9aa5"; g.lineWidth = u * 1.1;
    for (const yy of [-S * .26, -S * .15, -S * .04]) {
      g.beginPath(); g.moveTo(0, yy);
      for (let i = 0; i < 4; i++) g.quadraticCurveTo(S * (.24 + i * .25), yy + u * 2.4, S * (.37 + i * .25), yy);
      g.stroke();
    }
    g.fillStyle = "#cfd6dc";
    for (let i = 0; i < 12; i++) g.fillRect(S * .06 + Math.random() * S * .88, [-S * .26, -S * .15, -S * .04][i % 3] - u * 1.4, u * .8, u * 2.8);

  { // 참호 — a dark cut in a light board, with a plank wall and sandbags
    const c = mk(S, S * .9), g = c.getContext("2d");

    g.fillStyle = "#c0b79a"; g.fillRect(0, -S * .44, S, S * .12);
    g.fillStyle = lt("#c0b79a", .2); g.fillRect(0, -S * .44, S, S * .04);
    g.fillStyle = "#171b21"; g.fillRect(0, -S * .32, S, S * .30);
    g.fillStyle = "#3c3227";
    for (let i = 0; i < 9; i++) g.fillRect(S * .02 + i * S * .11, -S * .28, S * .075, S * .24);
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, -S * .32, S, S * .08);
    for (let i = 0; i < 6; i++) {
      const bw = S / 6, x = i * bw, col = i % 2 ? MAT.tan : dk(MAT.tan, .12);
      g.fillStyle = dk(col, .5); g.fillRect(x, -S * .02, bw - 1, S * .11);
      g.fillStyle = col; g.fillRect(x, -S * .06, bw - 1, S * .10);
      g.fillStyle = lt(col, .25); g.fillRect(x, -S * .06, bw - 1, S * .035);
    }

  }

  { // 벙커
    const c = mk(S, S), g = c.getContext("2d");
    g.translate(S * .5, S * .70);
    g.fillStyle = dk(MAT.conc, .55); g.fillRect(-S * .38, -S * .16, S * .76, S * .18);
    slab(g, -S * .38, -S * .52, S * .76, S * .38, MAT.conc, u * 5);
    g.fillStyle = "#0d1116"; g.fillRect(-S * .26, -S * .32, S * .52, S * .11);
    g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(-S * .26, -S * .32, S * .52, u * .9);
    g.fillStyle = dk(MAT.conc, .22);
    g.fillRect(-S * .38, -S * .52, u * 4, S * .38);
    g.fillRect(S * .38 - u * 4, -S * .52, u * 4, S * .38);
    g.fillStyle = MAT.orange; g.fillRect(-S * .05, -S * .50, S * .10, u * 2);
    for (let i = 0; i < 5; i++) {
      const bw = S * .76 / 5, x = -S * .38 + i * bw;
      g.fillStyle = i % 2 ? MAT.tan : dk(MAT.tan, .14);
      g.fillRect(x, -S * .02, bw - 1, S * .10);
      g.fillStyle = lt(MAT.tan, .2); g.fillRect(x, -S * .02, bw - 1, S * .03);

  }

  { // 기관총 진지
    const c = mk(S, S * .8), g = c.getContext("2d");
    g.translate(S * .5, S * .5);
    g.fillStyle = "#1d222a";
    g.beginPath(); g.ellipse(0, 0, S * .30, S * .17, 0, 0, 6.2832); g.fill();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * 6.2832, x = Math.cos(a) * S * .30, y = Math.sin(a) * S * .17;
      const col = i % 2 ? MAT.tan : dk(MAT.tan, .14);
      g.fillStyle = dk(col, .5); g.fillRect(x - u * 3.2, y - u * .6, u * 6.4, u * 4);
      g.fillStyle = col; g.fillRect(x - u * 3.2, y - u * 2, u * 6.4, u * 3.8);
      g.fillStyle = lt(col, .22); g.fillRect(x - u * 3.2, y - u * 2, u * 6.4, u * 1.2);
    }
    B_.mg = c;
    const t = mk(S, S), h = t.getContext("2d");
    h.translate(S * .5, S * .5);
    slab(h, -u * 4.4, -u * 3.4, u * 9, u * 6.8, MAT.steel, u * 1.8);
    h.fillStyle = MAT.dark; h.fillRect(u * 4, -u * 1.1, S * .30, u * 2.2);
    h.fillStyle = lt(MAT.dark, .35); h.fillRect(u * 4, -u * 1.1, S * .30, u * .8);
    h.fillStyle = "#12161b";

  { // 박격포
    const c = mk(S, S * .8), g = c.getContext("2d");
    g.translate(S * .5, S * .5);
    g.fillStyle = "#1d222a";
    g.beginPath(); g.ellipse(0, 0, S * .29, S * .16, 0, 0, 6.2832); g.fill();
    g.strokeStyle = MAT.tan; g.lineWidth = u * 3.2;
    g.beginPath(); g.ellipse(0, 0, S * .29, S * .16, 0, 0, 6.2832); g.stroke();
    g.fillStyle = dk(MAT.olive, .4); g.fillRect(-S * .30, S * .02, u * 8, u * 5.5);
    g.fillStyle = MAT.olive; g.fillRect(-S * .30, S * .0, u * 8, u * 5);
    g.fillStyle = lt(MAT.olive, .25); g.fillRect(-S * .30, S * .0, u * 8, u * 1.5);
    B_.mortar = c;
    const t = mk(S, S), h = t.getContext("2d");
    h.translate(S * .5, S * .5);
    h.fillStyle = dk(MAT.steel, .3);
    h.beginPath(); h.ellipse(0, 0, u * 6, u * 4.4, 0, 0, 6.2832); h.fill();
    h.fillStyle = MAT.steel; h.fillRect(-u * 2, -u * 2.3, S * .34, u * 4.6);
    h.fillStyle = lt(MAT.steel, .35); h.fillRect(-u * 2, -u * 2.3, S * .34, u * 1.6);

  { // 보급소

  { // 병영
    const c = mk(S, S * .9), g = c.getContext("2d");

      g.beginPath(); g.moveTo(sx + S * .15, -S * .38); g.lineTo(sx + S * .30, 0); g.lineTo(sx + S * .22, 0);

  }

  SPR.b = B_;

  { // 사령부 — the objective, three cells wide
    const w = Math.round(CELL * 3 * DPR), h = Math.round(CELL * 1.9 * DPR);
    const c = mk(w, h), g = c.getContext("2d");
    const uu = w / 120;
    slab(g, uu * 6, uu * 26, w - uu * 12, h - uu * 34, "#4c5765", uu * 8);
    slab(g, uu * 20, uu * 12, w - uu * 40, uu * 26, "#59647240".slice(0, 7), uu * 6);
    g.fillStyle = "#232b34"; g.fillRect(w / 2 - uu * 15, h - uu * 34, uu * 30, uu * 24);
    g.fillStyle = MAT.cyan; g.fillRect(w / 2 - uu * 11, h - uu * 30, uu * 22, uu * 4);
    g.fillStyle = MAT.orange; g.fillRect(w / 2 - uu * 5, h - uu * 22, uu * 10, uu * 10);
    g.strokeStyle = "#8d99a4"; g.lineWidth = uu * 1.6;
    g.beginPath(); g.moveTo(w - uu * 24, uu * 30); g.lineTo(w - uu * 24, uu * 2); g.stroke();
    g.fillStyle = K.danger;
    g.beginPath(); g.arc(w - uu * 24, uu * 2, uu * 2.8, 0, 6.2832); g.fill();
    g.fillStyle = MAT.orange;
    g.fillRect(uu * 6, uu * 26, w - uu * 12, uu * 2.4);
    SPR.hq = c;
  }

  // ---- infantry: eight facings, ready / firing ----
  const solSize = Math.round(S * .58);
  SPR.soldier = [];
  for (let a = 0; a < 8; a++) {
    const pair = [];
    for (let f = 0; f < 2; f++) {
      const c = mk(solSize, solSize), g = c.getContext("2d");

      g.translate(solSize / 2, solSize / 2);

      g.fillStyle = "#20262e"; g.fillRect(q * 2, -q * .9, q * (f ? 9.5 : 8.5), q * 1.8);
      g.fillStyle = "#aeb8c2"; g.fillRect(-q * 4, -q * 4.4, q * 8, q * 8);
      g.fillStyle = "#eef2f6"; g.fillRect(-q * 4, -q * 4.4, q * 8, q * 4);
      g.strokeStyle = "#1b222b"; g.lineWidth = q * .8;
      g.strokeRect(-q * 4, -q * 4.4, q * 8, q * 8);
      g.fillStyle = "#e6ecf1";
      g.beginPath(); g.ellipse(q * .6, -q * .5, q * 3.4, q * 3.1, 0, 0, 6.2832); g.fill();
      g.fillStyle = "#ffffff";
      g.beginPath(); g.ellipse(q * .1, -q * 1.5, q * 2.5, q * 1.6, 0, 0, 6.2832); g.fill();
      g.fillStyle = MAT.cyan; g.fillRect(q * 2.2, -q * 1.1, q * 1.5, q * 2.2);
      g.strokeStyle = "#1b222b"; g.lineWidth = q * .8;
      g.beginPath(); g.ellipse(q * .6, -q * .5, q * 3.4, q * 3.1, 0, 0, 6.2832); g.stroke();
      pair.push(c);
    }
    SPR.soldier.push(pair);
  }

  // ---- the swarm: near-black bodies, red edges, two leg frames ----
  const EC = {
    swarm:   { body: "#1d222a", edge: "#d8425c", eye: "#ff8494", spike: "#2b323c" },
    charger: { body: "#22262f", edge: "#ff5a6e", eye: "#ffb0ba", spike: "#333a45" },
    brute:   { body: "#191d24", edge: "#c23a52", eye: "#ff7183", spike: "#2a313a" },
    titan:   { body: "#14181e", edge: "#e03a58", eye: "#ffd0d6", spike: "#232a33" }
  };
  SPR.enemy = {};
  for (const type in E) {
    const rad = E[type].r * CELL * DPR;
    const size = Math.round(rad * 3.6);
    const P = EC[type];
    const rows = [];
    for (let a = 0; a < 8; a++) {
      const frames = [];
      for (let f = 0; f < 2; f++) {
        const c = mk(size, size), g = c.getContext("2d");
        const q = rad;
        g.translate(size / 2, size / 2);
        g.rotate(a / 8 * 6.2832);
        g.strokeStyle = P.spike; g.lineWidth = Math.max(1.1, q * .24); g.lineCap = "round";
        for (const sgn of [-1, 1]) {
          const sw = (f ? .34 : -.34) * sgn;
          g.beginPath();
          g.moveTo(-q * .1, sgn * q * .3);
          g.lineTo(q * (.35 + sw * .3), sgn * q * (.92 + Math.abs(sw) * .2));
          g.stroke();
          g.beginPath();
          g.moveTo(-q * .5, sgn * q * .3);
          g.lineTo(-q * (.75 - sw * .3), sgn * q * (.92 + Math.abs(sw) * .2));
          g.stroke();
        }
        g.fillStyle = P.spike;
        g.beginPath();
        g.moveTo(q * .8, 0); g.lineTo(q * 1.6, -q * .26); g.lineTo(q * 1.6, q * .26);
        g.closePath(); g.fill();
        g.fillStyle = P.body;
        g.beginPath(); g.ellipse(0, 0, q * 1.05, q * .70, 0, 0, 6.2832); g.fill();
        g.fillStyle = lt(P.body, .16);
        g.beginPath(); g.ellipse(-q * .1, -q * .22, q * .74, q * .32, 0, 0, 6.2832); g.fill();
        g.strokeStyle = P.edge; g.lineWidth = Math.max(1.1, q * .16);
        g.beginPath(); g.ellipse(0, 0, q * 1.05, q * .70, 0, 0, 6.2832); g.stroke();
        g.fillStyle = P.eye;
        g.fillRect(q * .55, -q * .22, q * .34, q * .13);
        g.fillRect(q * .55, q * .09, q * .34, q * .13);
        frames.push(c);
      }
      rows.push(frames);
    }
    SPR.enemy[type] = rows;
  }
}
let backdropCv = null;
// the void behind the board never changes, so it is painted once
function buildGround() {
  const c = mk(W * DPR, H * DPR), g = c.getContext("2d");
  g.scale(DPR, DPR);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0a0d12");
  sky.addColorStop(.45, "#151b24");
  sky.addColorStop(1, "#0b0e13");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.save();
  g.globalAlpha = .05;
  g.strokeStyle = "#7fa8c8"; g.lineWidth = 1;
  const step = CELL * 1.1;
  g.beginPath();
  for (let x = -step; x < W + step; x += step) { g.moveTo(x, 0); g.lineTo(x + H * .35, H); }
  for (let y = 0; y < H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  g.restore();
  const gl = g.createRadialGradient(W / 2, BTOP + BOARDH * .35, CELL * .5,
                                    W / 2, BTOP + BOARDH * .35, Math.max(W, H) * .62);
  gl.addColorStop(0, "rgba(86,116,150,.22)");
  gl.addColorStop(1, "rgba(10,13,18,0)");
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  backdropCv = c;
  hazeGrad = ctx.createLinearGradient(0, BTOP - CELL * .4, 0, BTOP + CELL * 3.4);
  hazeGrad.addColorStop(0, "rgba(24,32,44,.62)");
  hazeGrad.addColorStop(1, "rgba(24,32,44,0)");
}
let hazeGrad = null;

// Render
// ===========================================================================
const TILE_TOP = ["#454e5a", "#b3ac9c", "#c1baa9", "#cfc8b6"];

function drawTileRow(r) {
  const band = bandOf(r);
  const top = TILE_TOP[band];
  const lift = ROWLIFT[r];
  const scT = PERSP.far + (1 - PERSP.far) * (r / ROWS);
  const scB = PERSP.far + (1 - PERSP.far) * ((r + 1) / ROWS);
  const yT = BTOP + ROWY[r] - lift;
  const yB = yT + ROWH[r];
  const gx = CELL * .055;
  const gy = ROWH[r] * .34;
  const dep = gy * (band === 0 ? .5 : band === 1 ? .58 : band === 2 ? .64 : .70);
  const yt = yT + gy * .5, yb = yB - gy * .5;

  for (let c = 0; c < COLS; c++) {
    const x0t = BCX + (c - COLS / 2) * CELL * scT + gx * scT;
    const x1t = BCX + (c + 1 - COLS / 2) * CELL * scT - gx * scT;
    const x0b = BCX + (c - COLS / 2) * CELL * scB + gx * scB;
    const x1b = BCX + (c + 1 - COLS / 2) * CELL * scB - gx * scB;

    // drop into the void
    ctx.fillStyle = "rgba(6,9,13,.5)";
    ctx.beginPath();
    ctx.moveTo(x0b, yb + dep * .5); ctx.lineTo(x1b, yb + dep * .5);
    ctx.lineTo(x1b, yb + dep * 1.25); ctx.lineTo(x0b, yb + dep * 1.25);
    ctx.closePath(); ctx.fill();

    // slab thickness
    ctx.fillStyle = dk(top, .66);
    ctx.beginPath();
    ctx.moveTo(x0b, yb); ctx.lineTo(x1b, yb);
    ctx.lineTo(x1b, yb + dep); ctx.lineTo(x0b, yb + dep);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = dk(top, .86);
    ctx.fillRect(x0b, yb + dep * .62, x1b - x0b, dep * .38);
    ctx.fillStyle = "rgba(255,196,130,.10)";
    ctx.fillRect(x0b, yb + dep * .88, x1b - x0b, dep * .12);

    // top face
    ctx.beginPath();
    ctx.moveTo(x0t, yt); ctx.lineTo(x1t, yt);
    ctx.lineTo(x1b, yb); ctx.lineTo(x0b, yb);
    ctx.closePath();
    ctx.fillStyle = top; ctx.fill();
    ctx.strokeStyle = "rgba(20,24,30,.55)"; ctx.lineWidth = 1; ctx.stroke();

    // inset plate
    const ix = (x1t - x0t) * .13, iy = (yb - yt) * .17;
    ctx.fillStyle = dk(top, .10);
    ctx.beginPath();
    ctx.moveTo(x0t + ix, yt + iy); ctx.lineTo(x1t - ix, yt + iy);
    ctx.lineTo(x1b - ix, yb - iy); ctx.lineTo(x0b + ix, yb - iy);
    ctx.closePath(); ctx.fill();

    // corner cuts, the small technical notch this style always carries
    ctx.fillStyle = dk(top, .26);
    const nn = (x1t - x0t) * .16;
    ctx.beginPath();
    ctx.moveTo(x0t, yt); ctx.lineTo(x0t + nn, yt); ctx.lineTo(x0t, yt + (yb - yt) * .30);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x1b, yb); ctx.lineTo(x1b - nn, yb); ctx.lineTo(x1b, yb - (yb - yt) * .30);
    ctx.closePath(); ctx.fill();

    // the far edge takes the key light
    ctx.fillStyle = lt(top, .30);
    ctx.beginPath();
    ctx.moveTo(x0t, yt); ctx.lineTo(x1t, yt);
    ctx.lineTo(x1t - (x1t - x1b) * .16, yt + (yb - yt) * .15);
    ctx.lineTo(x0t + (x0b - x0t) * .16, yt + (yb - yt) * .15);
    ctx.closePath(); ctx.fill();

    // panel etching
    if ((c * 3 + r * 5) % 7 === 0) {
      ctx.fillStyle = dk(top, .11);
      ctx.fillRect(x0t + (x1t - x0t) * .16, yt + (yb - yt) * .28, (x1t - x0t) * .3, (yb - yt) * .10);
    }
  }

  // hostile entry chevrons
  if (band === 0) {
    ctx.strokeStyle = "rgba(216,66,92,.6)"; ctx.lineWidth = 2;
    for (let i = -1; i < COLS * 2; i++) {
      const x = BCX + (i * .5 - COLS / 2) * CELL * scT;
      ctx.beginPath();
      ctx.moveTo(x, yt + 2); ctx.lineTo(x + CELL * .24 * scT, yt + CELL * .24 * scT);
      ctx.stroke();
    }
  }
  // bright trim where the ground steps up
  if (r === 8 || r === 12) {
    ctx.strokeStyle = "rgba(230,242,255,.5)"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(BCX - COLS / 2 * CELL * scT + gx, yt - 1);
    ctx.lineTo(BCX + COLS / 2 * CELL * scT - gx, yt - 1);
    ctx.stroke();
    ctx.fillStyle = "rgba(63,210,226,.16)";
    ctx.fillRect(BCX - COLS / 2 * CELL * scT + gx, yt - 1, COLS * CELL * scT - gx * 2, 2);
  }
}

function shadowAt(p, rx) {
  if (!SPR.shadow) return;
  const w = rx * 2.9, h = w * .42;
  ctx.drawImage(SPR.shadow, p.x - w / 2, p.y + rx * .10 - h / 2, w, h);
}

// bright parts actually glow
const GLOW_TINT = {};
function glowSprite(col) {
  if (GLOW_TINT[col]) return GLOW_TINT[col];
  const n = SPR.glow.width, c = mk(n, n), g = c.getContext("2d");
  g.drawImage(SPR.glow, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = col; g.fillRect(0, 0, n, n);
  GLOW_TINT[col] = c;
  return c;
}
function bloom(x, y, r, col, a) {
  if (!SPR.glow) return;
  const sp = glowSprite(col);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a;
  ctx.drawImage(sp, x - r, y - r, r * 2, r * 2);
  ctx.restore();
}

function drawFrame() {
  const m = 4, L = 16;
  const x0 = GX - CELL * .3, x1 = W - x0;
  const y0 = CLIPTOP + m, y1 = H - ($("sheet") ? $("sheet").offsetHeight : 110) - m;
  ctx.strokeStyle = "rgba(150,168,190,.35)"; ctx.lineWidth = 1.4;
  const corner = (cx, cy, sx, sy) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy + sy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + sx * L, cy);
    ctx.stroke();
  };
  corner(x0, y0, 1, 1); corner(x1, y0, -1, 1);
  corner(x0, y1, 1, -1); corner(x1, y1, -1, -1);
}

function blit(spr, p, wMul, anchor) {
  const w = spr.width / DPR * p.s * wMul;
  const h = spr.height / DPR * p.s * wMul;
  ctx.drawImage(spr, p.x - w / 2, p.y - h * anchor, w, h);
  return { w, h };
}

function drawBuildingAt(b) {
  const spec = B[b.key];
  const p = tilePt(b.c, b.r);
  const sp = SPR.b[b.key];
  if (!sp) return;
  shadowAt(p, CELL * .34 * p.s);
  if (!b.done) {
    ctx.save(); ctx.globalAlpha = .34;
    blit(sp, p, 1.2, .78);
    ctx.restore();
    const w = CELL * .62 * p.s;
    ctx.fillStyle = "rgba(10,14,20,.8)"; ctx.fillRect(p.x - w / 2, p.y + 3, w, 4);
    ctx.fillStyle = MAT.orange; ctx.fillRect(p.x - w / 2, p.y + 3, w * b.prog, 4);
    return;
  }
  const anchor = b.key === "mech" ? .88 : b.key === "trench" || b.key === "wire" ? .70 : .78;
  const grow = b.key === "trench" || b.key === "wire" ? 1.06 : b.key === "mech" ? 1.30 : 1.26;
  blit(sp, p, grow, anchor);

  const tu = SPR.turret[b.key];
  if (tu) {
    const kick = b.flash > 0 ? b.flash * CELL * .09 * p.s : 0;
    const ty = p.y - CELL * (b.key === "siege" ? .30 : .24) * p.s;
    ctx.save();
    ctx.translate(p.x - Math.cos(b.aim) * kick, ty - Math.sin(b.aim) * kick * .5);
    ctx.scale(1, .82);
    ctx.rotate(b.aim);
    const tw = tu.width / DPR * p.s, th = tu.height / DPR * p.s;
    ctx.drawImage(tu, -tw / 2, -th / 2, tw, th);
    ctx.restore();
    if (b.flash > .45 && SPR.flash) {
      const fl = SPR.flash.width / DPR * p.s * (b.key === "siege" ? 1.5 : 1);
      const mz = CELL * (b.key === "siege" ? .58 : .38) * p.s;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = b.flash;
      ctx.drawImage(SPR.flash, p.x + Math.cos(b.aim) * mz - fl / 2,
                    ty + Math.sin(b.aim) * mz * .5 - fl / 2, fl, fl);
      ctx.restore();
    }
  }
  if (b.key === "mech") bloom(p.x, p.y - CELL * .95 * p.s, CELL * .55 * p.s, "#4fe3f0", .5);
  if (b.key === "depot") bloom(p.x - CELL * .22 * p.s, p.y - CELL * .34 * p.s, CELL * .30 * p.s, "#4fe3f0", .4);
  if (b.hp < b.maxHp) {
    const w = CELL * .60 * p.s;
    ctx.fillStyle = "rgba(10,14,20,.85)"; ctx.fillRect(p.x - w / 2, p.y + 4, w, 3);
    ctx.fillStyle = b.hp / b.maxHp < .35 ? K.danger : "#dfe6ec";
    ctx.fillRect(p.x - w / 2, p.y + 4, w * (b.hp / b.maxHp), 3);
  }
  if (spec.garrison) {
    const full = b.crew.length >= spec.garrison;
    ctx.font = `700 8px ${MONO}`; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(10,14,20,.78)";
    ctx.fillRect(p.x - 11, p.y - CELL * .62 * p.s, 22, 11);
    ctx.fillStyle = full ? "#cfd8e0" : MAT.orange;
    ctx.fillText(b.crew.length + "/" + spec.garrison, p.x, p.y - CELL * .62 * p.s + 8);
  }
}

const a8 = a => (((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8);

function drawSoldierAt(s) {
  const p = proj(s.x, s.y);
  const spr = SPR.soldier[a8(s.aim)][s.fire > 0 ? 1 : 0];
  shadowAt(p, CELL * .13 * p.s);
  const d = blit(spr, p, 1, .74);
  if (s.fire > .06 && SPR.flash) {
    const fl = SPR.flash.width / DPR * p.s * .55;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = (s.fire - .06) / .06;
    ctx.drawImage(SPR.flash, p.x + Math.cos(s.aim) * d.w * .42 - fl / 2,
                  p.y - d.h * .3 + Math.sin(s.aim) * d.w * .22 - fl / 2, fl, fl);
    ctx.restore();
  }
  if (s.hp / s.maxHp < .6) {
    const w = d.w * .5;
    ctx.fillStyle = "rgba(10,14,20,.8)"; ctx.fillRect(p.x - w / 2, p.y + 2, w, 2.5);
    ctx.fillStyle = K.danger; ctx.fillRect(p.x - w / 2, p.y + 2, w * (s.hp / s.maxHp), 2.5);
  }
}

function drawEnemyAt(e) {
  const rows = SPR.enemy[e.type];
  if (!rows) return;
  const p = proj(e.x, e.y);
  const f = (e.wob % 1.4) < .7 ? 0 : 1;
  const spr = rows[a8(e.dir === undefined ? Math.PI / 2 : e.dir)][f];
  shadowAt(p, e.r * .95 * p.s);
  const d = blit(spr, p, 1.12, .70);
  if (e.type === "titan") bloom(p.x, p.y - d.h * .35, e.r * 2.2 * p.s, "#e8384f", .45);
  if (e.flash > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = e.flash * .6;
    ctx.drawImage(spr, p.x - d.w / 2, p.y - d.h * .70, d.w, d.h);
    ctx.restore();
  }
  if (e.type === "titan" || (e.type === "brute" && e.hp < e.maxHp)) {
    const w = e.r * 2.2 * p.s;
    ctx.fillStyle = "rgba(10,14,20,.8)"; ctx.fillRect(p.x - w / 2, p.y + 3, w, 3);
    ctx.fillStyle = K.danger; ctx.fillRect(p.x - w / 2, p.y + 3, w * (e.hp / e.maxHp), 3);
  }
}

function drawHQ() {
  const p = tilePt(4, 14);
  const w = CELL * 3 * p.s;
  ctx.fillStyle = "rgba(10,14,20,.35)";
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + CELL * .5 * p.s, w * .48, CELL * .34 * p.s, 0, 0, 6.2832);
  ctx.fill();
  const h = SPR.hq.height / SPR.hq.width * w;
  ctx.drawImage(SPR.hq, p.x - w / 2, p.y + CELL * .45 * p.s - h, w, h);
  const fr = G.hq.hp / G.hq.max;
  const bw = w * .72;
  ctx.fillStyle = "rgba(10,14,20,.85)";
  ctx.fillRect(p.x - bw / 2, p.y + CELL * .5 * p.s, bw, 5);
  ctx.fillStyle = fr < .35 ? K.danger : MAT.cyan;
  ctx.fillRect(p.x - bw / 2, p.y + CELL * .5 * p.s, bw * fr, 5);
}

function drawPlacement() {
  if (!pick) return;
  const spec = B[pick];
  const [r0, r1] = ZONE_ROWS[spec.z];
  const glow = spec.z === 0 ? "63,210,226" : spec.z === 1 ? "255,138,61" : "255,201,90";
  const pulse = .18 + Math.sin(performance.now() / 260) * .07;
  for (let r = r0; r <= r1; r++) {
    const scT = PERSP.far + (1 - PERSP.far) * (r / ROWS);
    const scB = PERSP.far + (1 - PERSP.far) * ((r + 1) / ROWS);
    const yT = BTOP + ROWY[r] - ROWLIFT[r], yB = yT + ROWH[r];
    for (let c = 0; c < COLS; c++) {
      const t = G.tiles[r * COLS + c];
      const ok = !t.b && !t.hq;
      const x0t = BCX + (c - COLS / 2) * CELL * scT, x1t = BCX + (c + 1 - COLS / 2) * CELL * scT;
      const x0b = BCX + (c - COLS / 2) * CELL * scB, x1b = BCX + (c + 1 - COLS / 2) * CELL * scB;
      ctx.beginPath();
      ctx.moveTo(x0t + 2, yT + 1.5); ctx.lineTo(x1t - 2, yT + 1.5);
      ctx.lineTo(x1b - 2, yB - 1.5); ctx.lineTo(x0b + 2, yB - 1.5);
      ctx.closePath();
      ctx.fillStyle = ok ? `rgba(${glow},${pulse})` : "rgba(216,66,92,.13)";
      ctx.fill();
      ctx.strokeStyle = ok ? `rgba(${glow},.75)` : "rgba(216,66,92,.4)";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

function drawOrdnance() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const t of G.tracers) {
    const a = clamp(t.life / .07, 0, 1);
    const p1 = proj(t.x1, t.y1), p2 = proj(t.x2, t.y2);
    ctx.strokeStyle = t.col;
    ctx.globalAlpha = a * .45; ctx.lineWidth = t.w * 2.6;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - CELL * .2 * p1.s); ctx.lineTo(p2.x, p2.y - CELL * .12 * p2.s); ctx.stroke();
    ctx.globalAlpha = a; ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y - CELL * .2 * p1.s); ctx.lineTo(p2.x, p2.y - CELL * .12 * p2.s); ctx.stroke();
  }
  for (const b of G.beams) {
    const a = clamp(b.life / .18, 0, 1);
    const p1 = proj(b.x1, b.y1), p2 = proj(b.x2, b.y2);
    for (const [al, lw] of [[a * .16, CELL * .5], [a * .5, CELL * .2], [a, CELL * .06]]) {
      ctx.strokeStyle = "#b6f2ff"; ctx.globalAlpha = al; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y - CELL * .5 * p1.s); ctx.lineTo(p2.x, p2.y - CELL * .2 * p2.s); ctx.stroke();
    }
  }
  ctx.restore();

  for (const s of G.shells) {
    const k = s.t / s.dur;
    const gx = s.x0 + (s.x1 - s.x0) * k, gy = s.y0 + (s.y1 - s.y0) * k;
    const p = proj(gx, gy), tp = proj(s.x1, s.y1);
    const lift = Math.sin(k * Math.PI) * CELL * (s.big ? 3.2 : 2.1) * p.s;
    ctx.strokeStyle = `rgba(255,138,61,${.30 + .32 * (1 - Math.abs(.5 - k) * 2)})`;
    ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.ellipse(tp.x, tp.y, s.splash * (.4 + k * .6) * tp.s, s.splash * (.4 + k * .6) * tp.s * .45, 0, 0, 6.2832);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(10,14,20,.32)";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, CELL * .08 * p.s, CELL * .04 * p.s, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = s.big ? "#ffd98a" : "#eef3f7";
    ctx.beginPath(); ctx.arc(p.x, p.y - lift, CELL * (s.big ? .10 : .075) * p.s, 0, 6.2832); ctx.fill();
  }
}

function drawFx() {
  if (SPR.puff) {
    for (const q of G.parts) {
      if (!q.soft) continue;
      const p = proj(q.x, q.y);
      const a = clamp(q.life, 0, 1);
      const sz = q.size * (1 + (1 - a) * 2.4) * p.s;
      ctx.globalAlpha = a * q.alpha;
      ctx.drawImage(SPR.puff, p.x - sz / 2, p.y - sz * .72, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const q of G.parts) {
    if (q.soft || !q.hot) continue;
    const p = proj(q.x, q.y);
    ctx.globalAlpha = clamp(q.life, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(p.x - q.size / 2, p.y - q.size / 2 - CELL * .12 * p.s, q.size * p.s, q.size * p.s);
  }
  ctx.restore();
  for (const q of G.parts) {
    if (q.soft || q.hot) continue;
    const p = proj(q.x, q.y);
    ctx.globalAlpha = clamp(q.life, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(p.x - q.size / 2, p.y - q.size / 2, q.size * p.s, q.size * p.s);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  for (const f of G.floats) {
    const a = clamp(f.life, 0, 1);
    const p = proj(f.x, f.y);
    if (f.ring) {
      ctx.globalAlpha = a * .85;
      ctx.strokeStyle = "#ffc27a"; ctx.lineWidth = 2.5 * a + .5;
      const rr = (f.r0 + (f.r1 - f.r0) * (1 - a)) * p.s;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr * .45, 0, 0, 6.2832); ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = f.col; ctx.font = `700 12px ${MONO}`;
      ctx.fillText(f.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

const rowBucket = [];
function render() {
  // backdrop: a cool graded void with a faint structure behind the board
  if (backdropCv) ctx.drawImage(backdropCv, 0, 0, W, H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, CLIPTOP, W, H - CLIPTOP); ctx.clip();
  if (G.shake > .2) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));

  for (let r = 0; r < ROWS; r++) rowBucket[r] = rowBucket[r] ? (rowBucket[r].length = 0, rowBucket[r]) : [];
  for (const b of G.buildings) rowBucket[clamp(b.r, 0, ROWS - 1)].push(b);
  for (const s of G.soldiers) rowBucket[clamp(Math.floor((s.y - GY) / CELL), 0, ROWS - 1)].push(s);
  for (const e of G.enemies) rowBucket[clamp(Math.floor((e.y - GY) / CELL), 0, ROWS - 1)].push(e);

  for (let r = 0; r < ROWS; r++) {
    drawTileRow(r);
    if (r === r0Placement()) { /* placement overlay is drawn after all tiles */ }
    if (r === 14) drawHQ();
    const list = rowBucket[r];
    for (const o of list) {
      if (o.key !== undefined) drawBuildingAt(o);
      else if (o.post !== undefined) drawSoldierAt(o);
      else drawEnemyAt(o);
    }
  }
  drawPlacement();
  drawOrdnance();
  drawFx();

  // distance haze over the far rows
  if (hazeGrad) { ctx.fillStyle = hazeGrad; ctx.fillRect(0, BTOP - CELL, W, CELL * 4.4); }
  ctx.restore();

  drawFrame();

  if (G.breach > 0) {
    ctx.fillStyle = `rgba(216,66,92,${G.breach * .13})`;
    ctx.fillRect(0, 0, W, H);
  }
  const fr = G.hq.hp / G.hq.max;
  if (fr < .4) {
    const a = .10 + Math.sin(performance.now() / 150) * .05;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .65);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(216,66,92,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}
function r0Placement() { return -1; }

// ===========================================================================
// UI
// ===========================================================================
function syncTop() {
  $("sMat").textContent = Math.floor(G.mat);
  $("sMan").innerHTML = `${Math.floor(G.man)}<small>/${G.manCap}</small>`;
  $("sSol").textContent = G.soldiers.length;
  const fr = G.hq.hp / G.hq.max;
  $("sHq").innerHTML = `${Math.ceil(fr * 100)}<small>%</small>`;
  $("sHq").style.color = fr < .35 ? K.danger : K.ink;
  $("wNum").textContent = G.assault;
  $("wState").textContent = G.phase === "assault" ? "교전 중" : (G.assault ? "소강" : "대기");
  $("wState").style.color = G.phase === "assault" ? K.danger : K.dim;
  $("sKia").textContent = G.kia;
  $("sKill").textContent = G.kills;
  const a = G.phase === "assault" ? ASSAULTS[G.assault - 1] : null;
  $("threatFill").style.width = (a ? (1 - G.timer / a.dur) * 100 : (1 - G.timer / LULL) * 100) + "%";
  $("threatFill").style.background = G.phase === "assault" ? K.danger : "#3d4650";
}

function mkAct(title, cost, on, opts) {
  const b = document.createElement("button");
  b.className = "act" + (opts && opts.warn ? " warn" : "");
  b.innerHTML = `<div class="t">${title}</div><div class="c">${cost}</div>`;
  if (opts && opts.sel) b.dataset.sel = "1";
  if (opts && opts.off) b.disabled = true; else b.addEventListener("click", on);
  return b;
}

function syncSheet() {
  const body = $("body");
  body.innerHTML = "";
  document.querySelectorAll(".tab").forEach(t => t.dataset.on = (+t.dataset.zone === tab) ? "1" : "0");

  if (tab === 3) {
    $("hint").textContent = "병사는 가장 앞쪽 빈 참호로 알아서 들어갑니다";
    let free = 0;
    for (const b of G.buildings) if (b.done && B[b.key].garrison) free += B[b.key].garrison - b.crew.length;
    body.appendChild(mkAct("병사 1명", `자원 ${SOLDIER.mat} · 인력 ${SOLDIER.man}`, () => {
      spawnSoldier(); syncSheet();
    }, { off: G.mat < SOLDIER.mat || G.man < SOLDIER.man }));
    body.appendChild(mkAct("병사 5명", `자원 ${SOLDIER.mat * 5} · 인력 ${SOLDIER.man * 5}`, () => {
      for (let i = 0; i < 5; i++) if (!spawnSoldier()) break;
      syncSheet();
    }, { off: G.mat < SOLDIER.mat * 5 || G.man < SOLDIER.man * 5 }));
    const info = document.createElement("div");
    info.className = "act";
    info.style.cssText = "pointer-events:none;flex-basis:100%";
    info.innerHTML = `<div class="t" style="font-size:11px">배치 가능한 자리 ${free}칸</div>
      <div class="c">자원 +${income().toFixed(0)}/초 · 유지비 -${upkeepDrain().toFixed(1)}/초 · 인력 +${manRate().toFixed(2)}/초</div>`;
    body.appendChild(info);
    return;
  }

  $("hint").textContent = pick ? `${B[pick].name} — 강조된 구역을 누르세요` : "건물을 고른 뒤 지도를 누르세요";
  for (const key of ZONE_BUILDS[tab]) {
    const spec = B[key];
    const extra = spec.garrison ? ` · <em>병사 ${spec.garrison}</em>` : (spec.upkeep ? ` · <em>유지 ${spec.upkeep}</em>` : "");
    body.appendChild(mkAct(spec.name, `자원 ${spec.mat}${extra}<br>${spec.desc}`, () => {
      pick = (pick === key) ? null : key;
      syncSheet();
    }, { off: G.mat < spec.mat && pick !== key, sel: pick === key }));
  }
}

// ===========================================================================
// Loop
// ===========================================================================
let last = performance.now(), acc = 0, uiT = 0;
const STEP = 1 / 60;

function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .2) dt = .2;
  try {
    if (mode === "play") {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 4) { step(STEP); acc -= STEP; }
      if (acc > .4) acc = 0;
      uiT += dt;
      if (uiT > .12) { uiT = 0; syncTop(); }
    }
    if (G) render();
  } catch (err) {
    // never let a single bad frame leave the player staring at a frozen board
    console.error(err);
  }
  requestAnimationFrame(frame);
}

function step(dt) {
  updateWar(dt);
  if (mode !== "play") return;
  updateSoldiers(dt);
  updateBuildings(dt);
  updateShells(dt);
  updateEnemies(dt);
  updateFx(dt);
}

// ===========================================================================
// Flow
// ===========================================================================
function finish(won, why) {
  if (mode === "end") return;
  mode = "end";
  $("endTitle").textContent = won ? "전선 사수" : "전선 붕괴";
  $("endTitle").style.color = won ? K.cyan : K.danger;
  $("endSub").textContent = why;
  const m = Math.floor(G.t / 60), s2 = Math.floor(G.t % 60);
  $("endStats").innerHTML =
    `버틴 시간 &nbsp;<b>${m}분 ${String(s2).padStart(2, "0")}초</b><br>` +
    `도달 공세 &nbsp;<b>${G.assault} / ${ASSAULTS.length}</b><br>` +
    `적 격파 &nbsp;<b>${G.kills}</b><br>` +
    `아군 전사 &nbsp;<b>${G.kia}</b><br>` +
    `남은 사령부 &nbsp;<b>${Math.ceil(G.hq.hp / G.hq.max * 100)}%</b>`;
  $("endScreen").hidden = false;
}

function start() {
  newGame(); resize();
  mode = "play"; pick = null; tab = 0;
  last = performance.now(); acc = 0;
  $("titleScreen").hidden = true; $("endScreen").hidden = true;
  syncTop(); syncSheet();
}

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => { tab = +t.dataset.zone; syncSheet(); });
});

// ===========================================================================
// Input
// ===========================================================================
function tap(cx, cy) {
  if (mode !== "play" || !pick) return;
  const hit = unproj(cx, cy);
  if (!hit) return;
  const { c, r } = hit;
  const err = place(pick, c, r);
  if (err) floatText(px(c), py(r) - CELL * .4, err, K.danger);
  else if (G.mat < B[pick].mat) pick = null;
  syncSheet();
}
cv.addEventListener("click", e => tap(e.clientX, e.clientY));
cv.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  if (t) tap(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });
cv.addEventListener("touchstart", e => e.preventDefault(), { passive: false });

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
