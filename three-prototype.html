<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D 시제품</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
"use strict";
const COLS = 9, ROWS = 16;
const bandOf = r => r <= 1 ? 0 : r <= 7 ? 1 : r <= 11 ? 2 : 3;
const BAND_LIFT = [0, 0, 0.30, 0.62];
const BAND_COL = [0x39414c, 0x9d968a, 0xb3ac9f, 0xc8c2b4];
const TILE_H = 0.55;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2b3a4e, 42, 110);

{ // graded backdrop
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#0c1420");
  grd.addColorStop(0.42, "#25384f");
  grd.addColorStop(0.62, "#4d5f6e");
  grd.addColorStop(0.78, "#8a7a63");
  grd.addColorStop(1, "#2a2b2c");
  g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 220);
camera.position.set(0, 26.0, 30.0);
camera.lookAt(0, 0.4, -2.2);

// ---------- lighting ----------
const key = new THREE.DirectionalLight(0xffd39a, 2.15);
key.position.set(-22, 13, 15);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -16; key.shadow.camera.right = 16;
key.shadow.camera.top = 22; key.shadow.camera.bottom = -22;
key.shadow.camera.near = 1; key.shadow.camera.far = 90;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.022;
scene.add(key);
scene.add(new THREE.HemisphereLight(0x6f97cf, 0x231e17, 0.36));
const rim = new THREE.DirectionalLight(0x5c8ee0, 0.55);
rim.position.set(10, 7, -14);
scene.add(rim);

// ---------------------------------------------------------------------------
// Procedural surfaces
// Bare primitives in flat colour read as a modelling exercise. Grain, panel
// lines, wear along edges and grime in the corners are what make a surface
// look like a place instead of a diagram.
// ---------------------------------------------------------------------------
function canvasTex(size, draw, repeat) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  return t;
}
function noiseBlobs(g, n, size, min, max, colFn) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = min + Math.random() * (max - min);
    g.fillStyle = colFn();
    g.beginPath();
    g.ellipse(x, y, r, r * (0.5 + Math.random() * 0.6), Math.random() * 3, 0, 6.2832);
    g.fill();
  }
}

function concreteTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(256, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // aggregate grain
    noiseBlobs(g, 900, S, 0.6, 2.4, () => Math.random() < .5
      ? `rgba(0,0,0,${.03 + Math.random() * .08})`
      : `rgba(255,252,242,${.02 + Math.random() * .06})`);
    // blotchy staining
    noiseBlobs(g, 26, S, 12, 46, () => `rgba(60,52,40,${.04 + Math.random() * .07})`);
    // hairline cracks
    g.strokeStyle = "rgba(0,0,0,.20)";
    for (let i = 0; i < 5; i++) {
      g.lineWidth = 0.6 + Math.random();
      g.beginPath();
      let x = Math.random() * S, y = Math.random() * S;
      g.moveTo(x, y);
      for (let k = 0; k < 7; k++) {
        x += (Math.random() - .5) * 40; y += (Math.random() - .5) * 40;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    // grime creeping in from the edges
    const vg = g.createRadialGradient(S / 2, S / 2, S * .25, S / 2, S / 2, S * .72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(24,20,14,.30)");
    g.fillStyle = vg; g.fillRect(0, 0, S, S);
  });
}
function concreteRough() {
  return canvasTex(256, (g, S) => {
    g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, S, S);
    noiseBlobs(g, 700, S, 1, 4, () => Math.random() < .5
      ? `rgba(255,255,255,${.05 + Math.random() * .2})`
      : `rgba(0,0,0,${.05 + Math.random() * .2})`);
  });
}
function metalTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(256, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // brushed pass
    for (let i = 0; i < 500; i++) {
      const y = Math.random() * S;
      g.strokeStyle = Math.random() < .5
        ? `rgba(255,255,255,${.02 + Math.random() * .05})`
        : `rgba(0,0,0,${.02 + Math.random() * .06})`;
      g.lineWidth = .5 + Math.random();
      g.beginPath(); g.moveTo(0, y); g.lineTo(S, y + (Math.random() - .5) * 6); g.stroke();
    }
    // panel seams
    g.strokeStyle = "rgba(0,0,0,.42)"; g.lineWidth = 2;
    for (const v of [0.34, 0.68]) {
      g.beginPath(); g.moveTo(v * S, 0); g.lineTo(v * S, S); g.stroke();
      g.beginPath(); g.moveTo(0, v * S); g.lineTo(S, v * S); g.stroke();
    }
    // rivets
    for (let i = 0; i < 40; i++) {
      const x = 12 + Math.random() * (S - 24), y = 12 + Math.random() * (S - 24);
      g.fillStyle = "rgba(255,255,255,.14)";
      g.beginPath(); g.arc(x, y, 2.1, 0, 6.2832); g.fill();
      g.fillStyle = "rgba(0,0,0,.30)";
      g.beginPath(); g.arc(x, y + 1.1, 2.1, 0, 6.2832); g.fill();
    }
    // rust and scuffs
    noiseBlobs(g, 22, S, 3, 16, () => `rgba(112,66,34,${.05 + Math.random() * .16})`);
    noiseBlobs(g, 40, S, 1, 5, () => `rgba(0,0,0,${.06 + Math.random() * .16})`);
  });
}
function fabricTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(128, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = Math.random() < .5 ? "rgba(0,0,0,.09)" : "rgba(255,255,255,.07)";
      g.fillRect(Math.random() * S, Math.random() * S, 1.4, 1.4);
    }
    noiseBlobs(g, 14, S, 4, 16, () => `rgba(40,30,18,${.06 + Math.random() * .12})`);
  });
}

// ---------- materials ----------
const ROUGH = concreteRough();
const M = {
  steel: new THREE.MeshStandardMaterial({ map: metalTex(0x39424e), roughness: 0.62, metalness: 0.55, roughnessMap: ROUGH }),
  dark:  new THREE.MeshStandardMaterial({ map: metalTex(0x1e242c), roughness: 0.66, metalness: 0.45, roughnessMap: ROUGH }),
  conc:  new THREE.MeshStandardMaterial({ map: concreteTex(0xa8a395), roughness: 0.96, roughnessMap: ROUGH }),
  sand:  new THREE.MeshStandardMaterial({ map: fabricTex(0xb5a179), roughness: 1.0 }),
  wood:  new THREE.MeshStandardMaterial({ map: metalTex(0x59452f), roughness: 0.96 }),
  olive: new THREE.MeshStandardMaterial({ map: metalTex(0x4b5240), roughness: 0.92 }),
  rust:  new THREE.MeshStandardMaterial({ map: metalTex(0x6a4a32), roughness: 0.9, metalness: 0.3 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe9eef3, roughness: 0.68 }),
  orange:new THREE.MeshStandardMaterial({ color: 0xff7a2a, emissive: 0xff4d00, emissiveIntensity: 1.1, roughness: 0.5 }),
  cyan:  new THREE.MeshStandardMaterial({ color: 0x4fe3f0, emissive: 0x18c8dc, emissiveIntensity: 2.0, roughness: 0.4 }),
  enemy: new THREE.MeshStandardMaterial({ color: 0x171b22, roughness: 0.42, metalness: 0.55 }),
  eye:   new THREE.MeshStandardMaterial({ color: 0xff3b52, emissive: 0xff2036, emissiveIntensity: 2.6 })
};

// ---------- board ----------
const tileGeo = new THREE.BoxGeometry(0.975, 1, 0.975);
const capGeo = new THREE.BoxGeometry(0.80, 1, 0.80);
const bandTex = BAND_COL.map(c => concreteTex(c));
// every tile gets its own slight tint and a rotated texture, so the grid stops
// looking stamped out
const bandMat = BAND_COL.map((c, i) => {
  const out = [];
  for (let v = 0; v < 4; v++) {
    const col = new THREE.Color(c).multiplyScalar(0.93 + v * 0.035);
    out.push(new THREE.MeshStandardMaterial({
      color: col, map: bandTex[i], roughnessMap: ROUGH, roughness: 0.95
    }));
  }
  return out;
});
const capMat = BAND_COL.map(c => new THREE.MeshStandardMaterial({
  color: new THREE.Color(c).multiplyScalar(0.86), map: concreteTex(c), roughness: 0.92
}));

for (let r = 0; r < ROWS; r++) {
  const band = bandOf(r);
  const h = TILE_H + BAND_LIFT[band];
  for (let c = 0; c < COLS; c++) {
    const x = c - (COLS - 1) / 2, z = r - (ROWS - 1) / 2;
    const m = new THREE.Mesh(tileGeo, bandMat[band][(c * 3 + r * 5) % 4]);
    m.scale.y = h;
    m.position.set(x, -h / 2 + BAND_LIFT[band], z);
    m.rotation.y = (Math.floor(Math.random() * 4)) * Math.PI / 2;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    const cap = new THREE.Mesh(capGeo, capMat[band]);
    cap.scale.y = 0.035;
    cap.position.set(x, BAND_LIFT[band] + 0.002, z);
    cap.rotation.y = m.rotation.y;
    cap.receiveShadow = true;
    scene.add(cap);
  }
}
{
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(COLS + 0.5, 0.5, ROWS + 0.5),
    new THREE.MeshStandardMaterial({ color: 0x6b6c66, roughness: 1 })
  );
  base.position.set(0, -TILE_H + 0.04 - 0.25, 0);
  base.receiveShadow = true;
  scene.add(base);
}
{
  const trim = new THREE.MeshStandardMaterial({ color: 0x4fe3f0, emissive: 0x2ad0e2, emissiveIntensity: 2.2 });
  for (const r of [8, 12]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(COLS, 0.03, 0.07), trim);
    m.position.set(0, BAND_LIFT[bandOf(r)] + 0.02, r - (ROWS - 1) / 2 - 0.48);
    scene.add(m);
  }
  const warn = new THREE.MeshStandardMaterial({ color: 0xff3b52, emissive: 0xff1030, emissiveIntensity: 2.0 });
  const w = new THREE.Mesh(new THREE.BoxGeometry(COLS, 0.03, 0.07), warn);
  w.position.set(0, 0.02, 2 - (ROWS - 1) / 2 - 0.48);
  scene.add(w);
}
const surfaceY = r => BAND_LIFT[bandOf(r)] + 0.018;
const tx = c => c - (COLS - 1) / 2;
const tz = r => r - (ROWS - 1) / 2;

function box(w, h, d, mat, x, y, z, g) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  (g || scene).add(m); return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, g) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  (g || scene).add(m); return m;
}

// ---------- structures ----------
function trench(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.92, 0.10, 0.16, M.sand, x, y, z - 0.30);
  box(0.92, 0.16, 0.14, M.wood, x, y, z - 0.16);
  box(0.92, 0.05, 0.32, M.dark, x, y, z);
  box(0.92, 0.16, 0.14, M.wood, x, y, z + 0.16);
  for (let i = 0; i < 4; i++)
    box(0.20, 0.13, 0.16, M.sand, x - 0.33 + i * 0.22, y + 0.10, z + 0.30);
}
function wire(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (let i = 0; i < 3; i++) {
    box(0.05, 0.34, 0.05, M.dark, x - 0.3 + i * 0.3, y, z);
    box(0.62, 0.03, 0.03, M.steel, x, y + 0.14, z - 0.06 + (i % 2) * 0.12);
  }
  box(0.9, 0.02, 0.02, M.steel, x, y + 0.28, z);
}
function bunker(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.86, 0.34, 0.62, M.conc, x, y, z);
  box(0.70, 0.10, 0.10, M.dark, x, y + 0.16, z - 0.28);
  box(0.90, 0.06, 0.66, M.conc, x, y + 0.34, z);
  box(0.16, 0.05, 0.05, M.orange, x + 0.30, y + 0.40, z);
  for (let i = 0; i < 4; i++)
    box(0.20, 0.13, 0.16, M.sand, x - 0.33 + i * 0.22, y, z + 0.36);
}
function mgNest(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    const b = box(0.22, 0.14, 0.16, M.sand, x + Math.cos(a) * 0.34, y, z + Math.sin(a) * 0.30);
    b.rotation.y = -a;
  }
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(x, y + 0.16, z);
  g.rotation.y = 0.12;
  box(0.26, 0.16, 0.26, M.steel, 0, 0, 0, g);
  cyl(0.035, 0.035, 0.44, 10, M.dark, 0, 0.10, -0.22, g).rotation.x = Math.PI / 2;
  return g;
}
function mortar(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  cyl(0.34, 0.36, 0.10, 20, M.sand, x, y, z);
  const t = cyl(0.05, 0.06, 0.46, 12, M.steel, x, y + 0.08, z);
  t.rotation.x = -0.85;
  box(0.30, 0.14, 0.20, M.olive, x - 0.30, y, z + 0.28);
}
function siege(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.18, 0.20, 0.86, M.dark, x - 0.31, y, z);
  box(0.18, 0.20, 0.86, M.dark, x + 0.31, y, z);
  box(0.62, 0.22, 0.78, M.steel, x, y + 0.06, z);
  box(0.12, 0.04, 0.04, M.orange, x - 0.22, y + 0.28, z + 0.32);
  const g = new THREE.Group();
  g.position.set(x, y + 0.28, z - 0.02);
  g.rotation.y = -0.06;
  scene.add(g);
  cyl(0.24, 0.28, 0.20, 16, M.steel, 0, 0, 0, g);
  const barrel = cyl(0.055, 0.06, 1.05, 12, M.dark, 0, 0, 0, g);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.12, -0.55);
  return g;
}
function mech(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.20, 0.52, 0.22, M.dark, x - 0.19, y, z);
  box(0.20, 0.52, 0.22, M.dark, x + 0.19, y, z);
  box(0.28, 0.10, 0.34, M.dark, x - 0.19, y, z + 0.04);
  box(0.28, 0.10, 0.34, M.dark, x + 0.19, y, z + 0.04);
  box(0.70, 0.50, 0.46, M.steel, x, y + 0.52, z);
  box(0.72, 0.06, 0.48, M.orange, x, y + 0.82, z);
  box(0.22, 0.34, 0.20, M.steel, x - 0.44, y + 0.62, z);
  box(0.22, 0.34, 0.20, M.steel, x + 0.44, y + 0.62, z);
  box(0.34, 0.16, 0.26, M.dark, x, y + 1.02, z);
  box(0.26, 0.06, 0.03, M.cyan, x, y + 1.08, z - 0.13);
}
function depot(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.42, 0.30, 0.42, M.olive, x - 0.16, y, z - 0.08);
  box(0.30, 0.22, 0.30, M.olive, x + 0.22, y, z + 0.16);
  cyl(0.16, 0.16, 0.34, 14, M.steel, x + 0.20, y, z - 0.24);
  box(0.10, 0.03, 0.10, M.cyan, x - 0.16, y + 0.30, z - 0.08);
}
function camp(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (const dx of [-0.22, 0.22]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0, 0.26, 0.36, 4), M.olive);
    t.position.set(x + dx, y + 0.18, z);
    t.rotation.y = Math.PI / 4;
    t.castShadow = true; t.receiveShadow = true;
    scene.add(t);
  }
  box(0.06, 0.06, 0.06, M.orange, x, y + 0.06, z + 0.32);
}
function hq() {
  const y = surfaceY(14), x = 0, z = (tz(14) + tz(15)) / 2;
  box(2.9, 0.62, 1.8, M.steel, x, y, z);
  box(2.4, 0.20, 1.4, M.conc, x, y + 0.62, z);
  box(2.9, 0.07, 1.84, M.orange, x, y + 0.60, z);
  box(0.9, 0.44, 0.12, M.dark, x, y, z + 0.9);
  box(0.5, 0.10, 0.06, M.cyan, x, y + 0.22, z + 0.94);
  cyl(0.03, 0.03, 1.5, 8, M.steel, x + 1.2, y + 0.82, z - 0.6);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), M.eye);
  bulb.position.set(x + 1.2, y + 2.34, z - 0.6);
  scene.add(bulb);
}

// ---------------------------------------------------------------------------
// The site around the board
// The reference never floats its maps in a void: the playfield sits inside a
// built environment — container stacks, sheds, pipe runs, gantries, floodlight
// masts. That surrounding structure is also where the colour comes from.
// ---------------------------------------------------------------------------
const CONTAINER_COLS = [0x8a4238, 0x3c5a72, 0x6d6a3a, 0xa8813a, 0x4a5c52, 0x7a4a58];
const containerMats = CONTAINER_COLS.map(c => new THREE.MeshStandardMaterial({
  map: canvasTex(256, (g, S) => {
    const base = "#" + c.toString(16).padStart(6, "0");
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // corrugation
    for (let x = 0; x < S; x += 9) {
      g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(x, 0, 4, S);
      g.fillStyle = "rgba(0,0,0,.16)"; g.fillRect(x + 4, 0, 5, S);
    }
    g.fillStyle = "rgba(0,0,0,.30)";
    g.fillRect(0, 0, S, 10); g.fillRect(0, S - 10, S, 10);
    noiseBlobs(g, 30, S, 3, 18, () => `rgba(96,54,26,${.06 + Math.random() * .22})`);
    noiseBlobs(g, 60, S, 1, 5, () => `rgba(0,0,0,${.08 + Math.random() * .2})`);
    const vg = g.createLinearGradient(0, 0, 0, S);
    vg.addColorStop(0, "rgba(255,255,255,.05)");
    vg.addColorStop(1, "rgba(0,0,0,.28)");
    g.fillStyle = vg; g.fillRect(0, 0, S, S);
  }),
  roughness: 0.88, metalness: 0.25
}));

const siteGroup = new THREE.Group();
scene.add(siteGroup);

function container(x, y, z, ry, i) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.15, 1.05),
                           containerMats[i % containerMats.length]);
  m.position.set(x, y + 0.575, z);
  m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  siteGroup.add(m);
  return m;
}
function shed(x, y, z, w, h, d, ry) {
  const wall = new THREE.MeshStandardMaterial({
    map: canvasTex(256, (g, S) => {
      g.fillStyle = "#4e5459"; g.fillRect(0, 0, S, S);
      for (let x2 = 0; x2 < S; x2 += 11) {
        g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(x2, 0, 5, S);
        g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x2 + 5, 0, 6, S);
      }
      noiseBlobs(g, 26, S, 4, 20, () => `rgba(92,50,24,${.05 + Math.random() * .2})`);
      g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, S - 24, S, 24);
    }), roughness: 0.9, metalness: 0.2
  });
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wall);
  b.position.set(x, y + h / 2, z);
  b.rotation.y = ry || 0;
  b.castShadow = true; b.receiveShadow = true;
  siteGroup.add(b);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w * 1.06, 0.14, d * 1.06), M.dark);
  roof.position.set(x, y + h + 0.07, z);

function decalTex(draw) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  draw(g, 256);

  t.anisotropy = 4;
  return t;
}
function decal(tex, x, y, z, w, d, rot, op) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({
      map: tex, transparent: true, opacity: op === undefined ? 0.85 : op,
      roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2
    })
  );
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = rot || 0;
  m.position.set(x, y + 0.012, z);
  m.receiveShadow = false;
  scene.add(m);

}

    g.fillRect(i, -S, 22, S * 3);

const bladeGeo = (() => {
  const a = new THREE.PlaneGeometry(0.40, 0.30);
  const b = new THREE.PlaneGeometry(0.40, 0.30);
  b.rotateY(Math.PI / 2);
  return mergeGeosUV([{ g: a, m: new THREE.Matrix4() }, { g: b, m: new THREE.Matrix4() }]);
})();
function mergeGeosUV(parts) {
  const gs = parts.map(o => {
    const g = (o.g.index ? o.g.toNonIndexed() : o.g.clone());
    g.applyMatrix4(o.m); return g;
  });
  const total = gs.reduce((a, g) => a + g.attributes.position.count, 0);
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let off = 0;
  for (const g of gs) {
    pos.set(g.attributes.position.array, off * 3);
    nor.set(g.attributes.normal.array, off * 3);
    uv.set(g.attributes.uv.array, off * 2);
    off += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  out.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  out.computeBoundingSphere();
  return out;
}

      q.rotation.set((Math.random() - .5) * .5, (Math.random() - .5) * .8, Math.random() * 3);
      g.add(q);
    }
  }
}
vines(0, -TILE_H + 0.02, BZ + 6.52, 15, 1.7, 0, 22);
vines(-BX - 5.5, -TILE_H + 0.02, 0, 19, 1.7, Math.PI / 2, 24);

  vines(sx * (BX + 2.4), -TILE_H + 0.02, BZ - 3.0, 2.2, 1.1, sx > 0 ? -Math.PI / 2 : Math.PI / 2, 8);
}
vines(-1.0, -TILE_H + 0.02, -BZ - 7.4, 12, 2.6, 0, 20);

// ---------- lay out a defended line ----------

// ---------- infantry ----------

// ---------- the swarm ----------
// Spheres read as counters on a board. A carapace, six legs, a snout and a
// row of back spines give the thing a front, a gait and a silhouette.
function mergeGeos(parts) {
  const gs = parts.map(o => {
    const g = (o.g.index ? o.g.toNonIndexed() : o.g.clone());
    g.applyMatrix4(o.m);
    return g;
  });
  const total = gs.reduce((a, g) => a + g.attributes.position.count, 0);
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
  let off = 0;
  for (const g of gs) {
    pos.set(g.attributes.position.array, off * 3);
    nor.set(g.attributes.normal.array, off * 3);
    off += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  out.computeBoundingSphere();
  return out;
}
function T(x, y, z, rx, ry, rz, sx, sy, sz) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0));
  m.compose(new THREE.Vector3(x, y, z), q,
            new THREE.Vector3(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz));
  return m;
}
function creatureGeo() {
  const parts = [];
  const body = new THREE.SphereGeometry(0.17, 12, 9);
  parts.push({ g: body, m: T(0, 0.02, 0, 0, 0, 0, 1.0, 0.72, 1.5) });
  // thorax
  parts.push({ g: new THREE.SphereGeometry(0.12, 10, 8), m: T(0, 0.03, -0.20, 0, 0, 0, 1.0, 0.85, 1.1) });
  // snout
  const head = new THREE.ConeGeometry(0.10, 0.24, 8);
  parts.push({ g: head, m: T(0, 0.02, -0.34, -Math.PI / 2, 0, 0) });
  // mandibles
  for (const sx of [-1, 1]) {
    parts.push({ g: new THREE.ConeGeometry(0.028, 0.16, 5),
                 m: T(sx * 0.06, -0.01, -0.44, -Math.PI / 2 + 0.25, 0, sx * 0.3) });
  }
  // back spines
  for (let i = 0; i < 3; i++) {
    parts.push({ g: new THREE.ConeGeometry(0.045 - i * 0.008, 0.16 - i * 0.03, 5),
                 m: T(0, 0.14 - i * 0.012, 0.02 + i * 0.13, -0.4, 0, 0) });
  }
  // six legs
  const leg = new THREE.CylinderGeometry(0.018, 0.010, 0.26, 5);
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const z = -0.16 + i * 0.17;
      parts.push({ g: leg, m: T(sx * 0.15, -0.05, z, 0.2, 0, sx * (0.95 + i * 0.12)) });
      parts.push({ g: new THREE.CylinderGeometry(0.011, 0.008, 0.17, 5),
                   m: T(sx * 0.25, -0.14, z + 0.02, 0.1, 0, sx * 0.25) });
    }
  }
  return mergeGeos(parts);
}
const bodyGeo = creatureGeo();
const swarm = new THREE.InstancedMesh(bodyGeo, M.enemy, 260);
swarm.castShadow = true; swarm.receiveShadow = true;
scene.add(swarm);
const eyeGeo = new THREE.SphereGeometry(0.028, 6, 5);

for (let i = 0; i < 150; i++) {
  const r = Math.random() * 7.4;
  const c = Math.random() * COLS;

  const rot = Math.PI + (Math.random() - 0.5) * 0.6;
  const sc = 0.78 + Math.random() * 0.32;
  dummy.position.set(x, y, z);
  dummy.rotation.set(0, rot, 0);
  dummy.scale.setScalar(sc);
  dummy.updateMatrix();
  swarm.setMatrixAt(n++, dummy.matrix);
  for (const sx of [-1, 1]) {
    dummy.position.set(x + Math.cos(rot) * sx * 0.06 * sc,
                       y + 0.06 * sc,
                       z - Math.cos(rot) * 0.30 * sc + Math.sin(rot) * sx * 0.06 * sc);
    dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    eyes.setMatrixAt(en++, dummy.matrix);
  }
}
swarm.count = n; eyes.count = en;
swarm.instanceMatrix.needsUpdate = true;
eyes.instanceMatrix.needsUpdate = true;

// a few heavies

    e.position.set(x + sx * 0.14, surfaceY(2) + 0.40, z - 0.66);

}
