<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D 시제품</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
"use strict";
const COLS = 9, ROWS = 16;
const bandOf = r => r <= 1 ? 0 : r <= 7 ? 1 : r <= 11 ? 2 : 3;
const BAND_LIFT = [0, 0, 0.30, 0.62];
const BAND_COL = [0x39414c, 0x9d968a, 0xb3ac9f, 0xc8c2b4];
const TILE_H = 0.55;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.80;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x121a26, 26, 56);

{ // graded backdrop
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#070a0f");
  grd.addColorStop(0.55, "#141c28");
  grd.addColorStop(1, "#080b10");
  g.fillStyle = grd; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 220);
camera.position.set(0, 16.5, 20.5);
camera.lookAt(0, 0.6, -2.6);

// ---------- lighting ----------
const key = new THREE.DirectionalLight(0xfff2e0, 1.75);
key.position.set(-8, 15, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 13; key.shadow.camera.bottom = -13;
key.shadow.camera.near = 1; key.shadow.camera.far = 60;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.022;
scene.add(key);
scene.add(new THREE.HemisphereLight(0x8fb4de, 0x2e2a22, 0.30));
const rim = new THREE.DirectionalLight(0x74acff, 0.35);
rim.position.set(7, 6, -10);
scene.add(rim);

// ---------------------------------------------------------------------------
// Procedural surfaces
// Bare primitives in flat colour read as a modelling exercise. Grain, panel
// lines, wear along edges and grime in the corners are what make a surface
// look like a place instead of a diagram.
// ---------------------------------------------------------------------------
function canvasTex(size, draw, repeat) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  return t;
}
function noiseBlobs(g, n, size, min, max, colFn) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = min + Math.random() * (max - min);
    g.fillStyle = colFn();
    g.beginPath();
    g.ellipse(x, y, r, r * (0.5 + Math.random() * 0.6), Math.random() * 3, 0, 6.2832);
    g.fill();
  }
}

function concreteTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(256, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // aggregate grain
    noiseBlobs(g, 900, S, 0.6, 2.4, () => Math.random() < .5
      ? `rgba(0,0,0,${.03 + Math.random() * .08})`
      : `rgba(255,252,242,${.02 + Math.random() * .06})`);
    // blotchy staining
    noiseBlobs(g, 26, S, 12, 46, () => `rgba(60,52,40,${.04 + Math.random() * .07})`);
    // hairline cracks
    g.strokeStyle = "rgba(0,0,0,.20)";
    for (let i = 0; i < 5; i++) {
      g.lineWidth = 0.6 + Math.random();
      g.beginPath();
      let x = Math.random() * S, y = Math.random() * S;
      g.moveTo(x, y);
      for (let k = 0; k < 7; k++) {
        x += (Math.random() - .5) * 40; y += (Math.random() - .5) * 40;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    // grime creeping in from the edges
    const vg = g.createRadialGradient(S / 2, S / 2, S * .25, S / 2, S / 2, S * .72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(24,20,14,.30)");
    g.fillStyle = vg; g.fillRect(0, 0, S, S);
  });
}
function concreteRough() {
  return canvasTex(256, (g, S) => {
    g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, S, S);
    noiseBlobs(g, 700, S, 1, 4, () => Math.random() < .5
      ? `rgba(255,255,255,${.05 + Math.random() * .2})`
      : `rgba(0,0,0,${.05 + Math.random() * .2})`);
  });
}
function metalTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(256, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // brushed pass
    for (let i = 0; i < 500; i++) {
      const y = Math.random() * S;
      g.strokeStyle = Math.random() < .5
        ? `rgba(255,255,255,${.02 + Math.random() * .05})`
        : `rgba(0,0,0,${.02 + Math.random() * .06})`;
      g.lineWidth = .5 + Math.random();
      g.beginPath(); g.moveTo(0, y); g.lineTo(S, y + (Math.random() - .5) * 6); g.stroke();
    }
    // panel seams
    g.strokeStyle = "rgba(0,0,0,.42)"; g.lineWidth = 2;
    for (const v of [0.34, 0.68]) {
      g.beginPath(); g.moveTo(v * S, 0); g.lineTo(v * S, S); g.stroke();
      g.beginPath(); g.moveTo(0, v * S); g.lineTo(S, v * S); g.stroke();
    }
    // rivets
    for (let i = 0; i < 40; i++) {
      const x = 12 + Math.random() * (S - 24), y = 12 + Math.random() * (S - 24);
      g.fillStyle = "rgba(255,255,255,.14)";
      g.beginPath(); g.arc(x, y, 2.1, 0, 6.2832); g.fill();
      g.fillStyle = "rgba(0,0,0,.30)";
      g.beginPath(); g.arc(x, y + 1.1, 2.1, 0, 6.2832); g.fill();
    }
    // rust and scuffs
    noiseBlobs(g, 22, S, 3, 16, () => `rgba(112,66,34,${.05 + Math.random() * .16})`);
    noiseBlobs(g, 40, S, 1, 5, () => `rgba(0,0,0,${.06 + Math.random() * .16})`);
  });
}
function fabricTex(hex) {
  const base = "#" + hex.toString(16).padStart(6, "0");
  return canvasTex(128, (g, S) => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = Math.random() < .5 ? "rgba(0,0,0,.09)" : "rgba(255,255,255,.07)";
      g.fillRect(Math.random() * S, Math.random() * S, 1.4, 1.4);
    }
    noiseBlobs(g, 14, S, 4, 16, () => `rgba(40,30,18,${.06 + Math.random() * .12})`);
  });
}

// ---------- materials ----------
const ROUGH = concreteRough();
const M = {
  steel: new THREE.MeshStandardMaterial({ map: metalTex(0x39424e), roughness: 0.62, metalness: 0.55, roughnessMap: ROUGH }),
  dark:  new THREE.MeshStandardMaterial({ map: metalTex(0x1e242c), roughness: 0.66, metalness: 0.45, roughnessMap: ROUGH }),
  conc:  new THREE.MeshStandardMaterial({ map: concreteTex(0xa8a395), roughness: 0.96, roughnessMap: ROUGH }),
  sand:  new THREE.MeshStandardMaterial({ map: fabricTex(0xb5a179), roughness: 1.0 }),
  wood:  new THREE.MeshStandardMaterial({ map: metalTex(0x59452f), roughness: 0.96 }),
  olive: new THREE.MeshStandardMaterial({ map: metalTex(0x4b5240), roughness: 0.92 }),
  rust:  new THREE.MeshStandardMaterial({ map: metalTex(0x6a4a32), roughness: 0.9, metalness: 0.3 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe9eef3, roughness: 0.68 }),
  orange:new THREE.MeshStandardMaterial({ color: 0xff7a2a, emissive: 0xff4d00, emissiveIntensity: 1.1, roughness: 0.5 }),
  cyan:  new THREE.MeshStandardMaterial({ color: 0x4fe3f0, emissive: 0x18c8dc, emissiveIntensity: 2.0, roughness: 0.4 }),
  enemy: new THREE.MeshStandardMaterial({ color: 0x0b0d11, roughness: 0.55, metalness: 0.3 }),
  eye:   new THREE.MeshStandardMaterial({ color: 0xff3b52, emissive: 0xff2036, emissiveIntensity: 2.6 })
};

// ---------- board ----------
const tileGeo = new THREE.BoxGeometry(0.975, 1, 0.975);
const capGeo = new THREE.BoxGeometry(0.80, 1, 0.80);
const bandTex = BAND_COL.map(c => concreteTex(c));
// every tile gets its own slight tint and a rotated texture, so the grid stops
// looking stamped out
const bandMat = BAND_COL.map((c, i) => {
  const out = [];
  for (let v = 0; v < 4; v++) {
    const col = new THREE.Color(c).multiplyScalar(0.93 + v * 0.035);
    out.push(new THREE.MeshStandardMaterial({
      color: col, map: bandTex[i], roughnessMap: ROUGH, roughness: 0.95
    }));
  }
  return out;
});
const capMat = BAND_COL.map(c => new THREE.MeshStandardMaterial({
  color: new THREE.Color(c).multiplyScalar(0.86), map: concreteTex(c), roughness: 0.92
}));

for (let r = 0; r < ROWS; r++) {
  const band = bandOf(r);
  const h = TILE_H + BAND_LIFT[band];
  for (let c = 0; c < COLS; c++) {
    const x = c - (COLS - 1) / 2, z = r - (ROWS - 1) / 2;
    const m = new THREE.Mesh(tileGeo, bandMat[band][(c * 3 + r * 5) % 4]);
    m.scale.y = h;
    m.position.set(x, -h / 2 + BAND_LIFT[band], z);
    m.rotation.y = (Math.floor(Math.random() * 4)) * Math.PI / 2;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    const cap = new THREE.Mesh(capGeo, capMat[band]);
    cap.scale.y = 0.035;
    cap.position.set(x, BAND_LIFT[band] + 0.002, z);
    cap.rotation.y = m.rotation.y;
    cap.receiveShadow = true;
    scene.add(cap);
  }
}
{
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(COLS + 0.5, 0.5, ROWS + 0.5),
    new THREE.MeshStandardMaterial({ color: 0x6b6c66, roughness: 1 })
  );
  base.position.set(0, -TILE_H + 0.04 - 0.25, 0);
  base.receiveShadow = true;
  scene.add(base);
}
{
  const trim = new THREE.MeshStandardMaterial({ color: 0x4fe3f0, emissive: 0x2ad0e2, emissiveIntensity: 2.2 });
  for (const r of [8, 12]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(COLS, 0.03, 0.07), trim);
    m.position.set(0, BAND_LIFT[bandOf(r)] + 0.02, r - (ROWS - 1) / 2 - 0.48);
    scene.add(m);
  }
  const warn = new THREE.MeshStandardMaterial({ color: 0xff3b52, emissive: 0xff1030, emissiveIntensity: 2.0 });
  const w = new THREE.Mesh(new THREE.BoxGeometry(COLS, 0.03, 0.07), warn);
  w.position.set(0, 0.02, 2 - (ROWS - 1) / 2 - 0.48);
  scene.add(w);
}
const surfaceY = r => BAND_LIFT[bandOf(r)] + 0.018;
const tx = c => c - (COLS - 1) / 2;
const tz = r => r - (ROWS - 1) / 2;

function box(w, h, d, mat, x, y, z, g) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  (g || scene).add(m); return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, g) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  (g || scene).add(m); return m;
}

// ---------- structures ----------
function trench(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.92, 0.10, 0.16, M.sand, x, y, z - 0.30);
  box(0.92, 0.16, 0.14, M.wood, x, y, z - 0.16);
  box(0.92, 0.05, 0.32, M.dark, x, y, z);
  box(0.92, 0.16, 0.14, M.wood, x, y, z + 0.16);
  for (let i = 0; i < 4; i++)
    box(0.20, 0.13, 0.16, M.sand, x - 0.33 + i * 0.22, y + 0.10, z + 0.30);
}
function wire(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (let i = 0; i < 3; i++) {
    box(0.05, 0.34, 0.05, M.dark, x - 0.3 + i * 0.3, y, z);
    box(0.62, 0.03, 0.03, M.steel, x, y + 0.14, z - 0.06 + (i % 2) * 0.12);
  }
  box(0.9, 0.02, 0.02, M.steel, x, y + 0.28, z);
}
function bunker(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.86, 0.34, 0.62, M.conc, x, y, z);
  box(0.70, 0.10, 0.10, M.dark, x, y + 0.16, z - 0.28);
  box(0.90, 0.06, 0.66, M.conc, x, y + 0.34, z);
  box(0.16, 0.05, 0.05, M.orange, x + 0.30, y + 0.40, z);
  for (let i = 0; i < 4; i++)
    box(0.20, 0.13, 0.16, M.sand, x - 0.33 + i * 0.22, y, z + 0.36);
}
function mgNest(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    const b = box(0.22, 0.14, 0.16, M.sand, x + Math.cos(a) * 0.34, y, z + Math.sin(a) * 0.30);
    b.rotation.y = -a;
  }
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(x, y + 0.16, z);
  g.rotation.y = 0.12;
  box(0.26, 0.16, 0.26, M.steel, 0, 0, 0, g);
  cyl(0.035, 0.035, 0.44, 10, M.dark, 0, 0.10, -0.22, g).rotation.x = Math.PI / 2;
  return g;
}
function mortar(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  cyl(0.34, 0.36, 0.10, 20, M.sand, x, y, z);
  const t = cyl(0.05, 0.06, 0.46, 12, M.steel, x, y + 0.08, z);
  t.rotation.x = -0.85;
  box(0.30, 0.14, 0.20, M.olive, x - 0.30, y, z + 0.28);
}
function siege(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.18, 0.20, 0.86, M.dark, x - 0.31, y, z);
  box(0.18, 0.20, 0.86, M.dark, x + 0.31, y, z);
  box(0.62, 0.22, 0.78, M.steel, x, y + 0.06, z);
  box(0.12, 0.04, 0.04, M.orange, x - 0.22, y + 0.28, z + 0.32);
  const g = new THREE.Group();
  g.position.set(x, y + 0.28, z - 0.02);
  g.rotation.y = -0.06;
  scene.add(g);
  cyl(0.24, 0.28, 0.20, 16, M.steel, 0, 0, 0, g);
  const barrel = cyl(0.055, 0.06, 1.05, 12, M.dark, 0, 0, 0, g);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.12, -0.55);
  return g;
}
function mech(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.20, 0.52, 0.22, M.dark, x - 0.19, y, z);
  box(0.20, 0.52, 0.22, M.dark, x + 0.19, y, z);
  box(0.28, 0.10, 0.34, M.dark, x - 0.19, y, z + 0.04);
  box(0.28, 0.10, 0.34, M.dark, x + 0.19, y, z + 0.04);
  box(0.70, 0.50, 0.46, M.steel, x, y + 0.52, z);
  box(0.72, 0.06, 0.48, M.orange, x, y + 0.82, z);
  box(0.22, 0.34, 0.20, M.steel, x - 0.44, y + 0.62, z);
  box(0.22, 0.34, 0.20, M.steel, x + 0.44, y + 0.62, z);
  box(0.34, 0.16, 0.26, M.dark, x, y + 1.02, z);
  box(0.26, 0.06, 0.03, M.cyan, x, y + 1.08, z - 0.13);
}
function depot(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  box(0.42, 0.30, 0.42, M.olive, x - 0.16, y, z - 0.08);
  box(0.30, 0.22, 0.30, M.olive, x + 0.22, y, z + 0.16);
  cyl(0.16, 0.16, 0.34, 14, M.steel, x + 0.20, y, z - 0.24);
  box(0.10, 0.03, 0.10, M.cyan, x - 0.16, y + 0.30, z - 0.08);
}
function camp(c, r) {
  const y = surfaceY(r), x = tx(c), z = tz(r);
  for (const dx of [-0.22, 0.22]) {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0, 0.26, 0.36, 4), M.olive);
    t.position.set(x + dx, y + 0.18, z);
    t.rotation.y = Math.PI / 4;
    t.castShadow = true; t.receiveShadow = true;
    scene.add(t);
  }
  box(0.06, 0.06, 0.06, M.orange, x, y + 0.06, z + 0.32);
}
function hq() {
  const y = surfaceY(14), x = 0, z = (tz(14) + tz(15)) / 2;
  box(2.9, 0.62, 1.8, M.steel, x, y, z);
  box(2.4, 0.20, 1.4, M.conc, x, y + 0.62, z);
  box(2.9, 0.07, 1.84, M.orange, x, y + 0.60, z);
  box(0.9, 0.44, 0.12, M.dark, x, y, z + 0.9);
  box(0.5, 0.10, 0.06, M.cyan, x, y + 0.22, z + 0.94);
  cyl(0.03, 0.03, 1.5, 8, M.steel, x + 1.2, y + 0.82, z - 0.6);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), M.eye);
  bulb.position.set(x + 1.2, y + 2.34, z - 0.6);
  scene.add(bulb);
}

// ---------------------------------------------------------------------------
// Clutter and markings
// A perfectly regular grid reads as a diagram. Junk that does not line up with
// the tiles, and paint that has been walked on, is what says "somewhere real".
// ---------------------------------------------------------------------------
function decalTex(draw) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  draw(g, 256);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}
function decal(tex, x, y, z, w, d, rot, op) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({
      map: tex, transparent: true, opacity: op === undefined ? 0.85 : op,
      roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2
    })
  );
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = rot || 0;
  m.position.set(x, y + 0.012, z);
  m.receiveShadow = false;
  scene.add(m);
  return m;
}
const TEX_STRIPE = decalTex((g, S) => {
  g.clearRect(0, 0, S, S);
  g.save(); g.translate(S / 2, S / 2); g.rotate(-0.6); g.translate(-S / 2, -S / 2);
  for (let i = -S; i < S * 2; i += 42) {
    g.fillStyle = i / 42 % 2 ? "rgba(232,196,60,.85)" : "rgba(28,28,28,.8)";
    g.fillRect(i, -S, 22, S * 3);
  }
  g.restore();
  g.globalCompositeOperation = "destination-in";
  g.fillStyle = "rgba(0,0,0,1)"; g.fillRect(0, S * .30, S, S * .40);
  g.globalCompositeOperation = "source-over";
  for (let i = 0; i < 220; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * .5})`;
    g.fillRect(Math.random() * S, S * .30 + Math.random() * S * .40, 3, 3);
  }
});
function markTex(text) {
  return decalTex((g, S) => {
    g.clearRect(0, 0, S, S);
    g.fillStyle = "rgba(228,222,200,.72)";
    g.font = "bold 120px ui-monospace, monospace";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, S / 2, S / 2);
    for (let i = 0; i < 500; i++) {
      g.clearRect(Math.random() * S, Math.random() * S, 3, 3);
    }
  });
}
const TEX_SCORCH = decalTex((g, S) => {
  g.clearRect(0, 0, S, S);
  const gr = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S / 2);
  gr.addColorStop(0, "rgba(10,8,6,.85)");
  gr.addColorStop(.55, "rgba(24,18,12,.45)");
  gr.addColorStop(1, "rgba(24,18,12,0)");
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * 6.2832, d = Math.random() * S * .48;
    g.fillStyle = `rgba(8,6,4,${.2 + Math.random() * .5})`;
    g.fillRect(S / 2 + Math.cos(a) * d, S / 2 + Math.sin(a) * d, 2 + Math.random() * 4, 2 + Math.random() * 4);
  }
});

// painted markings and burn marks
decal(TEX_STRIPE, 0, BAND_LIFT[2], tz(8) - 0.5, COLS, 1.0, 0, .8);
decal(TEX_STRIPE, 0, BAND_LIFT[3], tz(12) - 0.5, COLS, 1.0, 0, .8);
for (const [t, c, r] of [["A", 0, 9], ["B", 4, 10], ["C", 8, 9], ["07", 2, 13], ["12", 6, 13]]) {
  decal(markTex(t), tx(c) + (Math.random() - .5) * .2, BAND_LIFT[bandOf(r)],
        tz(r) + (Math.random() - .5) * .2, .8, .8, (Math.random() - .5) * .5, .55);
}
for (let i = 0; i < 16; i++) {
  const r = Math.floor(Math.random() * 8);
  decal(TEX_SCORCH, tx(Math.floor(Math.random() * COLS)) + (Math.random() - .5) * .8,
        BAND_LIFT[bandOf(r)], tz(r) + (Math.random() - .5) * .8,
        .7 + Math.random() * .9, .7 + Math.random() * .9, Math.random() * 3, .75);
}

// junk that does not respect the grid
const barrelGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.34, 12);
const crateGeo = new THREE.BoxGeometry(0.26, 0.20, 0.20);
const rubbleGeo = new THREE.DodecahedronGeometry(0.10, 0);
const coilGeo = new THREE.TorusGeometry(0.13, 0.045, 6, 12);
function scatter(n, geo, mat, rowLo, rowHi, lie) {
  for (let i = 0; i < n; i++) {
    const c = Math.random() * COLS - 0.5;
    const r = rowLo + Math.random() * (rowHi - rowLo);
    const rr = Math.max(0, Math.min(ROWS - 1, Math.round(r)));
    const m = new THREE.Mesh(geo, mat);
    m.position.set(tx(0) + c, surfaceY(rr) + (lie ? 0.05 : 0.17), tz(0) + r);
    m.rotation.set(lie ? Math.PI / 2 : (Math.random() - .5) * .3,
                   Math.random() * 6.28, (Math.random() - .5) * .4);
    m.scale.setScalar(0.8 + Math.random() * 0.6);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
  }
}
scatter(9, barrelGeo, M.rust, 8.5, 15.5);
scatter(11, crateGeo, M.olive, 8.5, 15.5);
scatter(7, coilGeo, M.dark, 9.5, 15.5, true);
scatter(26, rubbleGeo, M.conc, 0.5, 7.5);
scatter(12, rubbleGeo, M.dark, 2.5, 8.5);

// airborne dust catching the key light
{
  const n = 420, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - .5) * (COLS + 2);
    pos[i * 3 + 1] = Math.random() * 3.4 + 0.1;
    pos[i * 3 + 2] = (Math.random() - .5) * (ROWS + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffe8c8, size: 0.035, transparent: true, opacity: 0.5, depthWrite: false
  }));
  scene.add(dust);
}

// ---------- lay out a defended line ----------
for (let c = 0; c < COLS; c++) wire(c, 3);
for (let c = 0; c < COLS; c++) trench(c, 5);
for (const c of [1, 4, 7]) bunker(c, 6);
for (const c of [0, 2, 4, 6, 8]) mgNest(c, 9);
for (const c of [1, 3, 5, 7]) mortar(c, 10);
for (const c of [0, 8]) siege(c, 13);
for (const c of [2, 6]) mech(c, 12);
for (const c of [1, 7]) depot(c, 13);
for (const c of [3, 5]) camp(c, 13);
hq();

// ---------- infantry ----------
const solGeo = new THREE.CapsuleGeometry(0.075, 0.16, 4, 8);
const helmGeo = new THREE.SphereGeometry(0.085, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2);
for (let c = 0; c < COLS; c++) {
  for (let i = 0; i < 3; i++) {
    const x = tx(c) - 0.26 + i * 0.26, z = tz(5) + 0.02;
    const y = surfaceY(5) + 0.06;
    const s = new THREE.Mesh(solGeo, M.white);
    s.position.set(x, y + 0.16, z);
    s.castShadow = true; scene.add(s);
    const h = new THREE.Mesh(helmGeo, M.white);
    h.position.set(x, y + 0.30, z);
    h.castShadow = true; scene.add(h);
    const v = box(0.09, 0.03, 0.02, M.cyan, x - 0.045, y + 0.28, z - 0.085);
  }
}

// ---------- the swarm ----------
const bodyGeo = new THREE.SphereGeometry(0.115, 12, 10);
bodyGeo.scale(1.0, 0.62, 1.35);
const swarm = new THREE.InstancedMesh(bodyGeo, M.enemy, 260);
swarm.castShadow = true; swarm.receiveShadow = true;
scene.add(swarm);
const eyeGeo = new THREE.SphereGeometry(0.035, 6, 5);
const eyes = new THREE.InstancedMesh(eyeGeo, M.eye, 260);
scene.add(eyes);
const legGeo = new THREE.BoxGeometry(0.03, 0.03, 0.20);
const legs = new THREE.InstancedMesh(legGeo, M.dark, 520);
legs.castShadow = true;
scene.add(legs);

const dummy = new THREE.Object3D();
let n = 0, ln = 0;
for (let i = 0; i < 260; i++) {
  const r = Math.random() * 5.2;
  const c = Math.random() * COLS;
  const x = tx(0) + c * 1 - 0.5 + Math.random() * 0.4;
  const z = tz(0) + r - 0.5;
  const y = surfaceY(Math.min(ROWS - 1, Math.max(0, Math.round(r)))) + 0.10;
  const rot = (Math.random() - 0.5) * 0.7;
  const sc = 0.75 + Math.random() * 0.35;
  dummy.position.set(x, y, z);
  dummy.rotation.set(0, rot, 0);
  dummy.scale.setScalar(sc);
  dummy.updateMatrix();
  swarm.setMatrixAt(n, dummy.matrix);
  dummy.position.set(x + Math.sin(rot) * 0.16, y + 0.05, z - Math.cos(rot) * 0.18);
  dummy.scale.setScalar(sc);
  dummy.updateMatrix();
  eyes.setMatrixAt(n, dummy.matrix);
  for (const side of [-1, 1]) {
    dummy.position.set(x + side * 0.12 * sc, y - 0.05, z + 0.02);
    dummy.rotation.set(0, rot + side * 0.5, 0);
    dummy.scale.setScalar(sc);
    dummy.updateMatrix();
    legs.setMatrixAt(ln++, dummy.matrix);
  }
  n++;
}
swarm.count = n; eyes.count = n; legs.count = ln;
swarm.instanceMatrix.needsUpdate = true;
eyes.instanceMatrix.needsUpdate = true;
legs.instanceMatrix.needsUpdate = true;

// a few heavies
for (let i = 0; i < 5; i++) {
  const x = tx(1 + Math.floor(Math.random() * 7)) + (Math.random() - .5) * .4;
  const z = tz(1) + Math.random() * 3;
  const b = new THREE.Mesh(bodyGeo, M.enemy);
  b.scale.setScalar(2.1);
  b.position.set(x, surfaceY(2) + 0.20, z);
  b.castShadow = true; scene.add(b);
  const e = new THREE.Mesh(eyeGeo, M.eye);
  e.scale.setScalar(2.2);
  e.position.set(x, surfaceY(2) + 0.26, z - 0.36);
  scene.add(e);
}

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

renderer.render(scene, camera);
window.__ready = true;
function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
