<style>
/* Discord design language — tokens from DESIGN-discord.md */
:root{
  --canvas:#0a0d3a; --surface-indigo:#1e2353; --surface-onyx:#23272a; --surface-black:#000000;
  --primary:#5865f2; --green:#35ed7e; --magenta:#ec48bd; --link:#00b0f4;
  --violet:#8b5cf6; --ink:#ffffff; --ink-dark:#000000; --muted:#9aa0c8; --hairline:#2b3170;

  --kr:#ec48bd; --jp:#5865f2; --pf:#00b0f4; --hw:#35ed7e; --id:#8b5cf6; --pv:#f0b429; --et:#6b7299;

  --r-xs:6px; --r-sm:12px; --r-md:14px; --r-lg:16px; --r-xl:40px; --r-pill:50px; --r-full:9999px;
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:20px; --s-xl:24px; --s-xxl:32px; --s-sec:40px;
  --display:"Space Grotesk","Plus Jakarta Sans","Noto Sans KR",sans-serif;
  --body:"Plus Jakarta Sans","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;
  background:var(--canvas);
  background-image:
    radial-gradient(900px 600px at 12% -10%, rgba(88,101,242,.55), transparent 60%),
    radial-gradient(760px 520px at 88% 8%, rgba(236,72,189,.34), transparent 62%),
    radial-gradient(700px 640px at 50% 110%, rgba(139,92,246,.30), transparent 60%);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100dvh;min-height:0}

.top{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-sm) var(--s-lg);
  padding-top:max(var(--s-sm),env(safe-area-inset-top));background:rgba(10,13,58,.82);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline)}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em;
  text-transform:uppercase;white-space:nowrap;line-height:1.05}
.brand span{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);
  letter-spacing:0;text-transform:none;margin-top:2px}
.grow{flex:1}
.tb{border:0;background:var(--surface-indigo);color:var(--ink);font-size:15px;font-weight:500;
  padding:10px var(--s-lg);border-radius:var(--r-sm);cursor:pointer;min-height:44px}
.tb:hover{background:#2a3070}
.tb[aria-pressed="true"]{background:var(--primary)}
.tb.hi{background:var(--green);color:var(--ink-dark);font-weight:600}
.tb.hi[aria-pressed="true"]{background:#22c96a}

.chips{flex:0 0 auto;display:flex;gap:var(--s-xs);overflow-x:auto;padding:var(--s-sm) var(--s-lg);
  background:rgba(10,13,58,.6);border-bottom:1px solid var(--hairline);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:var(--r-pill);padding:8px 16px;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:8px;min-height:38px;background:var(--surface-indigo);color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:var(--r-full);display:block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-dark)}

.sb{flex:0 0 auto;display:none;padding:var(--s-sm) var(--s-lg);background:rgba(10,13,58,.6);border-bottom:1px solid var(--hairline)}
.sb.on{display:block}
.sb input{width:100%;font-size:16px;padding:12px 16px;border:0;border-radius:var(--r-sm);
  background:var(--surface-indigo);color:var(--ink)}
.sb input::placeholder{color:var(--muted)}
.res{position:absolute;left:var(--s-lg);right:var(--s-lg);top:var(--s-sm);background:var(--surface-indigo);
  border-radius:var(--r-lg);max-height:56dvh;overflow-y:auto;z-index:30;display:none}
.res.on{display:block}
.rr{display:grid;grid-template-columns:1fr auto;gap:var(--s-sm);padding:14px var(--s-md);cursor:pointer;
  font-size:15px;align-items:center;color:var(--ink)}
.rr+.rr{border-top:1px solid var(--hairline)}
.rr:hover{background:#2a3070}
.rr .c{font-size:12px;color:var(--muted)}

.wrap{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;min-height:0;cursor:grab;
  user-select:none;-webkit-user-select:none;-ms-user-select:none}
.wrap svg,.wrap svg *{user-select:none;-webkit-user-select:none}
.wrap:active{cursor:grabbing}
svg.map{position:absolute;top:0;left:0;display:block;max-width:none!important;
  shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
.hallbg{fill:var(--surface-indigo);opacity:.72}
.hallnum{fill:var(--ink);opacity:.5;font-weight:700;font-family:var(--display);text-transform:uppercase}
.hdiv{stroke:var(--hairline);stroke-width:2;stroke-dasharray:7 9}
.bt{cursor:pointer}
.bt rect{stroke:none}
.bt.dim{opacity:.16}
.bt.sel rect.base{stroke:var(--ink);stroke-width:3}
.bn{font-weight:700;text-anchor:middle;pointer-events:none;font-family:var(--body);letter-spacing:-.01em;fill:var(--ink)}
.bg2{font-weight:500;text-anchor:middle;pointer-events:none;font-family:var(--body);fill:#c9cdf0}
.bc{font-weight:600;pointer-events:none;font-family:var(--display);opacity:.85;letter-spacing:.04em}
.bfl{pointer-events:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.zonet{font-weight:700;pointer-events:none;font-family:var(--body)}
.mkt{font-weight:600;font-size:13px;pointer-events:none;font-family:var(--body)}
.entryArrow{stroke-linecap:round;stroke-linejoin:round;fill:none}
.bridgeBand{fill:none;stroke:var(--violet);stroke-width:28;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.bridgeCore{fill:none;stroke:var(--violet);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 10}
.bridgeDot{fill:var(--violet);stroke:var(--canvas);stroke-width:3}
.bridgeTagBg{fill:var(--violet)}
.bridgeTag{fill:#fff;font-weight:700;font-family:var(--body);pointer-events:none}
.bridgeNote{fill:#d8c9ff;font-weight:500;font-family:var(--body);pointer-events:none}

.hud{position:absolute;left:0;right:0;bottom:0;padding:var(--s-md);
  padding-bottom:max(var(--s-md),env(safe-area-inset-bottom));
  display:flex;gap:var(--s-sm);align-items:flex-end;pointer-events:none;z-index:12}
.halls{display:flex;gap:var(--s-xs);overflow-x:auto;pointer-events:auto;max-width:calc(100% - 116px);scrollbar-width:none}
.halls::-webkit-scrollbar{display:none}
.halls button{flex:0 0 auto;border:0;border-radius:var(--r-md);background:var(--surface-indigo);color:var(--ink);
  font-family:var(--display);font-size:14px;font-weight:700;min-width:46px;min-height:46px;cursor:pointer}
.halls button:hover{background:#2a3070}
.halls button[aria-pressed="true"]{background:var(--primary)}
.zoom{margin-left:auto;display:flex;flex-direction:column;gap:var(--s-xs);pointer-events:auto}
.zoom button{width:48px;height:48px;border:0;border-radius:var(--r-lg);background:var(--surface-indigo);color:var(--ink);
  font-size:21px;font-weight:600;cursor:pointer}
.zoom button:hover{background:#2a3070}
.zoom button.sm{font-size:12px;font-weight:600;font-family:var(--display)}

.card{position:absolute;left:0;right:0;bottom:0;background:var(--surface-indigo);
  border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:40;transform:translateY(101%);
  transition:transform .24s cubic-bezier(.3,.8,.3,1);max-height:74dvh;overflow-y:auto;
  padding-bottom:max(var(--s-xl),env(safe-area-inset-bottom))}
.card.open{transform:none}
@media(prefers-reduced-motion:reduce){.card,.gpanel{transition:none}}
@media(min-width:860px){.card{left:var(--s-lg);right:auto;bottom:var(--s-lg);width:420px;border-radius:var(--r-xl);
  transform:translateY(calc(100% + 60px))}.card.open{transform:none}}
.cin{padding:var(--s-xl) var(--s-xl) var(--s-lg)}
.cx{float:right;border:0;background:var(--canvas);color:var(--ink);font-size:14px;border-radius:var(--r-pill);
  min-width:48px;min-height:40px;cursor:pointer}
.ctag{display:inline-block;font-size:13px;font-weight:600;padding:5px 14px;border-radius:var(--r-lg)}
.cname{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;margin-top:var(--s-sm);
  text-transform:uppercase;letter-spacing:0}
.cen{font-size:14px;color:var(--muted);margin-top:6px}
.crow{margin-top:var(--s-lg);padding-top:var(--s-md);border-top:1px solid var(--hairline)}
.crow b{display:block;font-family:var(--display);font-size:12px;color:var(--muted);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s-xs)}
.glist{display:flex;flex-wrap:wrap;gap:var(--s-xs)}
.gpill{font-size:14px;font-weight:500;padding:8px 14px;border-radius:var(--r-sm);background:var(--canvas);
  color:var(--ink);border:0;cursor:pointer;font-family:inherit}
.gpill:hover{background:var(--primary)}
.gpill.more{background:var(--magenta);color:var(--ink);font-weight:600}
.codes{display:flex;flex-wrap:wrap;gap:var(--s-xs)}
.code{font-family:var(--display);font-size:14px;font-weight:600;padding:7px 13px;border-radius:var(--r-sm);
  background:var(--canvas);color:var(--link);letter-spacing:.04em}

.gpanel{position:absolute;inset:auto 0 0 0;background:var(--surface-indigo);
  border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:45;transform:translateY(101%);
  transition:transform .24s cubic-bezier(.3,.8,.3,1);height:78dvh;display:flex;flex-direction:column}
.gpanel.open{transform:none}
@media(min-width:860px){.gpanel{inset:0 0 0 auto;width:440px;height:auto;border-radius:0;
  transform:translateX(101%)}.gpanel.open{transform:none}}
.ghead{flex:0 0 auto;display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-lg) var(--s-xl);
  border-bottom:1px solid var(--hairline)}
.ghead b{font-family:var(--display);font-size:17px;font-weight:700;white-space:nowrap;text-transform:uppercase}
.ghead input{flex:1;font-size:15px;padding:10px 14px;border:0;border-radius:var(--r-sm);background:var(--canvas);color:var(--ink)}
.ghead input::placeholder{color:var(--muted)}
.ghead button{border:0;background:var(--canvas);color:var(--ink);border-radius:var(--r-pill);min-width:44px;min-height:40px;cursor:pointer}
.gbody{flex:1 1 auto;overflow-y:auto;padding:var(--s-sm) var(--s-lg) var(--s-xxl);min-height:0}
.gsec{margin-top:var(--s-lg)}
.gsec>h4{margin:0 0 var(--s-xs);font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;padding-left:4px}
.gitem{display:grid;grid-template-columns:1fr auto;gap:var(--s-sm);align-items:center;padding:14px var(--s-md);
  border-radius:var(--r-md);background:var(--canvas);margin-bottom:var(--s-xs);cursor:pointer}
.gitem:hover{background:var(--primary)}
.gitem .t{font-size:16px;font-weight:600}
.gitem .s{font-size:13px;color:var(--muted);margin-top:2px}
.gitem:hover .s{color:#dfe2ff}
.gitem .b{font-family:var(--display);font-size:12px;font-weight:600;color:var(--link);background:var(--surface-indigo);
  border-radius:var(--r-xs);padding:6px 10px;white-space:nowrap;letter-spacing:.04em}
.gempty{color:var(--muted);font-size:14px;text-align:center;padding:var(--s-xxl) var(--s-md)}
.tip{position:absolute;left:var(--s-lg);top:var(--s-sm);z-index:11;font-size:13px;color:var(--ink);
  background:var(--surface-indigo);border-radius:var(--r-pill);padding:8px 16px;pointer-events:none;transition:opacity .6s}
</style>

    {const wEst=(m.k==="in"||m.k==="out")?Math.max(58,m.t.length*8.4+30):m.t.length*8+18;
     let dy=0,guard=0;
     while(guard++<8 && mkPlaced.some(q=>Math.abs(q.y-(p.y+dy))<21 && p.x<q.x2+6 && p.x+wEst>q.x-6)) dy+=23;
     p.y+=dy; mkPlaced.push({x:p.x,x2:p.x+wEst,y:p.y});}
    if(m.k==="in"||m.k==="out"){
      const w=Math.max(58,m.t.length*8.4+30);
      g.appendChild(el("rect",{x:p.x-11,y:p.y-11.5,width:w,height:23,rx:11.5,fill:"var("+col+")"}));
      g.appendChild(el("circle",{cx:p.x,cy:p.y,r:6.5,fill:"#fff"}));
      g.appendChild(el("text",{x:p.x+13,y:p.y+4.2,class:"mkt",fill:"#fff","font-size":12.5},m.t));
      if(m.note)g.appendChild(el("text",{x:p.x+13,y:p.y+21,class:"mkt",fill:"var("+col+")","font-size":9.4},m.note));
    }else{
      g.appendChild(el("circle",{cx:p.x,cy:p.y,r:8,fill:"var("+col+")"}));
      g.appendChild(el("text",{x:p.x+12,y:p.y+4.2,class:"mkt",fill:"var("+col+")"},m.t));
    }
    gm.appendChild(g);
  });
  svg.appendChild(gm);

  svg.addEventListener("click",e=>{const g=e.target.closest(".bt");if(g)open(+g.dataset.i)});
  svg.addEventListener("keydown",e=>{if(e.key==="Enter"){const g=e.target.closest(".bt");if(g)open(+g.dataset.i)}});
  wrap.insertBefore(svg,wrap.firstChild);
}

/* view */
let _lraf=0;
function apply(){
  const d=dims();
  svg.setAttribute("width",(d.w*sc).toFixed(2));
  svg.setAttribute("height",(d.h*sc).toFixed(2));
  svg.style.transform="translate("+tx.toFixed(1)+"px,"+ty.toFixed(1)+"px)";
  if(_lraf)cancelAnimationFrame(_lraf);
  _lraf=requestAnimationFrame(()=>{_lraf=0;drawLabels()});
}
const minS=()=>{const d=dims();return Math.min(wrap.clientWidth/d.w,wrap.clientHeight/d.h)};
function clamp(){const d=dims(),vw=wrap.clientWidth,vh=wrap.clientHeight,w=d.w*sc,h=d.h*sc;
  tx=w<vw?(vw-w)/2:Math.min(0,Math.max(vw-w,tx));ty=h<vh?(vh-h)/2:Math.min(0,Math.max(vh-h,ty))}
const fit=()=>{sc=minS()*0.96;clamp();apply()};
const centerOn=(x,y,s)=>{if(s)sc=s;tx=wrap.clientWidth/2-x*sc;ty=wrap.clientHeight/2-y*sc;clamp();apply()};
function zoomAt(cx,cy,f){const ns=Math.max(minS()*0.9,Math.min(18,sc*f));
  const ix=(cx-tx)/sc,iy=(cy-ty)/sc;sc=ns;tx=cx-ix*sc;ty=cy-iy*sc;clamp();apply()}
let drag=null,pinch=null;
wrap.addEventListener("pointerdown",e=>{if(e.target.closest(".hud,.card,.res"))return;
  e.preventDefault();
  drag={x:e.clientX,y:e.clientY,tx,ty,id:e.pointerId};try{wrap.setPointerCapture(e.pointerId)}catch(_){}});
wrap.addEventListener("dragstart",e=>e.preventDefault());
wrap.addEventListener("selectstart",e=>{if(!e.target.closest(".card,.res"))e.preventDefault()});
wrap.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;
  tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);clamp();apply()});
["pointerup","pointercancel"].forEach(t=>wrap.addEventListener(t,e=>{if(drag&&drag.id===e.pointerId)drag=null}));
wrap.addEventListener("wheel",e=>{e.preventDefault();const r=wrap.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.18:1/1.18)},{passive:false});
wrap.addEventListener("touchstart",e=>{if(e.touches.length===2){drag=null;const[a,b]=e.touches;
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}}},{passive:true});
wrap.addEventListener("touchmove",e=>{if(e.touches.length===2&&pinch){e.preventDefault();const[a,b]=e.touches;
  const nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),r=wrap.getBoundingClientRect();
  zoomAt((a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top,nd/pinch.d);pinch.d=nd}},{passive:false});
wrap.addEventListener("touchend",()=>{pinch=null});

/* card */
function open(i){
  SEL=i;build();apply();
  const b=MAP.booths[i],p=projB(b),c=CAT[b.c]||CAT.etc;
  document.getElementById("cin").innerHTML=
    '<button class="cx" id="cx">닫기</button>'
   +'<span class="ctag" style="background:var('+c[1]+');color:'+((b.c==="hw"||b.c==="pavilion")?"#0a0d3a":"#fff")+'">'+c[0]+' · 홀 '+b.hall+'</span>'
   +'<span class="ctag" style="background:var(--canvas);color:#fff;margin-left:6px">'+(b.fl||"")+' '+(b.cn||"")+'</span>'
   +'<div class="cname">'+b.n+'</div>'
   +(b.en&&b.en!==b.n?'<div class="cen">'+b.en+'</div>':'')
   +(b.g&&b.g.length?'<div class="crow"><b>출품 타이틀 · '+b.g.length+'</b><div class="glist">'
     +b.g.slice(0,6).map(g=>'<button class="gpill" data-g="'+g.replace(/"/g,'&quot;')+'">'+g+'</button>').join("")
     +(b.g.length>6?'<button class="gpill more" data-g="'+b.n.replace(/"/g,'&quot;')+'">외 '+(b.g.length-6)+'개 · 전체 보기</button>':'')
     +'</div></div>':'')
   +'<div class="crow"><b>부스 위치</b><div class="codes">'+b.codes.map(x=>'<span class="code">'+x+'</span>').join("")+'</div></div>'
   +(b.extra&&b.extra.length?'<div class="crow"><b>같은 구획 입주</b><div style="font-size:13px;color:var(--ink2)">'+b.extra.join(" · ")+'</div></div>':'');
  document.getElementById("card").classList.add("open");
  document.getElementById("cx").onclick=close;
  document.querySelectorAll("#cin .gpill").forEach(el2=>el2.onclick=()=>openGames(el2.dataset.g));
  const tip=document.getElementById("tip");if(tip)tip.style.opacity="0";
  centerOn(p.x+p.w/2,p.y+p.h/2,Math.max(sc,Math.min(8,260/Math.max(p.w,p.h))));
}
const close=()=>{document.getElementById("card").classList.remove("open");SEL=null;build();apply()};

/* chips */
const chips=document.getElementById("chips");
Object.keys(CAT).forEach(k=>{
  const c=CAT[k],b=document.createElement("button");
  b.className="chip";b.setAttribute("aria-pressed","false");
  b.innerHTML='<i style="background:var('+c[1]+')"></i>'+c[0];
  b.onclick=()=>{FILT=FILT===k?null:k;
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
    if(FILT)b.setAttribute("aria-pressed","true");
    build();apply()};
  chips.appendChild(b);
});

/* halls */
const halls=document.getElementById("halls");
Object.keys(MAP.halls).map(Number).sort((a,b)=>a-b).forEach(h=>{
  const btn=document.createElement("button");btn.textContent="H"+h;btn.setAttribute("aria-pressed","false");
  btn.onclick=()=>{document.querySelectorAll("#halls button").forEach(x=>x.setAttribute("aria-pressed",x===btn?"true":"false"));
    const p=proj(MAP.halls[h]);
    centerOn(p.x+p.w/2,p.y+p.h/2,Math.min(wrap.clientWidth/(p.w+70),wrap.clientHeight/(p.h+70)))};
  halls.appendChild(btn);
});
document.getElementById("zin").onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.5);
document.getElementById("zout").onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.5);
document.getElementById("zfit").onclick=()=>{document.querySelectorAll("#halls button").forEach(x=>x.setAttribute("aria-pressed","false"));fit()};
const bRot=document.getElementById("bRot");
bRot.onclick=()=>{ROT=ROT?0:1;bRot.textContent=ROT?"가로":"세로";bRot.setAttribute("aria-pressed",ROT?"true":"false");build();fit()};
bRot.textContent=ROT?"가로":"세로";bRot.setAttribute("aria-pressed",ROT?"true":"false");

/* search */
const sb=document.getElementById("sb"),q=document.getElementById("q"),res=document.getElementById("res");
document.getElementById("bSearch").onclick=e=>{const on=!sb.classList.contains("on");
  sb.classList.toggle("on",on);e.currentTarget.setAttribute("aria-pressed",on?"true":"false");
  if(on)q.focus();else res.classList.remove("on")};
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();
  if(!s){res.classList.remove("on");res.innerHTML="";return}
  const hit=[];
  MAP.booths.forEach((b,i)=>{
    const hay=(b.n+" "+b.en+" "+(b.g||[]).join(" ")+" "+b.extra.join(" ")+" "+b.codes.join(" ")).toLowerCase();
    if(hay.includes(s))hit.push(i)});
  res.innerHTML=hit.length?hit.slice(0,40).map(i=>{const b=MAP.booths[i];
    return '<div class="rr" data-i="'+i+'" tabindex="0"><span>'+b.n+(b.g&&b.g.length?' <span class="c">'+b.g[0]+'</span>':'')+'</span><span class="c">'+b.codes[0]+' · H'+b.hall+'</span></div>'}).join("")
    :'<div class="rr"><span>결과 없음</span></div>';
  res.classList.add("on");
  res.querySelectorAll(".rr[data-i]").forEach(r=>{const go=()=>{res.classList.remove("on");open(+r.dataset.i)};
    r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter")go()}});
});
/* games panel */
const gpanel=document.getElementById("gpanel"),gbody=document.getElementById("gbody"),gq=document.getElementById("gq");
function renderGames(){
  const q=(gq.value||"").trim().toLowerCase();
  const rows=[];
  MAP.booths.forEach((b,i)=>{(b.g||[]).forEach(g=>{
    if(!q||g.toLowerCase().includes(q)||b.n.toLowerCase().includes(q)||(b.en||"").toLowerCase().includes(q))
      rows.push({g:g,b:b,i:i});
  })});
  if(!rows.length){gbody.innerHTML='<div class="gempty">'+(q?"검색 결과가 없습니다.":"등록된 출품 게임이 없습니다.")+'</div>';return}
  const order=["kr","jp","platform","indie","pavilion","hw","etc"];
  let html="";
  order.forEach(k=>{
    const sub=rows.filter(r=>r.b.c===k);
    if(!sub.length)return;
    html+='<div class="gsec"><h4>'+CAT[k][0]+' · '+sub.length+'</h4>';
    sub.sort((a,b)=>a.b.n.localeCompare(b.b.n));
    sub.forEach(r=>{
      html+='<div class="gitem" data-i="'+r.i+'"><div><div class="t">'+r.g+'</div>'
        +'<div class="s">'+(r.b.fl||"")+' '+r.b.n+'</div></div>'
        +'<span class="b">H'+r.b.hall+' · '+r.b.codes[0]+'</span></div>';
    });
    html+='</div>';
  });
  gbody.innerHTML=html;
  gbody.querySelectorAll(".gitem").forEach(e=>e.onclick=()=>{closeGames();open(+e.dataset.i)});
}
function openGames(filter){
  gpanel.classList.add("open");
  document.getElementById("bGames").setAttribute("aria-pressed","true");
  gq.value=filter||"";renderGames();
}
function closeGames(){gpanel.classList.remove("open");document.getElementById("bGames").setAttribute("aria-pressed","false")}
document.getElementById("bGames").onclick=()=>gpanel.classList.contains("open")?closeGames():openGames();
document.getElementById("gx").onclick=closeGames;
gq.addEventListener("input",renderGames);
renderGames();

document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();closeGames();res.classList.remove("on")}});
window.addEventListener("resize",()=>{clamp();apply()});
build();fit();
setTimeout(()=>{const t=document.getElementById("tip");if(t)t.style.opacity="0"},4500);
</script>
