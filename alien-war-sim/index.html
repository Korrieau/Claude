<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUTPOST — 방어 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Endfield-style industrial HUD. See design-style-guide.md */
  :root{
    --base:#0A0A0A; --s1:#101318; --s2:#171B22; --s3:#1F252E;
    --line:#2A323C; --lineHi:#3E4956;
    --text:#F0F0F0; --muted:#8C8C8C; --dim:#5A6068;
    --signal:#FFD429; --signalDim:#7A6415;
    --info:#4DA9DA; --danger:#FF4756; --ok:#2ED675; --infect:#35E0D0;
    --tech:'Orbitron',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--base);color:var(--text);
    font-family:var(--ui);font-size:12px;-webkit-font-smoothing:antialiased;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{flex:1 1 0;min-height:0;position:relative}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}

  .lab{font-family:var(--tech);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--tech);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* ---------- top readout ---------- */
  #top{display:flex;align-items:stretch;background:var(--s1);
    border-bottom:1px solid var(--line);flex:none;position:relative}
  #top::after{content:'';position:absolute;left:0;bottom:-1px;width:96px;height:1px;
    background:var(--signal)}
  .cell{padding:9px 16px 8px;display:flex;flex-direction:column;gap:3px;min-width:96px;
    border-right:1px solid var(--line);position:relative}
  .cell .v{font-family:var(--tech);font-size:19px;font-weight:500;color:var(--text);
    font-variant-numeric:tabular-nums;line-height:1}
  .v.signal{color:var(--signal)}
  .v.infect{color:var(--infect)}
  .v.danger{color:var(--danger)}
  #top .grow{flex:1;border:none}
  #speeds{display:flex;align-items:center;gap:0;padding:0 10px;border-left:1px solid var(--line)}
  .sp{background:transparent;border:1px solid transparent;color:var(--muted);
    font-family:var(--tech);font-size:10px;letter-spacing:.1em;padding:6px 11px;cursor:pointer}
  .sp:hover{color:var(--text)}
  .sp.on{color:var(--signal);border-color:var(--signalDim);background:rgba(255,212,41,.07)}

  /* ---------- generic panel ---------- */
  .panel{background:rgba(23,27,34,.93);border:1px solid var(--line);
    backdrop-filter:blur(6px);position:relative;
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
  .panel::before,.panel::after{content:'';position:absolute;pointer-events:none}
  .panel::before{left:0;top:9px;width:1px;height:14px;background:var(--signal);opacity:.65}
  .panel::after{right:9px;bottom:0;width:14px;height:1px;background:var(--signal);opacity:.65}

  /* ---------- wave control ---------- */
  #wavebar{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;padding:9px 8px 9px 16px;z-index:5}
  #wlab{font-family:var(--tech);font-size:10px;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase}
  #wlab b{color:var(--text);font-weight:500}
  #callBtn{background:var(--signal);border:none;color:#141005;font-family:var(--tech);
    font-size:11px;font-weight:700;letter-spacing:.1em;padding:8px 16px;cursor:pointer;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
  #callBtn:hover{background:#ffe066}

  /* ---------- build rail ---------- */
  #build{display:flex;background:var(--s1);border-top:1px solid var(--line);
    flex:none;overflow-x:auto}
  .bcard{background:transparent;border:none;border-right:1px solid var(--line);
    border-top:2px solid transparent;color:var(--text);padding:9px 14px 10px;cursor:pointer;
    text-align:left;min-width:126px;display:flex;flex-direction:column;gap:5px;
    font-family:var(--ui);position:relative}
  .bcard:hover{background:var(--s3)}
  .bcard.sel{background:var(--s3);border-top-color:var(--signal)}
  .bcard.sel .n{color:var(--signal)}
  .bcard.poor{opacity:.32}
  .bcard .n{font-size:11.5px;color:var(--text);letter-spacing:.01em}
  .bcard .c{font-family:var(--tech);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .bcard .c .s{color:var(--signal)}
  .bcard .c .y{color:var(--infect)}
  .bcard .k{font-family:var(--tech);font-size:8.5px;letter-spacing:.14em;color:var(--dim)}

  /* ---------- inspector ---------- */
  #insp{position:absolute;right:14px;top:14px;width:238px;padding:14px;
    display:none;z-index:5}
  #iName{font-size:13.5px;color:var(--signal);font-weight:500;letter-spacing:.01em}
  #iCode{font-family:var(--tech);font-size:9px;letter-spacing:.16em;color:var(--dim);
    margin:3px 0 11px;text-transform:uppercase}
  #insp .row{display:flex;justify-content:space-between;padding:5px 0;
    border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
  #insp .row span:first-child{font-family:var(--tech);font-size:9px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase}
  #insp .row span:last-child{font-family:var(--tech);font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--text)}
  #insp .desc{font-size:11px;color:var(--dim);line-height:1.65;padding-top:10px}
  #insp .acts{display:flex;gap:7px;margin-top:12px}
  .abtn{flex:1;background:transparent;border:1px solid var(--line);color:var(--text);
    font-family:var(--tech);font-size:10px;letter-spacing:.08em;padding:8px 4px;cursor:pointer}
  .abtn:hover{border-color:var(--signalDim);color:var(--signal)}
  .abtn.warn:hover{border-color:var(--danger);color:var(--danger)}
  .abtn:disabled{opacity:.3;cursor:default}

  /* ---------- log ---------- */
  #log{position:absolute;left:14px;bottom:14px;width:310px;z-index:5;
    display:flex;flex-direction:column-reverse;gap:3px;pointer-events:none}
  #log div{background:rgba(16,19,24,.82);padding:5px 10px;font-size:10.5px;
    color:var(--muted);border-left:2px solid var(--line);letter-spacing:.01em}
  #log div::before{content:'◇ ';color:var(--dim)}
  #log div.hot{color:var(--signal);border-left-color:var(--signal)}
  #log div.hot::before{content:'◆ ';color:var(--signal)}
  #log div.bad{color:var(--danger);border-left-color:var(--danger)}
  #log div.bad::before{content:'◆ ';color:var(--danger)}

  /* ---------- overlays ---------- */
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,10,.93);z-index:20;flex-direction:column;gap:6px}
  #over h1{font-family:var(--tech);font-size:26px;color:var(--danger);letter-spacing:.28em;
    font-weight:500;text-transform:uppercase}
  #over .st{font-family:var(--tech);font-size:12px;color:var(--muted);letter-spacing:.1em;
    font-variant-numeric:tabular-nums}
  #oBtn{margin-top:18px;background:var(--signal);border:none;color:#141005;
    font-family:var(--tech);font-size:11px;font-weight:700;letter-spacing:.14em;
    padding:11px 30px;cursor:pointer;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
  #hint{position:absolute;left:14px;top:14px;font-family:var(--tech);font-size:9px;
    letter-spacing:.12em;color:var(--dim);line-height:2;z-index:4;pointer-events:none;
    text-transform:uppercase}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="cell"><div class="lab">Supply</div><div class="v signal" id="uSup">0</div></div>
    <div class="cell"><div class="lab">Crystal</div><div class="v infect" id="uCry">0</div></div>
    <div class="cell"><div class="lab">Wave</div><div class="v" id="uWave">0</div></div>
    <div class="cell"><div class="lab">Kills</div><div class="v" id="uKill">0</div></div>
    <div class="cell"><div class="lab">Control Hub</div><div class="v" id="uHub">100%</div></div>
    <div class="cell"><div class="lab">Blight</div><div class="v" id="uBlight">0%</div></div>
    <div class="grow"></div>
    <div id="speeds">
      <button class="sp" data-sp="0">HOLD</button>
      <button class="sp on" data-sp="1">1×</button>
      <button class="sp" data-sp="2">2×</button>
      <button class="sp" data-sp="3">3×</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hint">
      LMB 설치 · RMB드래그 이동 · WHEEL 확대<br>
      1–9 자산 · ESC 취소 · U 강화 · X 철거 · SPACE 소집
    </div>

    <div id="wavebar" class="panel">
      <div id="wlab">대기 중</div>
      <button id="callBtn">소집</button>
    </div>

    <div id="insp" class="panel">
      <div id="iName"></div>
      <div id="iCode"></div>
      <div id="iRows"></div>
      <div class="desc" id="iDesc"></div>
      <div class="acts">
        <button class="abtn" id="iUp">강화</button>
        <button class="abtn warn" id="iSell">철거</button>
      </div>
    </div>

    <div id="log"></div>

    <div id="over">
      <h1>Hub Lost</h1>
      <div class="st" id="oStat"></div>
      <button id="oBtn">재가동</button>
    </div>
  </div>

  <div id="build"></div>
</div>

<script>
"use strict";
// ============================================================================
// OUTPOST - top-down defense prototype
// Fixed 60Hz logic tick, decoupled render. Grid world, Dijkstra flow field,
// separation-steered swarm, pooled projectiles and particles, persistent
// ground decal layer.
// ============================================================================

const TILE = 20, GW = 76, GH = 48;
const WW = GW * TILE, WH = GH * TILE;
const TICK = 1 / 60;

// ---- terrain codes -------------------------------------------------------
const T_OPEN = 0, T_ROCK = 1, T_NODE = 2;

// ---- palette -------------------------------------------------------------
// Restrained industrial palette: near-black cool base, one warm accent for
// everything human-made, one cold accent for the infection. Form is carried
// by thin linework and silhouette, never by stacked blocks.
const C = {
  void: '#080A0D',
  plain: '#141920', plainHi: '#1B222B',
  rockFill: '#0C0F14', rockLip: '#1E2732', rockEdge: '#46586B',
  hair: 'rgba(150,180,210,0.055)',
  amber: '#F0A63C', amberDim: '#7A5622',
  cyan: '#35E0D0', cyanDim: '#12564F',
  bone: '#C9D3DD', steel: '#8FA3B5', steelDim: '#3B4652',
  danger: '#FF5A46',
  crew: '#FFE6BE',
  foeFill: '#3A444E', foeEdge: '#7E90A0', foeCore: '#35E0D0',
  line: '#2A323C', lineHi: '#3E4956', signal: '#FFD429', signalDim: '#7A6415',
  info: '#4DA9DA', ok: '#2ED675', steelDim: '#3B4652',
};

// The terrain is drawn once into its own layer as smooth merged silhouettes,
// so nothing on screen reads as a grid of cubes.
const terrainCv = document.createElement('canvas');
terrainCv.width = WW; terrainCv.height = WH;
// ---- value noise, for terrain that has structure instead of static -------
const NP = new Uint8Array(512);
for (let i = 0; i < 256; i++) { const v = (Math.random() * 256) | 0; NP[i] = v; NP[i + 256] = v; }
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => NP[(NP[a & 255] + (b & 255)) & 255] / 255;
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), e = h(xi + 1, yi + 1);
  const t1 = a + (b - a) * u, t2 = c + (e - c) * u;
  return t1 + (t2 - t1) * v;
}
function fbm(x, y) {
  return vn(x, y) * 0.54 + vn(x * 2.13, y * 2.13) * 0.28 +
         vn(x * 4.37, y * 4.37) * 0.12 + vn(x * 8.7, y * 8.7) * 0.06;
}

function buildTerrainLayer() {
  const t = terrainCv.getContext('2d');
  t.clearRect(0, 0, WW, WH);

  // ---- ground: sediment bands driven by low-frequency noise ----
  // Three materials read across the plain: shadowed packed earth, warm dry
  // dirt, and pale gravel on the high ground. Light comes from the top left.
  const HWD = WW >> 1, HHT = WH >> 1;
  const hf = new Float32Array(HWD * HHT);
  for (let y = 0; y < HHT; y++) for (let x = 0; x < HWD; x++)
    hf[y * HWD + x] = fbm(x / 48, y / 48);

  const im = t.createImageData(WW, WH), dd = im.data;
  const S = [13, 15, 19];      // shadowed hollow, cool
  const M = [27, 27, 24];      // dry earth, warm
  const G = [53, 51, 45];      // exposed gravel
  for (let y = 0; y < WH; y++) {
    const hy = y >> 1;
    for (let x = 0; x < WW; x++) {
      const hx = x >> 1, hi = hy * HWD + hx;
      const n = hf[hi];
      // one light direction: slope toward the top left reads as lit
      const gx = (hx < HWD - 2 ? hf[hi + 2] : n) - n;
      const gy = (hy < HHT - 2 ? hf[hi + HWD + HWD] : n) - n;
      const k = 0.74 + clamp(0.5 - (gx + gy) * 7.0, 0, 1) * 0.46;
      let r, g2, b2;
      if (n < 0.46) { const u = n / 0.46;
        r = S[0] + (M[0] - S[0]) * u; g2 = S[1] + (M[1] - S[1]) * u; b2 = S[2] + (M[2] - S[2]) * u;
      } else { const u = (n - 0.46) / 0.54;
        r = M[0] + (G[0] - M[0]) * u; g2 = M[1] + (G[1] - M[1]) * u; b2 = M[2] + (G[2] - M[2]) * u;
      }
      const j = ((x * 7 + y * 13) % 11) - 5;
      const i = (y * WW + x) * 4;
      dd[i] = r * k + j; dd[i + 1] = g2 * k + j; dd[i + 2] = b2 * k * 0.97 + j;
      dd[i + 3] = 255;
    }
  }
  t.putImageData(im, 0, 0);

  // ---- worn haul routes: the site has been used ----
  const hubPx = [(hub ? hub.x : WW * 0.8), (hub ? hub.y : WH / 2)];
  t.save();
  t.lineCap = 'round'; t.lineJoin = 'round';
  for (const g of GATES) {
    for (const [wdt, col] of [[34, 'rgba(92,90,80,0.075)'], [19, 'rgba(116,114,102,0.07)']]) {
      t.strokeStyle = col; t.lineWidth = wdt;
      t.beginPath(); t.moveTo(g.x * TILE, g.y * TILE);
      t.quadraticCurveTo((g.x * TILE + hubPx[0]) / 2, g.y * TILE + rnd(-40, 40), hubPx[0], hubPx[1]);
      t.stroke();
    }
  }
  for (let i = 0; i < SPAWNS.length; i++) {
    const s = SPAWNS[i], g = GATES[i] || GATES[0];
    t.strokeStyle = 'rgba(100,98,88,0.055)'; t.lineWidth = 26;
    t.beginPath(); t.moveTo(s.x * TILE, s.y * TILE);
    t.quadraticCurveTo((s.x + g.x) * TILE / 2, (s.y * TILE + g.y * TILE) / 2 + rnd(-70, 70),
      g.x * TILE, g.y * TILE);
    t.stroke();
  }
  t.restore();

  // ---- rock: raised mass, lit from the top left, with strata ----
  const discs = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (terrain[idx(x, y)] !== T_ROCK) continue;
    discs.push([x * TILE + TILE / 2, y * TILE + TILE / 2]);
  }
  const shape = (r, ox, oy) => {
    t.beginPath();
    const half = TILE / 2;
    for (const [x, y] of discs) {
      t.moveTo(x + ox + r, y + oy); t.arc(x + ox, y + oy, r, 0, 6.2832);
      t.rect(x + ox - half, y + oy - half, half * 2, half * 2);
    }
  };
  // ambient occlusion pooled around the base
  t.save();
  t.shadowColor = 'rgba(0,0,0,0.95)'; t.shadowBlur = 30; t.shadowOffsetX = 4; t.shadowOffsetY = 7;
  t.fillStyle = '#000'; shape(TILE * 0.62, 0, 0); t.fill();
  t.restore();
  // sunlit crest, then the body pulled down-right off it
  t.fillStyle = '#464339'; shape(TILE * 0.628, 0, 0); t.fill();
  t.fillStyle = '#1C1E20'; shape(TILE * 0.624, 1.0, 1.3); t.fill();
  t.fillStyle = '#0F1114'; shape(TILE * 0.62, 1.7, 2.2); t.fill();

  // strata: bedding planes inside the mass only
  t.save();
  shape(TILE * 0.62, 1.7, 2.2); t.clip();
  for (let i = 0; i < 150; i++) {
    const y = Math.random() * WH, x = Math.random() * WW, w = rnd(40, 260);
    t.strokeStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.45)' : 'rgba(150,146,124,0.07)';
    t.lineWidth = rnd(1, 3);
    t.beginPath(); t.moveTo(x, y);
    t.quadraticCurveTo(x + w * 0.5, y + rnd(-9, 9), x + w, y + rnd(-5, 5));
    t.stroke();
  }
  t.restore();

  buildProps(t);
}

// Ground furniture. Without this the plain reads as an empty board.
function buildProps(t) {
  const open = (x, y) => inb(x, y) && terrain[idx(x, y)] === T_OPEN;

  // scattered rubble and old equipment shadows
  for (let i = 0; i < 260; i++) {
    const gx = (rnd(1, GW - 1)) | 0, gy = (rnd(1, GH - 1)) | 0;
    if (!open(gx, gy)) continue;
    const x = gx * TILE + rnd(0, TILE), y = gy * TILE + rnd(0, TILE);
    t.fillStyle = Math.random() < 0.6 ? 'rgba(0,0,0,0.42)' : 'rgba(190,184,160,0.09)';
    t.beginPath();
    const n = 3 + ((Math.random() * 3) | 0), rr = rnd(2, 7);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 6.2832, r2 = rr * rnd(0.55, 1.2);
      k ? t.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2 * 0.7)
        : t.moveTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2 * 0.7);
    }
    t.closePath(); t.fill();
  }

  // painted survey blocks: dashed outlines with a corner tick
  for (let i = 0; i < 26; i++) {
    const gx = (rnd(2, GW - 10)) | 0, gy = (rnd(2, GH - 8)) | 0;
    const w = 3 + ((Math.random() * 5) | 0), h = 2 + ((Math.random() * 4) | 0);
    let clear = true;
    for (let y = gy; y < gy + h; y++) for (let x = gx; x < gx + w; x++) if (!open(x, y)) clear = false;
    if (!clear) continue;
    t.save();
    t.strokeStyle = 'rgba(255,212,41,0.10)'; t.lineWidth = 1; t.setLineDash([6, 7]);
    t.strokeRect(gx * TILE + 4, gy * TILE + 4, w * TILE - 8, h * TILE - 8);
    t.setLineDash([]);
    t.strokeStyle = 'rgba(255,212,41,0.20)'; t.lineWidth = 1.4;
    const bx = gx * TILE + 4, by = gy * TILE + 4;
    t.beginPath(); t.moveTo(bx + 9, by); t.lineTo(bx, by); t.lineTo(bx, by + 9); t.stroke();
    t.restore();
  }

  // hazard chevrons at each gate mouth
  for (const g of GATES) {
    for (let k = -2; k <= 2; k++) {
      const y = (g.y + k) * TILE + TILE / 2;
      t.strokeStyle = 'rgba(255,212,41,0.16)'; t.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        const x = (g.x - 3 + i * 2) * TILE;
        t.beginPath();
        t.moveTo(x, y - 6); t.lineTo(x + 7, y); t.lineTo(x, y + 6);
        t.stroke();
      }
    }
  }

  // pipe runs snaking across open ground
  for (let i = 0; i < 9; i++) {
    let x = (rnd(3, GW - 4)) | 0, y = (rnd(3, GH - 4)) | 0;
    if (!open(x, y)) continue;
    t.strokeStyle = 'rgba(180,176,158,0.07)'; t.lineWidth = 3.5;
    t.beginPath(); t.moveTo(x * TILE, y * TILE);
    for (let k = 0; k < 14; k++) {
      const horiz = Math.random() < 0.5;
      const nx = horiz ? x + (Math.random() < 0.5 ? -3 : 3) : x;
      const ny = horiz ? y : y + (Math.random() < 0.5 ? -3 : 3);
      if (!open(nx, ny)) break;
      x = nx; y = ny; t.lineTo(x * TILE, y * TILE);
    }
    t.stroke();
  }
}

// ============================================================================
// Catalogue
// ============================================================================
// kind: wall | post | turret | arty | util
// Every building upgrades in place through three tiers.
const DEFS = {
  wall: {
    name: '장벽', code: 'TB-1', kind: 'wall', key: '1',
    cost: [[25, 0], [45, 0], [90, 10]],
    hp: [340, 820, 1900], height: [6, 9, 12],
    desc: '진로를 비싸게 만든다. 적은 돌아가거나 갈아먹는다.'
  },
  trench: {
    name: '참호 · 소총반', code: 'GP-1', kind: 'post', key: '2',
    cost: [[70, 0], [130, 10], [240, 30]],

      const yy = yc + Math.sin(x * 0.11) * 2.4;

    const d = DEFS[b.type];

// ============================================================================
// Flow field - Dijkstra from the hub. Walls are passable at a high cost, so

// Spatial hash
// ============================================================================

function waveComp(n) {

  push('scurry', Math.round(11 + n * 6.4 + n * n * 0.34));
  if (n >= 3) push('drifter', Math.round(3 + n * 2.6 + n * n * 0.09));
  if (n >= 5) push('crawler', Math.round(2 + (n - 4) * 1.5));
  if (n >= 7) push('rammer', Math.round(1 + (n - 6) * 1.1));
  if (n >= 11) push('brute', Math.round(1 + (n - 10) * 0.55));

  if (!best) return;
  spawnFoe('spire', best.x, best.y);
  const f = foes[foes.length - 1];
  f.x = best.x * TILE + TILE / 2; f.y = best.y * TILE + TILE / 2;
  f.hp = f.hpMax = 900 + wave * 130;
  log('자실체 발생 — 오염이 퍼지기 시작합니다', 'bad');
}

// ============================================================================
// Spawning + creature update
// ============================================================================
function spawnFoe(type, gx, gy, fromSpire) {
  const d = FOES[type];
  const scale = 1 + Math.max(0, wave - 6) * 0.055;
  foes.push({
    type, x: gx * TILE + TILE / 2 + rnd(-8, 8), y: gy * TILE + TILE / 2 + rnd(-8, 8),
    vx: 0, vy: 0, hp: d.hp * scale, hpMax: d.hp * scale, dead: false, brood: !!fromSpire,
    cd: rnd(0, 0.5), face: 0, hitT: 0, wob: Math.random() * 6.28,
  });
}

const tmp = [];
function isRock(wx, wy) {
  const gx = (wx / TILE) | 0, gy = (wy / TILE) | 0;
  if (!inb(gx, gy)) return true;
  return terrain[idx(gx, gy)] === T_ROCK;
}
function updateFoes(dt) {
  for (let i = 0; i < foes.length; i++) {
    const f = foes[i];
    if (f.dead) continue;
    const d = FOES[f.type];
    f.hitT = Math.max(0, f.hitT - dt);
    f.cd -= dt;

    // static creatures do not path; they seed the ground and vent broods
    if (d.static) {
      f.age = (f.age || 0) + dt;
      f.spawnCd = (f.spawnCd || 0) - dt;
      if (phase === 'wave' && f.spawnCd <= 0) {
        f.spawnCd = Math.max(0.8, 2.6 - wave * 0.05);
        let brood = 0;
        for (const o of foes) if (!o.dead && o.brood) brood++;
        if (brood < 70) spawnFoe('scurry', (f.x / TILE) | 0, (f.y / TILE) | 0, true);
      }
      continue;
    }

    const gx = clamp((f.x / TILE) | 0, 0, GW - 1), gy = clamp((f.y / TILE) | 0, 0, GH - 1);
    const here = idx(gx, gy);
    const nx = nextIdx[here];

    // target the structure standing in the way
    let blockB = null;
    if (nx >= 0) {
      const bi = buildAt[nx];
      if (bi >= 0 && buildings[bi] && !buildings[bi].dead) blockB = buildings[bi];
    }
    const bHere = buildAt[here] >= 0 ? buildings[buildAt[here]] : null;
    if (bHere && !bHere.dead && bHere.type !== 'hub') blockB = bHere;

    if (blockB) {
      const ddx = blockB.x - f.x, ddy = blockB.y - f.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd < TILE * 0.85 + d.r) {
        f.face = Math.atan2(ddy, ddx);
        if (f.cd <= 0) {
          f.cd = d.atk;
          const mult = blockB.type === 'wall' ? d.wall : 1;
          damageBuilding(blockB, d.dmg * mult);
          burst(f.x + Math.cos(f.face) * d.r, f.y + Math.sin(f.face) * d.r, 3, '#c9a06a', 40);
        }
        f.vx *= 0.7; f.vy *= 0.7;
        f.x += f.vx * dt; f.y += f.vy * dt;
        continue;
      }
    }

    // steer along the flow field
    let tx = hub.x, ty = hub.y;
    if (nx >= 0) { tx = (nx % GW) * TILE + TILE / 2; ty = ((nx / GW) | 0) * TILE + TILE / 2; }
    let dx = tx - f.x, dy = ty - f.y;
    let m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;

    // separation keeps the mass readable instead of a single stacked blob
    let sx = 0, sy = 0;
    nearFoes(f.x, f.y, d.r * 2.6, tmp);
    for (let k = 0; k < tmp.length; k++) {
      const o = tmp[k]; if (o === f) continue;
      const ox = f.x - o.x, oy = f.y - o.y;
      const od = Math.hypot(ox, oy) || 0.01;
      const want = d.r + FOES[o.type].r;
      if (od < want) { sx += ox / od * (want - od); sy += oy / od * (want - od); }
    }
    f.wob += dt * 3.4;
    const wob = Math.sin(f.wob) * 0.16;
    const spd = d.spd * (1 + (blight[here] > 0.4 ? 0.28 : 0));
    f.vx = (dx + sx * 0.5 - dy * wob) * spd;
    f.vy = (dy + sy * 0.5 + dx * wob) * spd;
    f.face = Math.atan2(f.vy, f.vx);
    // axis-separated terrain collision: rock is solid, so the gates matter
    const px2 = clamp(f.x + f.vx * dt, 2, WW - 2);
    const py2 = clamp(f.y + f.vy * dt, 2, WH - 2);
    if (!isRock(px2, f.y)) f.x = px2; else f.vx *= -0.2;
    if (!isRock(f.x, py2)) f.y = py2; else f.vy *= -0.2;

    // reached the hub
    if (Math.hypot(f.x - hub.x, f.y - hub.y) < TILE * 1.4) {
      if (f.cd <= 0) { f.cd = d.atk; damageBuilding(hub, d.dmg); shake = Math.min(9, shake + 1.4); }
    }
  }
  if (foes.length > 1200) foes = foes.filter(f => !f.dead);
}

function hurtFoe(f, amount, kx, ky) {
  const d = FOES[f.type];
  const dmg = Math.max(1, amount - (d.armor || 0));
  f.hp -= dmg; f.hitT = 0.09;
  if (kx !== undefined && !d.big) { f.x += kx * 1.6; f.y += ky * 1.6; }
  if (f.hp <= 0 && !f.dead) {
    f.dead = true; kills++;
    supply += d.bounty;
    corpse(f.x, f.y, d.r, d.col);
    burst(f.x, f.y, d.big ? 16 : 6, d.col, d.big ? 120 : 70);
    if (d.big) shake = Math.min(10, shake + 2.2);
  }
}

function damageBuilding(b, amount) {
  b.hp -= amount;
  // garrisons bleed people, not just structure
  if (b.crew && b.crew.length && Math.random() < amount / 240) {
    const live = b.crew.filter(s => s.alive);
    if (live.length) {
      const s = live[(Math.random() * live.length) | 0];
      s.alive = false; s.respawn = 6;
      burst(b.x + s.ox, b.y + s.oy, 5, '#c04a3a', 55);
    }
  }
  if (b.hp <= 0) {
    if (b.type === 'hub') { die(); return; }
    burst(b.x, b.y, 22, '#8d8578', 130);
    scorch(b.x, b.y, TILE * 0.9);
    shake = Math.min(10, shake + 1.6);
    log(`${DEFS[b.type].name} 상실`, 'bad');
    killBuilding(b);
  }
}

// ============================================================================
// Firing
// ============================================================================
function pickTarget(x, y, range, minRange) {
  nearFoes(x, y, range * TILE, tmp);
  let best = null, bestD = Infinity;
  const min2 = minRange ? (minRange * TILE) ** 2 : 0;
  for (let i = 0; i < tmp.length; i++) {
    const f = tmp[i]; if (f.dead) continue;
    const d2 = (f.x - x) ** 2 + (f.y - y) ** 2;
    if (d2 < min2) continue;
    // prefer whatever is closest to the hub, i.e. the most urgent
    const pri = d2 - (FOES[f.type].big ? 90000 : 0);
    if (pri < bestD) { bestD = pri; best = f; }
  }
  return best;
}

function updateBuildings(dt) {
  for (const b of buildings) {
    if (b.dead) continue;
    const d = DEFS[b.type];
    b.flash = Math.max(0, b.flash - dt * 7);
    b.recoil = Math.max(0, b.recoil - dt * 5.5);
    if (b.type === 'hub') {
      // the hub is not helpless, but it is the last thing standing
      b.cd -= dt;
      const ht = pickTarget(b.x, b.y, 7.5);
      if (ht) {
        b.aim = Math.atan2(ht.y - b.y, ht.x - b.x);
        if (b.cd <= 0) { b.cd = 0.16; b.flash = 1; fire('tracer', b.x, b.y, ht, 14); }
      }
      continue;
    }

    if (b.deploy > 0) { b.deploy -= dt; continue; }

    if (d.yield) {
      if (b.powered) crystal += d.yield[b.tier] * dt;
      continue;
    }
    if (!d.range) continue;
    if (d.power && !b.powered) continue;

    // ---- garrison posts: every soldier fires on their own ----
    if (d.crew) {
      const want = d.crew[b.tier];
      for (const s of b.crew) {
        if (!s.alive) { s.respawn -= dt; if (s.respawn <= 0 && supply >= 12) { supply -= 12; s.alive = true; } continue; }
        s.flash = Math.max(0, s.flash - dt * 9);
        s.cd -= dt;
        const sx = b.x + s.ox, sy = b.y + s.oy;
        const t = pickTarget(sx, sy, d.range[b.tier]);
        if (!t) continue;
        s.aim = Math.atan2(t.y - sy, t.x - sx);
        if (s.cd > 0) continue;
        s.cd = d.rof[b.tier] * rnd(0.85, 1.15);
        s.flash = 1;
        if (d.crewKind === 'flame') {
          coneHit(sx, sy, s.aim, d.range[b.tier] * TILE, 0.42, d.dmg[b.tier], d.burnsBlight);
          for (let i = 0; i < 3; i++) flameParticle(sx, sy, s.aim, d.range[b.tier] * TILE);
        } else {
          fire('tracer', sx, sy, t, d.dmg[b.tier]);
          shellEject(sx, sy, s.aim);
        }
      }
      while (b.crew.length < want) refillCrew(b);
      continue;
    }

    // ---- machines ----
    b.cd -= dt;
    if (d.heatUp) {
      if (b.heat >= 1) { b.heat -= d.heatDown[b.tier] * dt; if (b.heat > 0.28) continue; b.heat = 0.27; }
      else b.heat = Math.max(0, b.heat - d.heatDown[b.tier] * 0.55 * dt);
    }
    const t = pickTarget(b.x, b.y, d.range[b.tier], d.minRange);
    if (!t) continue;
    b.aim = Math.atan2(t.y - b.y, t.x - b.x);
    if (b.cd > 0) continue;
    b.cd = d.rof[b.tier];
    b.flash = 1; b.recoil = 1;
    if (d.heatUp) b.heat = Math.min(1, b.heat + d.heatUp[b.tier] * 8);

    if (d.proj === 'mortar') {
      fireMortar(b.x, b.y, t.x, t.y, d.dmg[b.tier], d.splash[b.tier] * TILE);
      shake = Math.min(8, shake + 0.5);
    } else if (d.proj === 'rail') {
      fireRail(b.x, b.y, b.aim, d.dmg[b.tier], d.range[b.tier] * TILE);
      shake = Math.min(10, shake + 2.4);
    } else {
      fire('tracer', b.x, b.y, t, d.dmg[b.tier]);
      shellEject(b.x, b.y, b.aim);
    }
  }
  buildings = buildings.filter(b => !b.dead || b.type === 'hub');
  // rebuild index map after compaction
  buildAt.fill(-1);
  for (let i = 0; i < buildings.length; i++) {
    const b = buildings[i];
    if (b.dead) continue;
    for (let oy = 0; oy < (b.h || 1); oy++) for (let ox = 0; ox < (b.w || 1); ox++)
      if (inb(b.gx + ox, b.gy + oy)) buildAt[idx(b.gx + ox, b.gy + oy)] = i;
  }
}

function coneHit(x, y, ang, len, halfArc, dmg, burns) {
  nearFoes(x, y, len, tmp);
  for (let i = 0; i < tmp.length; i++) {
    const f = tmp[i]; if (f.dead) continue;
    let a = Math.atan2(f.y - y, f.x - x) - ang;
    while (a > Math.PI) a -= 6.2832; while (a < -Math.PI) a += 6.2832;
    if (Math.abs(a) < halfArc) hurtFoe(f, dmg * 0.5, Math.cos(ang) * 0.5, Math.sin(ang) * 0.5);
  }
  if (burns) {
    const bx = clamp(((x + Math.cos(ang) * len * 0.6) / TILE) | 0, 0, GW - 1);
    const by = clamp(((y + Math.sin(ang) * len * 0.6) / TILE) | 0, 0, GH - 1);
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const j = idx(clamp(bx + ox, 0, GW - 1), clamp(by + oy, 0, GH - 1));
      blight[j] = Math.max(0, blight[j] - 0.9 * TICK);
    }
  }
}

// ============================================================================
// Projectiles
// ============================================================================
function fire(kind, x, y, target, dmg) {
  projs.push({ kind, x, y, sx: x, sy: y, t: target, dmg, life: 0.5,
    vx: 0, vy: 0, spd: 900 });
}
function fireMortar(x, y, tx, ty, dmg, splash) {
  const dur = 1.05 + Math.hypot(tx - x, ty - y) / 900;
  projs.push({ kind: 'mortar', x, y, sx: x, sy: y, tx, ty, dmg, splash, life: dur, max: dur });
}
function fireRail(x, y, ang, dmg, len) {
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  projs.push({ kind: 'rail', x, y, ex, ey, life: 0.34, max: 0.34 });
  // instant piercing hit along the beam
  const steps = (len / 7) | 0;
  const seen = new Set();
  for (let i = 0; i < steps; i++) {
    const px = x + Math.cos(ang) * i * 7, py = y + Math.sin(ang) * i * 7;
    nearFoes(px, py, 13, tmp);
    for (let k = 0; k < tmp.length; k++) {
      const f = tmp[k];
      if (f.dead || seen.has(f)) continue;
      seen.add(f);
      hurtFoe(f, dmg, Math.cos(ang) * 3, Math.sin(ang) * 3);
      burst(f.x, f.y, 4, '#dfefff', 90);
    }
  }
}
function updateProjs(dt) {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.life -= dt;
    if (p.kind === 'tracer') {
      if (!p.t || p.t.dead) { projs.splice(i, 1); continue; }
      const dx = p.t.x - p.x, dy = p.t.y - p.y, m = Math.hypot(dx, dy) || 1;
      const step = p.spd * dt;
      if (m <= step) {
        hurtFoe(p.t, p.dmg, dx / m, dy / m);
        burst(p.t.x, p.t.y, 2, '#ffe6c0', 60);
        projs.splice(i, 1); continue;
      }
      p.x += dx / m * step; p.y += dy / m * step;
      if (p.life <= 0) projs.splice(i, 1);
    } else if (p.kind === 'mortar') {
      if (p.life <= 0) {
        nearFoes(p.tx, p.ty, p.splash, tmp);
        for (let k = 0; k < tmp.length; k++) {
          const f = tmp[k]; if (f.dead) continue;
          const d = Math.hypot(f.x - p.tx, f.y - p.ty);
          const fall = 1 - d / p.splash;
          hurtFoe(f, p.dmg * Math.max(0.25, fall), (f.x - p.tx) / (d || 1) * 4, (f.y - p.ty) / (d || 1) * 4);
        }
        burst(p.tx, p.ty, 26, '#ffb257', 190);
        scorch(p.tx, p.ty, p.splash * 0.8);
        shake = Math.min(10, shake + 2);
        projs.splice(i, 1);
      }
    } else if (p.life <= 0) projs.splice(i, 1);
  }
}

// ============================================================================
// Particles + persistent ground decals
// ============================================================================
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    if (parts.length > 1600) break;
    const a = Math.random() * 6.2832, s = rnd(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.18, 0.5), max: 0.5, col, r: rnd(1, 2.4) });
  }
}
function flameParticle(x, y, ang, len) {
  if (parts.length > 1600) return;
  const a = ang + rnd(-0.38, 0.38), s = rnd(len * 1.1, len * 2.0);
  parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.16, 0.3), max: 0.3,
    col: Math.random() < 0.4 ? '#ffd07a' : '#ff8a2c', r: rnd(2, 4.6) });
}
function shellEject(x, y, ang) {
  if (parts.length > 1600) return;
  const a = ang + Math.PI / 2 + rnd(-0.3, 0.3);
  parts.push({ x, y, vx: Math.cos(a) * 55, vy: Math.sin(a) * 55, life: 0.45, max: 0.45, col: C.shell, r: 0.9 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.88; p.vy *= 0.88;
  }
}

// persistent ground layer: corpses, scorch marks. Drawn once, never cleared.
const gc = document.createElement('canvas');
gc.width = WW; gc.height = WH;
const gx2 = gc.getContext('2d');
function corpse(x, y, r, col) {
  gx2.globalAlpha = 0.62;
  gx2.fillStyle = '#3A424B';
  gx2.beginPath();
  gx2.ellipse(x, y, r * rnd(0.8, 1.25), r * rnd(0.5, 0.85), Math.random() * 3.14, 0, 6.2832);
  gx2.fill();
  gx2.globalAlpha = 0.13; gx2.fillStyle = '#14544E';
  gx2.beginPath(); gx2.ellipse(x + rnd(-3, 3), y + rnd(-3, 3), r * 1.35, r * 1.0, 0, 0, 6.2832); gx2.fill();
  gx2.globalAlpha = 1;
}
function scorch(x, y, r) {
  gx2.globalAlpha = 0.26; gx2.fillStyle = '#07090C';
  gx2.beginPath(); gx2.arc(x, y, r * 0.72, 0, 6.2832); gx2.fill();
  gx2.globalAlpha = 1;
}

// ============================================================================
// Blight
// ============================================================================
let blightTick = 0;
function updateBlight(dt) {
  blightTick -= dt;
  if (blightTick > 0) return;
  blightTick = 0.5;
  for (const s of foes) {
    if (s.dead || !FOES[s.type].static) continue;
    const sgx = (s.x / TILE) | 0, sgy = (s.y / TILE) | 0;
    const R = 3 + Math.min(10, (s.age || 0) * 0.12);
    for (let y = Math.max(1, (sgy - R) | 0); y <= Math.min(GH - 2, sgy + R); y++)
      for (let x = Math.max(1, (sgx - R) | 0); x <= Math.min(GW - 2, sgx + R); x++) {
        if (terrain[idx(x, y)] === T_ROCK) continue;
        const d = Math.hypot(x - sgx, y - sgy);
        if (d > R) continue;
        blight[idx(x, y)] = Math.min(1, blight[idx(x, y)] + 0.05 * (1 - d / R));
      }
  }
  let n = 0, tot = 0;
  for (let i = 0; i < blight.length; i++) { if (terrain[i] !== T_ROCK) { tot++; if (blight[i] > 0.25) n++; } }
  blightPct = tot ? n / tot : 0;
}

// ============================================================================
// Main loop
// ============================================================================
function step(dt) {
  elapsed += dt;
  if (flowDirty) computeFlow();
  recalcPower();
  supply += 3.4 * dt;

  rehash();
  updateBuildings(dt);
  updateFoes(dt);
  updateProjs(dt);
  updateParts(dt);
  updateBlight(dt);

  if (phase === 'prep') {
    prepLeft = Math.max(0, prepLeft - dt);
    if (prepLeft <= 0) startWave();
  } else if (phase === 'wave') {
    spawnTimer -= dt;
    if (spawnQueue.length && spawnTimer <= 0) {
      // density spikes toward the tail of a wave
      const prog = 1 - spawnQueue.length / Math.max(1, waveTotal);
      // late in a wave the density spikes, so every wave ends on the back foot
      spawnTimer = clamp(0.26 - wave * 0.007, 0.035, 0.26) * (prog > 0.7 ? 0.35 : 1);
      const n = (prog > 0.7 ? 4 : 2) + ((wave / 6) | 0);
      for (let i = 0; i < n && spawnQueue.length; i++) {
        const s = SPAWNS[(Math.random() * SPAWNS.length) | 0];
        spawnFoe(spawnQueue.pop(), s.x, s.y);
      }
    }
    if (!spawnQueue.length) {
      // spires are terrain, not part of the wave count
      let alive = 0;
      for (const f of foes) if (!f.dead && !f.brood && !FOES[f.type].static) alive++;
      if (alive === 0) endWave();
    }
  }

  foes = foes.filter(f => !f.dead || Math.random() > 0.35);
  shake = Math.max(0, shake - dt * 14);
  if (flowRefresh -= dt, flowRefresh <= 0) { flowRefresh = 0.7; flowDirty = true; }
}
let flowRefresh = 0.7;

function die() {
  phase = 'dead';
  document.getElementById('over').style.display = 'flex';
  document.getElementById('oStat').textContent =
    `웨이브 ${wave} 도달 · 누적 처치 ${kills} · 경과 ${(elapsed / 60) | 0}분`;
}

// ============================================================================
// Camera + rendering
// ============================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let cam = { x: WW * 0.55, y: WH / 2, z: 1.15 };
let groundPat = null;
const vis = [];
function resize() {
  const st = document.getElementById('stage').getBoundingClientRect();
  cv.width = Math.max(320, st.width | 0);
  cv.height = Math.max(240, st.height | 0);
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.getElementById('stage'));

function w2s(wx, wy) { return [(wx - cam.x) * cam.z + cv.width / 2, (wy - cam.y) * cam.z + cv.height / 2]; }
function s2w(sx, sy) { return [(sx - cv.width / 2) / cam.z + cam.x, (sy - cv.height / 2) / cam.z + cam.y]; }

function draw() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#141312'; ctx.fillRect(0, 0, w, h);

  const sh = shake > 0 ? shake : 0;
  ctx.save();
  ctx.translate(w / 2 + rnd(-sh, sh), h / 2 + rnd(-sh, sh));
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  // visible tile window
  const [vx0, vy0] = s2w(0, 0), [vx1, vy1] = s2w(w, h);
  const tx0 = clamp((vx0 / TILE | 0) - 1, 0, GW - 1), tx1 = clamp((vx1 / TILE | 0) + 1, 0, GW - 1);
  const ty0 = clamp((vy0 / TILE | 0) - 1, 0, GH - 1), ty1 = clamp((vy1 / TILE | 0) + 1, 0, GH - 1);

  // ---- pre-rendered terrain, then decals, then the living blight ----
  ctx.drawImage(terrainCv, 0, 0);
  ctx.drawImage(gc, 0, 0);

  // blight reads as a soft creeping stain, not painted squares
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const b = blight[idx(x, y)];
    if (b <= 0.04 || terrain[idx(x, y)] === T_ROCK) continue;
    const cxb = x * TILE + TILE / 2, cyb = y * TILE + TILE / 2;
    ctx.fillStyle = `rgba(20,92,86,${b * 0.5})`;
    ctx.beginPath(); ctx.arc(cxb, cyb, TILE * 0.82, 0, 6.2832); ctx.fill();
  }

  // ---- buildings ----
  for (const b of buildings) { if (!b.dead) drawBuilding(b); }

  // ---- foes: dark warm mass on cold ground ----
  vis.length = 0;
  for (const f of foes) {
    if (f.dead) continue;
    if (f.x < vx0 - 30 || f.x > vx1 + 30 || f.y < vy0 - 30 || f.y > vy1 + 30) continue;
    vis.push(f);
    const d = FOES[f.type];
    if (d.static) {
      drawShadow(f.x, f.y, 13);
      ctx.save(); ctx.translate(f.x, f.y);
      ctx.fillStyle = f.hitT > 0 ? '#ffffff' : '#0E1A1C';
      ctx.strokeStyle = C.cyanDim; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = k * 1.0472 - 1.5708, rr = k % 2 ? 8 : 15;
        k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      bar(f.x - 15, f.y + 17, 30, 2, f.hp / f.hpMax, C.cyan);
      continue;
    }
    if (d.r > 5) drawShadow(f.x, f.y, d.r * 1.05);
    // tapered silhouette with a hairline edge: reads as a creature, not a pill
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.face);
    const L = d.r * 1.7, Wd = d.r * 0.92;
    ctx.beginPath();
    ctx.moveTo(L, 0);
    ctx.quadraticCurveTo(L * 0.2, -Wd, -L * 0.62, -Wd * 0.66);
    ctx.quadraticCurveTo(-L * 1.02, 0, -L * 0.62, Wd * 0.66);
    ctx.quadraticCurveTo(L * 0.2, Wd, L, 0);
    ctx.closePath();
    ctx.fillStyle = f.hitT > 0 ? '#ffffff' : C.foeFill;
    ctx.fill();
    ctx.strokeStyle = f.hitT > 0 ? '#ffffff' : C.foeEdge;
    ctx.lineWidth = d.r > 4 ? 1.1 : 0.8; ctx.stroke();
    ctx.restore();
    if (d.big) bar(f.x - 13, f.y - d.r - 9, 26, 2, f.hp / f.hpMax, C.danger);
  }

  // ======== additive glow pass ========
  ctx.globalCompositeOperation = 'lighter';

  // crystal nodes
  for (const n of nodes) {
    if (n.x < tx0 - 1 || n.x > tx1 + 1 || n.y < ty0 - 1 || n.y > ty1 + 1) continue;
    const nx = n.x * TILE + TILE / 2, ny = n.y * TILE + TILE / 2;
    const pulse = 0.5 + Math.sin(elapsed * 2 + n.x) * 0.22;
    glow(nx, ny, 18, 'rgba(53,224,208,' + (pulse * 0.42) + ')');
    ctx.fillStyle = C.cyan; ctx.globalAlpha = 0.75 + pulse * 0.25;
    ctx.beginPath();
    ctx.moveTo(nx, ny - 6); ctx.lineTo(nx + 4.5, ny); ctx.lineTo(nx, ny + 6); ctx.lineTo(nx - 4.5, ny);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }

  // blight bloom
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const b = blight[idx(x, y)];
    if (b <= 0.35 || terrain[idx(x, y)] === T_ROCK) continue;
    ctx.fillStyle = `rgba(24,120,110,${(b - 0.35) * 0.5})`;
    ctx.beginPath(); ctx.arc(x * TILE + TILE / 2, y * TILE + TILE / 2, TILE * 0.7, 0, 6.2832); ctx.fill();
  }

  // infected cores: hundreds of teal specks make the mass read at any density
  for (let i = 0; i < vis.length; i++) {
    const f = vis[i], d = FOES[f.type];
    if (d.static) {
      glow(f.x, f.y - 8, 22, 'rgba(53,224,208,0.5)');
      ctx.fillStyle = C.cyan;
      ctx.beginPath(); ctx.moveTo(f.x, f.y - 18); ctx.lineTo(f.x + 5, f.y + 4);
      ctx.lineTo(f.x - 5, f.y + 4); ctx.closePath(); ctx.fill();
      continue;
    }
    const s = d.r * 0.62;
    ctx.fillStyle = C.cyan;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(f.x + Math.cos(f.face) * d.r * 0.35 - s / 2, f.y + Math.sin(f.face) * d.r * 0.35 - s / 2, s, s);
    ctx.globalAlpha = 1;
    if (d.big) glow(f.x, f.y, d.r * 2.2, 'rgba(53,224,208,0.3)');
  }

  // ---- projectiles ----
  for (const p of projs) {
    if (p.kind === 'tracer') {
      const dx = p.x - p.sx, dy = p.y - p.sy, m = Math.hypot(dx, dy) || 1;
      ctx.strokeStyle = '#FFD9A0'; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx / m * 15, p.y - dy / m * 15); ctx.stroke();
      ctx.strokeStyle = '#fff4dd'; ctx.lineWidth = 1; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx / m * 9, p.y - dy / m * 9); ctx.stroke();
    } else if (p.kind === 'mortar') {
      const t = 1 - p.life / p.max;
      const cx = p.x + (p.tx - p.x) * t, cy = p.y + (p.ty - p.y) * t;
      const zz = Math.sin(t * Math.PI) * 52;
      ctx.strokeStyle = C.signal; ctx.globalAlpha = 0.22 + t * 0.55; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.tx, p.ty, p.splash * (1.3 - t * 0.3), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      glow(cx, cy - zz, 9, 'rgba(255,190,110,0.75)');
    } else if (p.kind === 'rail') {
      const a = p.life / p.max;
      ctx.globalAlpha = a * 0.35; ctx.strokeStyle = '#7DD8FF'; ctx.lineWidth = 20 * a;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.ex, p.ey); ctx.stroke();
      ctx.globalAlpha = a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * a;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.ex, p.ey); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---- particles ----
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.95;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;

  // every live structure spills a little light onto the ground
  for (const b of buildings) {
    if (b.dead) continue;
    const dd2 = DEFS[b.type];
    if (b.type !== 'hub' && dd2 && dd2.power && !b.powered) continue;
    if (b.x < vx0 - 90 || b.x > vx1 + 90 || b.y < vy0 - 90 || b.y > vy1 + 90) continue;
    const rr = (b.type === 'hub' ? 78 : 26 + (b.w || 1) * 14);
    const warm = b.type === 'gen' || b.type === 'extractor'
      ? 'rgba(77,169,218,0.10)' : 'rgba(255,212,41,0.075)';
    glow(b.x, b.y, rr, warm);
  }

  // muzzle flashes and glowing hardware sit in the additive pass too
  for (const b of buildings) {
    if (b.dead || b.flash <= 0.12) continue;
    const dd = DEFS[b.type];
    const len = b.type === 'siege' ? 22 : b.type === 'mortar' ? 12 : 13;
    if (b.type === 'hub' || (dd && dd.range && !dd.crew)) {
      glow(b.x + Math.cos(b.aim) * len, b.y + Math.sin(b.aim) * len,
        b.type === 'siege' ? 26 : 11, `rgba(255,214,150,${b.flash * 0.85})`);
    }
    if (dd && dd.crew) {
      for (const s of b.crew) {
        if (!s.alive || s.flash <= 0.2) continue;
        const fx = b.x + s.ox + Math.cos(s.aim) * 6, fy = b.y + s.oy + Math.sin(s.aim) * 6;
        glow(fx, fy, dd.crewKind === 'flame' ? 13 : 6.5,
          dd.crewKind === 'flame' ? `rgba(255,140,50,${s.flash * 0.85})` : `rgba(255,240,210,${s.flash})`);
      }
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  // ---- placement ghost ----
  if (ghost && hoverIdx >= 0) {
    const gxp = hoverIdx % GW, gyp = (hoverIdx / GW) | 0;
    const ok = canPlace(ghost, gxp, gyp);
    const d = DEFS[ghost];
    const gw = (d.w || 1) * TILE, gh = (d.h || 1) * TILE;
    // build lattice appears only while something is being sited
    ctx.strokeStyle = 'rgba(150,180,210,0.075)'; ctx.lineWidth = 1 / cam.z;
    ctx.beginPath();
    for (let x = tx0; x <= tx1 + 1; x++) { ctx.moveTo(x * TILE, ty0 * TILE); ctx.lineTo(x * TILE, (ty1 + 1) * TILE); }
    for (let y = ty0; y <= ty1 + 1; y++) { ctx.moveTo(tx0 * TILE, y * TILE); ctx.lineTo((tx1 + 1) * TILE, y * TILE); }
    ctx.stroke();
    const gcol = ok ? C.signal : C.danger;
    ctx.globalAlpha = 0.15; ctx.fillStyle = gcol;
    ctx.fillRect(gxp * TILE + 2, gyp * TILE + 2, gw - 4, gh - 4);
    ctx.globalAlpha = 1;
    brackets(gxp * TILE, gyp * TILE, gw, gh, 7, gcol, 1.4);
    if (d.range) {
      ctx.strokeStyle = ok ? 'rgba(255,212,41,.45)' : 'rgba(255,71,86,.45)';
      ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.range[0] * TILE, 0, 6.2832); ctx.stroke();
      if (d.minRange) { ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.minRange * TILE, 0, 6.2832); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (d.powerR) {
      ctx.strokeStyle = 'rgba(77,169,218,.45)'; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.powerR[0] * TILE, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ---- selection ring ----
  if (selected && !selected.dead) {
    const d = DEFS[selected.type];
    brackets(selected.gx * TILE - 2, selected.gy * TILE - 2,
      (selected.w || 1) * TILE + 4, (selected.h || 1) * TILE + 4, 8, C.signal, 1.4);
    if (d && d.range) {
      ctx.strokeStyle = 'rgba(255,212,41,.35)'; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(selected.x, selected.y, d.range[selected.tier] * TILE, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.restore();

  // vignette keeps the eye on the line and sinks the map edges into the dark
  if (!vig || vig.w !== w || vig.h !== h) {
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.34,
      w / 2, h / 2, Math.max(w, h) * 0.76);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.70)');
    vig = { w, h, g };
  }
  ctx.fillStyle = vig.g; ctx.fillRect(0, 0, w, h);
}
let vig = null;

function glow(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function drawShadow(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.ellipse(x + 2, y + 3, r, r * 0.62, 0, 0, 6.2832); ctx.fill();
}
function bar(x, y, w, h, f, col) {
  ctx.fillStyle = 'rgba(10,12,16,0.8)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
}

function drawBuilding(b) {
  const fw = b.w || 1, fh = b.h || 1;
  const px = b.gx * TILE, py = b.gy * TILE;
  const W = fw * TILE, H = fh * TILE;
  const cx = b.x, cy = b.y;
  const d = b.type === 'hub' ? null : DEFS[b.type];
  const deploying = b.deploy > 0;
  const ours = b.type === 'hub' || b.powered || !d.power;
  const edge = ours ? C.lineHi : 'rgba(255,71,86,0.6)';

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy + 4, W * 0.52, H * 0.42, 0, 0, 6.2832);
  ctx.fill();

  // ---------- control hub, 3x3 ----------
  if (b.type === 'hub') {
    plate(px + 2, py + 2, W - 4, H - 4, 12, '#1A1F27', edge);
    ctx.fillStyle = '#0E1116';
    ctx.fillRect(px + 9, py + 9, W - 18, H - 18);
    ctx.strokeStyle = C.signalDim; ctx.lineWidth = 1;
    ctx.strokeRect(px + 9.5, py + 9.5, W - 19, H - 19);
    // service bays along the lower edge
    ctx.fillStyle = '#242C36';
    for (let i = 0; i < 4; i++) ctx.fillRect(px + 8 + i * 12, py + H - 8, 8, 5);
    ctx.fillStyle = C.signal;
    for (let i = 0; i < 4; i++) ctx.fillRect(px + 8 + i * 12, py + H - 8, 8, 1);
    brackets(px + 3, py + 3, W - 6, H - 6, 13, C.signal, 1.5);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(elapsed * 0.5);
    ctx.strokeStyle = C.signal; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0.4, 2.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 11, 3.54, 5.74); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = C.signal;
    diamond(cx, cy, 6);
    bar(cx - W * 0.4, py - 9, W * 0.8, 2.5, b.hp / b.hpMax,
      b.hp / b.hpMax > 0.35 ? C.signal : C.danger);
    return;
  }

  // ---------- shared base plate ----------
  const tone = ['#1D242D', '#242D38', '#2C3742'][b.tier];

  if (b.type === 'wall') {
    // adjacent sections fuse into one continuous revetment
    const n = run(b);
    const x0 = px + (n.w ? 0 : 1), x1 = px + W - (n.e ? 0 : 1);
    const y0 = py + (n.n ? 0 : 1), y1 = py + H - (n.s ? 0 : 1);
    ctx.fillStyle = ['#232932', '#2B333E', '#343E4A'][b.tier];
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = edge; ctx.lineWidth = 1;
    ctx.beginPath();
    if (!n.n) { ctx.moveTo(x0, y0 + .5); ctx.lineTo(x1, y0 + .5); }
    if (!n.s) { ctx.moveTo(x0, y1 - .5); ctx.lineTo(x1, y1 - .5); }
    if (!n.w) { ctx.moveTo(x0 + .5, y0); ctx.lineTo(x0 + .5, y1); }
    if (!n.e) { ctx.moveTo(x1 - .5, y0); ctx.lineTo(x1 - .5, y1); }
    ctx.stroke();
    ctx.fillStyle = C.signalDim;
    for (let i = 0; i < 3; i++) ctx.fillRect(px + 4 + i * 4.4, py + H - 6, 2.4, 3.2);
    if (!n.n) hi(px + 2, py + 2.5, W - 4);

  } else if (d.crew && b.type !== 'bunker') {
    // trenches read as one dug line, not a row of boxes
    const n = run(b);
    const x0 = px + (n.w ? 0 : 1), x1 = px + W - (n.e ? 0 : 1);
    const y0 = py + (n.n ? 0 : 1), y1 = py + H - (n.s ? 0 : 1);
    ctx.fillStyle = '#0D1015';
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = edge; ctx.lineWidth = 1;
    ctx.beginPath();
    if (!n.w) { ctx.moveTo(x0 + .5, y0); ctx.lineTo(x0 + .5, y1); }
    if (!n.e) { ctx.moveTo(x1 - .5, y0); ctx.lineTo(x1 - .5, y1); }
    ctx.stroke();
    ctx.fillStyle = tone;
    ctx.fillRect(x0, py + 1, x1 - x0, 5);
    ctx.fillRect(x0, py + H - 6, x1 - x0, 5);
    ctx.fillStyle = d.crewKind === 'flame' ? C.signal : C.info;
    ctx.fillRect(x0, py + 1, x1 - x0, 1);
    ctx.globalAlpha = 0.5;
    ctx.fillRect(x0, py + H - 2, x1 - x0, 1);
    ctx.globalAlpha = 1;

  } else if (b.type === 'bunker') {
    // 2x2 casemate: chamfered block, firing slits on all four faces
    plate(px + 2, py + 2, W - 4, H - 4, 11, tone, edge);
    ctx.fillStyle = '#0A0D11';
    ctx.fillRect(px + 8, cy - 2, W - 16, 4);
    ctx.fillRect(cx - 2, py + 8, 4, H - 16);
    ctx.fillStyle = C.info;
    ctx.fillRect(px + 8, cy - 2, 4, 4);
    ctx.fillRect(px + W - 12, cy - 2, 4, 4);
    hi(px + 7, py + 4, W - 14);

  } else if (b.type === 'gen') {
    plate(px + 2, py + 2, W - 4, H - 4, 9, tone, edge);
    // cable stubs reaching out of the housing
    ctx.strokeStyle = C.steelDim; ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) {
      const a = i * 1.5708 + 0.7854;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * W * 0.28, cy + Math.sin(a) * H * 0.28);
      ctx.lineTo(cx + Math.cos(a) * W * 0.46, cy + Math.sin(a) * H * 0.46);
      ctx.stroke();
    }
    ctx.fillStyle = '#12171E';
    ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = C.info; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, 8, elapsed * 2.2, elapsed * 2.2 + 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 8, elapsed * 2.2 + 3.14, elapsed * 2.2 + 5.34); ctx.stroke();
    hi(px + 7, py + 4, W - 14);

  } else if (b.type === 'extractor') {
    plate(px + 2, py + 2, W - 4, H - 4, 9, tone, edge);
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.3;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(elapsed * 0.9);
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, 1.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 9, 3.14, 4.84); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = C.cyan; diamond(cx, cy, 4.5);
    hi(px + 7, py + 4, W - 14);

  } else {
    // machinery decks: autogun 1x1, mortar and siege 2x2
    plate(px + 1.5, py + 1.5, W - 3, H - 3, fw > 1 ? 9 : 5, tone, edge);
    hi(px + 4, py + 3, W - 8);
    if (fw > 1) {
      ctx.fillStyle = '#141A21';
      ctx.fillRect(px + 5, py + H - 9, W - 10, 5);
      ctx.fillStyle = C.signalDim;
      for (let i = 0; i < 4; i++) ctx.fillRect(px + 6 + i * 7.5, py + H - 9, 4, 1.6);
    }
  }

  // tier diamonds, only once upgraded
  if (b.tier > 0) {
    ctx.fillStyle = C.signal; ctx.globalAlpha = 0.55;
    for (let i = 0; i < b.tier; i++) diamond(px + 5 + i * 5, py - 2.5, 1.7);
    ctx.globalAlpha = 1;
  }

  if (deploying) {
    ctx.strokeStyle = C.lineHi; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, W * 0.38, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = C.signal; ctx.lineWidth = 2;
    const fr = 1 - b.deploy / b.deployMax;
    ctx.beginPath(); ctx.arc(cx, cy, W * 0.38, -1.5708, -1.5708 + fr * 6.2832); ctx.stroke();
    return;
  }

  // ---------- garrison: individual soldiers ----------
  if (d.crew) {
    for (const s of b.crew) {
      if (!s.alive) continue;
      const sx = cx + s.ox, sy = cy + s.oy;
      ctx.fillStyle = C.crew;
      ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = d.crewKind === 'flame' ? C.signal : '#FFF6E2';
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(s.aim) * 5, sy + Math.sin(s.aim) * 5); ctx.stroke();
    }

  } else if (d.range) {
    // ---------- machines: mount, legs, recoiling barrel ----------
    const big = b.type === 'siege';
    const rec = (b.recoil || 0);
    const len = (big ? 26 + b.tier * 2 : b.type === 'mortar' ? 15 : 13) - rec * 6;
    const ca = Math.cos(b.aim), sa = Math.sin(b.aim);
    if (big) {
      ctx.strokeStyle = C.steelDim; ctx.lineWidth = 3.2;
      for (let i = 0; i < 4; i++) {
        const a = b.aim + 0.7854 + i * 1.5708;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * W * 0.44, cy + Math.sin(a) * H * 0.44); ctx.stroke();
        ctx.fillStyle = '#2B333D';
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * W * 0.44, cy + Math.sin(a) * H * 0.44, 2.6, 0, 6.2832);
        ctx.fill();
      }
    }
    const rad = big ? 10 : b.type === 'mortar' ? 8 : 5.6;
    ctx.fillStyle = '#39434F';
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = C.lineHi; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.2832); ctx.stroke();
    const bx = cx - ca * rec * 3, by = cy - sa * rec * 3;
    if (b.type === 'mortar') {
      // twin tubes
      for (const o of [-3.2, 3.2]) {
        ctx.strokeStyle = C.steel; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bx - sa * o, by + ca * o);
        ctx.lineTo(bx + ca * len - sa * o, by + sa * len + ca * o);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    } else {
      ctx.strokeStyle = C.steel; ctx.lineWidth = big ? 5.2 : 3;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + ca * len, by + sa * len); ctx.stroke();
      ctx.lineCap = 'butt';
    }
    ctx.fillStyle = C.signal;
    ctx.beginPath(); ctx.arc(cx, cy, big ? 2.8 : 2, 0, 6.2832); ctx.fill();
    if (d.heatUp && b.heat > 0.05) {
      bar(px + 2, py + H + 1.5, W - 4, 2, b.heat, b.heat >= 1 ? C.danger : C.signal);
    }
  }

  if (b.hp < b.hpMax * 0.985) {
    bar(px + 2, py + H + (d.heatUp ? 5 : 1.5), W - 4, 2, b.hp / b.hpMax, C.ok);
  }
}

// which orthogonal neighbours are the same kind of works
function run(b) {
  const same = (dx, dy) => {
    const x = b.gx + dx, y = b.gy + dy;
    if (!inb(x, y)) return false;
    const i = buildAt[idx(x, y)];
    if (i < 0) return false;
    const o = buildings[i];
    return !!o && !o.dead && o.type === b.type;
  };
  return { n: same(0, -1), s: same(0, 1), w: same(-1, 0), e: same(1, 0) };
}

// chamfered filled plate with a hairline edge
function plate(x, y, w, h, c, fill, stroke) {
  chamfer(x, y, w, h, c);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke();
}
function hi(x, y, w) {
  ctx.strokeStyle = 'rgba(240,246,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
}
function diamond(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y);
  ctx.closePath(); ctx.fill();
}
function brackets(x, y, w, h, len, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  const pts = [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]];
  for (const [ox, oy, dx, dy] of pts) {
    ctx.beginPath();
    ctx.moveTo(ox + dx * len, oy); ctx.lineTo(ox, oy); ctx.lineTo(ox, oy + dy * len);
    ctx.stroke();
  }
}
function chamfer(x, y, w, h, c) {
  ctx.beginPath();
  ctx.moveTo(x + c, y); ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - c); ctx.lineTo(x + w - c, y + h);
  ctx.lineTo(x, y + h); ctx.lineTo(x, y + c);
  ctx.closePath();
}



// ============================================================================
// UI
// ============================================================================
const $ = id => document.getElementById(id);
function log(msg, cls) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  el.textContent = msg;
  $('log').prepend(el);
  while ($('log').children.length > 7) $('log').lastChild.remove();
  setTimeout(() => el.remove(), 7000);
}
function buildBar() {
  const bar = $('build'); bar.innerHTML = '';
  for (const t of BUILD_ORDER) {
    const d = DEFS[t];
    const [cs, cc] = d.cost[0];
    const el = document.createElement('button');
    el.className = 'bcard';
    el.dataset.t = t;
    el.innerHTML = `<div class="n">${d.name}</div>
      <div class="c"><span class="s">${cs}</span>${cc ? ` · <span class="y">${cc}</span>` : ''}</div>
      <div class="k">[${d.key}] ${d.code}</div>`;
    el.onclick = () => selectGhost(t);
    bar.appendChild(el);
  }
}
function selectGhost(t) {
  ghost = (ghost === t) ? null : t;
  selected = null;
  for (const el of document.querySelectorAll('.bcard')) el.classList.toggle('sel', el.dataset.t === ghost);
  refreshInsp();
}
function syncUI() {
  $('uSup').textContent = supply | 0;
  $('uCry').textContent = crystal | 0;
  $('uWave').textContent = wave;
  $('uKill').textContent = kills;
  const hf = hub ? hub.hp / hub.hpMax : 1;
  $('uHub').textContent = Math.max(0, Math.round(hf * 100)) + '%';
  $('uHub').className = 'v' + (hf < 0.4 ? ' danger' : '');
  $('uBlight').textContent = Math.round(blightPct * 100) + '%';
  $('uBlight').className = 'v' + (blightPct > 0.4 ? ' danger' : ' infect');

  for (const el of document.querySelectorAll('.bcard')) {
    const [cs, cc] = DEFS[el.dataset.t].cost[0];
    el.classList.toggle('poor', supply < cs || crystal < cc);
  }
  if (phase === 'prep') {
    $('wlab').innerHTML = `PREP <b>${Math.ceil(prepLeft)}s</b> &nbsp;·&nbsp; 조기 소집 보너스 <b>+${Math.round(prepLeft * 8)}</b>`;
    $('callBtn').style.display = '';
  } else if (phase === 'wave') {
    let alive = 0; for (const f of foes) if (!f.dead && !f.brood) alive++;
    $('wlab').innerHTML = `WAVE <b>${wave}</b> &nbsp;·&nbsp; 잔존 <b>${alive + spawnQueue.length}</b>`;
    $('callBtn').style.display = 'none';
  }
}
function refreshInsp() {
  const el = $('insp');
  if (!selected || selected.dead || selected.type === 'hub') { el.style.display = 'none'; return; }
  const b = selected, d = DEFS[b.type];
  el.style.display = 'block';
  $('iName').textContent = d.name;
  $('iCode').innerHTML = `${d.code} &nbsp; ${'◆'.repeat(b.tier + 1)}${'◇'.repeat(2 - b.tier)}`;
  const rows = [];
  rows.push(['Integrity', `${b.hp | 0} / ${b.hpMax}`]);
  if (d.range) rows.push(['Range', d.range[b.tier].toFixed(1) + (d.minRange ? ` / min ${d.minRange}` : '')]);
  if (d.dmg) rows.push(['Damage', d.dmg[b.tier]]);
  if (d.crew) rows.push(['Crew', `${b.crew.filter(s => s.alive).length} / ${d.crew[b.tier]}`]);
  if (d.powerR) rows.push(['Grid radius', d.powerR[b.tier]]);
  if (d.yield) rows.push(['Yield', d.yield[b.tier].toFixed(2) + '/s']);
  if (d.power) rows.push(['Power', b.powered ? '◆ ONLINE' : '◇ OFFLINE']);
  $('iRows').innerHTML = rows.map(r =>
    `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  $('iDesc').textContent = d.desc;
  const up = $('iUp');
  if (b.tier >= 2) { up.textContent = 'MAX'; up.disabled = true; }
  else { const [cs, cc] = d.cost[b.tier + 1]; up.disabled = false;
    up.textContent = `강화 ${cs}${cc ? ' / ' + cc : ''}`; }
}

// ---- input ---------------------------------------------------------------
let panning = false, panSX = 0, panSY = 0, panCX = 0, panCY = 0;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  if (e.button === 2 || e.button === 1) {
    panning = true; panSX = e.clientX; panSY = e.clientY; panCX = cam.x; panCY = cam.y;
    cv.style.cursor = 'grabbing';
  } else if (e.button === 0) {
    const r = cv.getBoundingClientRect();
    const [wx, wy] = s2w(e.clientX - r.left, e.clientY - r.top);
    const gxp = (wx / TILE) | 0, gyp = (wy / TILE) | 0;
    if (!inb(gxp, gyp)) return;
    if (ghost) {
      if (tryPlace(ghost, gxp, gyp) && !e.shiftKey) { /* keep ghost for chaining */ }
    } else {
      const bi = buildAt[idx(gxp, gyp)];
      selected = bi >= 0 ? buildings[bi] : null;
      refreshInsp();
    }
  }
});
window.addEventListener('mouseup', () => { panning = false; cv.style.cursor = 'crosshair'; });
window.addEventListener('mousemove', e => {
  if (panning) {
    cam.x = panCX - (e.clientX - panSX) / cam.z;
    cam.y = panCY - (e.clientY - panSY) / cam.z;
    cam.x = clamp(cam.x, 0, WW); cam.y = clamp(cam.y, 0, WH);
  }
  const r = cv.getBoundingClientRect();
  const [wx, wy] = s2w(e.clientX - r.left, e.clientY - r.top);
  const gxp = (wx / TILE) | 0, gyp = (wy / TILE) | 0;
  hoverIdx = inb(gxp, gyp) ? idx(gxp, gyp) : -1;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.88 : 1.14;
  cam.z = clamp(cam.z * f, 0.42, 2.6);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Escape') { selectGhost(null); ghost = null;
    for (const el of document.querySelectorAll('.bcard')) el.classList.remove('sel');
    selected = null; refreshInsp(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (phase === 'prep') startWave(); return; }
  if (e.key === 'u' || e.key === 'U') { if (selected) { upgrade(selected); refreshInsp(); } return; }
  if (e.key === 'x' || e.key === 'X') { if (selected) { sell(selected); } return; }
  const t = BUILD_ORDER.find(k => DEFS[k].key === e.key);
  if (t) selectGhost(t);
});

for (const btn of document.querySelectorAll('.sp')) {
  btn.onclick = () => {
    speed = +btn.dataset.sp;
    for (const o of document.querySelectorAll('.sp')) o.classList.remove('on');
    btn.classList.add('on');
  };
}
$('callBtn').onclick = () => startWave();
$('iUp').onclick = () => { if (selected) { upgrade(selected); refreshInsp(); } };
$('iSell').onclick = () => { if (selected) sell(selected); };
$('oBtn').onclick = () => location.reload();

// ============================================================================
// Boot
// ============================================================================
function init() {
  resize();
  const { hx, hy } = buildMap();
  buildTerrainLayer();
  cam.x = hx * TILE; cam.y = hy * TILE;
  computeFlow();
  buildBar();
  prepMax = prepLeft = 70;
  log('구역 도착 — 관제동 가동', 'hot');
  log('참호부터 세우십시오. 진입로는 세 곳입니다.');
  requestAnimationFrame(frame);
}
function frame(ms) {
  if (!lastMs) lastMs = ms;
  let dtms = Math.min(90, ms - lastMs); lastMs = ms;
  if (phase !== 'dead') {
    timeAcc += (dtms / 1000) * speed;
    let guard = 0;
    while (timeAcc >= TICK && guard++ < 12) { step(TICK); timeAcc -= TICK; }
  }
  draw();
  syncUI();
  requestAnimationFrame(frame);
}
// debug probe (used by the harness, harmless in normal play)
window.__dbg = () => ({
  wave, phase, kills, supply: supply | 0, crystal: crystal | 0,
  foes: foes.filter(f => !f.dead).length,
  buildings: buildings.filter(b => !b.dead).length,
  hub: hub ? Math.round(hub.hp) : null, blight: +(blightPct * 100).toFixed(1),
  parts: parts.length, projs: projs.length,
});
init();
</script>
