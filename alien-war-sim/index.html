  const hf = hub ? hub.hp / hub.hpMax : 1;
  $('uHub').textContent = Math.max(0, Math.round(hf * 100)) + '%';
  $('uHub').className = 'v' + (hf < 0.4 ? ' danger' : '');
  $('uBlight').textContent = Math.round(blightPct * 100) + '%';
  $('uBlight').className = 'v' + (blightPct > 0.4 ? ' danger' : ' infect');

  for (const el of document.querySelectorAll('.bcard')) {
    const [cs, cc] = DEFS[el.dataset.t].cost[0];
    el.classList.toggle('poor', supply < cs || crystal < cc);
  }
  if (phase === 'prep') {
    $('wlab').innerHTML = `PREP <b>${Math.ceil(prepLeft)}s</b> &nbsp;·&nbsp; 조기 소집 보너스 <b>+${Math.round(prepLeft * 8)}</b>`;
    $('callBtn').style.display = '';
  } else if (phase === 'wave') {
    let alive = 0; for (const f of foes) if (!f.dead && !f.brood) alive++;
    $('wlab').innerHTML = `WAVE <b>${wave}</b> &nbsp;·&nbsp; 잔존 <b>${alive + spawnQueue.length}</b>`;
    $('callBtn').style.display = 'none';
  }
}
function refreshInsp() {
  const el = $('insp');
  if (!selected || selected.dead || selected.type === 'hub') { el.style.display = 'none'; return; }
  const b = selected, d = DEFS[b.type];
  el.style.display = 'block';
  $('iName').textContent = d.name;
  $('iCode').innerHTML = `${d.code} &nbsp; ${'◆'.repeat(b.tier + 1)}${'◇'.repeat(2 - b.tier)}`;
  const rows = [];
  rows.push(['Integrity', `${b.hp | 0} / ${b.hpMax}`]);
  if (d.range) rows.push(['Range', d.range[b.tier].toFixed(1) + (d.minRange ? ` / min ${d.minRange}` : '')]);
  if (d.dmg) rows.push(['Damage', d.dmg[b.tier]]);
  if (d.crew) rows.push(['Crew', `${b.crew.filter(s => s.alive).length} / ${d.crew[b.tier]}`]);
  if (d.powerR) rows.push(['Grid radius', d.powerR[b.tier]]);
  if (d.yield) rows.push(['Yield', d.yield[b.tier].toFixed(2) + '/s']);
  if (d.power) rows.push(['Power', b.powered ? '◆ ONLINE' : '◇ OFFLINE']);
  $('iRows').innerHTML = rows.map(r =>
    `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  $('iDesc').textContent = d.desc;
  const up = $('iUp');
  if (b.tier >= 2) { up.textContent = 'MAX'; up.disabled = true; }
  else { const [cs, cc] = d.cost[b.tier + 1]; up.disabled = false;
    up.textContent = `강화 ${cs}${cc ? ' / ' + cc : ''}`; }
}

// ---- input ---------------------------------------------------------------
// ---- unified pointer input: mouse, pen and touch --------------------------
// Mouse keeps the desktop feel (left click acts immediately, right drag pans).
// Touch pans with one finger, pinches with two, and acts on a quick tap.
const ptrs = new Map();
let panning = false, panSX = 0, panSY = 0, panCX = 0, panCY = 0;
let tapAt = null, pinchD = 0, pinchZ = 1;

function localPt(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function tileUnder(e) {
  const [sx, sy] = localPt(e);
  const [wx, wy] = s2w(sx, sy);
  const gxp = Math.floor(wx / TILE), gyp = Math.floor(wy / TILE);
  return inb(gxp, gyp) ? [gxp, gyp] : null;
}
function beginPan(e) {
  panning = true; panSX = e.clientX; panSY = e.clientY;
  panCX = cam.x; panCY = cam.y;
}
function primaryAction(e) {
  const t = tileUnder(e);
  if (!t) return;
  const [gxp, gyp] = t;
  hoverIdx = idx(gxp, gyp);
  if (ghost) {
    // a multi-tile asset is sited from its centre, which is what the
    // finger is actually pointing at
    const d = DEFS[ghost];
    const ax = gxp - (((d.w || 1) - 1) >> 1), ay = gyp - (((d.h || 1) - 1) >> 1);
    tryPlace(ghost, ax, ay);
  } else {
    const bi = buildAt[idx(gxp, gyp)];
    selected = bi >= 0 ? buildings[bi] : null;
    refreshInsp();
  }
}

cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (e.pointerType === 'mouse') {
    if (e.button === 2 || e.button === 1) { beginPan(e); cv.style.cursor = 'grabbing'; }
    else if (e.button === 0) primaryAction(e);
    return;
  }
  if (ptrs.size === 1) {
    tapAt = { t: performance.now(), x: e.clientX, y: e.clientY };
    beginPan(e);
    const t = tileUnder(e);
    if (t) hoverIdx = idx(t[0], t[1]);
  } else if (ptrs.size === 2) {
    tapAt = null; panning = false;
    const [a, b] = [...ptrs.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    pinchZ = cam.z;
  }
});

cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    cam.z = clamp(pinchZ * (d / pinchD), minZoom(), 2.6);
    clampCam();
    return;
  }
  if (panning) {
    cam.x = panCX - (e.clientX - panSX) / cam.z;
    cam.y = panCY - (e.clientY - panSY) / cam.z;
    clampCam();
    if (tapAt && Math.hypot(e.clientX - tapAt.x, e.clientY - tapAt.y) > 14) tapAt = null;
  }
  if (e.pointerType !== 'touch') {
    const t = tileUnder(e);
    hoverIdx = t ? idx(t[0], t[1]) : -1;
  }
});

function endPointer(e) {
  if (e.pointerType === 'touch' && tapAt && ptrs.size === 1) {
    const quick = performance.now() - tapAt.t < 320;
    const still = Math.hypot(e.clientX - tapAt.x, e.clientY - tapAt.y) < 14;
    if (quick && still) primaryAction(e);
  }
  ptrs.delete(e.pointerId);
  tapAt = null;
  if (ptrs.size === 0) { panning = false; cv.style.cursor = 'crosshair'; }
  else if (ptrs.size === 1) {
    // second finger lifted: resume panning from the remaining one
    const [only] = [...ptrs.values()];
    panning = true; panSX = only.x; panSY = only.y; panCX = cam.x; panCY = cam.y;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

cv.addEventListener('wheel', e => {
  e.preventDefault();
  cam.z = clamp(cam.z * (e.deltaY > 0 ? 0.88 : 1.14), minZoom(), 2.6);
  clampCam();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Escape') { selectGhost(null); ghost = null;
    for (const el of document.querySelectorAll('.bcard')) el.classList.remove('sel');
    selected = null; refreshInsp(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (phase === 'prep') startWave(); return; }
  if (e.key === 'u' || e.key === 'U') { if (selected) { upgrade(selected); refreshInsp(); } return; }
  if (e.key === 'x' || e.key === 'X') { if (selected) { sell(selected); } return; }
  const t = BUILD_ORDER.find(k => DEFS[k].key === e.key);
  if (t) selectGhost(t);
});

for (const btn of document.querySelectorAll('.sp')) {
  btn.onclick = () => {
    speed = +btn.dataset.sp;
    for (const o of document.querySelectorAll('.sp')) o.classList.remove('on');
    btn.classList.add('on');
  };
}
$('callBtn').onclick = () => startWave();
$('iUp').onclick = () => { if (selected) { upgrade(selected); refreshInsp(); } };
$('iSell').onclick = () => { if (selected) sell(selected); };
$('oBtn').onclick = () => location.reload();

// ============================================================================
// Boot
// ============================================================================
function init() {
  resize();
  const { hx, hy } = buildMap();
  buildTerrainLayer();
  cam.x = hx * TILE; cam.y = hy * TILE;
  if (MOBILE) cam.z = 0.70;
  clampCam();
  computeFlow();
  buildBar();
  prepMax = prepLeft = 70;
  log('구역 도착 — 관제동 가동', 'hot');
  log('참호부터 세우십시오. 진입로는 세 곳입니다.');
  requestAnimationFrame(frame);
}
function frame(ms) {
  if (!lastMs) lastMs = ms;
  let dtms = Math.min(90, ms - lastMs); lastMs = ms;
  if (phase !== 'dead') {
    timeAcc += (dtms / 1000) * speed;
    let guard = 0;
    while (timeAcc >= TICK && guard++ < 12) { step(TICK); timeAcc -= TICK; }
  }
  draw();
  syncUI();
  requestAnimationFrame(frame);
}
// debug probe (used by the harness, harmless in normal play)
window.__dbg = () => ({
  wave, phase, kills, supply: supply | 0, crystal: crystal | 0,
  foes: foes.filter(f => !f.dead).length,
  buildings: buildings.filter(b => !b.dead).length,
  hub: hub ? Math.round(hub.hp) : null, blight: +(blightPct * 100).toFixed(1),
  parts: parts.length, projs: projs.length,
});
init();
</script>
