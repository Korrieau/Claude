<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OUTPOST — 방어 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Endfield-style industrial HUD. See design-style-guide.md */
  :root{
    --base:#0A0A0A; --s0:#0F0F0F; --s1:#141414; --s2:#1A1A1A; --s3:#222222;
    --hover:#1E1E1E; --active:#252525;
    --line:rgba(255,255,255,.06); --lineHi:rgba(255,255,255,.10);
    --text:#F0F0F0; --muted:#999999; --dim:#666666;
    --signal:#FFD429; --signalDim:#B89210;
    --info:#4DA8DA; --danger:#FF4757; --ok:#2ED573; --infect:#00E5FF;
    --sharp:cubic-bezier(.4,0,.2,1); --t-fast:150ms;
    --tech:'Orbitron',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--base);color:var(--text);
    font-family:var(--ui);font-size:12px;-webkit-font-smoothing:antialiased;user-select:none}

  .lab{font-family:var(--tech);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .num{font-family:var(--tech);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* ---------- generic panel ---------- */
  /* the chamfer cuts the top-right and bottom-left corners */
  .panel{background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 4px 24px rgba(0,0,0,.4);position:relative;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
  .panel::before,.panel::after{content:'';position:absolute;width:24px;height:24px;
    pointer-events:none}
  .panel::before{top:-1px;left:-1px;
    border-top:2px solid rgba(255,212,41,.4);border-left:2px solid rgba(255,212,41,.4)}
  .panel::after{bottom:-1px;right:-1px;
    border-bottom:2px solid rgba(255,212,41,.4);border-right:2px solid rgba(255,212,41,.4)}
  .scan{position:relative}
  .scan::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,
      rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 4px)}

  /* ---------- inspector ---------- */
  #iName{font-size:13.5px;color:var(--signal);font-weight:500;letter-spacing:.01em}
  #iCode{font-family:var(--tech);font-size:9px;letter-spacing:.16em;color:var(--dim);
    margin:3px 0 11px;text-transform:uppercase}
  #insp .row{display:flex;justify-content:space-between;padding:5px 0;
    border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
  #insp .row span:first-child{font-family:var(--tech);font-size:9px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase}
  #insp .row span:last-child{font-family:var(--tech);font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--text)}
  #insp .desc{font-size:11px;color:var(--dim);line-height:1.65;padding-top:10px}
  #insp .acts{display:flex;gap:7px;margin-top:12px}
  .abtn{flex:1;background:transparent;border:1px solid var(--line);color:var(--text);
    font-family:var(--tech);font-size:10px;letter-spacing:.08em;padding:11px 4px;cursor:pointer;
    min-height:44px;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
  .abtn:hover{border-color:var(--signalDim);color:var(--signal)}
  .abtn.warn:hover{border-color:var(--danger);color:var(--danger)}
  .abtn:disabled{opacity:.3;cursor:default}

  /* ---------- log ---------- */
  #log div{background:rgba(10,10,10,.72);backdrop-filter:blur(8px);padding:5px 10px;font-size:10.5px;
    color:var(--muted);border-left:2px solid var(--line);letter-spacing:.01em}
  #log div::before{content:'◇ ';color:var(--dim)}
  #log div.hot{color:var(--signal);border-left-color:var(--signal)}
  #log div.hot::before{content:'◆ ';color:var(--signal)}
  #log div.bad{color:var(--danger);border-left-color:var(--danger)}
  #log div.bad::before{content:'◆ ';color:var(--danger)}

  /* ---------- overlays ---------- */
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,10,10,.93);z-index:20;flex-direction:column;gap:6px}
  #over h1{font-family:var(--tech);font-size:26px;color:var(--danger);letter-spacing:.28em;
    font-weight:500;text-transform:uppercase}
  #over .st{font-family:var(--tech);font-size:12px;color:var(--muted);letter-spacing:.1em;
    font-variant-numeric:tabular-nums}
  #oBtn{margin-top:18px;background:var(--signal);border:none;color:#141005;
    font-family:var(--tech);font-size:11px;font-weight:700;letter-spacing:.14em;
    padding:13px 32px;cursor:pointer;min-height:44px;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}


  /* hover effects only where a pointer can actually hover */
  @media (hover:none){
    .bcard:hover{background:transparent}
    .sp:hover{color:var(--muted)}
    .abtn:hover{border-color:var(--line);color:var(--text)}
  }


  /* ---------- floating HUD: the world holds the centre ---------- */
  #wrap{position:fixed;inset:0}
  #stage{position:absolute;inset:0;overflow:hidden}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;
    cursor:crosshair;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}

  #tl{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .chipbar{display:flex;align-items:center;gap:2px}
  #obj{gap:12px;padding:7px 7px 7px 13px}
  #wlab{font-family:var(--tech);font-size:10px;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase;white-space:nowrap}
  #wlab b{color:var(--text);font-weight:500}
  #callBtn{background:var(--signal);border:none;color:#0A0A0A;font-family:var(--tech);
    font-size:11px;font-weight:700;letter-spacing:.1em;padding:8px 15px;cursor:pointer;
    transition:background var(--t-fast) var(--sharp);
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
  #callBtn:hover{background:#ffe066}

  #res{gap:6px}
  .chip{display:flex;flex-direction:column;gap:1px;padding:5px 10px 4px;
    background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:56px;
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
  .chip .lab{font-style:normal;font-size:8px;letter-spacing:.14em}
  .chip .v{font-family:var(--tech);font-size:14px;font-weight:500;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--text)}
  .v.signal{color:var(--signal)} .v.infect{color:var(--infect)} .v.danger{color:var(--danger)}

  #speeds{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));
    display:flex;gap:2px;padding:3px;background:rgba(20,20,20,.55);
    border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px);
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
  .sp{background:transparent;border:1px solid transparent;color:var(--muted);
    font-family:var(--tech);font-size:10px;letter-spacing:.1em;padding:7px 10px;
    cursor:pointer;transition:color var(--t-fast) var(--sharp)}
  .sp:hover{color:var(--text)}
  .sp.on{color:var(--signal);border-color:rgba(255,212,41,.4);
    background:rgba(255,212,41,.08);box-shadow:0 0 20px rgba(255,212,41,.2)}

  #hint{position:absolute;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));
    font-family:var(--tech);font-size:9px;letter-spacing:.12em;color:var(--dim);
    line-height:2;text-transform:uppercase;text-align:right;pointer-events:none}

  /* build tray floats at the bottom, sized to its contents */
  #build{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;max-width:calc(100vw - 28px);overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0}
  #build::-webkit-scrollbar{display:none}
  #trayfade{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));
    right:calc(50vw - min(50vw - 14px, 50%));width:30px;height:52px;
    pointer-events:none;display:none}
  .bcard{background:transparent;border:none;border-right:1px solid rgba(255,255,255,.06);
    border-top:2px solid transparent;color:var(--text);padding:8px 12px 9px;cursor:pointer;
    text-align:left;min-width:0;display:flex;align-items:center;gap:9px;
    font-family:var(--ui);position:relative;flex:none;
    transition:background var(--t-fast) var(--sharp)}
  .bcard:last-child{border-right:none}
  .bcard:hover{background:var(--hover)}
  .bcard.sel{background:var(--active);border-top-color:var(--signal)}
  .bcard.sel .n{color:var(--signal)}
  .bcard.poor{opacity:.32}
  .bcard .ic{flex:none;width:30px;height:30px;display:grid;place-items:center;
    color:var(--muted);background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    transition:color var(--t-fast) var(--sharp);
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
  .bcard .ic svg{width:18px;height:18px}
  .bcard.sel .ic{color:var(--signal);border-color:rgba(255,212,41,.4);
    background:rgba(255,212,41,.10);box-shadow:0 0 20px rgba(255,212,41,.2)}
  .bcard .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .bcard .n{font-size:11px;color:var(--text);white-space:nowrap}
  .bcard .c{font-family:var(--tech);font-size:10px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .bcard .c .s{color:var(--signal)} .bcard .c .y{color:var(--infect)}
  .bcard .c i{font-style:normal;color:var(--dim);font-size:8px;vertical-align:1px}
  .bcard .k{display:none}

  #insp{position:absolute;right:14px;top:74px;width:246px;padding:16px;display:none}
  #log{position:absolute;left:14px;bottom:calc(72px + env(safe-area-inset-bottom));
    width:300px;display:flex;flex-direction:column-reverse;gap:3px;pointer-events:none}

  @media (max-width:900px), (pointer:coarse){
    body{font-size:13px}
    #tl{left:8px;top:calc(8px + env(safe-area-inset-top));gap:6px}
    #obj{gap:9px;padding:6px 6px 6px 11px}
    #wlab{font-size:9px}
    #callBtn{padding:10px 15px;min-height:40px}
    .chip{padding:4px 8px 3px}
    .chip .v{font-size:13px}
    .chip.opt{display:none}
    #speeds{right:8px;top:calc(8px + env(safe-area-inset-top))}
    .sp{padding:9px 10px;min-height:40px}
    #hint{display:none}

    /* the tray spans the width; the inspector becomes a bottom sheet */
    #build{left:0;right:0;transform:none;bottom:0;max-width:none;
      background:rgba(14,14,14,.86);border-left:none;border-right:none;
      border-bottom:none;clip-path:none;justify-content:flex-start}
    .bcard{padding:9px 11px 11px;gap:8px}
    .bcard .n{font-size:11.5px}

    #insp{right:0;left:0;top:auto;bottom:66px;width:auto;padding:14px 16px 16px;
      clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
    #insp::after{display:none}
    .abtn{padding:13px 4px;font-size:11px}
    #insp .row{padding:7px 0}

    #log{left:8px;right:8px;bottom:auto;top:96px;width:auto}
    #log div{font-size:10px;padding:5px 9px}
    #log div:nth-child(n+4){display:none}
  }

  /* the tray scrolls; fade its trailing edge so that is obvious */
  @media (pointer:coarse){
    #stage::after{content:'';position:absolute;right:0;bottom:0;width:34px;
      height:60px;pointer-events:none;z-index:6;
      background:linear-gradient(90deg,rgba(14,14,14,0),rgba(14,14,14,.9))}
  }

  @media (max-width:560px){
    .chip{padding:4px 7px 3px}
    .chip .v{font-size:12px}
    .bcard{padding:8px 9px 10px}
    #over h1{font-size:20px;letter-spacing:.2em}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <!-- everything below floats over the world; only controls take input -->
    <div id="hud">
      <div id="tl">
        <div id="obj" class="chipbar panel"><span id="wlab">대기 중</span>
          <button id="callBtn">소집</button></div>
        <div id="res" class="chipbar">
          <span class="chip"><i class="lab">SUP</i><b class="v signal" id="uSup">0</b></span>
          <span class="chip"><i class="lab">CRY</i><b class="v infect" id="uCry">0</b></span>
          <span class="chip"><i class="lab">WAVE</i><b class="v" id="uWave">0</b></span>
          <span class="chip opt"><i class="lab">KILL</i><b class="v" id="uKill">0</b></span>
          <span class="chip"><i class="lab">HUB</i><b class="v" id="uHub">100%</b></span>
          <span class="chip opt"><i class="lab">BLGT</i><b class="v" id="uBlight">0%</b></span>
        </div>
      </div>

      <div id="speeds">
        <button class="sp" data-sp="0">HOLD</button>
        <button class="sp on" data-sp="1">1×</button>
        <button class="sp" data-sp="2">2×</button>
        <button class="sp" data-sp="3">3×</button>
      </div>

      <div id="hint">LMB 설치 · RMB드래그 이동 · WHEEL 확대<br>
        1–9 자산 · ESC 취소 · U 강화 · X 철거 · SPACE 소집</div>

      <div id="insp" class="panel scan">
        <div id="iName"></div>
        <div id="iCode"></div>
        <div id="iRows"></div>
        <div class="desc" id="iDesc"></div>
        <div class="acts">
          <button class="abtn" id="iUp">강화</button>
          <button class="abtn warn" id="iSell">철거</button>
        </div>
      </div>

      <div id="log"></div>
      <div id="build" class="panel"></div>
    </div>

    <div id="over">
      <h1>Hub Lost</h1>
      <div class="st" id="oStat"></div>
      <button id="oBtn">재가동</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ============================================================================
// OUTPOST - top-down defense prototype
// Fixed 60Hz logic tick, decoupled render. Grid world, Dijkstra flow field,
// separation-steered swarm, pooled projectiles and particles, persistent
// ground decal layer.
// ============================================================================

const TILE = 20, GW = 72, GH = 78;
// The camera is tilted: world Y is compressed on screen, and anything with
// height is drawn upward from its ground point. Simulation stays flat 2D.
const SQ = 0.55, HZ = 1 / SQ;
const WW = GW * TILE, WH = GH * TILE;
const TICK = 1 / 60;

// ---- terrain codes -------------------------------------------------------
const T_OPEN = 0, T_ROCK = 1, T_NODE = 2;

// ---- palette -------------------------------------------------------------
// Restrained industrial palette: near-black cool base, one warm accent for
// everything human-made, one cold accent for the infection. Form is carried
// by thin linework and silhouette, never by stacked blocks.
const C = {
  void: '#080A0D',
  plain: '#141920', plainHi: '#1B222B',
  rockFill: '#0C0F14', rockLip: '#1E2732', rockEdge: '#46586B',
  hair: 'rgba(150,180,210,0.055)',
  amber: '#FFA502', amberDim: '#8A5A05',
  conc: '#C6C8C0', concHi: '#E4E6DE', concDark: '#8A8F88',
  slit: '#2A302E',
  cyan: '#00E5FF', cyanDim: '#0A5560',
  bone: '#C9D3DD', steel: '#D0D4D2', steelHi: '#F0F2EF', steelDim: '#9AA29E',
  danger: '#FF4757',
  crew: '#FFE6BE',
  foeFill: '#241F1A', foeEdge: '#B9C0A4', foeCore: '#00E5FF',
  line: '#2A323C', lineHi: '#3E4956', signal: '#FFD429', signalDim: '#B89210',
  info: '#4DA8DA', ok: '#2ED573',
};

// The terrain is drawn once into its own layer as smooth merged silhouettes,
// so nothing on screen reads as a grid of cubes.
const terrainCv = document.createElement('canvas');
// supersample the terrain on desktop so close zooms stay crisp
const TS = (matchMedia('(pointer:coarse)').matches || innerWidth < 900) ? 1 : 1.5;
terrainCv.width = Math.round(WW * TS); terrainCv.height = Math.round(WH * TS);
// ---- value noise, for terrain that has structure instead of static -------
const NP = new Uint8Array(512);
for (let i = 0; i < 256; i++) { const v = (Math.random() * 256) | 0; NP[i] = v; NP[i + 256] = v; }
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => NP[(NP[a & 255] + (b & 255)) & 255] / 255;
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), e = h(xi + 1, yi + 1);
  const t1 = a + (b - a) * u, t2 = c + (e - c) * u;
  return t1 + (t2 - t1) * v;
}
function fbm(x, y) {
  return vn(x, y) * 0.54 + vn(x * 2.13, y * 2.13) * 0.28 +
         vn(x * 4.37, y * 4.37) * 0.12 + vn(x * 8.7, y * 8.7) * 0.06;
}

// ---- terrain --------------------------------------------------------------
// Built as a painting, not as sampled noise. One material dominates: grass.
// Variation is in VALUE only, delivered by tens of thousands of individual
// blades whose colour is picked from a soft light field. Because the blades
// dither every boundary, the light field never shows as a hard-edged patch,
// which is what made the earlier quantised version read as camouflage cloth.
// Every other material is confined to a place it has a reason to be: dirt on
// the routes people walk, gravel at the foot of the cliffs, flowers in the
// damp low ground.
// Sampled from the reference captures rather than chosen by eye. The grass
// there is olive and desaturated - dark #4B6639, mid #73845C, lit #969640 -
// which is a long way from the pure saturated green this used to be.
const GRASS = ['#3F5029', '#55683A', '#6E8248', '#8B9B58'];
const GRASS_DRY = '#A8AC6A';

function buildTerrainLayer() {
  const t = terrainCv.getContext('2d');
  t.setTransform(1, 0, 0, 1, 0, 0);
  t.clearRect(0, 0, terrainCv.width, terrainCv.height);
  t.setTransform(TS, 0, 0, TS, 0, 0);   // everything below is in world units

  const isRockTile = (gx, gy) => inb(gx, gy) && terrain[idx(gx, gy)] === T_ROCK;
  const rockAt = (x, y) => isRockTile((x / TILE) | 0, (y / TILE) | 0);

  // ---- 1. the valley floor is one colour ----
  t.fillStyle = '#55683A';
  t.fillRect(0, 0, WW, WH);

  // ---- 2. broad light: cloud shadow and sun, same hue, low contrast ----
  for (let i = 0; i < 46; i++) {
    const x = rnd(-100, WW + 100), y = rnd(-100, WH + 100), r = rnd(180, 520);
    const dark = Math.random() < 0.55;
    const g = t.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, dark ? 'rgba(34,46,22,0.22)' : 'rgba(174,182,104,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = g;
    t.beginPath(); t.ellipse(x, y, r, r * 0.74, rnd(0, 3.1), 0, 6.2832); t.fill();
  }

  // ---- 3. grass, blade by blade ----
  // Four value batches so the whole lawn is four fill() calls, not 50k.
  const blade = (p, x, y, h, w, lean) => {
    p.moveTo(x - w, y);
    p.quadraticCurveTo(x - w * 0.4, y - h * 0.55, x + lean, y - h);
    p.quadraticCurveTo(x + w * 0.6, y - h * 0.45, x + w, y);
  };
  const batch = [];
  for (let i = 0; i < 5; i++) batch.push(new Path2D());
  // Blades grow in tufts, not on a lattice, and they all lean the same way.
  // Even scatter at high contrast is what made the first attempt read as
  // static; grouping plus one wind direction reads as a field.
  const STEP = 11;
  for (let y = -6; y < WH + 12; y += STEP) {
    for (let x = -6; x < WW + 12; x += STEP) {
      const cx = x + rnd(-STEP * 0.55, STEP * 0.55), cy = y + rnd(-STEP * 0.55, STEP * 0.55);
      if (rockAt(cx, cy)) continue;
      const L = fbm(cx / 300, cy / 300) * 0.7 + fbm(cx / 96, cy / 96) * 0.3;
      const tuft = 4 + ((Math.random() * 5) | 0);
      for (let k = 0; k < tuft; k++) {
        const bx = cx + rnd(-4.5, 4.5), by = cy + rnd(-3.5, 3.5);
        const q = L + rnd(-0.055, 0.055);
        let ci = q < 0.42 ? 0 : q < 0.50 ? 1 : q < 0.58 ? 2 : 3;
        if (Math.random() < 0.010) ci = 4;
        blade(batch[ci], bx, by, rnd(5, 10), rnd(0.75, 1.25), rnd(-2.2, -0.4));
      }
    }
  }
  for (let i = 0; i < 5; i++) {
    t.fillStyle = i === 4 ? GRASS_DRY : GRASS[i];
    t.fill(batch[i]);
  }
  // Softening: broad washes knock the texture back in places, so the field
  // has smooth passages instead of being uniformly busy everywhere.
  for (let i = 0; i < 70; i++) {
    const x = rnd(-120, WW + 120), y = rnd(-120, WH + 120), r = rnd(140, 420);
    const g = t.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() < 0.5;
    g.addColorStop(0, dark ? 'rgba(48,60,28,0.30)' : 'rgba(150,150,64,0.24)');
    g.addColorStop(0.65, dark ? 'rgba(48,60,28,0.10)' : 'rgba(150,150,64,0.08)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    t.fillStyle = g;
    t.beginPath(); t.ellipse(x, y, r, r * rnd(0.5, 0.85), rnd(0, 3.1), 0, 6.2832); t.fill();
  }

  // ---- 4. worn routes: dirt shows only where the site is actually used ----
  const hubPx = [(hub ? hub.x : WW * 0.8), (hub ? hub.y : WH / 2)];
  const routes = [];
  for (const g of GATES) routes.push([g.x * TILE, g.y * TILE, hubPx[0], hubPx[1], 1]);
  for (let i = 0; i < SPAWNS.length; i++) {
    const s = SPAWNS[i], g = GATES[i] || GATES[0];
    routes.push([s.x * TILE, s.y * TILE, g.x * TILE, g.y * TILE, 0.72]);
  }
  t.save();
  t.lineCap = 'round'; t.lineJoin = 'round';
  for (const [x0, y0, x1, y1, str] of routes) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + rnd(-70, 70);
    const lay = (w, col) => {
      t.strokeStyle = col; t.lineWidth = w;
      t.beginPath(); t.moveTo(x0, y0); t.quadraticCurveTo(mx, my, x1, y1); t.stroke();
    };
    lay(46, `rgba(112,104,66,${0.20 * str})`);   // trampled fringe
    lay(30, `rgba(140,120,80,${0.52 * str})`);   // worn dirt
    lay(15, `rgba(166,144,100,${0.60 * str})`);  // bare centre
    // ruts
    for (const off of [-5.5, 5.5]) {
      t.strokeStyle = `rgba(96,80,52,${0.34 * str})`; t.lineWidth = 2.2;
      t.beginPath(); t.moveTo(x0 + off, y0); t.quadraticCurveTo(mx + off, my, x1 + off, y1); t.stroke();
    }
    // grass creeping back at the edges keeps the path from reading as a decal
    for (let i = 0; i < 200; i++) {
      const u = Math.random(), iu = 1 - u;
      const px = iu * iu * x0 + 2 * iu * u * mx + u * u * x1;
      const py = iu * iu * y0 + 2 * iu * u * my + u * u * y1;
      const o = (Math.random() < 0.5 ? -1 : 1) * rnd(10, 24);
      if (rockAt(px + o, py)) continue;
      const p = new Path2D();
      blade(p, px + o, py + rnd(-14, 14), rnd(4, 8), rnd(0.7, 1.1), rnd(-1.6, 0.6));
      t.fillStyle = Math.random() < 0.5 ? GRASS[1] : GRASS[2];
      t.fill(p);
    }
  }
  t.restore();

  // ---- 4b. bare stone showing through the turf ----
  // In the reference a good third of the ground is exposed pale rock, not
  // grass. Wall-to-wall lawn is what made ours read as a golf course.
  for (let i = 0; i < 190; i++) {
    const cx = Math.random() * WW, cy = Math.random() * WH;
    if (rockAt(cx, cy)) continue;
    if (fbm(cx / 150, cy / 150) < 0.58) continue;   // high ground wears through
    const n = 2 + ((Math.random() * 3) | 0);
    for (let k = 0; k < n; k++) {
      const x = cx + rnd(-11, 11), y = cy + rnd(-7, 7), r = rnd(4, 11);
      t.fillStyle = Math.random() < 0.5 ? 'rgba(112,118,112,0.55)' : 'rgba(140,144,134,0.48)';
      t.beginPath(); t.ellipse(x, y, r, r * rnd(0.4, 0.62), rnd(0, 3.1), 0, 6.2832); t.fill();
    }
    for (let k = 0; k < 4; k++) {      // loose stones on top of the patch
      const x = cx + rnd(-12, 12), y = cy + rnd(-8, 8), r = rnd(1.1, 2.6);
      t.fillStyle = 'rgba(28,34,20,0.46)';
      t.beginPath(); t.ellipse(x + 0.7, y + 1.0, r, r * 0.62, 0, 0, 6.2832); t.fill();
      t.fillStyle = 'rgba(166,172,170,0.85)';
      t.beginPath(); t.ellipse(x, y, r, r * 0.62, rnd(0, 3.1), 0, 6.2832); t.fill();
    }
  }

  // ---- 5. wildflowers, clustered in the damp hollows ----
  const FLOWER = ['#F4EEC6', '#FFFFFF', '#EFC3C9', '#F6D98A'];
  for (let i = 0; i < 150; i++) {
    const cx = Math.random() * WW, cy = Math.random() * WH;
    if (rockAt(cx, cy)) continue;
    if (fbm(cx / 130, cy / 130) > 0.50) continue;   // low ground only
    const col = FLOWER[(Math.random() * FLOWER.length) | 0];
    const n = 7 + ((Math.random() * 12) | 0);
    for (let k = 0; k < n; k++) {
      const x = cx + rnd(-22, 22), y = cy + rnd(-16, 16), r = rnd(0.9, 1.7);
      t.fillStyle = 'rgba(40,58,26,0.5)';
      t.beginPath(); t.ellipse(x, y + 1.6, r, r * 0.8, 0, 0, 6.2832); t.fill();
      t.fillStyle = col;
      t.beginPath(); t.ellipse(x, y, r, r * 0.8, 0, 0, 6.2832); t.fill();
    }
  }

  buildCliffs(t);
  buildTrees();
  buildProps(t);

  // ---- 7. the daylight model, baked in ----
  // Warm sun falls from the top left, cool sky light fills the far side, and
  // the distance goes to haze. Without this the valley is evenly lit, which
  // is the flattest a landscape can look.
  const sun = t.createRadialGradient(WW * 0.14, -WH * 0.12, 0, WW * 0.14, -WH * 0.12, WW * 1.35);
  sun.addColorStop(0, 'rgba(255,226,150,0.18)');
  sun.addColorStop(0.45, 'rgba(255,222,150,0.06)');
  sun.addColorStop(1, 'rgba(60,90,120,0.16)');
  t.fillStyle = sun; t.fillRect(0, 0, WW, WH);

  const hz = t.createLinearGradient(0, 0, 0, WH * 0.44);
  hz.addColorStop(0, 'rgba(183,211,222,0.66)');
  hz.addColorStop(0.22, 'rgba(186,210,220,0.30)');
  hz.addColorStop(0.55, 'rgba(190,212,218,0.09)');
  hz.addColorStop(1, 'rgba(196,214,218,0)');
  t.fillStyle = hz; t.fillRect(0, 0, WW, WH * 0.44);
}

// ---- cliffs ---------------------------------------------------------------
// The silhouette is a smoothed iso-contour of the rock mask, never a union of
// per-tile discs and squares. That union is what left axis-aligned corners on
// every rock mass and made the terrain read as tiles no matter how it was
// painted. Here the mask is supersampled, blurred and thresholded, so the
// outline follows an organic curve at a scale well below one tile.
let silCv = null, faceCv = null, scrCv = null, scrX = null;

function buildSilhouette() {
  const SS = 4, cell = TILE / SS;            // 5 world units per sample
  const sw = GW * SS, sh = GH * SS;
  let f = new Float32Array(sw * sh), g = new Float32Array(sw * sh);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    if (terrain[idx(gx, gy)] !== T_ROCK) continue;
    for (let j = 0; j < SS; j++) {
      const row = (gy * SS + j) * sw + gx * SS;
      for (let i = 0; i < SS; i++) f[row + i] = 1;
    }
  }
  const RB = 3, W2 = RB * 2 + 1;
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < sh; y++) {           // horizontal
      const row = y * sw;
      let acc = 0;
      for (let i = -RB; i <= RB; i++) acc += f[row + clamp(i, 0, sw - 1)];
      for (let x = 0; x < sw; x++) {
        g[row + x] = acc / W2;
        acc += f[row + Math.min(sw - 1, x + RB + 1)] - f[row + Math.max(0, x - RB)];
      }
    }
    for (let x = 0; x < sw; x++) {           // vertical
      let acc = 0;
      for (let i = -RB; i <= RB; i++) acc += g[clamp(i, 0, sh - 1) * sw + x];
      for (let y = 0; y < sh; y++) {
        f[y * sw + x] = acc / W2;
        acc += g[Math.min(sh - 1, y + RB + 1) * sw + x] - g[Math.max(0, y - RB) * sw + x];
      }
    }
  }
  const c = document.createElement('canvas');
  c.width = WW; c.height = WH;
  const x2 = c.getContext('2d');
  x2.fillStyle = '#fff';
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    if (f[y * sw + x] < 0.5) continue;
    x2.beginPath();
    x2.arc(x * cell + cell / 2, y * cell + cell / 2, cell * 0.78, 0, 6.2832);
    x2.fill();
  }
  return c;
}

// Paint into a scratch layer, then keep only what falls inside a mask. This
// is how every cliff pass is coloured, so each one shares the exact same
// organic outline.
function stencil(mask, paint) {
  if (!scrCv) {
    scrCv = document.createElement('canvas');
    scrCv.width = WW; scrCv.height = WH;
    scrX = scrCv.getContext('2d');
  }
  scrX.setTransform(1, 0, 0, 1, 0, 0);
  scrX.globalCompositeOperation = 'source-over';
  scrX.clearRect(0, 0, WW, WH);
  paint(scrX);
  scrX.globalCompositeOperation = 'destination-in';
  scrX.drawImage(mask, 0, 0);
  scrX.globalCompositeOperation = 'source-over';
  return scrCv;
}

function buildCliffs(t) {
  const rocky = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++)
    if (terrain[idx(x, y)] === T_ROCK) rocky.push([x * TILE + TILE / 2, y * TILE + TILE / 2]);
  if (!rocky.length) return;

  const CLIFF = 46 * HZ;          // face height in world units, before the squash
  silCv = buildSilhouette();

  // the face is the silhouette swept upward off the ground plane
  faceCv = document.createElement('canvas');
  faceCv.width = WW; faceCv.height = WH;
  const fx = faceCv.getContext('2d');
  for (let d = CLIFF; d >= 0; d -= 1.2) fx.drawImage(silCv, 0, -d);

  const bb = rocky.reduce((a, [x, y]) => [Math.min(a[0], x), Math.min(a[1], y),
    Math.max(a[2], x), Math.max(a[3], y)], [1e9, 1e9, -1e9, -1e9]);
  const TOPY = bb[1] - TILE - CLIFF, BOTY = bb[3] + TILE;

  // ---- the ground shadow the mass sits in ----
  t.save();
  t.shadowColor = 'rgba(20,30,16,0.50)';
  t.shadowBlur = 13; t.shadowOffsetX = WW + 5; t.shadowOffsetY = 7;
  t.drawImage(silCv, -WW, 0);
  t.restore();

  // ---- the face: dark at the foot, catching light near the lip ----
  t.drawImage(stencil(faceCv, x2 => {
    const g = x2.createLinearGradient(0, TOPY, 0, BOTY);
    g.addColorStop(0, '#8C9AA0');
    g.addColorStop(0.45, '#697880');
    g.addColorStop(1, '#3A4750');
    x2.fillStyle = g; x2.fillRect(0, 0, WW, WH);

    // Columnar jointing. Rock of this kind parts along vertical planes, and
    // that is what carries the height in the reference; a smooth grey band
    // reads as a painted wall however it is shaded.
    for (let x = bb[0] - TILE; x < bb[2] + TILE; ) {
      const w = rnd(4, 13), k = rnd(-0.22, 0.24);
      x2.fillStyle = k < 0 ? `rgba(16,24,30,${-k})` : `rgba(212,222,226,${k})`;
      x2.fillRect(x, TOPY, w, BOTY - TOPY);
      x2.fillStyle = 'rgba(12,18,24,0.34)';
      x2.fillRect(x + w - 1, TOPY, 1, BOTY - TOPY);
      x += w + rnd(0, 1.6);
    }
    // blocks that have spalled away, so the columns are not a perfect comb
    for (let i = 0; i < 420; i++) {
      const [dx, dy] = rocky[(Math.random() * rocky.length) | 0];
      const x = dx + rnd(-TILE * 0.7, TILE * 0.7), y = dy + rnd(-CLIFF, TILE * 0.4);
      x2.fillStyle = Math.random() < 0.5 ? 'rgba(16,24,30,0.24)' : 'rgba(200,212,218,0.20)';
      x2.fillRect(x, y, rnd(5, 16), rnd(6, 20));
    }
  }), 0, 0);

  // ---- the lip, a bright stone rim right under the plateau edge ----
  t.drawImage(stencil(silCv, x2 => { x2.fillStyle = '#A6B2B6'; x2.fillRect(0, 0, WW, WH); }),
    0, -CLIFF + 3);
  t.drawImage(stencil(silCv, x2 => { x2.fillStyle = '#77848A'; x2.fillRect(0, 0, WW, WH); }),
    1.4, -CLIFF + 6.5);

  // ---- the plateau, which is the same grass as the valley, only higher ----
  t.drawImage(stencil(silCv, x2 => {
    x2.fillStyle = '#6E8248'; x2.fillRect(0, 0, WW, WH);
    for (let i = 0; i < 30; i++) {
      const x = Math.random() * WW, y = Math.random() * WH, r = rnd(90, 280);
      const g = x2.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, Math.random() < 0.5 ? 'rgba(34,46,22,0.24)' : 'rgba(174,182,104,0.18)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x2.fillStyle = g; x2.beginPath(); x2.arc(x, y, r, 0, 6.2832); x2.fill();
    }
    const bt = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    for (const [dx, dy] of rocky) for (let k = 0; k < 30; k++) {
      const x = dx + rnd(-TILE * 0.8, TILE * 0.8), y = dy + rnd(-TILE * 0.8, TILE * 0.8);
      const L = fbm(x / 130, y / 130) + rnd(-0.14, 0.14);
      const ci = L < 0.40 ? 0 : L < 0.50 ? 1 : L < 0.61 ? 2 : 3;
      const h = rnd(4.5, 9), w = rnd(0.75, 1.2), p = bt[ci];
      p.moveTo(x - w, y);
      p.quadraticCurveTo(x - w * 0.4, y - h * 0.55, x + rnd(-2.2, -0.4), y - h);
      p.quadraticCurveTo(x + w * 0.6, y - h * 0.45, x + w, y);
    }
    for (let i = 0; i < 4; i++) { x2.fillStyle = GRASS[i]; x2.fill(bt[i]); }
    for (let i = 0; i < 150; i++) {      // stone breaking through the turf
      const [dx, dy] = rocky[(Math.random() * rocky.length) | 0];
      const x = dx + rnd(-11, 11), y = dy + rnd(-9, 9), r = rnd(4, 13);
      x2.fillStyle = 'rgba(120,130,134,0.52)';
      x2.beginPath(); x2.ellipse(x, y, r, r * 0.58, rnd(0, 3.1), 0, 6.2832); x2.fill();
      x2.fillStyle = 'rgba(176,186,188,0.40)';
      x2.beginPath(); x2.ellipse(x - 1, y - 1.4, r * 0.66, r * 0.36, rnd(0, 3.1), 0, 6.2832); x2.fill();
    }
  }), 0, -CLIFF);

  // ---- scree spilling out at the foot ----
  for (let i = 0; i < 800; i++) {
    const [dx, dy] = rocky[(Math.random() * rocky.length) | 0];
    const a = rnd(0, 6.2832), d = TILE * rnd(0.55, 1.6);
    const x = dx + Math.cos(a) * d, y = dy + Math.sin(a) * d * 0.8 + 5;
    const gx = (x / TILE) | 0, gy = (y / TILE) | 0;
    if (inb(gx, gy) && terrain[idx(gx, gy)] === T_ROCK) continue;
    const r = rnd(1.2, 4.4);
    t.fillStyle = 'rgba(28,36,20,0.46)';
    t.beginPath(); t.ellipse(x + 0.8, y + 1.3, r, r * 0.62, 0, 0, 6.2832); t.fill();
    t.fillStyle = Math.random() < 0.5 ? 'rgba(158,168,172,0.84)' : 'rgba(112,122,128,0.80)';
    t.beginPath(); t.ellipse(x, y, r, r * 0.62, rnd(0, 3.1), 0, 6.2832); t.fill();
  }
}
// Canopy. Trees hug the rock so they never clutter the ground units cross.
function buildTrees() {
  const nearRock = (gx, gy) => {
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      const x = gx + ox, y = gy + oy;
      if (inb(x, y) && terrain[idx(x, y)] === T_ROCK) return true;
    }
    return false;
  };
  const spots = [];
  for (let gy = 1; gy < GH - 1; gy++) for (let gx = 1; gx < GW - 1; gx++) {
    if (terrain[idx(gx, gy)] !== T_OPEN) continue;
    if (!nearRock(gx, gy)) continue;
    if (Math.random() > 0.13) continue;
    spots.push([gx * TILE + rnd(0, TILE), gy * TILE + rnd(0, TILE)]);
  }
  trees.length = 0;
  for (const [x, y] of spots) {
    const conifer = Math.random() < 0.42;
    const big = Math.random() < 0.24;
    const r = conifer ? (big ? rnd(6.5, 9.5) : rnd(4, 6.5))
                      : (big ? rnd(8, 12) : rnd(4.5, 8));
    const t = {
      x, y, r, conifer,
      h: conifer ? r * rnd(2.6, 3.4) : r * rnd(1.6, 2.2),
      lean: rnd(-0.14, 0.14),
      out: [],   // crown silhouette in units of r, y negative is up
    };
    // No discs and no clean triangles. Each crown gets its own ragged
    // outline, so no two trees share a shape and none of them reads as a
    // geometric primitive.
    if (conifer) {
      const TOP = -rnd(4.6, 6.2), BASE = rnd(0.35, 0.75);
      const steps = 5 + ((Math.random() * 4) | 0);
      const half = [];
      for (let i = 0; i <= steps; i++) {
        const f = i / steps;
        const yy = BASE + (TOP - BASE) * f;
        const wid = Math.pow(1 - f, 0.78) * rnd(1.0, 1.28);
        half.push([wid, yy]);                                  // branch tip
        half.push([wid * rnd(0.30, 0.5), yy + (TOP - BASE) / steps * rnd(0.42, 0.68)]);
      }
      const tip = [rnd(-0.09, 0.09), TOP - rnd(0.1, 0.5)];
      for (let i = 0; i < half.length; i++) t.out.push([-half[i][0], half[i][1]]);
      t.out.push(tip);
      for (let i = half.length - 1; i >= 0; i--) t.out.push([half[i][0], half[i][1]]);
    } else {
      const n = 15 + ((Math.random() * 6) | 0);
      const p1 = rnd(0, 6.28), p2 = rnd(0, 6.28), p3 = rnd(0, 6.28);
      const notch = new Set();
      for (let i = 0; i < 3; i++) notch.add((Math.random() * n) | 0);
      for (let i = 0; i < n; i++) {
        const a2 = (i / n) * 6.2832;
        let rad = 1.16 + 0.26 * Math.sin(3 * a2 + p1) + 0.17 * Math.sin(5 * a2 + p2)
                       + 0.11 * Math.sin(8 * a2 + p3) + rnd(-0.10, 0.10);
        if (notch.has(i)) rad *= rnd(0.52, 0.70);
        t.out.push([Math.cos(a2) * rad * 1.06, Math.sin(a2) * rad * 0.88 - 0.55]);
      }
    }
    trees.push(t);
  }
}

// The crown is one ragged closed silhouette, drawn four times at shrinking
// scales so the sun side reads against the shade. Shrinking about the crown
// centre keeps every pass the same shape, which is what makes the lighting
// look like one object rather than stacked stamps.
function foliage(t, dx, dy, k, col) {
  const o = t.out, r = t.r;
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < o.length; i++) {
    const x = dx + o[i][0] * r * k, y = dy + o[i][1] * r * k;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}
function drawTree(t) {
  const th = t.h * HZ, lx = t.lean * t.h;

  // the shadow takes the shape of the crown, thrown away from the sun
  ctx.save();
  ctx.translate(t.x + t.h * 0.36, t.y + 1);
  ctx.scale(1, 0.40);
  ctx.globalAlpha = 0.32;
  foliage(t, 0, 0, 1.04, '#1C2210');
  ctx.globalAlpha = 1;
  ctx.restore();

  // tapered trunk, leaning with the crown
  ctx.fillStyle = '#2B2417';
  ctx.beginPath();
  ctx.moveTo(t.x - t.r * 0.17, t.y);
  ctx.lineTo(t.x + t.r * 0.17, t.y);
  ctx.lineTo(t.x + lx + t.r * 0.075, t.y - th * 0.88);
  ctx.lineTo(t.x + lx - t.r * 0.075, t.y - th * 0.88);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#463A25';
  ctx.beginPath();
  ctx.moveTo(t.x - t.r * 0.17, t.y);
  ctx.lineTo(t.x - t.r * 0.06, t.y);
  ctx.lineTo(t.x + lx - t.r * 0.02, t.y - th * 0.88);
  ctx.lineTo(t.x + lx - t.r * 0.075, t.y - th * 0.88);
  ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.translate(t.x + lx, t.y - th);
  ctx.scale(1, HZ);
  foliage(t, 0, 0, 1.0, '#1E2718');
  foliage(t, -t.r * 0.10, -t.r * 0.12, 0.93, '#2C3A22');
  foliage(t, -t.r * 0.24, -t.r * 0.30, 0.80, '#3E4E2C');
  foliage(t, -t.r * 0.40, -t.r * 0.52, 0.60, '#556438');
  ctx.restore();
}

// Ground furniture. Without this the plain reads as an empty board.
function buildProps(t) {
  const open = (x, y) => inb(x, y) && terrain[idx(x, y)] === T_OPEN;

  // scattered rubble and old equipment shadows
  for (let i = 0; i < 260; i++) {
    const gx = (rnd(1, GW - 1)) | 0, gy = (rnd(1, GH - 1)) | 0;
    if (!open(gx, gy)) continue;
    const x = gx * TILE + rnd(0, TILE), y = gy * TILE + rnd(0, TILE);
    t.fillStyle = Math.random() < 0.55 ? 'rgba(52,48,38,0.30)' : 'rgba(238,230,208,0.22)';
    t.beginPath();
    const n = 3 + ((Math.random() * 3) | 0), rr = rnd(2, 7);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 6.2832, r2 = rr * rnd(0.55, 1.2);
      k ? t.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2 * 0.7)
        : t.moveTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2 * 0.7);
    }
    t.closePath(); t.fill();
  }

  // painted survey blocks: dashed outlines with a corner tick
  for (let i = 0; i < 26; i++) {
    const gx = (rnd(2, GW - 10)) | 0, gy = (rnd(2, GH - 8)) | 0;
    const w = 3 + ((Math.random() * 5) | 0), h = 2 + ((Math.random() * 4) | 0);
    let clear = true;
    for (let y = gy; y < gy + h; y++) for (let x = gx; x < gx + w; x++) if (!open(x, y)) clear = false;
    if (!clear) continue;
    t.save();
    t.strokeStyle = 'rgba(226,178,40,0.30)'; t.lineWidth = 1.4; t.setLineDash([6, 7]);
    t.strokeRect(gx * TILE + 4, gy * TILE + 4, w * TILE - 8, h * TILE - 8);
    t.setLineDash([]);
    t.strokeStyle = 'rgba(226,178,40,0.5)'; t.lineWidth = 1.6;
    const bx = gx * TILE + 4, by = gy * TILE + 4;
    t.beginPath(); t.moveTo(bx + 9, by); t.lineTo(bx, by); t.lineTo(bx, by + 9); t.stroke();
    t.restore();
  }

  // hazard chevrons at each gate mouth
  for (const g of GATES) {
    for (let k = -2; k <= 2; k++) {
      const x = (g.x + k) * TILE + TILE / 2;
      t.strokeStyle = 'rgba(214,166,32,0.34)'; t.lineWidth = 3.2;
      for (let i = 0; i < 3; i++) {
        const y = (g.y - 3 + i * 2) * TILE;
        t.beginPath();
        t.moveTo(x - 6, y); t.lineTo(x, y + 7); t.lineTo(x + 6, y);
        t.stroke();
      }
    }
  }

  // pipe runs snaking across open ground
  for (let i = 0; i < 9; i++) {
    let x = (rnd(3, GW - 4)) | 0, y = (rnd(3, GH - 4)) | 0;
    if (!open(x, y)) continue;
    t.strokeStyle = 'rgba(70,66,56,0.16)'; t.lineWidth = 3.5;
    t.beginPath(); t.moveTo(x * TILE, y * TILE);
    for (let k = 0; k < 14; k++) {
      const horiz = Math.random() < 0.5;
      const nx = horiz ? x + (Math.random() < 0.5 ? -3 : 3) : x;
      const ny = horiz ? y : y + (Math.random() < 0.5 ? -3 : 3);
      if (!open(nx, ny)) break;
      x = nx; y = ny; t.lineTo(x * TILE, y * TILE);
    }
    t.stroke();
  }
}

// ============================================================================
// Map generation - three approach corridors converging on the hub
// ============================================================================
const SPAWNS = [], GATES = [];
function buildMap() {
  // Open field first. The swarm must arrive as a mass, not a queue, so the
  // approach lanes are wide and the ground near the hub is a broad plain.
  terrain.fill(T_OPEN);
  const hx = (GW / 2) | 0, hy = (GH * 0.80) | 0;

  // ---- landforms ----------------------------------------------------
  // Rock goes down as thick organic mesas, never as thin ribbons. A ridge
  // one or two tiles wide renders as a hedge; a mass eight to fourteen
  // tiles across renders as a cliff with a plateau on top, which is the
  // entire reason the camera is tilted.
  const mesa = (pts, th, seed) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 1.6));
      for (let k = 0; k <= steps; k++) {
        const u = k / steps, x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u;
        blob(x, y, th * (0.62 + 0.72 * vn(x * 0.17 + seed, y * 0.17 + seed)));
      }
    }
  };

  // two long spurs running toward the camera split the far ground into
  // three approach lanes
  mesa([[GW * 0.30, 3], [GW * 0.33, 16], [GW * 0.28, 30],
        [GW * 0.34, 44], [GW * 0.31, GH * 0.56]], 4.8, 11.3);
  mesa([[GW * 0.70, 3], [GW * 0.67, 15], [GW * 0.73, 29],
        [GW * 0.66, 43], [GW * 0.70, GH * 0.56]], 4.8, 57.9);

  // a far pass, so each lane squeezes once before it opens out again
  mesa([[GW * 0.04, GH * 0.21], [GW * 0.18, GH * 0.24], [GW * 0.25, GH * 0.19]], 5.0, 3.1);
  mesa([[GW * 0.42, GH * 0.23], [GW * 0.57, GH * 0.19]], 4.8, 21.7);
  mesa([[GW * 0.77, GH * 0.20], [GW * 0.95, GH * 0.24]], 5.0, 44.5);

  // freestanding outcrops so the plain is not a board
  for (let i = 0; i < 14; i++) {
    const px = rnd(5, GW - 6), py = rnd(4, GH * 0.58);
    mesa([[px, py], [px + rnd(-6, 6), py + rnd(-4, 4)]], rnd(2.6, 4.6), i * 7.7);
  }

  // A curtain wall closes off the inner ground, pierced by exactly three
  // gates. Those gates are the defensible line the player starts from; the
  // crystal sits outside them, which is the whole tension of the map.
  const GATE_Y = (GH * 0.63) | 0;
  for (let x = 0; x < GW; x++) {
    const th = 3.2 + vn(x * 0.12, 5.5) * 5.4;
    const y0 = GATE_Y - Math.round(th * 0.45), y1 = GATE_Y + Math.round(th);
    for (let y = y0; y < y1; y++) if (inb(x, y)) terrain[idx(x, y)] = T_ROCK;
  }
  const laneX = [(GW * 0.16) | 0, (GW * 0.5) | 0, (GW * 0.84) | 0];
  GATES.length = 0;
  for (const gx of laneX) {
    for (let x = gx - 3; x <= gx + 3; x++)
      for (let y = GATE_Y - 7; y < GATE_Y + 9; y++)
        if (inb(x, y)) terrain[idx(x, y)] = T_OPEN;
    GATES.push({ x: gx, y: GATE_Y + 3 });
  }

  // the held ground in front of the camera
  for (let y = GATE_Y + 9; y < GH - 2; y++)
    for (let x = 2; x < GW - 2; x++) terrain[idx(x, y)] = T_OPEN;
  carveDisc(hx, hy, 11);

  for (const lx of laneX) SPAWNS.push({ x: lx, y: 1 });
  for (const sp of SPAWNS) carveDisc(sp.x, sp.y + 2, 5);

  // hard border
  for (let x = 0; x < GW; x++) { terrain[idx(x, 0)] = T_ROCK; terrain[idx(x, GH - 1)] = T_ROCK; }
  for (let y = 0; y < GH; y++) { terrain[idx(GW - 1, y)] = T_ROCK; terrain[idx(0, y)] = T_ROCK; }
  for (const sp of SPAWNS) for (let d = -3; d <= 3; d++)
    if (inb(sp.x + d, 1)) terrain[idx(sp.x + d, 1)] = T_OPEN;

  // One safe node behind the gates. Everything else is beyond them, so
  // growing the economy means holding ground you would rather not hold.
  placeNode(hx - 6, hy - 5);
  let placed = 0, tries = 0;
  while (placed < 7 && tries++ < 6000) {
    const x = (rnd(4, GW - 4)) | 0, y = (rnd(3, GATE_Y - 3)) | 0;
    if (terrain[idx(x, y)] !== T_OPEN) continue;
    let near = false;
    for (const n of nodes) if (Math.hypot(n.x - x, n.y - y) < 7) near = true;
    if (near) continue;
    placeNode(x, y); placed++;
  }

  hub = mkBuilding('hub', hx - 1, hy - 1);

  // guarantee every lane actually reaches the hub; random rock can seal one
  computeFlow();
  for (const s of SPAWNS) {
    let guard = 0;
    while (!isFinite(dist[idx(s.x, s.y + 1)]) && guard++ < 40) {
      let cx = s.x, cy = s.y + 1;
      while (Math.hypot(cx - hx, cy - hy) > 6) {
        carveDisc(cx, cy, 3.2);
        const dx = hx - cx, dy = hy - cy, m = Math.hypot(dx, dy) || 1;
        cx = clamp(cx + dx / m * 2, 1, GW - 2);
        cy = clamp(cy + dy / m * 2, 1, GH - 2);
      }
      computeFlow();
    }
  }
  return { hx, hy };
}
const nodes = [];
function placeNode(x, y) {
  x |= 0; y |= 0;
  if (!inb(x, y)) return;
  terrain[idx(x, y)] = T_NODE;
  nodes.push({ x, y });
}
function blob(cx, cy, r) {
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= cy + r; y++)
    for (let x = Math.floor(cx - r); x <= cx + r; x++) {
      if (!inb(x, y)) continue;
      if ((x - cx) ** 2 + (y - cy) ** 2 <= r2) terrain[idx(x, y)] = T_ROCK;
    }
}
function carveDisc(cx, cy, r) {
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= cy + r; y++)
    for (let x = Math.floor(cx - r); x <= cx + r; x++) {
      if (!inb(x, y)) continue;
      if ((x - cx) ** 2 + (y - cy) ** 2 <= r2 && terrain[idx(x, y)] === T_ROCK)
        terrain[idx(x, y)] = T_OPEN;
    }
}

function mkBuilding(type, gx, gy) {
  const d = type === 'hub' ? null : DEFS[type];
  const b = {
    type, gx, gy, tier: 0, dead: false,
    x: gx * TILE + TILE / 2, y: gy * TILE + TILE / 2,
    hp: type === 'hub' ? 9000 : d.hp[0], hpMax: type === 'hub' ? 9000 : d.hp[0],
    heat: 0, cd: 0, powered: type === 'hub', aim: 0, recoil: 0,
    deploy: (d && d.deploy) ? d.deploy : 0, deployMax: (d && d.deploy) ? d.deploy : 0,
    crew: [], flash: 0,
  };
  if (d && d.crew) refillCrew(b);
  const fw = d ? (d.w || 1) : 3, fh = d ? (d.h || 1) : 3;
  b.w = fw; b.h = fh;
  b.x = (gx + fw / 2) * TILE; b.y = (gy + fh / 2) * TILE;
  buildings.push(b);
  const ix = buildings.length - 1;
  for (let oy = 0; oy < fh; oy++) for (let ox = 0; ox < fw; ox++)
    if (inb(gx + ox, gy + oy)) buildAt[idx(gx + ox, gy + oy)] = ix;
  flowDirty = true;
  stampPad(b);
  return b;
}
function refillCrew(b) {
  const d = DEFS[b.type];
  const want = d.crew[b.tier];
  const rad = TILE * 0.24 * (d.w || 1);
  while (b.crew.length < want) {
    const a = (b.crew.length / want) * Math.PI * 2;
    b.crew.push({
      ox: Math.cos(a) * rad, oy: Math.sin(a) * rad,
      cd: Math.random() * 0.4, aim: 0, flash: 0, alive: true, respawn: 0,
    });
  }
}
function buildingCost(type, tier) { return DEFS[type].cost[tier]; }

function canPlace(type, gx, gy) {
  const d = DEFS[type], fw = d.w || 1, fh = d.h || 1;
  let onNode = false;
  for (let oy = 0; oy < fh; oy++) for (let ox = 0; ox < fw; ox++) {
    const x = gx + ox, y = gy + oy;
    if (!inb(x, y)) return false;
    const i = idx(x, y), t = terrain[i];
    if (t === T_ROCK) return false;
    if (t === T_NODE) onNode = true;
    if (buildAt[i] >= 0) return false;
    if (blight[i] > 0.25) return false;
  }
  if (d.onNode && !onNode) return false;
  if (!d.onNode && onNode) return false;
  return true;
}
function tryPlace(type, gx, gy) {
  if (!canPlace(type, gx, gy)) return false;
  const [cs, cc] = buildingCost(type, 0);
  if (supply < cs || crystal < cc) { log('자원 부족', 'bad'); return false; }
  supply -= cs; crystal -= cc;
  mkBuilding(type, gx, gy);
  return true;
}
function upgrade(b) {
  if (b.type === 'hub') return;
  const d = DEFS[b.type];
  if (b.tier >= 2) return;
  const [cs, cc] = d.cost[b.tier + 1];
  if (supply < cs || crystal < cc) { log('강화 자원 부족', 'bad'); return; }
  supply -= cs; crystal -= cc;
  const frac = b.hp / b.hpMax;
  b.tier++;
  b.hpMax = d.hp[b.tier]; b.hp = b.hpMax * Math.max(frac, 0.55);
  if (d.crew) refillCrew(b);
  if (d.deploy) { b.deploy = d.deploy * 0.5; b.deployMax = d.deploy; }
  flowDirty = true;
  log(`${d.name} → 등급 ${b.tier + 1}`, 'hot');
}
function sell(b) {
  if (b.type === 'hub') return;
  const d = DEFS[b.type];
  let s = 0, c = 0;
  for (let t = 0; t <= b.tier; t++) { s += d.cost[t][0]; c += d.cost[t][1]; }
  supply += (s * 0.5) | 0; crystal += (c * 0.5) | 0;
  killBuilding(b);
}
function killBuilding(b) {
  b.dead = true;
  for (let oy = 0; oy < (b.h || 1); oy++) for (let ox = 0; ox < (b.w || 1); ox++)
    if (inb(b.gx + ox, b.gy + oy)) buildAt[idx(b.gx + ox, b.gy + oy)] = -1;
  flowDirty = true;
  if (selected === b) { selected = null; refreshInsp(); }
}

// power propagation from hub + generators
function recalcPower() {
  for (const b of buildings) {
    if (b.dead || b.type === 'hub') continue;
    const d = DEFS[b.type];
    if (!d.power) { b.powered = true; continue; }
    let ok = Math.hypot(b.gx - hub.gx, b.gy - hub.gy) <= 10.5;
    if (!ok) for (const g of buildings) {
      if (g.dead || g.type !== 'gen') continue;
      if (Math.hypot(b.gx - g.gx, b.gy - g.gy) <= DEFS.gen.powerR[g.tier]) { ok = true; break; }
    }
    b.powered = ok;
  }
}

// ============================================================================
// Flow field - Dijkstra from the hub. Walls are passable at a high cost, so
// the swarm routes around them when it is cheaper and chews through when it
// is not. That single rule gives "attack only what blocks you".
// ============================================================================
const heapV = new Float64Array(GW * GH), heapI = new Int32Array(GW * GH);
let heapN = 0;
function hpush(v, i) {
  let n = heapN++; heapV[n] = v; heapI[n] = i;
  while (n > 0) { const p = (n - 1) >> 1; if (heapV[p] <= heapV[n]) break;
    const tv = heapV[p], ti = heapI[p]; heapV[p] = heapV[n]; heapI[p] = heapI[n];
    heapV[n] = tv; heapI[n] = ti; n = p; }

// ============================================================================
// Spatial hash
// ============================================================================
const CELL = 34, HW = Math.ceil(WW / CELL), HH = Math.ceil(WH / CELL);

  for (const f of foes) {
    if (f.dead) continue;
    const cx = clamp((f.x / CELL) | 0, 0, HW - 1), cy = clamp((f.y / CELL) | 0, 0, HH - 1);

  const y0 = clamp(((y - r) / CELL) | 0, 0, HH - 1), y1 = clamp(((y + r) / CELL) | 0, 0, HH - 1);
  const r2 = r * r;

    const arr = hash[cy * HW + cx];
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      if ((f.x - x) ** 2 + (f.y - y) ** 2 <= r2) out.push(f);
    }

}

// ============================================================================
// Waves
// ============================================================================
function waveComp(n) {
  const q = [];
  const push = (t, c) => { for (let i = 0; i < c; i++) q.push(t); };
  push('scurry', Math.round(11 + n * 6.4 + n * n * 0.34));
  if (n >= 3) push('drifter', Math.round(3 + n * 2.6 + n * n * 0.09));
  if (n >= 5) push('crawler', Math.round(2 + (n - 4) * 1.5));
  if (n >= 7) push('rammer', Math.round(1 + (n - 6) * 1.1));
  if (n >= 11) push('brute', Math.round(1 + (n - 10) * 0.55));
  for (let i = q.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = q[i]; q[i] = q[j]; q[j] = t; }
  return q;
}
function startWave() {
  if (phase !== 'prep') return;
  const bonus = Math.round(prepLeft * 8);
  if (bonus > 0) { supply += bonus; log(`조기 소집 보너스 +${bonus} 물자`, 'hot'); }
  wave++;
  spawnQueue = waveComp(wave);
  waveTotal = spawnQueue.length;
  spawnTimer = 0;
  phase = 'wave';
  log(`웨이브 ${wave} — 개체 ${spawnQueue.length}`, 'hot');
  // a new spire is planted every few waves
  if (wave % 4 === 0) plantSpire();
  syncUI();
}
function endWave() {
  phase = 'prep';
  prepMax = prepLeft = 26;
  log(`웨이브 ${wave} 종료 · 구역 확보`, 'hot');
  syncUI();
}
function plantSpire() {
  let best = null, bestD = -1;
  for (let t = 0; t < 400; t++) {
    const x = (rnd(2, GW - 3)) | 0, y = (rnd(2, GH - 3)) | 0;
    if (terrain[idx(x, y)] !== T_OPEN || buildAt[idx(x, y)] >= 0) continue;
    const d = Math.hypot(x - hub.gx, y - hub.gy);
    if (d < 14) continue;
    if (d > bestD && d < 40) { bestD = d; best = { x, y }; }
  }
  if (!best) return;
  spawnFoe('spire', best.x, best.y);
  const f = foes[foes.length - 1];
  f.x = best.x * TILE + TILE / 2; f.y = best.y * TILE + TILE / 2;
  f.hp = f.hpMax = 900 + wave * 130;

// ============================================================================
// Spawning + creature update
// ============================================================================
function spawnFoe(type, gx, gy, fromSpire) {
  const d = FOES[type];
  const scale = 1 + Math.max(0, wave - 6) * 0.055;
  foes.push({
    type, x: gx * TILE + TILE / 2 + rnd(-8, 8), y: gy * TILE + TILE / 2 + rnd(-8, 8),
    vx: 0, vy: 0, hp: d.hp * scale, hpMax: d.hp * scale, dead: false, brood: !!fromSpire,
    cd: rnd(0, 0.5), face: 0, hitT: 0, wob: Math.random() * 6.28,

const tmp = [];
function isRock(wx, wy) {

}
function updateFoes(dt) {
  for (let i = 0; i < foes.length; i++) {
    const f = foes[i];
    if (f.dead) continue;
    const d = FOES[f.type];
    f.hitT = Math.max(0, f.hitT - dt);
    f.cd -= dt;

    // static creatures do not path; they seed the ground and vent broods
    if (d.static) {
      f.age = (f.age || 0) + dt;
      f.spawnCd = (f.spawnCd || 0) - dt;
      if (phase === 'wave' && f.spawnCd <= 0) {
        f.spawnCd = Math.max(0.8, 2.6 - wave * 0.05);
        let brood = 0;
        for (const o of foes) if (!o.dead && o.brood) brood++;
        if (brood < 70) spawnFoe('scurry', (f.x / TILE) | 0, (f.y / TILE) | 0, true);
      }
      continue;
    }

    const gx = clamp((f.x / TILE) | 0, 0, GW - 1), gy = clamp((f.y / TILE) | 0, 0, GH - 1);
    const here = idx(gx, gy);
    const nx = nextIdx[here];

    // target the structure standing in the way
    let blockB = null;
    if (nx >= 0) {
      const bi = buildAt[nx];
      if (bi >= 0 && buildings[bi] && !buildings[bi].dead) blockB = buildings[bi];
    }
    const bHere = buildAt[here] >= 0 ? buildings[buildAt[here]] : null;
    if (bHere && !bHere.dead && bHere.type !== 'hub') blockB = bHere;

    if (blockB) {
      const ddx = blockB.x - f.x, ddy = blockB.y - f.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd < TILE * 0.85 + d.r) {
        f.face = Math.atan2(ddy, ddx);
        if (f.cd <= 0) {
          f.cd = d.atk;
          const mult = blockB.type === 'wall' ? d.wall : 1;
          damageBuilding(blockB, d.dmg * mult);
          burst(f.x + Math.cos(f.face) * d.r, f.y + Math.sin(f.face) * d.r, 3, '#c9a06a', 40);
        }
        f.vx *= 0.7; f.vy *= 0.7;
        f.x += f.vx * dt; f.y += f.vy * dt;
        continue;
      }
    }

    // steer along the flow field
    let tx = hub.x, ty = hub.y;
    if (nx >= 0) { tx = (nx % GW) * TILE + TILE / 2; ty = ((nx / GW) | 0) * TILE + TILE / 2; }
    let dx = tx - f.x, dy = ty - f.y;
    let m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;

function hurtFoe(f, amount, kx, ky) {

// ============================================================================
// Firing
// ============================================================================
function pickTarget(x, y, range, minRange) {

function updateBuildings(dt) {
  for (const b of buildings) {
    if (b.dead) continue;
    const d = DEFS[b.type];
    b.flash = Math.max(0, b.flash - dt * 7);
    b.recoil = Math.max(0, b.recoil - dt * 5.5);
    if (b.type === 'hub') {
      // the hub is not helpless, but it is the last thing standing
      b.cd -= dt;
      const ht = pickTarget(b.x, b.y, 7.5);
      if (ht) {
        b.aim = Math.atan2(ht.y - b.y, ht.x - b.x);
        if (b.cd <= 0) { b.cd = 0.16; b.flash = 1; fire('tracer', b.x, b.y, ht, 14); }
      }
      continue;
    }

    if (b.deploy > 0) { b.deploy -= dt; continue; }

    if (d.yield) {
      if (b.powered) crystal += d.yield[b.tier] * dt;
      continue;
    }
    if (!d.range) continue;
    if (d.power && !b.powered) continue;

    // ---- garrison posts: every soldier fires on their own ----
    if (d.crew) {
      const want = d.crew[b.tier];
      for (const s of b.crew) {
        if (!s.alive) { s.respawn -= dt; if (s.respawn <= 0 && supply >= 12) { supply -= 12; s.alive = true; } continue; }
        s.flash = Math.max(0, s.flash - dt * 9);
        s.cd -= dt;
        const sx = b.x + s.ox, sy = b.y + s.oy;
        const t = pickTarget(sx, sy, d.range[b.tier]);
        if (!t) continue;
        s.aim = Math.atan2(t.y - sy, t.x - sx);
        if (s.cd > 0) continue;
        s.cd = d.rof[b.tier] * rnd(0.85, 1.15);
        s.flash = 1;
        if (d.crewKind === 'flame') {
          coneHit(sx, sy, s.aim, d.range[b.tier] * TILE, 0.42, d.dmg[b.tier], d.burnsBlight);
          for (let i = 0; i < 3; i++) flameParticle(sx, sy, s.aim, d.range[b.tier] * TILE);
        } else {
          fire('tracer', sx, sy, t, d.dmg[b.tier]);
          shellEject(sx, sy, s.aim);
        }
      }
      while (b.crew.length < want) refillCrew(b);
      continue;
    }

    // ---- machines ----
    b.cd -= dt;
    if (d.heatUp) {
      if (b.heat >= 1) { b.heat -= d.heatDown[b.tier] * dt; if (b.heat > 0.28) continue; b.heat = 0.27; }
      else b.heat = Math.max(0, b.heat - d.heatDown[b.tier] * 0.55 * dt);
    }

    if (!t) continue;
    b.aim = Math.atan2(t.y - b.y, t.x - b.x);
    if (b.cd > 0) continue;
    b.cd = d.rof[b.tier];
    b.flash = 1; b.recoil = 1;
    if (d.heatUp) b.heat = Math.min(1, b.heat + d.heatUp[b.tier] * 8);

    if (d.proj === 'mortar') {
      fireMortar(b.x, b.y, t.x, t.y, d.dmg[b.tier], d.splash[b.tier] * TILE);
      shake = Math.min(8, shake + 0.5);

function coneHit(x, y, ang, len, halfArc, dmg, burns) {
  nearFoes(x, y, len, tmp);
  for (let i = 0; i < tmp.length; i++) {
    const f = tmp[i]; if (f.dead) continue;
    let a = Math.atan2(f.y - y, f.x - x) - ang;

// ============================================================================
// Projectiles
// ============================================================================
function fire(kind, x, y, target, dmg) {

}

}

  projs.push({ kind: 'rail', x, y, ex, ey, life: 0.34, max: 0.34 });
  // instant piercing hit along the beam
  const steps = (len / 7) | 0;

    const px = x + Math.cos(ang) * i * 7, py = y + Math.sin(ang) * i * 7;
    nearFoes(px, py, 13, tmp);
    for (let k = 0; k < tmp.length; k++) {

      seen.add(f);

      const dx = p.t.x - p.x, dy = p.t.y - p.y, m = Math.hypot(dx, dy) || 1;
      const step = p.spd * dt;

        projs.splice(i, 1); continue;
      }
      p.x += dx / m * step; p.y += dy / m * step;
      if (p.life <= 0) projs.splice(i, 1);
    } else if (p.kind === 'mortar') {
      if (p.life <= 0) {
        nearFoes(p.tx, p.ty, p.splash, tmp);
        for (let k = 0; k < tmp.length; k++) {
          const f = tmp[k]; if (f.dead) continue;
          const d = Math.hypot(f.x - p.tx, f.y - p.ty);
          const fall = 1 - d / p.splash;
          hurtFoe(f, p.dmg * Math.max(0.25, fall), (f.x - p.tx) / (d || 1) * 4, (f.y - p.ty) / (d || 1) * 4);
        }
        burst(p.tx, p.ty, 26, '#ffb257', 190);
        scorch(p.tx, p.ty, p.splash * 0.8);
        shake = Math.min(10, shake + 2);
        projs.splice(i, 1);
      }
    } else if (p.life <= 0) projs.splice(i, 1);
  }
}

// Particles + persistent ground decals
// ============================================================================
function burst(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) {
    if (parts.length > 1600) break;
    const a = Math.random() * 6.2832, s = rnd(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.18, 0.5), max: 0.5, col, r: rnd(1, 2.4) });
  }
}
function flameParticle(x, y, ang, len) {
  if (parts.length > 1600) return;
  const a = ang + rnd(-0.38, 0.38), s = rnd(len * 1.1, len * 2.0);
  parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.16, 0.3), max: 0.3,
    col: Math.random() < 0.4 ? '#ffd07a' : '#ff8a2c', r: rnd(2, 4.6) });
}
function shellEject(x, y, ang) {
  if (parts.length > 1600) return;
  const a = ang + Math.PI / 2 + rnd(-0.3, 0.3);
  parts.push({ x, y, vx: Math.cos(a) * 55, vy: Math.sin(a) * 55, life: 0.45, max: 0.45, col: C.shell, r: 0.9 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.88; p.vy *= 0.88;
  }

// persistent ground layer: corpses, scorch marks. Drawn once, never cleared.
const gc = document.createElement('canvas');
gc.width = WW; gc.height = WH;
const gx2 = gc.getContext('2d');

function stampPad(b) {
  const fw = b.w || 1, fh = b.h || 1;
  const px = b.gx * TILE, py = b.gy * TILE;
  const W = fw * TILE, H = fh * TILE;
  const m = b.type === 'hub' ? 7 : 4;
  const g = gx2;
  g.save();
  g.globalAlpha = 0.62;
  g.fillStyle = '#9B927C';
  padPath(g, px - m, py - m, W + m * 2, H + m * 2, 7);
  g.fill();
  g.globalAlpha = 0.5;
  g.strokeStyle = '#6E6653'; g.lineWidth = 1.4;
  padPath(g, px - m, py - m, W + m * 2, H + m * 2, 7);
  g.stroke();
  // expansion joints and scuffing
  g.globalAlpha = 0.28; g.strokeStyle = '#5E5745'; g.lineWidth = 1;
  g.beginPath();
  for (let i = 1; i < fw + 1; i++) {
    g.moveTo(px - m + i * TILE, py - m); g.lineTo(px - m + i * TILE, py + H + m);
  }
  for (let i = 1; i < fh + 1; i++) {
    g.moveTo(px - m, py - m + i * TILE); g.lineTo(px + W + m, py - m + i * TILE);
  }
  g.stroke();
  g.globalAlpha = 0.16; g.fillStyle = '#3A3529';
  for (let i = 0; i < 14; i++) {
    g.beginPath();
    g.ellipse(px + rnd(-m, W + m), py + rnd(-m, H + m), rnd(2, 7), rnd(1.5, 4), rnd(0, 3), 0, 6.2832);
    g.fill();
  }
  g.restore();
}
function padPath(g, x, y, w, h, c) {
  g.beginPath();
  g.moveTo(x + c, y); g.lineTo(x + w - c, y); g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - c); g.lineTo(x + w - c, y + h); g.lineTo(x + c, y + h);
  g.lineTo(x, y + h - c); g.lineTo(x, y + c); g.closePath();
}

function corpse(x, y, r, col) {
  gx2.globalAlpha = 0.62;
  gx2.fillStyle = '#4A4436';
  gx2.beginPath();
  gx2.ellipse(x, y, r * rnd(0.8, 1.25), r * rnd(0.5, 0.85), Math.random() * 3.14, 0, 6.2832);
  gx2.fill();
  gx2.globalAlpha = 0.16; gx2.fillStyle = '#1B6A62';
  gx2.beginPath(); gx2.ellipse(x + rnd(-3, 3), y + rnd(-3, 3), r * 1.35, r * 1.0, 0, 0, 6.2832); gx2.fill();
  gx2.globalAlpha = 1;
}
function scorch(x, y, r) {
  gx2.globalAlpha = 0.30; gx2.fillStyle = '#2A241A';
  gx2.beginPath(); gx2.arc(x, y, r * 0.72, 0, 6.2832); gx2.fill();
  gx2.globalAlpha = 1;
}

// ============================================================================
// Blight
// ============================================================================
let blightTick = 0;
function updateBlight(dt) {
  blightTick -= dt;
  if (blightTick > 0) return;
  blightTick = 0.5;
  for (const s of foes) {
    if (s.dead || !FOES[s.type].static) continue;
    const sgx = (s.x / TILE) | 0, sgy = (s.y / TILE) | 0;
    const R = 3 + Math.min(10, (s.age || 0) * 0.12);
    for (let y = Math.max(1, (sgy - R) | 0); y <= Math.min(GH - 2, sgy + R); y++)
      for (let x = Math.max(1, (sgx - R) | 0); x <= Math.min(GW - 2, sgx + R); x++) {
        if (terrain[idx(x, y)] === T_ROCK) continue;
        const d = Math.hypot(x - sgx, y - sgy);
        if (d > R) continue;
        blight[idx(x, y)] = Math.min(1, blight[idx(x, y)] + 0.05 * (1 - d / R));
      }
  }
  let n = 0, tot = 0;
  for (let i = 0; i < blight.length; i++) { if (terrain[i] !== T_ROCK) { tot++; if (blight[i] > 0.25) n++; } }
  blightPct = tot ? n / tot : 0;
}

// ============================================================================
// Main loop
// ============================================================================
function step(dt) {
  elapsed += dt;
  if (flowDirty) computeFlow();
  recalcPower();
  supply += 3.4 * dt;

  rehash();
  updateBuildings(dt);
  updateFoes(dt);
  updateProjs(dt);
  updateParts(dt);
  updateBlight(dt);

  if (phase === 'prep') {
    prepLeft = Math.max(0, prepLeft - dt);
    if (prepLeft <= 0) startWave();
  } else if (phase === 'wave') {
    spawnTimer -= dt;
    if (spawnQueue.length && spawnTimer <= 0) {
      // density spikes toward the tail of a wave
      const prog = 1 - spawnQueue.length / Math.max(1, waveTotal);
      // late in a wave the density spikes, so every wave ends on the back foot
      spawnTimer = clamp(0.26 - wave * 0.007, 0.035, 0.26) * (prog > 0.7 ? 0.35 : 1);
      const n = (prog > 0.7 ? 4 : 2) + ((wave / 6) | 0);
      for (let i = 0; i < n && spawnQueue.length; i++) {
        const s = SPAWNS[(Math.random() * SPAWNS.length) | 0];
        spawnFoe(spawnQueue.pop(), s.x, s.y);
      }
    }
    if (!spawnQueue.length) {
      // spires are terrain, not part of the wave count
      let alive = 0;
      for (const f of foes) if (!f.dead && !f.brood && !FOES[f.type].static) alive++;
      if (alive === 0) endWave();
    }
  }

  foes = foes.filter(f => !f.dead || Math.random() > 0.35);
  windA += dt * 0.05;
  const wx = Math.cos(windA) * windS, wy = Math.sin(windA * 0.7) * windS * 0.35;
  for (const m of motes) {
    m.x += wx * m.z * dt; m.y += wy * m.z * dt;
    if (m.x < 0) m.x += WW; else if (m.x > WW) m.x -= WW;
    if (m.y < 0) m.y += WH; else if (m.y > WH) m.y -= WH;
  }
  shake = Math.max(0, shake - dt * 14);
  if (flowRefresh -= dt, flowRefresh <= 0) { flowRefresh = 0.7; flowDirty = true; }
}
let flowRefresh = 0.7;

function die() {
  phase = 'dead';
  document.getElementById('over').style.display = 'flex';
  document.getElementById('oStat').textContent =
    `웨이브 ${wave} 도달 · 누적 처치 ${kills} · 경과 ${(elapsed / 60) | 0}분`;
}

// ============================================================================
// Camera + rendering
// ============================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let cam = { x: WW * 0.5, y: WH * 0.62, z: 1.0 };
let groundPat = null;
const vis = [];
let VW = 800, VH = 600, DPR = 1;
function resize() {
  const st = document.getElementById('stage').getBoundingClientRect();
  VW = Math.max(280, st.width | 0);
  VH = Math.max(220, st.height | 0);
  // cap the ratio so phones stay smooth
  DPR = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.5 : 2);
  cv.width = (VW * DPR) | 0;
  cv.height = (VH * DPR) | 0;
  clampCam();
}

// never show past the edge of the site: zoom in far enough to cover the
// viewport, and keep the camera inside the world
function minZoom() { return Math.max(VW / WW, VH / (WH * SQ)); }
function clampCam() {
  cam.z = clamp(cam.z, minZoom(), 2.6);
  const hw = VW / cam.z / 2, hh = VH / cam.z / SQ / 2;
  cam.x = clamp(cam.x, hw, WW - hw);
  cam.y = clamp(cam.y, hh, WH - hh);
}
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 900;
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.getElementById('stage'));

function w2s(wx, wy) {
  return [(wx - cam.x) * cam.z + VW / 2, (wy - cam.y) * cam.z * SQ + VH / 2];
}
function s2w(sx, sy) {
  return [(sx - VW / 2) / cam.z + cam.x, (sy - VH / 2) / (cam.z * SQ) + cam.y];
}

function draw() {
  const w = VW, h = VH;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, w, h);

  const sh = shake > 0 ? shake : 0;
  ctx.save();
  ctx.translate(w / 2 + rnd(-sh, sh), h / 2 + rnd(-sh, sh));
  ctx.scale(cam.z, cam.z);
  ctx.scale(1, SQ);            // the tilt
  ctx.translate(-cam.x, -cam.y);

  // visible tile window
  const [vx0, vy0] = s2w(0, 0), [vx1, vy1] = s2w(w, h);
  const tx0 = clamp((vx0 / TILE | 0) - 1, 0, GW - 1), tx1 = clamp((vx1 / TILE | 0) + 1, 0, GW - 1);
  const ty0 = clamp((vy0 / TILE | 0) - 1, 0, GH - 1), ty1 = clamp((vy1 / TILE | 0) + 1, 0, GH - 1);

  // ---- pre-rendered terrain, then decals, then the living blight ----
  ctx.drawImage(terrainCv, 0, 0, terrainCv.width, terrainCv.height, 0, 0, WW, WH);
  ctx.drawImage(gc, 0, 0);

  // blight reads as a soft creeping stain, not painted squares
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const b = blight[idx(x, y)];
    if (b <= 0.04 || terrain[idx(x, y)] === T_ROCK) continue;
    const cxb = x * TILE + TILE / 2, cyb = y * TILE + TILE / 2;
    ctx.fillStyle = `rgba(26,104,96,${b * 0.62})`;
    ctx.beginPath(); ctx.arc(cxb, cyb, TILE * 0.82, 0, 6.2832); ctx.fill();
  }

  // ---- everything with height, drawn back to front ----
  vis.length = 0;
  const order = [];
  for (const t of trees)
    if (t.x > vx0 - 40 && t.x < vx1 + 40 && t.y > vy0 - 60 && t.y < vy1 + 40)
      order.push([t.y, 0, t]);
  for (const b2 of buildings)
    if (!b2.dead) order.push([b2.y + (b2.h || 1) * TILE * 0.5, 1, b2]);
  for (const f of foes) {
    if (f.dead) continue;
    if (f.x < vx0 - 30 || f.x > vx1 + 30 || f.y < vy0 - 60 || f.y > vy1 + 30) continue;
    vis.push(f); order.push([f.y, 2, f]);
  }
  order.sort((p, q) => p[0] - q[0]);
  for (let i = 0; i < order.length; i++) {
    const kind = order[i][1], o = order[i][2];
    if (kind === 0) drawTree(o);
    else if (kind === 1) drawBuilding(o);
    else drawFoe(o);
  }

  // ======== additive glow pass ========
  ctx.globalCompositeOperation = 'lighter';

  // crystal nodes
  for (const n of nodes) {
    if (n.x < tx0 - 1 || n.x > tx1 + 1 || n.y < ty0 - 1 || n.y > ty1 + 1) continue;
    const nx = n.x * TILE + TILE / 2, ny = n.y * TILE + TILE / 2;
    const pulse = 0.5 + Math.sin(elapsed * 2 + n.x) * 0.22;
    glow(nx, ny, 18, 'rgba(0,229,255,' + (pulse * 0.42) + ')');
    ctx.fillStyle = C.cyan; ctx.globalAlpha = 0.75 + pulse * 0.25;
    ctx.beginPath();
    ctx.moveTo(nx, ny - 6); ctx.lineTo(nx + 4.5, ny); ctx.lineTo(nx, ny + 6); ctx.lineTo(nx - 4.5, ny);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }

  // blight bloom
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
    const b = blight[idx(x, y)];
    if (b <= 0.35 || terrain[idx(x, y)] === T_ROCK) continue;
    ctx.fillStyle = `rgba(24,120,110,${(b - 0.35) * 0.5})`;
    ctx.beginPath(); ctx.arc(x * TILE + TILE / 2, y * TILE + TILE / 2, TILE * 0.7, 0, 6.2832); ctx.fill();
  }

  // infected cores: hundreds of teal specks make the mass read at any density
  for (let i = 0; i < vis.length; i++) {
    const f = vis[i], d = FOES[f.type];
    if (d.static) {
      glow(f.x, f.y - 26 * HZ, 22, 'rgba(0,229,255,0.5)');
      ctx.fillStyle = C.cyan;
      ctx.beginPath(); ctx.moveTo(f.x, f.y - 34 * HZ); ctx.lineTo(f.x + 5, f.y - 16 * HZ);
      ctx.lineTo(f.x - 5, f.y - 16 * HZ); ctx.closePath(); ctx.fill();
      continue;
    }
    const sz = d.r * 0.62;
    ctx.fillStyle = C.cyan;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(f.x + Math.cos(f.face) * d.r * 0.35 - sz / 2,
      f.y - d.r * 0.75 * HZ + Math.sin(f.face) * d.r * 0.35 * HZ - sz * HZ / 2, sz, sz * HZ);
    ctx.globalAlpha = 1;
    if (d.big) glow(f.x, f.y, d.r * 2.2, 'rgba(0,229,255,0.3)');
  }

  // ---- projectiles ----
  for (const p of projs) {
    if (p.kind === 'tracer') {
      const dx = p.x - p.sx, dy = p.y - p.sy, m = Math.hypot(dx, dy) || 1;
      ctx.strokeStyle = '#FFD9A0'; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx / m * 15, p.y - dy / m * 15); ctx.stroke();
      ctx.strokeStyle = '#fff4dd'; ctx.lineWidth = 1; ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - dx / m * 9, p.y - dy / m * 9); ctx.stroke();
    } else if (p.kind === 'mortar') {
      const t = 1 - p.life / p.max;
      const cx = p.x + (p.tx - p.x) * t, cy = p.y + (p.ty - p.y) * t;
      const zz = Math.sin(t * Math.PI) * 52;
      ctx.strokeStyle = C.signal; ctx.globalAlpha = 0.22 + t * 0.55; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.tx, p.ty, p.splash * (1.3 - t * 0.3), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      glow(cx, cy - zz, 9, 'rgba(255,190,110,0.75)');
    } else if (p.kind === 'rail') {
      const a = p.life / p.max;
      ctx.globalAlpha = a * 0.35; ctx.strokeStyle = '#7DD8FF'; ctx.lineWidth = 20 * a;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.ex, p.ey); ctx.stroke();
      ctx.globalAlpha = a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * a;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.ex, p.ey); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---- particles ----
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.95;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;

  // supply links: each powered asset is tied to its source by a thin bright
  // line, the fan of beams that defines an outpost in the reference shots
  ctx.lineWidth = 1.1;
  for (const b of buildings) {
    if (b.dead || b.type === 'hub') continue;
    const dl = DEFS[b.type];
    if (!dl.power || !b.powered) continue;
    let src = hub, best = Math.hypot(b.gx - hub.gx, b.gy - hub.gy);
    for (const g of buildings) {
      if (g.dead || g.type !== 'gen') continue;
      const dg = Math.hypot(b.gx - g.gx, b.gy - g.gy);
      if (dg <= DEFS.gen.powerR[g.tier] && dg < best) { best = dg; src = g; }
    }
    const pulse = 0.30 + Math.sin(elapsed * 2.4 + b.gx * 0.7 + b.gy * 0.5) * 0.12;
    ctx.strokeStyle = `rgba(255,212,41,${pulse})`;
    ctx.beginPath(); ctx.moveTo(src.x, src.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // every live structure spills a little light onto the ground
  for (const b of buildings) {
    if (b.dead) continue;
    const dd2 = DEFS[b.type];
    if (b.type !== 'hub' && dd2 && dd2.power && !b.powered) continue;
    if (b.x < vx0 - 90 || b.x > vx1 + 90 || b.y < vy0 - 90 || b.y > vy1 + 90) continue;
    const rr = (b.type === 'hub' ? 78 : 26 + (b.w || 1) * 14);
    const warm = b.type === 'gen' || b.type === 'extractor'
      ? 'rgba(77,169,218,0.10)' : 'rgba(255,212,41,0.075)';
    glow(b.x, b.y, rr, warm);
  }

  // muzzle flashes and glowing hardware sit in the additive pass too
  for (const b of buildings) {
    if (b.dead || b.flash <= 0.12) continue;
    const dd = DEFS[b.type];
    const len = b.type === 'siege' ? 22 : b.type === 'mortar' ? 12 : 13;
    if (b.type === 'hub' || (dd && dd.range && !dd.crew)) {
      glow(b.x + Math.cos(b.aim) * len, b.y + Math.sin(b.aim) * len,
        b.type === 'siege' ? 26 : 11, `rgba(255,214,150,${b.flash * 0.85})`);
    }
    if (dd && dd.crew) {
      for (const s of b.crew) {
        if (!s.alive || s.flash <= 0.2) continue;
        const fx = b.x + s.ox + Math.cos(s.aim) * 6, fy = b.y + s.oy + Math.sin(s.aim) * 6;
        glow(fx, fy, dd.crewKind === 'flame' ? 13 : 6.5,
          dd.crewKind === 'flame' ? `rgba(255,140,50,${s.flash * 0.85})` : `rgba(255,240,210,${s.flash})`);
      }
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  // ---- drifting dust ----
  for (const m of motes) {
    if (m.x < vx0 || m.x > vx1 || m.y < vy0 || m.y > vy1) continue;
    ctx.fillStyle = `rgba(232,222,196,${0.05 + m.z * 0.11})`;
    ctx.fillRect(m.x, m.y, m.s, m.s * 0.8);
  }

  // ---- placement ghost ----
  if (ghost && hoverIdx >= 0) {
    const gxp = hoverIdx % GW, gyp = (hoverIdx / GW) | 0;
    const ok = canPlace(ghost, gxp, gyp);
    const d = DEFS[ghost];
    const gw = (d.w || 1) * TILE, gh = (d.h || 1) * TILE;
    // build lattice appears only while something is being sited
    ctx.lineWidth = 1 / cam.z;
    ctx.strokeStyle = 'rgba(255,212,41,0.16)';
    ctx.beginPath();
    for (let x = tx0; x <= tx1 + 1; x++) { ctx.moveTo(x * TILE, ty0 * TILE); ctx.lineTo(x * TILE, (ty1 + 1) * TILE); }
    for (let y = ty0; y <= ty1 + 1; y++) { ctx.moveTo(tx0 * TILE, y * TILE); ctx.lineTo((tx1 + 1) * TILE, y * TILE); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,212,41,0.38)'; ctx.lineWidth = 1.5 / cam.z;
    ctx.beginPath();
    for (let x = tx0 - (tx0 % 4); x <= tx1 + 1; x += 4) { ctx.moveTo(x * TILE, ty0 * TILE); ctx.lineTo(x * TILE, (ty1 + 1) * TILE); }
    for (let y = ty0 - (ty0 % 4); y <= ty1 + 1; y += 4) { ctx.moveTo(tx0 * TILE, y * TILE); ctx.lineTo((tx1 + 1) * TILE, y * TILE); }
    ctx.stroke();
    const gcol = ok ? C.signal : C.danger;
    ctx.globalAlpha = 0.15; ctx.fillStyle = gcol;
    ctx.fillRect(gxp * TILE + 2, gyp * TILE + 2, gw - 4, gh - 4);
    ctx.globalAlpha = 1;
    brackets(gxp * TILE, gyp * TILE, gw, gh, 7, gcol, 1.4);
    if (d.range) {
      ctx.strokeStyle = ok ? 'rgba(255,212,41,.45)' : 'rgba(255,71,86,.45)';
      ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.range[0] * TILE, 0, 6.2832); ctx.stroke();
      if (d.minRange) { ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.minRange * TILE, 0, 6.2832); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (d.powerR) {
      ctx.strokeStyle = 'rgba(77,169,218,.45)'; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(gxp * TILE + gw / 2, gyp * TILE + gh / 2, d.powerR[0] * TILE, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ---- selection ring ----
  if (selected && !selected.dead) {
    const d = DEFS[selected.type];
    brackets(selected.gx * TILE - 2, selected.gy * TILE - 2,
      (selected.w || 1) * TILE + 4, (selected.h || 1) * TILE + 4, 8, C.signal, 1.4);
    if (d && d.range) {
      ctx.strokeStyle = 'rgba(255,212,41,.35)'; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(selected.x, selected.y, d.range[selected.tier] * TILE, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.restore();

  // ---- bloom: soft halation off every lit surface ----
  // The reference lighting is soft and warm with visible bloom; a scene with
  // hard clean edges everywhere reads as a diagram no matter how it is
  // coloured. A quarter-resolution, thresholded, blurred copy added back is
  // cheap and does the whole job.
  const bw = Math.max(1, w >> 2), bh = Math.max(1, h >> 2);
  if (!bl || bl.cv.width !== bw || bl.cv.height !== bh) {
    const c2 = document.createElement('canvas');
    c2.width = bw; c2.height = bh;
    bl = { cv: c2, cx: c2.getContext('2d') };
  }
  bl.cx.setTransform(1, 0, 0, 1, 0, 0);
  bl.cx.clearRect(0, 0, bw, bh);
  bl.cx.filter = 'blur(4px) brightness(0.60) contrast(9) saturate(1.1)';
  bl.cx.drawImage(cv, 0, 0, cv.width, cv.height, 0, 0, bw, bh);
  bl.cx.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(bl.cv, 0, 0, bw, bh, 0, 0, w, h);
  ctx.restore();

  // ---- grade: warm key from the top left, cool fill opposite it ----
  if (!grd || grd.w !== w || grd.h !== h) {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, 'rgba(255,206,138,0.16)');
    g.addColorStop(0.5, 'rgba(255,244,224,0.03)');
    g.addColorStop(1, 'rgba(86,120,166,0.16)');
    grd = { w, h, g };
  }
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = grd.g; ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // vignette keeps the eye on the line and sinks the map edges into the dark
