<title>Job Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wdth,wght@100..125,500..900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* Theme: Ananta-style dark (see "Ananta theme" block at the end, which overrides the older light passes).
   Layout: one mobile column (max 480px). Older notes:
   light grey ground, white hard-edged panels with 3px rims, black ink, a vertical key-colour strip with rotated text,
   bracket labels [ ], // indices, micro mono captions, hatch patterns. Yellow swapped for a blue key colour
   that shifts tone per job type. Single light theme by design. */
:root{
  --k:#FFFA00; --k-d:#191919; --kt:#191919; --kb:#191919; --on-k:#191919;                  /* key colour, overridden per job type */
  --cy:#CBFF40;                                /* secondary accent */
  --bg:#FFFFFF; --line:#E4E4E4; --soft:#F5F5F5; --paper:#FFFFFF; --rim:#DDE1E6; --rim-2:#C9CED6;
  --ink:#191919; --sub:#5E6268; --mute:#9A9EA5;
  --dark:#191919; --dark-2:#232528; --dark-3:#34373C;
  --warn:#E0245E; --ok:#191919;
  --wide:"Archivo","Noto Sans KR",sans-serif;
  --ko:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--kb);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:96px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{font-family:var(--wide);font-stretch:125%;font-variation-settings:"wdth" 125}
.mono{font-family:var(--mono)}
.hatch{background-image:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.06) 6px 12px)}
.tri{height:4px;background:linear-gradient(90deg,var(--k) 0 40%,var(--cy) 40% 70%,var(--ink) 70% 100%)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:var(--paper);border-bottom:1px solid var(--rim);display:flex;align-items:center;gap:10px;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.logo{flex:1;display:flex;flex-direction:column;gap:2px;text-decoration:none}
.logo small{font:700 7px/1 var(--mono);letter-spacing:.2em;color:var(--mute)}
.logo b{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;line-height:1;letter-spacing:-.01em}
.logo b i{display:inline-block;width:14px;height:10px;background:var(--ink);box-shadow:4px 0 0 var(--k)}
.back{flex:1;display:flex;align-items:center;gap:8px;text-decoration:none;font:800 13px/1 var(--ko)}
.back .arr{width:30px;height:30px;border-radius:50%;background:var(--paper);box-shadow:0 0 5px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--mono)}
.gbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 10px;background:var(--ink);color:#fff;border-radius:2px;font:700 11px/1 var(--mono);letter-spacing:.08em;text-decoration:none}
.gbtn::before{content:"";width:3px;height:14px;background:var(--k)}
.gbtn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}

/* section head */
.sec{position:relative;display:flex;background:var(--paper);border-bottom:1px solid var(--rim)}
.sec .strip{flex:0 0 30px;background:var(--k);display:flex;align-items:center;justify-content:center}
.sec .strip span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 9px/1 var(--mono);letter-spacing:.28em;color:var(--on-k);white-space:nowrap}
.sec .body{flex:1;min-width:0;padding:16px 16px 14px}
.sec .cap{display:flex;align-items:center;gap:6px;font:700 9px/1 var(--mono);letter-spacing:.14em;color:var(--sub)}
.sec .cap::before{content:"";width:5px;height:5px;background:var(--ink)}
.sec h1{margin:10px 0 0;font-weight:800;font-size:38px;line-height:.95;letter-spacing:-.01em}
.sec h1 em{font-style:normal;color:var(--kt)}
.sec .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sec .ko{font:700 13px/1.3 var(--ko);color:var(--sub)}
.sec .idx{font:700 11px/1 var(--mono);color:var(--mute)}
.arrowbox{display:inline-flex;width:28px;height:14px;background:var(--rim);align-items:center;justify-content:flex-end;padding-right:3px;font:700 10px/1 var(--mono);color:var(--ink)}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sum div{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:10px 10px 9px;position:relative}
.sum div::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;border-top:2px solid var(--ink);border-right:2px solid var(--ink)}
.sum b{display:block;font-weight:800;font-size:28px;line-height:1;color:var(--kt)}
.sum span{display:block;margin-top:7px;font:700 10.5px/1.25 var(--ko);color:var(--sub)}

/* tabs */
.tabs{display:flex;margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.tabs button{flex:1;height:38px;font:800 12.5px/1 var(--ko);color:var(--sub);position:relative;transition:background .3s var(--ease),color .3s var(--ease)}
.tabs button+button{border-left:1px solid var(--rim)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;height:32px;border-radius:2px;background:var(--paper);border:1px solid var(--line);font:800 11.5px/1 var(--ko);color:var(--sub);transition:all .3s var(--ease)}
.chips button[aria-pressed="true"]{border-color:var(--kb);color:var(--kt);background:#EEF3FF}
.row-sort{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:700 11px/1 var(--mono);color:var(--sub);letter-spacing:.04em}
.row-sort button{font:800 12px/1 var(--ko);color:var(--ink);display:flex;align-items:center;gap:6px}
.row-sort button::before{content:"";width:3px;height:12px;background:var(--k)}

/* job card */
.cards{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.card{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden;transition:transform .3s var(--ease),border-color .3s var(--ease)}
.card:active{transform:translateY(1px);border-color:var(--kb)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--k)}
.card .in{padding:14px 14px 12px 20px}
.card .hd{display:flex;align-items:flex-start;gap:10px}
.lt{display:inline-flex;align-items:center;justify-content:center;width:64px;height:36px;background:#fff;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex-shrink:0}
.lt img{width:100%;height:100%;object-fit:contain;display:block}
.lt b{font-weight:900;font-size:14px;color:var(--ink)}
.lt-t b{font-family:var(--ko);line-height:1.1;text-align:center;padding:0 3px;word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .who{flex:1;min-width:0}
.card .co{font:900 19px/1.15 var(--ko);letter-spacing:-.01em;text-wrap:balance}
.card .gm{margin-top:3px;font:600 11.5px/1.3 var(--ko);color:var(--sub)}
.fit{text-align:right;flex-shrink:0}
.fit b{display:block;font-weight:800;font-size:30px;line-height:1;color:var(--kt);white-space:nowrap}
.fit b span{color:var(--rim-2);font-weight:500;font-size:13px;margin-left:2px}
.fit small{display:block;margin-top:4px;font:700 8px/1 var(--mono);letter-spacing:.12em;color:var(--mute)}
.bar{position:relative;height:6px;margin-top:12px;background:repeating-linear-gradient(90deg,var(--rim) 0 2px,transparent 2px 6px)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--k)}
.bar i::after{content:"";position:absolute;right:-1px;top:-3px;width:2px;height:12px;background:var(--ink)}
.ttl{margin:12px 0 0;font:800 16.5px/1.4 var(--ko);letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font:700 10.5px/1 var(--ko);background:rgba(255,255,255,.08);color:#B5B5B5;padding:5px 7px;border-radius:2px}
.tag.k{background:var(--ink);color:#fff;font-family:var(--mono);letter-spacing:.08em}
.date{font:700 11px/1 var(--mono);color:var(--kt)}
.desc{margin:8px 0 0;font:500 12.5px/1.6 var(--ko);color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.st{font:800 11px/1 var(--ko);padding:6px 9px;border-radius:2px;border:1px solid var(--line);color:var(--sub)}
.st.on{border-color:var(--kb);color:var(--kt)}
.st.s-지원함,.st.s-결과대기{background:var(--k);border-color:var(--kb);color:var(--on-k)}
.dl{font:700 10.5px/1 var(--mono);color:var(--mute);letter-spacing:.02em}
.flag{display:inline-block;margin-top:6px;font:800 10px/1 var(--ko);padding:4px 6px;border-radius:2px;background:#FDE8EF;color:var(--warn)}
.flag.ask{background:#EEF3FF;color:var(--kt)}

/* detail */
.dt-top{background:var(--dark);color:#fff;position:relative;overflow:hidden;display:flex}
.dt-top .strip{flex:0 0 30px;background:var(--k);display:flex;align-items:center;justify-content:center}
.dt-top .strip span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 9px/1 var(--mono);letter-spacing:.28em;color:var(--on-k);white-space:nowrap}
.dt-top .body{flex:1;min-width:0;padding:16px 16px 18px}
.dt-top .cap{font:700 9px/1 var(--mono);letter-spacing:.14em;color:#8C9096}
.dt-top .co-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.dt-top .co{font:900 24px/1.15 var(--ko)}
.dt-top .co span{color:#6C7076;font-weight:500}
.dt-top .gm{margin-top:4px;font:600 12px/1.35 var(--ko);color:#A8ACB2}
.dt-top h1{margin:14px 0 0;font:800 20px/1.4 var(--ko);text-wrap:balance}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.crumb .tag{background:var(--dark-3);color:#D6D9DE}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--dark-3)}
.score b{font-weight:800;font-size:64px;line-height:.85;color:#fff}
.score b span{font-size:20px;color:#6C7076;font-weight:500}
.score div{font:600 11.5px/1.6 var(--ko);color:#A8ACB2;text-align:right}
.score div strong{color:#fff}
.score div em{display:block;font:700 8px/1 var(--mono);font-style:normal;letter-spacing:.14em;color:#6C7076;margin-bottom:6px}
.dt-top .bar{background:repeating-linear-gradient(90deg,var(--dark-3) 0 2px,transparent 2px 6px)}
.dt-top .bar i::after{background:#fff}
.alert{margin-top:12px;font:700 12px/1.5 var(--ko);padding:9px 11px;border-left:3px solid var(--warn);background:rgba(224,36,94,.12);color:#FFB3C8}
.alert.ask{border-color:var(--kb);background:rgba(31,91,255,.18);color:#C7D6FF}
.status{display:flex;margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.status button{flex:1;height:40px;font:800 12px/1 var(--ko);color:var(--sub);position:relative}
.status button+button{border-left:1px solid var(--rim)}
.status button[aria-pressed="true"]{background:var(--ink);color:#fff}
.status button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k)}
.blk{margin-top:22px}
.blk-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.blk-h .n{font:700 11px/1 var(--mono);color:var(--kt)}
.blk-h h2{margin:0;font:900 16px/1 var(--ko)}
.blk-h small{margin-left:auto;display:flex;align-items:center;gap:6px;font:700 8.5px/1 var(--mono);letter-spacing:.14em;color:var(--mute)}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:0 12px}
.req{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.req:last-child{border:0}
.chip{flex:0 0 58px;text-align:center;font:800 10.5px/1 var(--ko);padding:6px 0;border-radius:2px;height:22px}
.c-ok{background:var(--k);color:var(--on-k)}.c-part{background:rgba(255,255,255,.08);color:#B5B5B5}.c-no{background:var(--warn);color:#fff}.c-ask{border:2px solid var(--kb);color:var(--kt);padding:4px 0}
.req .k{font:800 13px/1.4 var(--ko)}
.req .k em{font-style:normal;font:700 9.5px/1 var(--mono);color:var(--mute);margin-left:5px;white-space:nowrap}
.req .v{margin-top:3px;font:500 12px/1.5 var(--ko);color:var(--sub)}
.ans{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ans button{min-height:34px;padding:0 12px;border:2px solid var(--kb);background:var(--paper);color:var(--kt);font:800 12px/1 var(--ko);border-radius:2px;cursor:pointer}
.ans button.y{background:var(--k);color:var(--on-k)}
.ans button.n{border-color:var(--ink);color:var(--ink)}
.ans .re{border:0;min-height:28px;padding:0;color:var(--sub);font:700 11px/1 var(--ko);text-decoration:underline}
.qs{background:var(--paper);border:1px solid var(--line);border-radius:2px}
.qs .q{padding:12px 14px;border-bottom:1px solid var(--line)}
.qs .q:last-child{border-bottom:0}
.qs .q b{display:block;font:800 14px/1.4 var(--ko)}
.qs .q small{display:block;margin-top:3px;font:600 11.5px/1.45 var(--ko);color:var(--sub)}
.qs .q small em{font-style:normal;color:var(--kt);font-weight:800}
.raw{margin-top:10px;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.raw summary{padding:11px 12px;font:800 12.5px/1 var(--ko);cursor:pointer}
.raw pre{margin:0;padding:0 12px 12px;white-space:pre-wrap;font:500 13px/1.7 var(--ko);color:var(--ink);max-height:none}
.calc{margin:8px 2px 0;font:500 11px/1.5 var(--ko);color:var(--mute)}
.need{background:var(--dark);color:#fff;border-radius:2px;padding:4px 14px;margin:0;list-style:none;position:relative;overflow:hidden}
.need::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.need li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--dark-3);font:700 13px/1.45 var(--ko)}
.need li:last-child{border:0}
.need li b{font-weight:800;font-size:16px;color:var(--kt);flex:0 0 26px;line-height:1.3}
.need li small{display:block;margin-top:3px;font:500 11.5px/1.5 var(--ko);color:#A8ACB2}
.txt{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:14px}
.txt h3{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font:800 13px/1 var(--ko)}
.txt h3:first-child{margin-top:0}
.txt h3::before{content:"//";font:700 11px/1 var(--mono);color:var(--kt)}
.txt ul{margin:0;padding:0;list-style:none}
.txt li{font:500 12.5px/1.65 var(--ko);color:#B5B5B5;padding-left:12px;position:relative}
.txt li::before{content:"";position:absolute;left:1px;top:.75em;width:4px;height:4px;background:var(--ink)}
.co-card{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:14px;display:grid;grid-template-columns:68px 1fr;row-gap:11px;column-gap:10px;margin:0}
.co-card dt{font:700 11.5px/1.45 var(--ko);color:var(--mute)}
.co-card dd{margin:0;font:600 12.5px/1.5 var(--ko);color:var(--ink);min-width:0}
.src{margin:8px 2px 0;font:500 11px/1.5 var(--ko);color:var(--mute)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--rim);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.cta .in{max-width:456px;margin:0 auto;display:flex;gap:8px}
.cta a{height:46px;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 14px/1 var(--ko);text-decoration:none}
.cta .p{flex:1.4;background:var(--ink);color:#fff}
.cta .p::before{content:"";width:3px;height:16px;background:var(--k)}
.cta .s{flex:1;background:var(--paper);border:1px solid var(--line);color:var(--ink)}

/* companies */
.cos{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.co-wrap{background:var(--paper);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.co-wrap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--k)}
.co-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 20px}
.co-head h3{margin:0;font:900 19px/1.15 var(--ko)}
.co-head p{margin:3px 0 0;font:600 11.5px/1.35 var(--ko);color:var(--sub)}
.co-wrap .co-card{border:0;border-top:1px solid var(--line);padding-left:20px}
.co-wrap .src{padding:0 14px 0 20px}
.co-jobs{display:flex;flex-direction:column;gap:6px;padding:4px 14px 14px 20px}
.co-jobs a{display:flex;align-items:center;gap:8px;font:800 12px/1.35 var(--ko);text-decoration:none;color:var(--ink)}
.co-jobs a::before{content:"↘";font:700 10px/1 var(--mono);color:var(--kt)}

/* spec */
.grp{margin-top:18px}
.grp .gh{display:flex;justify-content:space-between;align-items:center;padding:0 0 8px;border-bottom:3px solid var(--ink)}
.grp .gh b{font-weight:800;font-size:17px;line-height:1}
.grp .gh span{font:700 10px/1 var(--mono);letter-spacing:.1em;color:var(--sub)}
.set{display:flex;align-items:center;min-height:56px;border-bottom:1px solid var(--line);padding:6px 0;gap:10px}
.set .l{flex:1;min-width:0;font:800 14px/1.3 var(--ko)}
.set .l small{display:block;font:600 11px/1.35 var(--ko);color:var(--sub);margin-top:2px}
.sel{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sel button{width:30px;height:30px;border-radius:50%;background:var(--paper);box-shadow:0 0 5px rgba(0,0,0,.22);font:700 13px/1 var(--mono)}
.sel span{min-width:76px;height:30px;display:flex;align-items:center;justify-content:center;font:800 12px/1 var(--ko);background:rgba(255,255,255,.08);border-radius:2px;padding:0 6px}
.sel.hi span{background:var(--k);color:var(--on-k)}
.tg{width:52px;height:28px;border-radius:2px;background:#D5D9DF;position:relative;flex-shrink:0;transition:background .3s var(--ease)}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:1px;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.25);transition:left .3s var(--ease)}
.tg[aria-checked="true"]{background:var(--k)}.tg[aria-checked="true"]::after{left:27px}
.impact{margin-top:12px;background:var(--dark);color:#fff;border-radius:2px;padding:11px 13px 11px 16px;font:600 12px/1.55 var(--ko);position:relative}
.impact::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.impact b{color:#9DB8FF}
.career{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:11px 13px;margin-top:10px}
.career div{font:800 13.5px/1.35 var(--ko)}.career small{display:block;font:600 11.5px/1.45 var(--ko);color:var(--sub);margin-top:2px}
textarea{width:100%;min-height:120px;margin-top:10px;border:1px solid var(--line);border-radius:2px;padding:12px;font:500 13px/1.55 var(--ko);color:var(--ink);background:var(--paper);resize:vertical}
textarea:focus{outline:none;border-color:var(--kb)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:2px;background:var(--ink);color:#fff;font:800 12.5px/1 var(--ko);margin-top:10px;text-decoration:none}

/* ===== Ananta theme (anantagame.com study 2026-11-24) =====
   near-black ground, white/grey type, no colour key (white is the key), one red for urgency,
   huge outlined condensed display words, Bebas Neue numerals, soft-vignette image panels, pill buttons. */
:root{
  --k:#F6F6F6; --k-d:#080808; --kt:#F6F6F6; --kb:#F6F6F6; --on-k:#080808; --cy:#F6F6F6;
  --bg:#080808; --line:rgba(255,255,255,.09); --soft:#141416; --paper:#0E0E10; --rim:rgba(255,255,255,.09); --rim-2:rgba(255,255,255,.16);
  --ink:#EEEEEE; --sub:#A3A3A3; --mute:#6B6B6B; --dark:#000; --dark-2:#111; --dark-3:#1A1A1C;
  --warn:#DD353A; --red:#DD353A; --ok:#EEEEEE;
  --wide:"Bebas Neue","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
body{font-synthesis:none;background:#080808!important;color:var(--ink)}
body::before{background:#080808}
::selection{background:#F6F6F6;color:#080808}
.w{font-family:var(--wide);font-stretch:normal;font-variation-settings:normal;letter-spacing:.02em}
/* top bar */
.top{background:rgba(8,8,8,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo small{color:var(--mute);letter-spacing:.24em}
.logo b{font:400 25px/1 "Bebas Neue",sans-serif;letter-spacing:.06em;color:#fff}
.logo b i{display:none}
.menubtn i{background:#EEE!important}
.back,.back .arr{color:#EEE}.back .arr{background:rgba(255,255,255,.08);box-shadow:none}
.gbtn{background:#F6F6F6;color:#080808;border-radius:999px;height:32px;padding:0 14px;font:700 11px/1 var(--ko);letter-spacing:.06em}
.gbtn::before{display:none}.gbtn svg{stroke:#080808}
.gbtn.xg{background:rgba(255,255,255,.06);color:#EEE;border:1px solid rgba(255,255,255,.22)}
/* hero band */
.an-hero{position:relative;overflow:hidden;min-height:0!important;padding:34px max(16px,env(safe-area-inset-left,0px)) 26px!important;background:radial-gradient(120% 90% at 80% 0%,#1B1B1F 0,#080808 70%)!important;border-bottom:1px solid var(--line)}
.an-hero::after{display:none!important}
.an-out{position:absolute;left:-6px;top:4px;font:400 150px/.85 "Bebas Neue",sans-serif;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.16);white-space:nowrap;text-transform:uppercase;pointer-events:none}
.an-hc{position:relative}
.an-cap{font:600 10px/1 var(--ko);letter-spacing:.42em;color:var(--sub);text-transform:uppercase}
.an-h{margin:10px 0 0;font:400 64px/.9 "Bebas Neue",sans-serif;letter-spacing:.02em;color:#fff;text-transform:uppercase}
.an-hero .sub{margin-top:10px;font:500 13px/1.45 var(--ko);color:var(--sub)}
.band-rule{display:none}
/* sections: big outlined word + small label + heading (no rail) */
.rs{display:block;margin:44px 0 0}
.rs-rail{display:none}
.rs-body{padding:0;overflow:visible}
.rs-big{font:400 78px/.82 "Bebas Neue",sans-serif;letter-spacing:.01em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.32);white-space:nowrap;overflow:hidden;margin:0 0 12px;text-transform:uppercase}
.rs-lab{display:block;font:600 10px/1 var(--ko);letter-spacing:.38em;color:var(--mute);text-transform:uppercase}
.rs-lab i{display:none}
.rs-h{margin:8px 0 0;font:700 20px/1.3 var(--ko);color:#fff}
.rs-micro{display:none}
.rs-sub{color:var(--mute)}
/* image panel: cinematic vignette, outlined word, logo plate, white condensed name */
.th{background:#121214;color:#fff;border-radius:2px;aspect-ratio:16/9}
.th.big{aspect-ratio:4/3}
.th-glow{position:absolute;inset:0;background:radial-gradient(90% 70% at 70% 35%,var(--g1,#2A2D36) 0,transparent 70%),linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85) 100%)}
.th-v0{--g1:#2B3140}.th-v1{--g1:#3A2A2E}.th-v2{--g1:#23332F}.th-v3{--g1:#33302A}
.th-w{left:-4px;top:6px;bottom:auto;font:400 92px/.85 "Bebas Neue",sans-serif;letter-spacing:.01em;-webkit-text-stroke:1px rgba(255,255,255,.2)}
.th.big .th-w{font-size:120px;writing-mode:vertical-rl;left:auto;right:-10px;top:-6px}
.th-c{left:12px;top:auto;bottom:12px;background:rgba(0,0,0,.35);color:#EEE;border:1px solid rgba(255,255,255,.25);border-radius:999px;font:600 10.5px/1 var(--ko);padding:5px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.th-l{right:auto;left:50%;top:44%;transform:translate(-50%,-50%);width:46%;max-width:200px;background:rgba(255,255,255,.94);border:0;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.th.big .th-l{width:58%;top:40%}
.th-l b{color:#080808}
.th-nm{position:absolute;right:12px;bottom:8px;font:400 30px/1 "Bebas Neue",sans-serif;letter-spacing:.03em;color:#fff;text-transform:uppercase;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.th.big .th-nm{font-size:46px}
.th-n{right:12px;top:12px;background:var(--red);color:#fff;border-radius:999px;font:700 9.5px/1 var(--ko);letter-spacing:.12em;padding:5px 9px}
.th-grid,.th-ring,.th-m,.th-k,.th-bar{display:none}
.card .th{border-bottom:0}
/* news cards */
.nc{color:var(--ink)}.nc .th{box-shadow:none}
.nc-m .lab{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:#DDD;padding:4px 10px}
.nc-m .dt{color:var(--sub)}
.nc-m .sc{font:400 22px/1 "Bebas Neue",sans-serif;color:#fff}
.nc-t{color:#fff}.nc-c{color:var(--mute)}
/* pager + buttons: translucent pills */
.rb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);box-shadow:none;color:#EEE}
.pc{font:400 16px/1 "Bebas Neue",sans-serif;color:var(--mute)}.pc b{color:#fff}
.mbtn{background:#F6F6F6;color:#080808;border-radius:999px;padding:0 18px}
.mbtn::before{display:none}
/* jobs header */
.jh{background:rgba(8,8,8,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.jh-t b{font:400 40px/1 "Bebas Neue",sans-serif;letter-spacing:.02em;color:#fff}
.jh-t span{color:var(--sub)}
.srch{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:0 14px;color:#EEE}
.srch input{color:#fff}.srch input::placeholder{color:#777}
.srch svg{stroke:#999}
.tchips button,.chips button{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--sub);border-radius:999px}
.tchips button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:#F6F6F6;border-color:#F6F6F6;color:#080808}
/* posting rows */
.jrows,.wl2{border-top:1px solid rgba(255,255,255,.2)}
.row{color:var(--ink)}.row:active,.wr2[open]>summary{background:rgba(255,255,255,.04)}
.row-th{background:radial-gradient(80% 80% at 60% 30%,#2A2D36,#121214);background-image:radial-gradient(80% 80% at 60% 30%,#2A2D36,#121214);border-radius:4px}
.row-th img,.row-th b{background:rgba(255,255,255,.94);color:#080808;border-radius:2px}
.row-th i{display:none}
.row-t{color:#fff}
.row-m .lab{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;color:#CCC}
.row-co em.nw{background:var(--red);color:#fff;border-radius:999px}
.row-s b{font:400 28px/1 "Bebas Neue",sans-serif;color:#fff}
.row .xbtn{color:#555}.row .xbtn:active{color:#fff}
.xbtn{background:transparent;color:var(--mute);border-color:var(--line)}
/* companies */
.wr2-b b{color:#fff}.wr2-n b{font:400 26px/1 "Bebas Neue",sans-serif;color:#fff}
.wr2-in .co-jobs{border-left:1px solid rgba(255,255,255,.3)}
.wr2-in .co-jobs a{color:#DDD;border-bottom-color:var(--line)}
.wr2-in .re{color:#EEE}
/* generic surfaces from older passes */
.card,.bcard,.co-wrap,.mini a,.sum div,.hm-kpi a,.hb,.cal,.qs,.stat4 > *,.hlist a,.hco a{background:#111113!important;border-color:var(--line)!important;color:var(--ink)}
.hm-kpi a.k1{background:#F6F6F6!important;color:#080808!important}

.tag{background:rgba(255,255,255,.08);color:#DDD}.tag.k{background:#F6F6F6;color:#080808}

.bar i,.hb .ht i,.cal .nm i span,.gauge .gc i.on{background:#EEE}
.rs .hbars .dot{background:#EEE!important}
.tabs button[aria-pressed="true"]::after,.status button[aria-pressed="true"]::after,.tabbar a[aria-current="page"]::before{background:#F6F6F6}

main .alert,.pad .alert,.hidebar .alert,main .alert.ask,.pad .alert.ask{background:#141416;color:#DDD;border-left:2px solid #F6F6F6}
/* detail text */

.tabbar{background:rgba(8,8,8,.9)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)!important}
.tabbar a{color:#777}.tabbar a[aria-current="page"]{color:#fff}

.dt-top{background:radial-gradient(110% 80% at 85% 0%,#22252C 0,#0B0B0D 72%)!important;border-bottom:1px solid var(--line)}

.ans button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#EEE;border-radius:999px}

.ans button.n{border-color:rgba(255,255,255,.3);color:#EEE}

.th-nm{font-weight:700}
.an-h,.rs-big,.an-out{font-weight:400}

.sel button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);box-shadow:none;color:#EEE}

.btn.ghost{background:transparent;color:#EEE;border:1px solid rgba(255,255,255,.25)}
textarea,input[type=text],input:not([type]){background:rgba(255,255,255,.04);color:#EEE;border-color:rgba(255,255,255,.16)}
.gh{border-bottom-color:rgba(255,255,255,.3)!important}

.hlist .ti{color:#A8A8A8}

.th .th-glow{z-index:1;background:linear-gradient(180deg,rgba(8,8,8,.05) 0,rgba(8,8,8,.15) 45%,rgba(8,8,8,.88) 100%)}

.th-l{left:12px;top:12px;transform:none;width:auto;height:34px;max-width:42%;aspect-ratio:auto;padding:4px 8px;box-shadow:0 4px 18px rgba(0,0,0,.5)}

.th-nm{left:12px;right:12px;bottom:10px;max-width:none;text-align:left}

/* ===== Ananta type: MiSans (Latin/digits) + Noto Sans KR (Hangul) + Bebas Neue (display), heavier weights ===== */
@font-face{font-family:"MiSans";font-weight:400;font-display:swap;src:url("fonts/MiSansLatin-Regular.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
@font-face{font-family:"MiSans";font-weight:500;font-display:swap;src:url("fonts/MiSansLatin-Medium.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
@font-face{font-family:"MiSans";font-weight:600;font-display:swap;src:url("fonts/MiSansLatin-Semibold.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
@font-face{font-family:"MiSans";font-weight:700 800;font-display:swap;src:url("fonts/MiSansLatin-Bold.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
@font-face{font-family:"MiSans";font-weight:900;font-display:swap;src:url("fonts/MiSansLatin-Heavy.woff2") format("woff2");unicode-range:U+0000-024F,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF}
:root{--ko:"MiSans","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--mono:"MiSans","Noto Sans KR",sans-serif;--wide:"Bebas Neue","MiSans","Noto Sans KR",sans-serif}

.an-h,.jh-t b,.wr2-n b,.row-s b,.nc-m .sc{font-family:"Bebas Neue","MiSans","Noto Sans KR",sans-serif}

<script>

  publish: {label:"퍼블리싱", en:"PUBLISHING",  k:"#F6F6F6", kd:"#080808"},
  service: {label:"서비스PM", en:"SERVICE PM",  k:"#F6F6F6", kd:"#080808"},

  ip:      {label:"IP 사업",  en:"IP BUSINESS", k:"#F6F6F6", kd:"#080808"},
  devpm:   {label:"개발PM",   en:"DEV PM",      k:"#F6F6F6", kd:"#080808"},

const COUNTRIES = [["all","전체"],["KR","한국"],["JP","일본"],["CN","중국"],["US","미국"],["etc","기타"]];
const MAIN_C = ["KR","JP","CN","US"];
const STATUSES = ["관심","지원함","결과 대기","종료"];
const LANG_LV = ["못 함","학습 중","기초","일상 회화","비즈니스","원어민"];
const LANG_NAMES = {en:"영어",ko:"한국어",ja:"일본어",zh:"중국어"};
const PLACES = ["미입력","서울","판교·성남","도쿄","상하이","해외 어디든","원격","무관"];
const DEFAULT_PROFILE = {lang:{en:"원어민",ko:"원어민",ja:"못 함",zh:"못 함"},learn:["ja","zh"],travel:null,overseas:null,place:"미입력",
  career:[{org:"넷마블",role:"게임사업PM (SQC팀)",months:8,note:"공채 인턴십 합격",game:true},{org:"호주 국립해양박물관",role:"인턴",months:4,note:"대학 시절",game:false}],notes:""};

/* ---------- state ---------- */
const S = {db:null, ready:false, failed:false, jobs:[], companies:[], tests:[], news:[], watch:[], wcat:"all", wcountry:"all", status:{}, profile:null, animUntil:0, lastRoute:"",
  country:"all", sort:"fit", reach:"all", route:"jobs", param:null};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const typeOf = j => TYPES[j.job_type] || TYPES.bizpm;
const kvars = t => `--k:${t.k};--k-d:${t.kd}`;
const today = () => new Date().toISOString().slice(0,10);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
const prof = () => S.profile || DEFAULT_PROFILE;
const months = () => (prof().career||[]).filter(c=>c.game!==false).reduce((a,c)=>a+(+c.months||0),0);
function daysLeft(d){ if(!d) return null; const t0=new Date(); t0.setHours(0,0,0,0); const x=new Date(d+"T00:00:00"); if(isNaN(x)) return null; return Math.round((x-t0)/864e5); }

/* ---------- scoring ----------
   Each requirement: {kind:"must"|"plus", text, status, reason, rule?}
   rule.type: "lang" {any:[codes], min:level} | "travel" | "overseas"
   Profile-linked rules are re-evaluated live; others keep the stored AI judgement. */
function reqKey(r){ return r.rule&&r.rule.type!=="lang" ? r.rule.type : "q:"+(r.text||"").trim(); }
const ANS_LABEL={ok:"있음",part:"조금 있음",no:"없음"};
function evalReq(r){
  const p = prof(), rule = r.rule;
  if(!rule){ const a=p.answers?.[reqKey(r)]; if(r.status==="ask"&&a) return {status:a, reason:`내 답변: ${ANS_LABEL[a]}`, answered:true}; return {status:r.status, reason:r.reason}; }
  if(rule.type==="lang"){
    const need = LANG_LV.indexOf(rule.min||"원어민");
    const best = (rule.any||[]).map(c=>({c,lv:LANG_LV.indexOf(p.lang?.[c]||"못 함")})).sort((a,b)=>b.lv-a.lv)[0];
    if(best && best.lv>=need) return {status:"ok", reason:`${LANG_NAMES[best.c]} ${p.lang[best.c]}`};
    const learning = (rule.any||[]).filter(c=>p.lang?.[c]==="학습 중"||(p.learn||[]).includes(c)).map(c=>LANG_NAMES[c]);
    const have = (rule.any||[]).map(c=>`${LANG_NAMES[c]} ${p.lang?.[c]||"못 함"}`).join(", ");
    return {status:"no", reason:`${have}${learning.length?" (학습 희망)":""}. 필요 수준: ${rule.min||"원어민"}`};
  }
  if(rule.type==="travel"||rule.type==="overseas"){
    const v = p[rule.type];
    if(v===true) return {status:"ok", reason:"내 답변: 가능", answered:true};
    if(v===false) return {status:"no", reason:"내 답변: 불가", answered:true};
    return {status:"ask", reason:rule.type==="travel"?"해외 출장이 가능한지 답해 주세요":"이 나라에서 일할 수 있는지(이주·비자) 답해 주세요"};
  }
  return {status:r.status, reason:r.reason};
}
function score(j){
  const reqs = (j.reqs||[]).map(r=>({...r, ...evalReq(r)}));
  const musts = reqs.filter(r=>r.kind==="must"), pluses = reqs.filter(r=>r.kind==="plus");
  const M = musts.length?(pluses.length?60:90):0, P = pluses.length?(musts.length?30:90):0;
  const mw = musts.length?M/musts.length:0, pw = pluses.length?P/pluses.length:0;
  const pts = (r,w)=> r.status==="ok"?w : r.status==="part"?w/2 : 0;
  reqs.forEach(r=>{ const w=r.kind==="must"?mw:pw; r.max=Math.round(w); r.pts=Math.round(pts(r,w)); });
  const minM = +j.min_years_months||0, careerOk = months()>=minM;
  const career = {kind:"career", text:`경력 조건: ${j.career_req||"무관"}`, status:careerOk?"ok":"no",
    reason: careerOk ? (minM?`내 게임 경력 ${months()}개월`:"신입 지원 가능") : `필요 ${minM}개월, 내 게임 경력 ${months()}개월`, max:10, pts:careerOk?10:0};
  // Evidence shrink: with few requirements a single match should not mean 100. conf = n/4 (max 1); the rest is pulled toward 55%.
  const nReq = reqs.length, conf = Math.min(1, nReq/4), base = nReq?90:0;
  const shrink = v => nReq ? conf*v + (1-conf)*base*0.55 : 0;
  const rawReq = reqs.reduce((a,r)=>a+(r.kind==="must"?pts(r,mw):pts(r,pw)),0);
  let total = shrink(rawReq) + career.pts;
  const thin = !!j.lite && !musts.length && !(j.quals||[]).length;
  if(thin){ total=Math.min(total,70); }
  const askGain = conf*reqs.filter(r=>r.status==="ask").reduce((a,r)=>a+(r.kind==="must"?mw:pw),0);
  const mustNo = musts.filter(r=>r.status==="no").length, ask = reqs.filter(r=>r.status==="ask").length;
  return {reqs, career, conf, total:Math.round(total), max:Math.round(thin?Math.min(70,total+askGain):total+askGain), mustNo, ask, thin};
}

/* ---------- db ---------- */
async function boot(){
  render();
  const timer = setTimeout(()=>{ if(!S.ready){ S.failed="slow"; bootEnd(); render(); } }, 10000);
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if(!db){ clearTimeout(timer); S.failed="none"; bootEnd(); render(); return; }
  S.db = db;
  const seen = {bodies:false,tr:false,trp:false,jobs:false,jobpacks:false,companies:false,tests:false,news:false,watch:false,watchpacks:false,status:false,profile:false};
  const R={jobs:[],jobpacks:[],watch:[],watchpacks:[]};
  const flat=(single,packs)=>{ const m=new Map(); packs.forEach(p=>Object.entries(p.items||{}).forEach(([id,v])=>m.set(id,{id,...v}))); single.forEach(x=>m.set(x.id,x)); return [...m.values()]; };
  const expire=list=>list.map(j=>{ const d=daysLeft(j.deadline_date); return (!j.closed&&d!==null&&d<0)?{...j,closed:true,expired:true}:j; });
  const done = k => { seen[k]=true; bootProgress(Object.values(seen).filter(Boolean).length/Object.keys(seen).length); if(Object.values(seen).every(Boolean)){ S.ready=true; S.failed=false; clearTimeout(timer); bootEnd(); } render(); };
  const onErr = e => { S.failed = e?.code||"error"; clearTimeout(timer); bootEnd(); render(); };
  db.collection("jobs").onSnapshot(s=>{ R.jobs=s.docs.map(d=>({id:d.id,...d.data()})); S.allJobs=expire(flat(R.jobs,R.jobpacks)); applyHide(); if(!s.metadata.fromCache) done("jobs"); else render(); }, onErr);
  db.collection("companies").onSnapshot(s=>{ S.companies=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache) done("companies"); else render(); }, onErr);
  db.collection("watch").onSnapshot(s=>{ R.watch=s.docs.map(d=>({id:d.id,...d.data()})); S.allWatch=flat(R.watch,R.watchpacks); applyHide(); if(!s.metadata.fromCache) done("watch"); else render(); }, onErr);
  db.collection("jobpacks").onSnapshot(s=>{ R.jobpacks=s.docs.map(d=>d.data()); S.allJobs=expire(flat(R.jobs,R.jobpacks)); applyHide(); if(!s.metadata.fromCache) done("jobpacks"); else render(); }, onErr);
  db.collection("watchpacks").onSnapshot(s=>{ R.watchpacks=s.docs.map(d=>d.data()); S.allWatch=flat(R.watch,R.watchpacks); applyHide(); if(!s.metadata.fromCache) done("watchpacks"); else render(); }, onErr);
  db.collection("bodypacks").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>Object.assign(m,d.data().items||{})); S.bodies=m; if(!s.metadata.fromCache) done("bodies"); else render(); }, onErr);
  const mergeTr=()=>{ S.tr={...(R.trp||{}),...(R.tr1||{})}; };
  db.collection("tr").onSnapshot(s=>{ R.tr1=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); mergeTr(); if(!s.metadata.fromCache) done("tr"); else render(); }, onErr);
  db.collection("trpacks").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>Object.assign(m,d.data().items||{})); R.trp=m; mergeTr(); if(!s.metadata.fromCache) done("trp"); else render(); }, onErr);
  db.collection("news").onSnapshot(s=>{ S.news=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache) done("news"); else render(); }, onErr);
  db.collection("tests").onSnapshot(s=>{ S.tests=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache) done("tests"); else render(); }, onErr);
  db.collection("status").onSnapshot(s=>{ S.status=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); if(!s.metadata.fromCache) done("status"); else render(); }, onErr);
  db.doc("profile/me").onSnapshot(d=>{ S.profile = d.exists ? {...DEFAULT_PROFILE,...d.data()} : null; applyHide(); if(!d.metadata.fromCache) done("profile"); else render(); }, onErr);
}
let writing = Promise.resolve();
function write(fn){ writing = writing.then(fn).catch(e=>{ toast(e?.code==="invalid_argument"?"저장 권한이 없습니다":"저장하지 못했습니다. 다시 시도해 주세요"); }); return writing; }
function setStatus(id, st){
  if(!S.db) return toast("저장 기능을 쓸 수 없는 화면입니다");
  S.status[id] = {status:st, updated:today()}; render();
  write(()=>S.db.doc("status/"+id).set({status:st, updated:today()}));
}
function saveProfile(patch){
  S.profile = {...prof(), ...patch}; render();
  if(!S.db) return toast("저장 기능을 쓸 수 없는 화면입니다");
  const body = JSON.parse(JSON.stringify(S.profile));
  clearTimeout(saveProfile._t); saveProfile._t = setTimeout(()=>write(()=>S.db.doc("profile/me").set(body)), 400);
}

/* Scope guard: roles the user never wants (shown nowhere), interns (hidden unless toggled), and cross-board duplicates. */
const OUT_RE=/(UA|퍼포먼스)\s*\/?\s*(퍼포먼스\s*)?(마케터|매니저|마케팅)|UA\s*크리에이티브|User Acquisition|performance marketing|UA Manager|(컨셉|배경|시네마틱|캐릭터|이펙트|애니메이션)\s*아티스트|캐릭터\s*컨셉|배경\s*컨셉|원화가|모델러|애니메이터|VFX|디자이너|\bdesigner\b|엔지니어|\bengineer\b|개발자|\bdeveloper\b|프로그래머|\bQA\b|테스터|payroll|급여|시스템\s*[&·]?\s*(컨텐츠|콘텐츠)?\s*기획|전투\s*기획|레벨\s*디자/i;
const INTERN_RE=/인턴|체험형\s*인턴|\bintern(ship)?s?\b|インターン|实习/i;
const ttl=j=>(j.title||"")+" "+(j.title_original||"");
const isOut=j=>OUT_RE.test(ttl(j)), isIntern=j=>INTERN_RE.test(ttl(j));
const BOARD=/gamejob|jobkorea|saramin|wanted\.co|green-japan|wantedly/;
function normTitle(t){ return (t||"").replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】|추가\s*(모집|채용)|모집|채용|공고|담당자/g,"").replace(/\s+/g,"").toLowerCase(); }
function dedupe(list){ const best=new Map(); const rank=j=>(BOARD.test(j.url||"")?0:2)+((j.duties||[]).length?1:0);
  list.forEach(j=>{ const k=(j.company_id==="headhunt"?j.company:(j.company_id||j.company))+"|"+normTitle(j.title); const cur=best.get(k); if(!cur||rank(j)>rank(cur)) best.set(k,j); });
  const host=j=>{ try{ return new URL(j.url).host; }catch(_){ return ""; } };
  const drop=new Set(); list.forEach(j=>{ const b=best.get((j.company_id==="headhunt"?j.company:(j.company_id||j.company))+"|"+normTitle(j.title)); if(b&&b.id!==j.id&&host(b)!==host(j)) drop.add(j.id); });
  S.dupCount=drop.size; return list.filter(j=>!drop.has(j.id)); }
function applyHide(){
  const p=prof(), hj=new Set(p.hidden_jobs||[]), hc=new Set(p.hidden_cos||[]);
  const base=(S.allJobs||[]).filter(j=>!hj.has(j.id)&&!hc.has(j.company_id)&&!isOut(j));
  S.internCount=base.filter(j=>!j.closed&&isIntern(j)).length;
  S.jobs=dedupe(base.filter(j=>S.showIntern||!isIntern(j)));
  S.watch=(S.allWatch||[]).filter(w=>!hc.has(w.id));
}
function toggleHide(kind,id){
  const key=kind==="co"?"hidden_cos":"hidden_jobs", cur=new Set(prof()[key]||[]), on=!cur.has(id);
  on?cur.add(id):cur.delete(id); saveProfile({[key]:[...cur]}); applyHide(); render();
  toast(on?(kind==="co"?"이 회사의 공고를 모두 제외했습니다. 메뉴 › 제외한 회사·공고에서 되돌릴 수 있습니다":"이 공고를 제외했습니다. 메뉴 › 제외한 회사·공고에서 되돌릴 수 있습니다"):"다시 보이게 했습니다");
}
function openX(id){
  const j=(S.allJobs||S.jobs).find(x=>x.id===id); if(!j) return;
  const hj=(prof().hidden_jobs||[]).includes(id), hc=(prof().hidden_cos||[]).includes(j.company_id);
  let el=document.getElementById("xsheet"); if(!el){ el=document.createElement("div"); el.id="xsheet"; document.body.appendChild(el); }
  el.innerHTML=`<div class="xs-bg" data-xbg></div><div class="xs" role="dialog" aria-label="제외">
    <b>${esc(j.company)}</b><p>${esc(j.title)}</p>
    <button class="xs-b" data-xgo="job|${esc(j.id)}">${hj?"이 공고 다시 보기":"이 공고만 제외"}</button>
    <button class="xs-b k" data-xgo="co|${esc(j.company_id)}">${hc?"이 회사 다시 보기":"이 회사 공고 전부 제외"}</button>
    <button class="xs-c" id="xClose">취소</button><small>제외한 항목은 메뉴 › 제외한 회사·공고에서 되돌릴 수 있습니다.</small></div>`;
  el.hidden=false; el.querySelector("[data-xbg]").onclick=closeX;
}
function closeX(){ const el=document.getElementById("xsheet"); if(el) el.hidden=true; }
function viewHidden(){
  const p=prof(), hj=p.hidden_jobs||[], hc=p.hidden_cos||[];
  const jobName=id=>{const j=(S.allJobs||[]).find(x=>x.id===id);return j?`${esc(j.company)} · ${esc(j.title)}`:esc(id)};
  const coName=id=>{const w=(S.allWatch||[]).find(x=>x.id===id)||(S.allJobs||[]).find(x=>x.company_id===id);return esc(w?(w.name||w.company):id)};
  const row=(label,kind,id)=>`<div class="hrow"><span>${label}</span><button class="btn" data-hide="${kind}" data-hid="${esc(id)}">다시 보기</button></div>`;
  return `${topbar()}<main class="pad"><section class="blk"><div class="blk-h"><span class="n">// H</span><h2>제외한 회사 ${hc.length}</h2><small>COMPANIES</small></div>
    ${hc.length?hc.map(id=>row(coName(id),"co",id)).join(""):`<p class="calc">숨긴 회사가 없습니다.</p>`}</section>
    <section class="blk"><div class="blk-h"><span class="n">// H</span><h2>제외한 공고 ${hj.length}</h2><small>JOBS</small></div>
    ${hj.length?hj.map(id=>row(jobName(id),"job",id)).join(""):`<p class="calc">숨긴 공고가 없습니다.</p>`}</section>
    <p class="calc">제외한 회사·공고는 목록, 홈 숫자, 회사 목록에서 빠지고 매일 업데이트에서도 새 공고로 알리지 않습니다.</p></main>${tabbar("")}`;
}

function readHash(){
  const h = location.hash.replace("#","");
  if(h.startsWith("job-")){ S.route="job"; S.param=h.slice(4); }
  else if(["home","jobs","companies","spec","tests","install","hidden"].includes(h)){ S.route=h; S.param=null; }
  else { S.route="home"; S.param=null; }
}
window.addEventListener("hashchange",()=>{ readHash(); closeMenu(); render(); window.scrollTo(0,0); });

const NAV=[["home","홈","00"],["jobs","공고","01"],["companies","회사","02"],["spec","내 스펙","03"],["tests","CBT 모집","04"]];
function tabbar(cur){
  const t=NAV;
  return `<nav class="tabbar" aria-label="메뉴"><div class="in">${t.map(([id,l,n])=>`<a href="#${id}" ${cur===id?'aria-current="page"':""}>${ICON[id]}${l}<span class="n">// ${n}</span></a>`).join("")}</div></nav>`;
}
function fsBtn(){ try{ if(!document.fullscreenEnabled||document.fullscreenElement) return ""; }catch(_){ return ""; } return `<button class="gbtn" id="fsBtn" aria-label="전체 화면">전체화면</button>`; }
function topbar(btn){
  return `<header class="top"><a class="logo" href="#home"><small>SUBCULTURE · GAME PM</small><b class="w"><i></i>JOB RADAR</b></a>${fsBtn()}${btn||""}<button class="menubtn" id="menuBtn" aria-label="전체 메뉴 열기"><i></i><i></i><i></i></button></header>`;
}

function logoOf(id){ return S.watch.find(w=>w.id===id)?.logo || S.companies.find(c=>c.id===id)?.logo || null; }
const QTEXT={travel:"해외 출장 갈 수 있나요?",overseas:"해외(현지)에서 일할 수 있나요? (이주·비자)"};
function ansBtns(r){
  const k=reqKey(r);
  if(r.answered) return `<div class="ans"><button class="re" data-ans="${esc(k)}" data-v="">답변 바꾸기</button></div>`;
  if(r.status!=="ask") return "";
  if(k==="travel"||k==="overseas") return `<div class="ans"><button class="y" data-ans="${k}" data-v="ok">가능</button><button class="n" data-ans="${k}" data-v="no">불가</button></div>`;
  return `<div class="ans"><button class="y" data-ans="${esc(k)}" data-v="ok">있음</button><button data-ans="${esc(k)}" data-v="part">조금 있음</button><button class="n" data-ans="${esc(k)}" data-v="no">없음</button></div>`;
}
function openQuestions(){
  const m={};
  S.jobs.filter(j=>!j.closed).forEach(j=>{ const sc=score(j);
    sc.reqs.filter(r=>r.status==="ask").forEach(r=>{ const k=reqKey(r); const q=m[k]||(m[k]={k,r,text:QTEXT[k]||`"${r.text}" 경험이 있나요?`,jobs:0,gain:0}); q.jobs++; q.gain+=r.max; });
  });
  return Object.values(m).sort((a,b)=>b.jobs-a.jobs||b.gain-a.gain);
}
function shortName(name){ let n=(name||"?").replace(/^헤드헌팅.*/,"헤드헌팅").replace(/\(.*?\)|（.*?）|㈜|\(주\)|주식회사|株式会社|合同会社|\s+Inc\.?|\s+Co\.,?\s*Ltd\.?/g,"").trim(); return n||name||"?"; }
function logoTile(id,name){ const l=logoOf(id); if(l) return `<span class="lt"><img src="${esc(l)}" alt="${esc(name)} 로고"></span>`;
  const n=shortName(name); const sz=n.length<=4?13:n.length<=7?11:n.length<=10?9.5:8.5;
  return `<span class="lt lt-t" title="${esc(name)}"><b style="font-size:${sz}px">${esc(n)}</b></span>`; }
function stateNote(){
  if(S.failed==="none") return `<div class="empty"><h3>데이터를 불러올 수 없는 화면입니다</h3><p>claude.ai에 로그인한 상태에서 이 링크를 열어 주세요. 공고·내 스펙·지원 상태는 그곳에 저장됩니다.</p></div>`;
  if(S.failed==="slow") return `<div class="banner-state">데이터 연결이 늦어지고 있습니다. 화면 내용이 최신이 아닐 수 있습니다.</div>`;
  if(S.failed) return `<div class="banner-state">데이터를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>`;
  if(!S.ready && !S.jobs.length) return `<div class="banner-state">불러오는 중…</div>`;
  return "";
}
function flagHtml(sc){
  if(sc.mustNo) return `<span class="flag">필수 ${sc.mustNo}개 부족</span>`;
  if(sc.ask) return `<span class="flag ask">답변 필요 ${sc.ask}</span>`;
  if(sc.thin) return `<span class="flag ask">조건 정보 부족</span>`;
  return "";
}
function deadlineText(j){
  const d=daysLeft(j.deadline_date);
  if(d===null) return j.deadline||"마감일 미표기";
  if(d<0) return "마감됨"; if(d===0) return "오늘 마감"; return `D-${d} · ${j.deadline_date.replaceAll("-",".")}`;
}
const pd = s => (s||"").replaceAll("-",".");
/* 100-point gauge: 50 cells x 2 points; solid = current score, hatched = reachable if "확인 필요" items are met */
function gauge(total,max,big){
  const cur=Math.round(total/2), mx=Math.round((max||total)/2);
  let cells=""; for(let i=0;i<50;i++) cells+=`<i class="${i<cur?"on":i<mx?"mx":""}${i%5===4?" t":""}"></i>`;
  return `<div class="gauge ${big?"big":""}" role="img" aria-label="적합도 ${total}점 / 100${max>total?`, 최대 ${max}점`:""}"><div class="gc">${cells}</div><div class="gl"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>`;
}

function briefItems(){
  const items = S.news.map(n=>({...n}));
  const weekAgo = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  S.jobs.forEach(j=>{ const d=daysLeft(j.deadline_date); if(d!==null&&d>=0&&d<=14) items.push({id:"dl-"+j.id,kind:"deadline",date:today(),title:`${j.company} · ${j.title}`,body:`마감까지 ${d}일 (${pd(j.deadline_date)}). 적합도 ${score(j).total}점.`,job_id:j.id,source:"공고 데이터"}); });
  return items.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0) || (b.date||"").localeCompare(a.date||""));
}
function blockers(){
  const m={};
  S.jobs.forEach(j=>{ const sc=score(j);
    sc.reqs.filter(r=>r.kind==="must"&&r.status==="no").forEach(r=>{ const k=r.rule?.type==="lang"?`${r.rule.any.map(c=>LANG_NAMES[c]).join("·")} ${r.rule.min} 수준`:r.text; m[k]=(m[k]||0)+1; });
    if(sc.career.status==="no"){ const y=Math.ceil((+j.min_years_months||0)/12); const k=`게임 경력 ${y}년 이상`; m[k]=(m[k]||0)+1; }
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
}

function viewInstall(){
  return `${topbar()}${secHead("Install","05","HOME SCREEN","폰 홈 화면에 바로가기 만들기")}
  <main class="pad inst">
    <div class="ib"><img src="${APP_ICON}" alt="Job Radar 아이콘" width="120" height="120"><div><b>Job Radar 아이콘</b><small>아래 버튼으로 저장한 뒤, 바로가기 아이콘으로 지정하세요.</small><button class="btn" id="iconSave">아이콘 저장 (PNG)</button></div></div>
    <div class="iu"><small>앱 주소</small><code id="appUrl">${APP_URL}</code><button class="gbtn" id="urlCopy">복사</button></div>
    <section class="hm-sec"><h2>아이폰</h2><ol class="is">
      <li><b>아이콘 저장</b> 위 버튼 → 공유 화면에서 <b>이미지 저장</b>(사진 앱에 저장).</li>
      <li><b>단축어</b> 앱 열기 → 오른쪽 위 <b>+</b> → <b>동작 추가</b> → <b>URL 열기</b> 검색해서 추가.</li>
      <li>URL 칸에 위 <b>앱 주소</b>를 붙여넣기.</li>
      <li>위쪽 이름 옆 <b>∨</b> → <b>홈 화면에 추가</b> → 아이콘 그림 누르기 → <b>사진 선택</b> → 저장한 아이콘.</li>
      <li>이름을 <b>Job Radar</b>로 바꾸고 <b>추가</b>.</li></ol></section>
    <section class="hm-sec"><h2>안드로이드</h2><ol class="is">
      <li>크롬에서 위 <b>앱 주소</b> 열기 → 오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b>. (아이콘은 claude.ai 기본 모양)</li>
      <li>이 아이콘으로 바꾸려면: 아이콘을 저장한 뒤, 무료 앱 <b>Shortcut Maker</b>(Play 스토어)에서 <b>웹사이트</b> → 앱 주소 입력 → 아이콘을 <b>이미지</b>로 바꿔 저장한 아이콘 선택 → 이름 Job Radar → 바로가기 만들기.</li></ol></section>

  </main>${tabbar("")}`;
}

/* no-art panels: tint with the logo's main colour (computed once per company) */
const TINT={};
function logoTint(id,cb){ if(id in TINT) return cb(TINT[id]); const src=logoOf(id); if(!src){ TINT[id]=null; return cb(null); }
  const im=new Image(); im.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=24; const x=c.getContext("2d"); x.drawImage(im,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data; let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2],A=d[i+3], mx=Math.max(R,G,B), mn=Math.min(R,G,B); if(A<128||mx-mn<40||mx<50) continue; r+=R;g+=G;b+=B;n++; }
    TINT[id]=n>8?[r/n|0,g/n|0,b/n|0]:null; }catch(_){ TINT[id]=null; } cb(TINT[id]); }; im.onerror=()=>{ TINT[id]=null; cb(null); }; im.src=src; }
function tintNoArt(){ document.querySelectorAll(".th.no-art[data-co]").forEach(el=>{ logoTint(el.dataset.co,c=>{ if(c) el.style.setProperty("--g1",`rgba(${c[0]},${c[1]},${c[2]},.55)`); }); }); }

${(j.raw||"").slice(0,4000)}`;

  let dl=null; try{ dl=await window.claude?.use?.("downloads"); }catch(_){}
  if(!dl) return toast("이 화면에서는 파일 저장을 쓸 수 없습니다");
  try{ await dl.save({filename:`job-radar-${today()}.csv`, data:csv}); toast("CSV를 저장했습니다"); }
  catch(err){ if(err?.code!=="declined") toast("파일을 저장하지 못했습니다"); }
}

readHash();
boot();
</script>
